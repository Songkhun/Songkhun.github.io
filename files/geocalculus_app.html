** เมื่อ $\\beta<45^\\circ$ ทั้งสองพจน์ของ $FS'$ เป็นลบ (เพราะ $\\cos2\\beta>0$) $FS$ จึงลดลง ความชันที่เพิ่มขึ้นทุกองศาทำให้ลาดพังง่ายขึ้น"}, {"en": "**Find the critical angle.** Solve $FS(\\beta)=1$ numerically: $FS(35^\\circ)=1.10$, $FS(40^\\circ)=0.96$, and the root is $\\beta\\approx38.4^\\circ$.", "th": "**หามุมวิกฤต** แก้สมการ $FS(\\beta)=1$ เชิงตัวเลข: $FS(35^\\circ)=1.10$, $FS(40^\\circ)=0.96$ และรากคือ $\\beta\\approx38.4^\\circ$"}], "meaning": {"en": "With these soil properties a slope is stable up to about 38° and fails beyond. At 30° a 1° (0.0175 rad) increase lowers $FS$ by about $2.66\\times0.0175\\approx0.047$. Rain that lowers cohesion $c$ shifts the critical angle down, which is why monsoon landslides in northern Thailand happen on slopes that are stable in the dry season.", "th": "ด้วยสมบัติดินชุดนี้ ลาดจะมั่นคงจนถึงประมาณ 38° และพังเมื่อชันกว่านั้น ที่ 30° การเพิ่มความชัน 1° (0.0175 rad) ทำให้ $FS$ ลดลงราว $2.66\\times0.0175\\approx0.047$ ฝนที่ลดแรงยึดเหนี่ยว $c$ ทำให้มุมวิกฤตต่ำลง ดินถล่มในฤดูมรสุมทางภาคเหนือจึงเกิดบนลาดที่มั่นคงในฤดูแล้ง"}, "pitfalls": [{"en": "Writing the quotient rule as $(u'v+uv')/v^2$: the sign in the numerator is **minus**, $u'v-uv'$.", "th": "เขียนกฎผลหารเป็น $(u'v+uv')/v^2$ เครื่องหมายในตัวเศษต้องเป็น **ลบ** คือ $u'v-uv'$"}, {"en": "Plugging degrees into a derivative formula: derivatives of trig functions assume radians, so $FS'$ is per radian; divide by 57.3 for per degree.", "th": "แทนค่ามุมเป็นองศาในสูตรอนุพันธ์ อนุพันธ์ของฟังก์ชันตรีโกณมิติใช้หน่วยเรเดียน $FS'$ จึงมีหน่วยต่อเรเดียน ถ้าต้องการต่อองศาให้หารด้วย 57.3"}, {"en": "Forgetting the product rule inside $v=\\sin\\beta\\cos\\beta$ (its derivative is $\\cos2\\beta$, not $\\cos\\beta\\cdot(-\\sin\\beta)$).", "th": "ลืมใช้กฎผลคูณกับ $v=\\sin\\beta\\cos\\beta$ (อนุพันธ์คือ $\\cos2\\beta$ ไม่ใช่ $\\cos\\beta\\cdot(-\\sin\\beta)$)"}]}, "27": {"id": 27, "idea": {"en": "Pressure depends on height, and height depends on time. The **chain rule** links the two rates: the rate the sensor sees in time equals the rate of change with height times the climb rate.", "th": "ความดันขึ้นกับความสูง และความสูงขึ้นกับเวลา **หลักเกณฑ์ลูกโซ่ (chain rule)** เชื่อมอัตราทั้งสองเข้าด้วยกัน: อัตราที่เซนเซอร์วัดได้ตามเวลาเท่ากับอัตราการเปลี่ยนตามความสูงคูณด้วยอัตราการลอยขึ้น"}, "steps": [{"en": "**Differentiate with respect to height.** For $P(z)=1013.25\\,e^{-z/8.4}$ the chain rule on the exponent gives $$\\frac{dP}{dz}=1013.25\\,e^{-z/8.4}\\cdot\\left(-\\frac{1}{8.4}\\right)=-\\frac{P(z)}{8.4}.$$", "th": "**หาอนุพันธ์เทียบกับความสูง** สำหรับ $P(z)=1013.25\\,e^{-z/8.4}$ ใช้หลักเกณฑ์ลูกโซ่กับเลขชี้กำลังได้ $$\\frac{dP}{dz}=1013.25\\,e^{-z/8.4}\\cdot\\left(-\\frac{1}{8.4}\\right)=-\\frac{P(z)}{8.4}$$"}, {"en": "**Evaluate at 3 km.** $P(3)=1013.25\\,e^{-0.3571}=1013.25(0.6997)\\approx708.9$ hPa, so $dP/dz=-708.9/8.4\\approx-84.40$ hPa/km.", "th": "**แทนค่าที่ 3 km** $P(3)=1013.25\\,e^{-0.3571}=1013.25(0.6997)\\approx708.9$ hPa ดังนั้น $dP/dz=-708.9/8.4\\approx-84.40$ hPa/km"}, {"en": "**Convert the climb rate to matching units.** $dz/dt=5$ m/s $=300$ m/min $=0.3$ km/min.", "th": "**แปลงอัตราการลอยขึ้นให้หน่วยเข้ากัน** $dz/dt=5$ m/s $=300$ m/min $=0.3$ km/min"}, {"en": "**Apply the chain rule.** $$\\frac{dP}{dt}=\\frac{dP}{dz}\\cdot\\frac{dz}{dt}=(-84.40\\ \\text{hPa/km})(0.3\\ \\text{km/min})\\approx-25.32\\ \\text{hPa/min}.$$ The km cancel, leaving hPa/min.", "th": "**ใช้หลักเกณฑ์ลูกโซ่** $$\\frac{dP}{dt}=\\frac{dP}{dz}\\cdot\\frac{dz}{dt}=(-84.40\\ \\text{hPa/km})(0.3\\ \\text{km/min})\\approx-25.32\\ \\text{hPa/min}$$ หน่วย km ตัดกันเหลือ hPa/min"}, {"en": "**Compare with 10 km.** $P(10)\\approx308.2$ hPa, so $dP/dt=-(308.2/8.4)(0.3)\\approx-11.00$ hPa/min: the same climb gives a slower pressure drop higher up.", "th": "**เปรียบเทียบที่ 10 km** $P(10)\\approx308.2$ hPa ดังนั้น $dP/dt=-(308.2/8.4)(0.3)\\approx-11.00$ hPa/min การลอยขึ้นเท่าเดิมทำให้ความดันลดช้าลงเมื่ออยู่สูงขึ้น"}], "meaning": {"en": "At 3 km the balloon's sensor sees the pressure fall by about 25 hPa per minute. Because $dP/dz$ is proportional to $P$, the drop slows with height. Meteorologists use the same relation backwards: from the measured $dP/dt$ they compute the balloon's height and ascent rate.", "th": "ที่ความสูง 3 km เซนเซอร์บนบอลลูนวัดความดันที่ลดลงราว 25 hPa ต่อนาที เพราะ $dP/dz$ แปรผันตาม $P$ การลดลงจึงช้าลงเมื่อสูงขึ้น นักอุตุนิยมวิทยาใช้ความสัมพันธ์เดียวกันย้อนกลับ คือคำนวณความสูงและอัตราการลอยของบอลลูนจาก $dP/dt$ ที่วัดได้"}, "pitfalls": [{"en": "Mixing units: multiplying hPa/km by 5 m/s gives a meaningless number. Convert so the length units cancel.", "th": "ใช้หน่วยปนกัน การคูณ hPa/km กับ 5 m/s ให้ตัวเลขที่ไม่มีความหมาย ต้องแปลงหน่วยให้หน่วยความยาวตัดกัน"}, {"en": "Forgetting the inner derivative $-1/8.4$ of the exponent, which gives the wrong size and the wrong sign.", "th": "ลืมอนุพันธ์ภายใน $-1/8.4$ ของเลขชี้กำลัง ทำให้ได้ขนาดและเครื่องหมายผิด"}, {"en": "Dropping the minus sign: pressure *falls* as the balloon rises, so $dP/dt<0$.", "th": "ทิ้งเครื่องหมายลบ ความดัน *ลดลง* เมื่อบอลลูนลอยขึ้น ดังนั้น $dP/dt<0$"}]}, "28": {"id": 28, "idea": {"en": "pH is a base-10 logarithm, and the derivative of a logarithm is proportional to $1/x$. That means pH responds to the **relative** change in hydrogen-ion concentration, so a small-looking pH change hides a large change in acidity.", "th": "pH เป็นลอการิทึมฐาน 10 และอนุพันธ์ของลอการิทึมแปรผันตาม $1/x$ pH จึงตอบสนองต่อการเปลี่ยนแปลง **สัมพัทธ์** ของความเข้มข้นไฮโดรเจนไอออน การเปลี่ยน pH ที่ดูเล็กน้อยจึงซ่อนการเปลี่ยนความเป็นกรดที่มาก"}, "steps": [{"en": "**Change the base.** $\\mathrm{pH}=-\\log_{10}H=-\\dfrac{\\ln H}{\\ln10}$, where $H=[\\mathrm{H}^+]$.", "th": "**เปลี่ยนฐาน** $\\mathrm{pH}=-\\log_{10}H=-\\dfrac{\\ln H}{\\ln10}$ โดย $H=[\\mathrm{H}^+]$"}, {"en": "**Differentiate.** Since $\\dfrac{d}{dH}\\ln H=\\dfrac1H$, $$\\frac{d\\,\\mathrm{pH}}{dH}=-\\frac{1}{H\\ln10}.$$", "th": "**หาอนุพันธ์** เนื่องจาก $\\dfrac{d}{dH}\\ln H=\\dfrac1H$ จะได้ $$\\frac{d\\,\\mathrm{pH}}{dH}=-\\frac{1}{H\\ln10}$$"}, {"en": "**Turn pH into concentrations.** $H_0=10^{-8.18}\\approx6.607\\times10^{-9}$ mol/L (pre-industrial) and $H_1=10^{-8.07}\\approx8.511\\times10^{-9}$ mol/L (today). Relative increase: $(H_1-H_0)/H_0\\approx0.288=28.8\\%$.", "th": "**แปลง pH เป็นความเข้มข้น** $H_0=10^{-8.18}\\approx6.607\\times10^{-9}$ mol/L (ก่อนยุคอุตสาหกรรม) และ $H_1=10^{-8.07}\\approx8.511\\times10^{-9}$ mol/L (ปัจจุบัน) เพิ่มขึ้นสัมพัทธ์ $(H_1-H_0)/H_0\\approx0.288=28.8\\%$"}, {"en": "**Differential estimate.** $\\Delta\\mathrm{pH}\\approx\\dfrac{d\\,\\mathrm{pH}}{dH}\\Delta H=-\\dfrac{1}{\\ln10}\\dfrac{\\Delta H}{H_0}=-0.4343\\times0.288\\approx-0.125$.", "th": "**ประมาณด้วยผลต่างเชิงอนุพันธ์** $\\Delta\\mathrm{pH}\\approx\\dfrac{d\\,\\mathrm{pH}}{dH}\\Delta H=-\\dfrac{1}{\\ln10}\\dfrac{\\Delta H}{H_0}=-0.4343\\times0.288\\approx-0.125$"}, {"en": "**Compare with the exact value.** The true change is $8.07-8.18=-0.110$. The linear estimate overshoots because a 29 % change is not small; the log curve bends.", "th": "**เทียบกับค่าจริง** การเปลี่ยนแปลงจริงคือ $8.07-8.18=-0.110$ ค่าประมาณเชิงเส้นเกินไปเล็กน้อยเพราะการเปลี่ยน 29 % ไม่ใช่ค่าเล็ก เส้นโค้งลอการิทึมจึงโค้งออกจากเส้นสัมผัส"}, {"en": "**Look ahead.** If pH falls to 7.95 by 2100, $10^{-7.95}/H_0-1\\approx0.70$: about 70 % more hydrogen ions than before industrialisation.", "th": "**มองไปข้างหน้า** ถ้า pH ลดลงเหลือ 7.95 ในปี 2100 จะได้ $10^{-7.95}/H_0-1\\approx0.70$ คือไฮโดรเจนไอออนเพิ่มขึ้นราว 70 % จากก่อนยุคอุตสาหกรรม"}], "meaning": {"en": "A drop of \\\"only\\\" 0.11 pH units means the ocean surface has about 29 % more hydrogen ions than before industrialisation. That shifts carbonate chemistry and makes it harder for corals and shellfish, including Andaman Sea reef builders, to build calcium-carbonate skeletons.", "th": "การลดลงของ pH \\\"เพียง\\\" 0.11 หน่วย หมายความว่าผิวมหาสมุทรมีไฮโดรเจนไอออนมากขึ้นราว 29 % จากก่อนยุคอุตสาหกรรม ซึ่งเปลี่ยนเคมีของคาร์บอเนต และทำให้ปะการังและสัตว์มีเปลือก รวมถึงสิ่งมีชีวิตสร้างแนวปะการังในทะเลอันดามัน สร้างโครงร่างแคลเซียมคาร์บอเนตได้ยากขึ้น"}, "pitfalls": [{"en": "Forgetting the factor $1/\\ln10$ when differentiating $\\log_{10}$; $\\frac{d}{dx}\\log_{10}x=\\frac{1}{x\\ln10}$, not $\\frac1x$.", "th": "ลืมตัวประกอบ $1/\\ln10$ เมื่อหาอนุพันธ์ของ $\\log_{10}$ เพราะ $\\frac{d}{dx}\\log_{10}x=\\frac{1}{x\\ln10}$ ไม่ใช่ $\\frac1x$"}, {"en": "Reading pH as a linear scale: a change of 0.11 is not \\\"0.11 % more acidic\\\"; one pH unit is a factor of 10.", "th": "อ่าน pH เหมือนมาตราส่วนเชิงเส้น การเปลี่ยน 0.11 ไม่ได้แปลว่า \\\"เป็นกรดเพิ่ม 0.11 %\\\" เพราะ pH หนึ่งหน่วยคือ 10 เท่า"}, {"en": "Using the differential for large changes and trusting it exactly; it is only a first-order approximation.", "th": "ใช้ผลต่างเชิงอนุพันธ์กับการเปลี่ยนแปลงขนาดใหญ่แล้วเชื่อว่าแม่นยำ ที่จริงเป็นเพียงการประมาณอันดับหนึ่ง"}]}, "29": {"id": 29, "idea": {"en": "The apparent dip seen in a cross-section is $\\alpha=\\arctan(\\tan\\delta\\sin\\beta)$. Differentiating an **inverse trigonometric function** with the chain rule shows how sensitive the apparent dip is to the direction of the section.", "th": "มุมเทปรากฏ (apparent dip) ที่เห็นในภาคตัดขวางคือ $\\alpha=\\arctan(\\tan\\delta\\sin\\beta)$ การหาอนุพันธ์ของ **ฟังก์ชันตรีโกณมิติผกผัน (inverse trigonometric function)** ด้วยหลักเกณฑ์ลูกโซ่บอกว่ามุมเทปรากฏไวต่อทิศทางของภาคตัดเพียงใด"}, "steps": [{"en": "**Compute the apparent dip at the default.** With $\\delta=40^\\circ$ and $\\beta=30^\\circ$: $\\tan40^\\circ=0.8391$, so $u=\\tan\\delta\\sin\\beta=0.8391\\times0.5=0.4195$ and $\\alpha=\\arctan0.4195\\approx22.76^\\circ$.", "th": "**คำนวณมุมเทปรากฏที่ค่าตั้งต้น** เมื่อ $\\delta=40^\\circ$ และ $\\beta=30^\\circ$: $\\tan40^\\circ=0.8391$ ดังนั้น $u=\\tan\\delta\\sin\\beta=0.8391\\times0.5=0.4195$ และ $\\alpha=\\arctan0.4195\\approx22.76^\\circ$"}, {"en": "**Differentiate with the chain rule.** Let $u=\\tan\\delta\\sin\\beta$, so $du/d\\beta=\\tan\\delta\\cos\\beta$ ($\\delta$ is fixed). With $\\dfrac{d}{du}\\arctan u=\\dfrac1{1+u^2}$: $$\\frac{d\\alpha}{d\\beta}=\\frac{\\tan\\delta\\cos\\beta}{1+\\tan^2\\delta\\sin^2\\beta}.$$", "th": "**หาอนุพันธ์ด้วยหลักเกณฑ์ลูกโซ่** ให้ $u=\\tan\\delta\\sin\\beta$ ดังนั้น $du/d\\beta=\\tan\\delta\\cos\\beta$ ($\\delta$ คงที่) และ $\\dfrac{d}{du}\\arctan u=\\dfrac1{1+u^2}$ จะได้ $$\\frac{d\\alpha}{d\\beta}=\\frac{\\tan\\delta\\cos\\beta}{1+\\tan^2\\delta\\sin^2\\beta}$$"}, {"en": "**Evaluate at $\\beta=30^\\circ$.** Numerator $0.8391\\times0.8660=0.7267$; denominator $1+0.4195^2=1.1760$. So $d\\alpha/d\\beta\\approx0.618$. Both angles are in the same unit, so this is also 0.618 degree per degree.", "th": "**แทนค่าที่ $\\beta=30^\\circ$** ตัวเศษ $0.8391\\times0.8660=0.7267$ ตัวส่วน $1+0.4195^2=1.1760$ ดังนั้น $d\\alpha/d\\beta\\approx0.618$ เนื่องจากมุมทั้งสองใช้หน่วยเดียวกัน ค่านี้จึงเท่ากับ 0.618 องศาต่อองศาด้วย"}, {"en": "**Check the extremes.** At $\\beta=90^\\circ$: $\\cos\\beta=0$, so $d\\alpha/d\\beta=0$ and $\\alpha=\\delta=40^\\circ$. At $\\beta=0$: $d\\alpha/d\\beta=\\tan\\delta\\approx0.839$, the largest sensitivity.", "th": "**ตรวจกรณีสุดขั้ว** ที่ $\\beta=90^\\circ$: $\\cos\\beta=0$ ดังนั้น $d\\alpha/d\\beta=0$ และ $\\alpha=\\delta=40^\\circ$ ที่ $\\beta=0$: $d\\alpha/d\\beta=\\tan\\delta\\approx0.839$ ซึ่งเป็นความไวสูงสุด"}, {"en": "**Use the differential.** If the section direction is uncertain by $\\pm2^\\circ$ at $\\beta=30^\\circ$, then $d\\alpha\\approx0.618\\times2\\approx1.2^\\circ$.", "th": "**ใช้ผลต่างเชิงอนุพันธ์** ถ้าทิศทางของภาคตัดคลาดเคลื่อน $\\pm2^\\circ$ ที่ $\\beta=30^\\circ$ จะได้ $d\\alpha\\approx0.618\\times2\\approx1.2^\\circ$"}], "meaning": {"en": "The apparent dip is never larger than the true dip. In a section 30° from the strike, a 40° layer looks like it dips only about 23°. Close to perpendicular, errors in section direction hardly matter; close to the strike they matter a lot, so field geologists measure the orientation of road cuts carefully.", "th": "มุมเทปรากฏไม่มีวันมากกว่ามุมเทจริง ในภาคตัดที่ทำมุม 30° กับแนวระดับ (strike) ชั้นหินที่เท 40° จะดูเหมือนเทเพียงประมาณ 23° เมื่อภาคตัดเกือบตั้งฉาก ความคลาดเคลื่อนของทิศทางแทบไม่มีผล แต่เมื่อใกล้แนวระดับจะมีผลมาก นักธรณีวิทยาภาคสนามจึงต้องวัดทิศทางของหน้าตัดถนนอย่างระมัดระวัง"}, "pitfalls": [{"en": "Forgetting the inner derivative $\\tan\\delta\\cos\\beta$ when differentiating $\\arctan u$.", "th": "ลืมอนุพันธ์ภายใน $\\tan\\delta\\cos\\beta$ เมื่อหาอนุพันธ์ของ $\\arctan u$"}, {"en": "Treating $\\delta$ as a variable: the true dip is fixed, only $\\beta$ changes, so $\\tan\\delta$ is a constant.", "th": "ถือว่า $\\delta$ เป็นตัวแปร มุมเทจริงคงที่ มีเพียง $\\beta$ ที่เปลี่ยน $\\tan\\delta$ จึงเป็นค่าคงตัว"}, {"en": "Calculator in the wrong angle mode when computing $\\tan40^\\circ$ or $\\arctan$.", "th": "ตั้งเครื่องคิดเลขผิดโหมดมุมเมื่อคำนวณ $\\tan40^\\circ$ หรือ $\\arctan$"}]}, "30": {"id": 30, "idea": {"en": "Wave physics gives $\\omega^2=gk\\tanh(kh)$. To find the depth we must undo the tanh, which needs the **inverse hyperbolic tangent** artanh. Its derivative $1/(1-x^2)$ also tells how errors in the measured wavelength grow into depth errors.", "th": "ฟิสิกส์ของคลื่นให้ $\\omega^2=gk\\tanh(kh)$ เพื่อหาความลึกต้องย้อนฟังก์ชัน tanh ซึ่งต้องใช้ **ฟังก์ชันไฮเพอร์โบลิกผกผัน (inverse hyperbolic function)** artanh อนุพันธ์ $1/(1-x^2)$ ของมันยังบอกว่าความคลาดเคลื่อนของความยาวคลื่นที่วัดได้ขยายเป็นความคลาดเคลื่อนของความลึกเท่าใด"}, "steps": [{"en": "**Solve for $h$.** Divide by $gk$: $\\tanh(kh)=\\dfrac{\\omega^2}{gk}=x$, so $kh=\\operatorname{artanh}x$ and $h=\\dfrac1k\\operatorname{artanh}x$. This needs $|x|<1$.", "th": "**แก้หา $h$** หารด้วย $gk$: $\\tanh(kh)=\\dfrac{\\omega^2}{gk}=x$ ดังนั้น $kh=\\operatorname{artanh}x$ และ $h=\\dfrac1k\\operatorname{artanh}x$ ซึ่งต้องมี $|x|<1$"}, {"en": "**Plug in $T=10$ s, $L=100$ m.** $\\omega=2\\pi/10=0.6283$ rad/s, $k=2\\pi/100=0.06283$ m⁻¹, so $x=\\dfrac{0.3948}{9.81\\times0.06283}=\\dfrac{0.3948}{0.6164}\\approx0.6405<1$.", "th": "**แทนค่า $T=10$ s, $L=100$ m** $\\omega=2\\pi/10=0.6283$ rad/s, $k=2\\pi/100=0.06283$ m⁻¹ ดังนั้น $x=\\dfrac{0.3948}{9.81\\times0.06283}=\\dfrac{0.3948}{0.6164}\\approx0.6405<1$"}, {"en": "**Evaluate artanh with logarithms.** $\\operatorname{artanh}x=\\tfrac12\\ln\\dfrac{1+x}{1-x}=\\tfrac12\\ln\\dfrac{1.6405}{0.3595}=\\tfrac12\\ln4.563\\approx0.7590$. Then $h=0.7590/0.06283\\approx12.08$ m.", "th": "**คำนวณ artanh ด้วยลอการิทึม** $\\operatorname{artanh}x=\\tfrac12\\ln\\dfrac{1+x}{1-x}=\\tfrac12\\ln\\dfrac{1.6405}{0.3595}=\\tfrac12\\ln4.563\\approx0.7590$ จากนั้น $h=0.7590/0.06283\\approx12.08$ m"}, {"en": "**Differentiate with respect to $L$.** Write $h=\\dfrac{L}{2\\pi}\\operatorname{artanh}x$ with $x=\\dfrac{\\omega^2L}{2\\pi g}$, so $dx/dL=x/L$. Product and chain rules give $$\\frac{dh}{dL}=\\frac{1}{2\\pi}\\left[\\operatorname{artanh}x+\\frac{x}{1-x^2}\\right].$$", "th": "**หาอนุพันธ์เทียบกับ $L$** เขียน $h=\\dfrac{L}{2\\pi}\\operatorname{artanh}x$ โดย $x=\\dfrac{\\omega^2L}{2\\pi g}$ ดังนั้น $dx/dL=x/L$ ใช้กฎผลคูณและหลักเกณฑ์ลูกโซ่ได้ $$\\frac{dh}{dL}=\\frac{1}{2\\pi}\\left[\\operatorname{artanh}x+\\frac{x}{1-x^2}\\right]$$"}, {"en": "**Evaluate the sensitivity.** $x/(1-x^2)=0.6405/0.5898\\approx1.086$, so $dh/dL=(0.7590+1.086)/6.283\\approx0.294$ m per m. A 5 m wavelength error gives about $1.5$ m depth error.", "th": "**คำนวณความไว** $x/(1-x^2)=0.6405/0.5898\\approx1.086$ ดังนั้น $dh/dL=(0.7590+1.086)/6.283\\approx0.294$ m ต่อ m ความคลาดเคลื่อนของความยาวคลื่น 5 m ทำให้ความลึกคลาดเคลื่อนประมาณ $1.5$ m"}, {"en": "**Find where the method breaks.** $x\\to1$ when $L\\to gT^2/(2\\pi)=9.81(100)/6.283\\approx156.1$ m (the deep-water wavelength). There $\\operatorname{artanh}x\\to\\infty$ and $1/(1-x^2)\\to\\infty$.", "th": "**หาจุดที่วิธีนี้ใช้ไม่ได้** $x\\to1$ เมื่อ $L\\to gT^2/(2\\pi)=9.81(100)/6.283\\approx156.1$ m (ความยาวคลื่นน้ำลึก) ที่จุดนั้น $\\operatorname{artanh}x\\to\\infty$ และ $1/(1-x^2)\\to\\infty$"}], "meaning": {"en": "A 10 s swell with a 100 m wavelength means the water is about 12 m deep. The method works well in shallow coastal water, roughly up to 15–20 m, but fails as the waves stop feeling the bottom. That is why satellite-derived bathymetry is used for charting shallow coasts and reefs that survey ships cannot reach.", "th": "คลื่นที่มีคาบ 10 s และความยาวคลื่น 100 m บอกว่าน้ำลึกประมาณ 12 m วิธีนี้ใช้ได้ดีในน้ำตื้นชายฝั่งลึกถึงราว 15–20 m แต่ใช้ไม่ได้เมื่อคลื่นไม่ \\\"รู้สึก\\\" ถึงพื้นทะเลอีกต่อไป จึงใช้การหาความลึกจากภาพดาวเทียมเพื่อทำแผนที่ชายฝั่งตื้นและแนวปะการังที่เรือสำรวจเข้าไม่ถึง"}, "pitfalls": [{"en": "Using artanh when $x\\ge1$: artanh is only defined for $|x|<1$; there the wave is a deep-water wave and depth cannot be found.", "th": "ใช้ artanh เมื่อ $x\\ge1$ ฟังก์ชัน artanh นิยามเฉพาะ $|x|<1$ ในกรณีนั้นเป็นคลื่นน้ำลึกและหาความลึกไม่ได้"}, {"en": "Confusing $\\operatorname{artanh}x$ with $1/\\tanh x$; the inverse function is not the reciprocal.", "th": "สับสน $\\operatorname{artanh}x$ กับ $1/\\tanh x$ ฟังก์ชันผกผันไม่ใช่ส่วนกลับ"}, {"en": "Forgetting that $k$ also depends on $L$ when computing $dh/dL$, which drops the product-rule term.", "th": "ลืมว่า $k$ ขึ้นกับ $L$ ด้วยเมื่อหา $dh/dL$ ทำให้ขาดพจน์จากกฎผลคูณ"}]}, "31": {"id": 31, "idea": {"en": "The Earth's meridian is an ellipse given by an equation in $x$ and $z$, not by $z=f(x)$. **Implicit differentiation** finds its slope directly, and the normal to that slope defines the latitude GPS uses.", "th": "เส้นเมริเดียนของโลกเป็นวงรีที่กำหนดด้วยสมการใน $x$ และ $z$ ไม่ใช่ในรูป $z=f(x)$ **การหาอนุพันธ์โดยปริยาย (implicit differentiation)** หาความชันได้โดยตรง และเส้นตั้งฉากกับความชันนั้นกำหนดละติจูดที่ GPS ใช้"}, "steps": [{"en": "**Differentiate both sides with respect to $x$**, treating $z$ as a function of $x$: $$\\frac{2x}{a^2}+\\frac{2z}{b^2}\\frac{dz}{dx}=0\\quad\\Longrightarrow\\quad\\frac{dz}{dx}=-\\frac{b^2x}{a^2z}.$$", "th": "**หาอนุพันธ์ทั้งสองข้างเทียบกับ $x$** โดยถือว่า $z$ เป็นฟังก์ชันของ $x$ $$\\frac{2x}{a^2}+\\frac{2z}{b^2}\\frac{dz}{dx}=0\\quad\\Longrightarrow\\quad\\frac{dz}{dx}=-\\frac{b^2x}{a^2z}$$"}, {"en": "**Get the normal.** The normal's slope is the negative reciprocal, $\\dfrac{a^2z}{b^2x}$, and its angle with the equator is the geodetic latitude: $\\tan\\varphi=\\dfrac{a^2z}{b^2x}$.", "th": "**หาเส้นตั้งฉาก** ความชันของเส้นตั้งฉากคือส่วนกลับที่ติดลบ $\\dfrac{a^2z}{b^2x}$ และมุมที่ทำกับเส้นศูนย์สูตรคือละติจูดเชิงภูมิมาตร (geodetic latitude) $\\tan\\varphi=\\dfrac{a^2z}{b^2x}$"}, {"en": "**Relate the two latitudes.** The geocentric latitude has $\\tan\\psi=z/x$, so $$\\tan\\varphi=\\left(\\frac ab\\right)^2\\tan\\psi,\\qquad \\left(\\frac ab\\right)^2=\\left(\\frac{6378.137}{6356.752}\\right)^2\\approx1.006739.$$", "th": "**เชื่อมละติจูดทั้งสอง** ละติจูดเชิงศูนย์กลางโลก (geocentric latitude) มี $\\tan\\psi=z/x$ ดังนั้น $$\\tan\\varphi=\\left(\\frac ab\\right)^2\\tan\\psi,\\qquad \\left(\\frac ab\\right)^2=\\left(\\frac{6378.137}{6356.752}\\right)^2\\approx1.006739$$"}, {"en": "**Evaluate at $\\psi=45^\\circ$.** $\\tan\\varphi=1.006739$, so $\\varphi=\\arctan1.006739\\approx45.1924^\\circ$ and $\\varphi-\\psi\\approx0.1924^\\circ$.", "th": "**แทนค่าที่ $\\psi=45^\\circ$** $\\tan\\varphi=1.006739$ ดังนั้น $\\varphi=\\arctan1.006739\\approx45.1924^\\circ$ และ $\\varphi-\\psi\\approx0.1924^\\circ$"}, {"en": "**Why the maximum is near 45°.** Let $q=(a/b)^2$. Setting $\\dfrac{d}{d\\psi}\\left[\\arctan(q\\tan\\psi)-\\psi\\right]=0$ gives $q\\sec^2\\psi=1+q^2\\tan^2\\psi$, i.e. $\\tan^2\\psi=1/q$, so $\\psi=\\arctan(1/\\sqrt q)\\approx44.9^\\circ$.", "th": "**ทำไมค่าสูงสุดอยู่ใกล้ 45°** ให้ $q=(a/b)^2$ ตั้ง $\\dfrac{d}{d\\psi}\\left[\\arctan(q\\tan\\psi)-\\psi\\right]=0$ ได้ $q\\sec^2\\psi=1+q^2\\tan^2\\psi$ คือ $\\tan^2\\psi=1/q$ ดังนั้น $\\psi=\\arctan(1/\\sqrt q)\\approx44.9^\\circ$"}, {"en": "**Convert to distance.** $0.1924^\\circ=0.003358$ rad, and $0.003358\\times6371\\approx21.4$ km along the surface.", "th": "**แปลงเป็นระยะทาง** $0.1924^\\circ=0.003358$ rad และ $0.003358\\times6371\\approx21.4$ km ตามผิวโลก"}], "meaning": {"en": "Because the Earth is slightly flattened, the local vertical does not point exactly to the Earth's centre. The two latitudes agree at the equator and the poles but differ by up to about 0.19°, roughly 21 km on the ground. GPS receivers and national maps use geodetic latitude, so this implicit derivative is built into every coordinate you read from a phone.", "th": "เพราะโลกแป้นเล็กน้อย แนวดิ่งในท้องถิ่นจึงไม่ได้ชี้ตรงไปยังศูนย์กลางโลก ละติจูดทั้งสองแบบเท่ากันที่เส้นศูนย์สูตรและขั้วโลก แต่ต่างกันได้ถึงประมาณ 0.19° หรือราว 21 km บนพื้นผิว เครื่องรับ GPS และแผนที่ของประเทศใช้ละติจูดเชิงภูมิมาตร อนุพันธ์โดยปริยายนี้จึงอยู่ในทุกพิกัดที่อ่านจากโทรศัพท์"}, "pitfalls": [{"en": "Forgetting $dz/dx$ when differentiating $z^2$: $\\frac{d}{dx}z^2=2z\\,\\frac{dz}{dx}$, not $2z$.", "th": "ลืม $dz/dx$ เมื่อหาอนุพันธ์ของ $z^2$ เพราะ $\\frac{d}{dx}z^2=2z\\,\\frac{dz}{dx}$ ไม่ใช่ $2z$"}, {"en": "Using the tangent's slope as the latitude: latitude is defined by the **normal** (the local vertical), whose slope is the negative reciprocal.", "th": "ใช้ความชันของเส้นสัมผัสเป็นละติจูด ละติจูดนิยามจาก **เส้นตั้งฉาก** (แนวดิ่งท้องถิ่น) ซึ่งมีความชันเป็นส่วนกลับที่ติดลบ"}, {"en": "Assuming the Earth is a sphere when working at the scale of kilometres; the 21 km difference is far larger than GPS precision.", "th": "สมมติว่าโลกเป็นทรงกลมเมื่อทำงานในระดับกิโลเมตร ผลต่าง 21 km มากกว่าความแม่นยำของ GPS มาก"}]}, "32": {"id": 32, "idea": {"en": "In the hillslope diffusion equation $\\partial z/\\partial t=D\\,z''$, erosion or deposition depends only on the **second derivative** (curvature). Where the profile is convex ($z''<0$) the ground is lowered, where it is concave ($z''>0$) it is raised, and the **inflection point** separates the two.", "th": "ในสมการการแพร่ของลาดเขา $\\partial z/\\partial t=D\\,z''$ การกัดเซาะหรือการสะสมขึ้นกับ **อนุพันธ์อันดับสอง (second derivative)** หรือความโค้งเท่านั้น ส่วนที่นูน ($z''<0$) พื้นจะต่ำลง ส่วนที่เว้า ($z''>0$) พื้นจะสูงขึ้น และ **จุดเปลี่ยนเว้า (inflection point)** แบ่งสองส่วนนี้"}, "steps": [{"en": "**First derivative.** Let $u=(x-x_0)/w$ and $s=e^u$, so $z=H/(1+s)$. By the chain rule, $$z'=-\\frac{H}{w}\\,\\frac{s}{(1+s)^2}<0,$$ so the hill slopes downward everywhere.", "th": "**อนุพันธ์อันดับหนึ่ง** ให้ $u=(x-x_0)/w$ และ $s=e^u$ ดังนั้น $z=H/(1+s)$ ใช้หลักเกณฑ์ลูกโซ่ได้ $$z'=-\\frac{H}{w}\\,\\frac{s}{(1+s)^2}<0$$ เนินจึงลาดลงตลอด"}, {"en": "**Second derivative.** Differentiate $s/(1+s)^2$ with the quotient rule (and $ds/dx=s/w$): $$z''=-\\frac{H}{w^2}\\,\\frac{s(1-s)}{(1+s)^3}.$$", "th": "**อนุพันธ์อันดับสอง** หาอนุพันธ์ของ $s/(1+s)^2$ ด้วยกฎผลหาร (และ $ds/dx=s/w$) $$z''=-\\frac{H}{w^2}\\,\\frac{s(1-s)}{(1+s)^3}$$"}, {"en": "**Inflection point.** $z''=0$ when $s=1$, i.e. $u=0$, so $x=x_0=100$ m. For $x<100$, $s<1$ and $z''<0$ (convex, erosion); for $x>100$, $s>1$ and $z''>0$ (concave, deposition).", "th": "**จุดเปลี่ยนเว้า** $z''=0$ เมื่อ $s=1$ คือ $u=0$ ดังนั้น $x=x_0=100$ m เมื่อ $x<100$ จะได้ $s<1$ และ $z''<0$ (นูน กัดเซาะ) เมื่อ $x>100$ จะได้ $s>1$ และ $z''>0$ (เว้า สะสม)"}, {"en": "**Where is erosion fastest?** Maximise $g(s)=s(1-s)/(1+s)^3$: $g'(s)=0$ gives $1-4s+s^2=0$, so $s=2-\\sqrt3\\approx0.268$, i.e. $x=100+20\\ln(0.268)\\approx73.7$ m. There $g\\approx0.0962$.", "th": "**กัดเซาะเร็วที่สุดตรงไหน** หาค่าสูงสุดของ $g(s)=s(1-s)/(1+s)^3$ จาก $g'(s)=0$ ได้ $1-4s+s^2=0$ ดังนั้น $s=2-\\sqrt3\\approx0.268$ คือ $x=100+20\\ln(0.268)\\approx73.7$ m ซึ่ง $g\\approx0.0962$"}, {"en": "**Convert to a rate.** $H/w^2=50/400=0.125$ m⁻¹, so $\\partial z/\\partial t=-D(0.125)(0.0962)=-0.01\\times0.01203\\approx-1.20\\times10^{-4}$ m/yr $=-0.120$ mm/yr. By symmetry the maximum deposition, $+0.120$ mm/yr, is at $x\\approx126.3$ m.", "th": "**แปลงเป็นอัตรา** $H/w^2=50/400=0.125$ m⁻¹ ดังนั้น $\\partial z/\\partial t=-D(0.125)(0.0962)=-0.01\\times0.01203\\approx-1.20\\times10^{-4}$ m/yr $=-0.120$ mm/yr จากความสมมาตร การสะสมสูงสุด $+0.120$ mm/yr อยู่ที่ $x\\approx126.3$ m"}], "meaning": {"en": "The upper, convex part of the hill loses up to about 0.12 mm of soil per year, and the lower, concave part gains the same amount. Over thousands of years this rounds hilltops and fills valley floors, which is why old landscapes look smooth. Because $z''\\propto H/w^2$, a hill twice as wide erodes four times more slowly.", "th": "ส่วนบนของเนินที่นูนสูญเสียดินได้ถึงประมาณ 0.12 mm ต่อปี และส่วนล่างที่เว้าได้รับดินเท่ากัน ตลอดหลายพันปีกระบวนการนี้ทำให้ยอดเนินมนและหุบเขาถูกถม ภูมิประเทศเก่าจึงดูราบเรียบ เนื่องจาก $z''\\propto H/w^2$ เนินที่กว้างขึ้นสองเท่าจะกัดเซาะช้าลงสี่เท่า"}, "pitfalls": [{"en": "Thinking the steepest point erodes fastest: erosion follows curvature $z''$, not slope $z'$. The steepest point is the inflection point, where nothing changes.", "th": "คิดว่าจุดที่ชันที่สุดถูกกัดเซาะเร็วที่สุด การกัดเซาะขึ้นกับความโค้ง $z''$ ไม่ใช่ความชัน $z'$ จุดที่ชันที่สุดคือจุดเปลี่ยนเว้าซึ่งไม่มีการเปลี่ยนแปลง"}, {"en": "Mixing up the signs: $z''<0$ means concave **down** (convex hilltop) and gives $\\partial z/\\partial t<0$, i.e. lowering.", "th": "สับสนเครื่องหมาย $z''<0$ หมายถึงเว้าคว่ำ (ยอดเนินนูน) และให้ $\\partial z/\\partial t<0$ คือพื้นต่ำลง"}, {"en": "Forgetting the factor $1/w$ from the chain rule each time you differentiate, which leaves $z''$ off by $w^2$.", "th": "ลืมตัวประกอบ $1/w$ จากหลักเกณฑ์ลูกโซ่ทุกครั้งที่หาอนุพันธ์ ทำให้ $z''$ ผิดไป $w^2$ เท่า"}]}, "33": {"id": 33, "idea": {"en": "The epicentral distance depends on the S–P time and on the wave speeds, which are never known exactly. **Differentials** estimate how much each input error moves the computed distance, without recomputing everything.", "th": "ระยะทางถึงศูนย์กลางแผ่นดินไหวขึ้นกับเวลา S–P และความเร็วคลื่น ซึ่งไม่เคยรู้ค่าได้แน่นอน **ผลต่างเชิงอนุพันธ์ (differential)** ประมาณว่าความคลาดเคลื่อนของข้อมูลแต่ละตัวทำให้ระยะทางที่คำนวณได้เปลี่ยนไปเท่าใด โดยไม่ต้องคำนวณใหม่ทั้งหมด"}, "steps": [{"en": "**Derive the formula.** The P wave arrives at $d/v_p$ and the S wave at $d/v_s$, so $\\Delta t=d\\left(\\frac1{v_s}-\\frac1{v_p}\\right)=d\\,\\frac{v_p-v_s}{v_pv_s}$, giving $d=\\Delta t\\,\\dfrac{v_pv_s}{v_p-v_s}$.", "th": "**หาสูตร** คลื่น P มาถึงที่เวลา $d/v_p$ และคลื่น S ที่ $d/v_s$ ดังนั้น $\\Delta t=d\\left(\\frac1{v_s}-\\frac1{v_p}\\right)=d\\,\\frac{v_p-v_s}{v_pv_s}$ ได้ $d=\\Delta t\\,\\dfrac{v_pv_s}{v_p-v_s}$"}, {"en": "**Compute the distance.** $\\dfrac{v_pv_s}{v_p-v_s}=\\dfrac{6.0\\times3.5}{2.5}=8.4$ km/s, so $d=12\\times8.4=100.8$ km.", "th": "**คำนวณระยะทาง** $\\dfrac{v_pv_s}{v_p-v_s}=\\dfrac{6.0\\times3.5}{2.5}=8.4$ km/s ดังนั้น $d=12\\times8.4=100.8$ km"}, {"en": "**Timing error.** $\\partial d/\\partial\\Delta t=8.4$ km/s. A picking error $d(\\Delta t)=0.2$ s gives $dd=8.4\\times0.2=1.68$ km.", "th": "**ความคลาดเคลื่อนของเวลา** $\\partial d/\\partial\\Delta t=8.4$ km/s ความคลาดเคลื่อนในการอ่านเวลา $d(\\Delta t)=0.2$ s ให้ $dd=8.4\\times0.2=1.68$ km"}, {"en": "**Velocity error.** By the quotient rule, $$\\frac{\\partial d}{\\partial v_s}=\\Delta t\\,v_p\\,\\frac{(v_p-v_s)+v_s}{(v_p-v_s)^2}=\\frac{\\Delta t\\,v_p^2}{(v_p-v_s)^2}=\\frac{12\\times36}{6.25}=69.12\\ \\text{s}.$$", "th": "**ความคลาดเคลื่อนของความเร็ว** ใช้กฎผลหาร $$\\frac{\\partial d}{\\partial v_s}=\\Delta t\\,v_p\\,\\frac{(v_p-v_s)+v_s}{(v_p-v_s)^2}=\\frac{\\Delta t\\,v_p^2}{(v_p-v_s)^2}=\\frac{12\\times36}{6.25}=69.12\\ \\text{s}$$"}, {"en": "**Compare.** An error $dv_s=0.1$ km/s gives $dd=69.12\\times0.1\\approx6.91$ km, about four times the timing error.", "th": "**เปรียบเทียบ** ความคลาดเคลื่อน $dv_s=0.1$ km/s ให้ $dd=69.12\\times0.1\\approx6.91$ km ประมาณสี่เท่าของผลจากความคลาดเคลื่อนของเวลา"}], "meaning": {"en": "The earthquake is about 101 km from the station. The distance is much more sensitive to the S-wave speed than to the clock, because $v_p-v_s$ is a small difference in the denominator. Better crustal velocity models are therefore worth more than better timing; three such distances are then combined to locate the epicentre.", "th": "แผ่นดินไหวอยู่ห่างจากสถานีประมาณ 101 km ระยะทางไวต่อความเร็วคลื่น S มากกว่านาฬิกามาก เพราะ $v_p-v_s$ เป็นผลต่างเล็ก ๆ ในตัวส่วน แบบจำลองความเร็วของเปลือกโลกที่ดีขึ้นจึงมีค่ากว่าการจับเวลาที่แม่นขึ้น จากนั้นนำระยะทางจากสามสถานีมารวมกันเพื่อหาตำแหน่งศูนย์กลาง"}, "pitfalls": [{"en": "Treating $v_s$ as appearing only in the numerator; it is also in the denominator, so you need the quotient rule.", "th": "มองว่า $v_s$ อยู่เฉพาะในตัวเศษ ที่จริงอยู่ในตัวส่วนด้วย จึงต้องใช้กฎผลหาร"}, {"en": "Adding the two error estimates as if they always add up: they are separate sources; combine them only when both happen together.", "th": "บวกค่าประมาณความคลาดเคลื่อนทั้งสองเสมือนว่าเกิดพร้อมกันเสมอ ทั้งสองเป็นแหล่งที่แยกกัน ให้รวมเฉพาะเมื่อเกิดขึ้นพร้อมกัน"}, {"en": "Mixing seconds and minutes for $\\Delta t$, or km and m for the velocities.", "th": "ใช้หน่วยวินาทีปนกับนาทีสำหรับ $\\Delta t$ หรือ km ปนกับ m สำหรับความเร็ว"}]}, "34": {"id": 34, "idea": {"en": "The wavelength of strongest emission is where Planck's curve has a maximum, so we set $\\partial B/\\partial\\lambda=0$. This **optimisation** reduces to the equation $5(1-e^{-x})=x$, which must be solved numerically, and it produces Wien's law $\\lambda_{\\max}=b/T$.", "th": "ความยาวคลื่นที่แผ่รังสีมากที่สุดคือจุดสูงสุดของเส้นโค้งพลังค์ เราจึงตั้ง $\\partial B/\\partial\\lambda=0$ **การหาค่าเหมาะที่สุด (optimisation)** นี้ลดรูปเป็นสมการ $5(1-e^{-x})=x$ ซึ่งต้องแก้เชิงตัวเลข และให้กฎของวีน (Wien's law) $\\lambda_{\\max}=b/T$"}, "steps": [{"en": "**Simplify.** Write $B=C\\lambda^{-5}\\left(e^{a/\\lambda}-1\\right)^{-1}$ with $C=2hc^2$ and $a=hc/(k_BT)$.", "th": "**ทำให้ง่าย** เขียน $B=C\\lambda^{-5}\\left(e^{a/\\lambda}-1\\right)^{-1}$ โดย $C=2hc^2$ และ $a=hc/(k_BT)$"}, {"en": "**Differentiate (product + chain rule).** $$\\frac{\\partial B}{\\partial\\lambda}=C\\left[-5\\lambda^{-6}\\left(e^{a/\\lambda}-1\\right)^{-1}+\\lambda^{-5}\\left(e^{a/\\lambda}-1\\right)^{-2}e^{a/\\lambda}\\frac{a}{\\lambda^2}\\right].$$", "th": "**หาอนุพันธ์ (กฎผลคูณ + หลักเกณฑ์ลูกโซ่)** $$\\frac{\\partial B}{\\partial\\lambda}=C\\left[-5\\lambda^{-6}\\left(e^{a/\\lambda}-1\\right)^{-1}+\\lambda^{-5}\\left(e^{a/\\lambda}-1\\right)^{-2}e^{a/\\lambda}\\frac{a}{\\lambda^2}\\right]$$"}, {"en": "**Set it to zero.** Multiply by $\\lambda^6(e^{a/\\lambda}-1)^2/C$ and let $x=a/\\lambda$: $5(e^x-1)=xe^x$, i.e. $5(1-e^{-x})=x$.", "th": "**ตั้งให้เท่ากับศูนย์** คูณด้วย $\\lambda^6(e^{a/\\lambda}-1)^2/C$ และให้ $x=a/\\lambda$ ได้ $5(e^x-1)=xe^x$ คือ $5(1-e^{-x})=x$"}, {"en": "**Solve numerically (Newton's method).** Let $F(x)=5-5e^{-x}-x$, $F'(x)=5e^{-x}-1$. From $x_0=5$: $F(5)=-0.0337$, $F'(5)=-0.966$, so $x_1=5-0.0349=4.9651$. The root is $x\\approx4.96511$.", "th": "**แก้เชิงตัวเลข (วิธีของนิวตัน)** ให้ $F(x)=5-5e^{-x}-x$, $F'(x)=5e^{-x}-1$ เริ่มที่ $x_0=5$: $F(5)=-0.0337$, $F'(5)=-0.966$ ดังนั้น $x_1=5-0.0349=4.9651$ รากคือ $x\\approx4.96511$"}, {"en": "**Get Wien's constant.** $\\lambda_{\\max}=\\dfrac{hc}{4.965\\,k_BT}=\\dfrac bT$ with $b=\\dfrac{6.626\\times10^{-34}\\times2.998\\times10^{8}}{4.965\\times1.381\\times10^{-23}}\\approx2.898\\times10^{-3}$ m·K $=2897.8$ μm·K.", "th": "**หาค่าคงตัวของวีน** $\\lambda_{\\max}=\\dfrac{hc}{4.965\\,k_BT}=\\dfrac bT$ โดย $b=\\dfrac{6.626\\times10^{-34}\\times2.998\\times10^{8}}{4.965\\times1.381\\times10^{-23}}\\approx2.898\\times10^{-3}$ m·K $=2897.8$ μm·K"}, {"en": "**Apply it.** Sun ($T=5778$ K): $\\lambda_{\\max}=2897.8/5778\\approx0.50$ μm. Earth ($288$ K): $\\approx10.06$ μm. Lava ($1373$ K): $\\approx2.11$ μm.", "th": "**นำไปใช้** ดวงอาทิตย์ ($T=5778$ K): $\\lambda_{\\max}=2897.8/5778\\approx0.50$ μm โลก ($288$ K): $\\approx10.06$ μm ลาวา ($1373$ K): $\\approx2.11$ μm"}], "meaning": {"en": "The Sun's emission peaks in visible green light, about 0.50 μm, while the Earth's peaks in thermal infrared, about 10 μm. Greenhouse gases absorb in the infrared, so they let sunlight in but trap outgoing heat. Satellite thermal sensors (e.g. Landsat band 10) are tuned near 10 μm, and hot lava stands out in short-wave infrared near 2 μm.", "th": "การแผ่รังสีของดวงอาทิตย์สูงสุดที่แสงสีเขียวในช่วงที่ตามองเห็น ประมาณ 0.50 μm ส่วนโลกสูงสุดที่อินฟราเรดความร้อน ประมาณ 10 μm แก๊สเรือนกระจกดูดกลืนอินฟราเรด จึงปล่อยแสงอาทิตย์เข้ามาแต่กักความร้อนขาออกไว้ เซนเซอร์ความร้อนของดาวเทียม (เช่น Landsat แบนด์ 10) จึงตั้งไว้ใกล้ 10 μm และลาวาร้อนจะเด่นในอินฟราเรดคลื่นสั้นใกล้ 2 μm"}, "pitfalls": [{"en": "Accepting the trivial root $x=0$: it corresponds to $\\lambda\\to\\infty$, not a maximum. The physical root is $x\\approx4.965$.", "th": "รับรากชัด $x=0$ ซึ่งสอดคล้องกับ $\\lambda\\to\\infty$ ไม่ใช่จุดสูงสุด รากที่มีความหมายทางฟิสิกส์คือ $x\\approx4.965$"}, {"en": "Using °C instead of kelvin for $T$: Wien's law needs absolute temperature.", "th": "ใช้ °C แทนเคลวินสำหรับ $T$ กฎของวีนต้องใช้อุณหภูมิสัมบูรณ์"}, {"en": "Forgetting that $e^{a/\\lambda}$ has inner derivative $-a/\\lambda^2$, which changes the sign of the second term.", "th": "ลืมว่า $e^{a/\\lambda}$ มีอนุพันธ์ภายใน $-a/\\lambda^2$ ซึ่งเปลี่ยนเครื่องหมายของพจน์ที่สอง"}]}, "35": {"id": 35, "idea": {"en": "Volume, radius and surface uplift all change with time and are tied together by formulas. **Related rates** differentiate those formulas with respect to time, so a known inflow rate of magma gives the rates we can actually observe: the chamber wall moving and the ground rising.", "th": "ปริมาตร รัศมี และการยกตัวของผิวดินล้วนเปลี่ยนตามเวลา และสัมพันธ์กันด้วยสูตร **อัตราสัมพัทธ์ (related rates)** หาอนุพันธ์ของสูตรเหล่านั้นเทียบกับเวลา อัตราการไหลเข้าของแมกมาที่ทราบจึงให้อัตราที่สังเกตได้จริง คือผนังโพรงที่ขยายและพื้นดินที่ยกตัว"}, "steps": [{"en": "**Differentiate the volume.** $V=\\tfrac43\\pi r^3$ with $r=r(t)$. By the chain rule, $\\dfrac{dV}{dt}=4\\pi r^2\\dfrac{dr}{dt}$.", "th": "**หาอนุพันธ์ของปริมาตร** $V=\\tfrac43\\pi r^3$ โดย $r=r(t)$ ใช้หลักเกณฑ์ลูกโซ่ได้ $\\dfrac{dV}{dt}=4\\pi r^2\\dfrac{dr}{dt}$"}, {"en": "**Solve for $dr/dt$.** With $dV/dt=10^6$ m³/yr and $r=2000$ m: $$\\frac{dr}{dt}=\\frac{10^6}{4\\pi(2000)^2}=\\frac{1}{16\\pi}\\approx0.0199\\ \\text{m/yr}\\approx19.9\\ \\text{mm/yr}.$$", "th": "**แก้หา $dr/dt$** เมื่อ $dV/dt=10^6$ m³/yr และ $r=2000$ m $$\\frac{dr}{dt}=\\frac{10^6}{4\\pi(2000)^2}=\\frac{1}{16\\pi}\\approx0.0199\\ \\text{m/yr}\\approx19.9\\ \\text{mm/yr}$$"}, {"en": "**Differentiate the Mogi formula.** $u_z=\\dfrac{3\\,\\Delta V}{4\\pi d^2}$ with fixed depth $d$, so $\\dfrac{du_z}{dt}=\\dfrac{3}{4\\pi d^2}\\dfrac{dV}{dt}$.", "th": "**หาอนุพันธ์ของสูตรโมกิ (Mogi)** $u_z=\\dfrac{3\\,\\Delta V}{4\\pi d^2}$ โดยความลึก $d$ คงที่ ดังนั้น $\\dfrac{du_z}{dt}=\\dfrac{3}{4\\pi d^2}\\dfrac{dV}{dt}$"}, {"en": "**Evaluate the uplift rate.** With $d=5000$ m: $$\\frac{du_z}{dt}=\\frac{3\\times10^6}{4\\pi(5000)^2}=\\frac{3}{100\\pi}\\approx0.00955\\ \\text{m/yr}=9.55\\ \\text{mm/yr}.$$", "th": "**คำนวณอัตราการยกตัว** เมื่อ $d=5000$ m $$\\frac{du_z}{dt}=\\frac{3\\times10^6}{4\\pi(5000)^2}=\\frac{3}{100\\pi}\\approx0.00955\\ \\text{m/yr}=9.55\\ \\text{mm/yr}$$"}, {"en": "**Look sideways.** Away from the centre the uplift rate is proportional to $d/(x^2+d^2)^{3/2}$; at $x=d=5$ km it falls to $2^{-3/2}\\approx35\\%$ of the peak, about 3.4 mm/yr.", "th": "**มองออกด้านข้าง** ห่างจากจุดกึ่งกลาง อัตราการยกตัวแปรผันตาม $d/(x^2+d^2)^{3/2}$ ที่ $x=d=5$ km ลดลงเหลือ $2^{-3/2}\\approx35\\%$ ของค่าสูงสุด หรือราว 3.4 mm/yr"}], "meaning": {"en": "The chamber wall moves out only about 2 cm per year, but the ground above rises about 9.5 mm per year, which GPS and InSAR satellites can measure. Volcano observatories reverse the calculation: from the measured uplift rate they estimate how fast magma is accumulating. Note that the uplift rate depends on depth, not on chamber radius.", "th": "ผนังโพรงขยายออกเพียงประมาณ 2 cm ต่อปี แต่พื้นดินด้านบนยกตัวราว 9.5 mm ต่อปี ซึ่ง GPS และดาวเทียม InSAR วัดได้ หอสังเกตการณ์ภูเขาไฟคำนวณย้อนกลับ คือประมาณอัตราการสะสมของแมกมาจากอัตราการยกตัวที่วัดได้ สังเกตว่าอัตราการยกตัวขึ้นกับความลึก ไม่ขึ้นกับรัศมีของโพรง"}, "pitfalls": [{"en": "Writing $dV/dt=\\tfrac43\\pi\\cdot3r^2$ and forgetting the factor $dr/dt$ from the chain rule.", "th": "เขียน $dV/dt=\\tfrac43\\pi\\cdot3r^2$ แล้วลืมตัวประกอบ $dr/dt$ จากหลักเกณฑ์ลูกโซ่"}, {"en": "Substituting the numbers before differentiating: $r$ must stay a variable until after the derivative is taken.", "th": "แทนตัวเลขก่อนหาอนุพันธ์ $r$ ต้องเป็นตัวแปรจนกว่าจะหาอนุพันธ์เสร็จ"}, {"en": "Mixing km and m: with $r$ in km and $dV/dt$ in m³/yr the answer is off by a factor of $10^6$.", "th": "ใช้หน่วย km ปนกับ m ถ้าใช้ $r$ เป็น km แต่ $dV/dt$ เป็น m³/yr คำตอบจะผิดไป $10^6$ เท่า"}]}, "36": {"id": 36, "idea": {"en": "The range of a ballistic bomb is a function of the launch angle, $R(\\theta)$. The angle that throws farthest is where the curve is flat at the top, so we solve $R'(\\theta)=0$. Turning the question around, the farthest bombs on a field map tell us the **minimum** speed the volcano must have produced.", "th": "ระยะตกของบอมบ์ภูเขาไฟ (volcanic bomb) เป็นฟังก์ชันของมุมยิง $R(\\theta)$ มุมที่ทำให้ไปไกลที่สุดคือจุดที่กราฟแบนราบที่ยอด เราจึงแก้สมการ $R'(\\theta)=0$ (การหาค่าสูงสุด (optimisation)) และเมื่อมองกลับด้าน บอมบ์ที่ตกไกลที่สุดในแผนที่ภาคสนามจะบอก**อัตราเร็วต่ำสุด**ที่ภูเขาไฟต้องพ่นออกมา"}, "steps": [{"en": "**Flat ground ($H=0$).** Without air drag the range is $R(\\theta)=\\dfrac{v^2\\sin2\\theta}{g}$. Differentiate with the chain rule: $R'(\\theta)=\\dfrac{v^2}{g}\\cdot\\cos2\\theta\\cdot2=\\dfrac{2v^2\\cos2\\theta}{g}$.", "th": "**พื้นราบ ($H=0$)** ถ้าไม่คิดแรงต้านอากาศ ระยะตกคือ $R(\\theta)=\\dfrac{v^2\\sin2\\theta}{g}$ หาอนุพันธ์ด้วยหลักเกณฑ์ลูกโซ่ (chain rule): $R'(\\theta)=\\dfrac{v^2}{g}\\cdot\\cos2\\theta\\cdot2=\\dfrac{2v^2\\cos2\\theta}{g}$"}, {"en": "**Critical point.** $R'(\\theta)=0\\Rightarrow\\cos2\\theta=0\\Rightarrow2\\theta=90^\\circ\\Rightarrow\\theta=45^\\circ$ (in $0<\\theta<90^\\circ$). The second derivative $R''=-\\dfrac{4v^2\\sin2\\theta}{g}<0$ there, so it is a maximum, with $R_{\\max}=\\dfrac{v^2}{g}$.", "th": "**จุดวิกฤต** $R'(\\theta)=0\\Rightarrow\\cos2\\theta=0\\Rightarrow2\\theta=90^\\circ\\Rightarrow\\theta=45^\\circ$ (ในช่วง $0<\\theta<90^\\circ$) อนุพันธ์อันดับสอง $R''=-\\dfrac{4v^2\\sin2\\theta}{g}<0$ ที่จุดนี้ จึงเป็นค่าสูงสุด และ $R_{\\max}=\\dfrac{v^2}{g}$"}, {"en": "**Minimum ejection speed.** A bomb found 2 km away needs $\\dfrac{v^2}{g}\\ge2000$ m, so $v\\ge\\sqrt{9.81\\times2000}=\\sqrt{19620}\\approx140.1$ m/s $\\approx504$ km/h. Any other angle would need an even larger speed, so this is a lower bound.", "th": "**อัตราเร็วพ่นต่ำสุด** บอมบ์ที่พบห่างออกไป 2 km ต้องมี $\\dfrac{v^2}{g}\\ge2000$ m ดังนั้น $v\\ge\\sqrt{9.81\\times2000}=\\sqrt{19620}\\approx140.1$ m/s $\\approx504$ km/h มุมอื่นต้องใช้อัตราเร็วมากกว่านี้ ค่านี้จึงเป็นขอบเขตล่าง"}, {"en": "**Launch from a crater rim $H=300$ m.** Now $R(\\theta)=\\dfrac{v\\cos\\theta}{g}\\left(v\\sin\\theta+\\sqrt{v^2\\sin^2\\theta+2gH}\\right)$. Setting $R'(\\theta)=0$ and simplifying gives the closed form $\\tan\\theta^*=\\dfrac{v}{\\sqrt{v^2+2gH}}$.", "th": "**ยิงจากขอบปล่อง สูง $H=300$ m** ตอนนี้ $R(\\theta)=\\dfrac{v\\cos\\theta}{g}\\left(v\\sin\\theta+\\sqrt{v^2\\sin^2\\theta+2gH}\\right)$ เมื่อตั้ง $R'(\\theta)=0$ แล้วจัดรูปจะได้ $\\tan\\theta^*=\\dfrac{v}{\\sqrt{v^2+2gH}}$"}, {"en": "**Plug in $v=140$ m/s.** $\\sqrt{v^2+2gH}=\\sqrt{19600+5886}=\\sqrt{25486}\\approx159.6$, so $\\tan\\theta^*\\approx0.877$ and $\\theta^*\\approx41.25^\\circ$. The range there is $R\\approx2278$ m, slightly more than $2263$ m at $45^\\circ$.", "th": "**แทนค่า $v=140$ m/s** $\\sqrt{v^2+2gH}=\\sqrt{19600+5886}=\\sqrt{25486}\\approx159.6$ ดังนั้น $\\tan\\theta^*\\approx0.877$ และ $\\theta^*\\approx41.25^\\circ$ ระยะตกที่มุมนี้คือ $R\\approx2278$ m มากกว่า $2263$ m ที่มุม $45^\\circ$ เล็กน้อย"}], "meaning": {"en": "Raising the launch point lowers the best angle below $45^\\circ$, because a flatter shot spends its extra fall time moving sideways. The 140 m/s result is a **minimum** speed: real bombs are slowed by air, so the true ejection speed was higher. Hazard maps draw exclusion zones from exactly this kind of maximum-range calculation.", "th": "การยกจุดยิงให้สูงขึ้นทำให้มุมที่ดีที่สุดต่ำกว่า $45^\\circ$ เพราะการยิงที่แบนกว่าใช้เวลาตกที่เพิ่มขึ้นไปกับการเคลื่อนที่ในแนวราบ ค่า 140 m/s เป็นอัตราเร็ว**ต่ำสุด** เพราะบอมบ์จริงถูกอากาศหน่วงไว้ อัตราเร็วพ่นจริงจึงสูงกว่านี้ แผนที่ภัยพิบัติใช้การคำนวณระยะไกลสุดแบบนี้กำหนดเขตห้ามเข้า"}, "pitfalls": [{"en": "Forgetting the factor 2 from the chain rule in $\\dfrac{d}{d\\theta}\\sin2\\theta=2\\cos2\\theta$ (it does not change the angle here, but it changes $R''$ and later answers).", "th": "ลืมตัวคูณ 2 จากหลักเกณฑ์ลูกโซ่ใน $\\dfrac{d}{d\\theta}\\sin2\\theta=2\\cos2\\theta$ (ไม่เปลี่ยนมุมในข้อนี้ แต่ทำให้ $R''$ และคำตอบอื่นผิด)"}, {"en": "Using degrees inside the derivative. Calculus formulas like $\\dfrac{d}{dx}\\sin x=\\cos x$ need radians; convert only at the end.", "th": "ใช้หน่วยองศาขณะหาอนุพันธ์ สูตรอย่าง $\\dfrac{d}{dx}\\sin x=\\cos x$ ใช้ได้กับเรเดียนเท่านั้น ให้แปลงเป็นองศาตอนท้าย"}, {"en": "Assuming $45^\\circ$ is always best. It is only best when launch and landing heights are equal.", "th": "คิดว่ามุม $45^\\circ$ ดีที่สุดเสมอ ซึ่งจริงเฉพาะเมื่อจุดยิงและจุดตกอยู่ระดับเดียวกัน"}]}, "37": {"id": 37, "idea": {"en": "Flushing a lake in $n$ discrete steps per year leaves $\\left(1-\\dfrac kn\\right)^{nt}$ of the pollutant. Letting $n\\to\\infty$ gives the indeterminate form $1^\\infty$: the base goes to 1 but the power goes to infinity. Taking a logarithm turns it into $\\tfrac00$, which L'Hôpital's rule can handle, and the answer explains why continuous decay laws use $e$.", "th": "การชะล้างทะเลสาบแบบเป็นขั้น $n$ ครั้งต่อปีจะเหลือสารมลพิษ $\\left(1-\\dfrac kn\\right)^{nt}$ เมื่อให้ $n\\to\\infty$ จะได้รูปแบบไม่กำหนด (indeterminate form) $1^\\infty$ ฐานเข้าใกล้ 1 แต่เลขชี้กำลังเข้าใกล้อนันต์ การใส่ลอการิทึมเปลี่ยนเป็นรูป $\\tfrac00$ ซึ่งใช้หลักเกณฑ์โลปีตาล (L'Hôpital's rule) ได้ และคำตอบอธิบายว่าทำไมกฎการลดลงแบบต่อเนื่องจึงใช้ $e$"}, "steps": [{"en": "**Name the limit.** Let $y=\\left(1-\\dfrac kn\\right)^{nt}$. As $n\\to\\infty$, $1-\\dfrac kn\\to1$ and $nt\\to\\infty$, so direct substitution gives $1^\\infty$, which is **not** automatically 1.", "th": "**ตั้งชื่อลิมิต** ให้ $y=\\left(1-\\dfrac kn\\right)^{nt}$ เมื่อ $n\\to\\infty$ จะได้ $1-\\dfrac kn\\to1$ และ $nt\\to\\infty$ การแทนค่าตรง ๆ ให้ $1^\\infty$ ซึ่ง**ไม่**จำเป็นต้องเท่ากับ 1"}, {"en": "**Take logarithms** to bring the power down: $\\ln y=nt\\ln\\!\\left(1-\\dfrac kn\\right)=t\\,\\dfrac{\\ln(1-k/n)}{1/n}$. Now the top $\\to\\ln1=0$ and the bottom $\\to0$: the form $\\tfrac00$.", "th": "**ใส่ลอการิทึม** เพื่อดึงเลขชี้กำลังลงมา: $\\ln y=nt\\ln\\!\\left(1-\\dfrac kn\\right)=t\\,\\dfrac{\\ln(1-k/n)}{1/n}$ ตอนนี้ตัวเศษ $\\to\\ln1=0$ และตัวส่วน $\\to0$ เป็นรูป $\\tfrac00$"}, {"en": "**Substitute $u=1/n$** so that $u\\to0^+$: $\\displaystyle\\lim_{u\\to0^+}\\frac{\\ln(1-ku)}{u}$. Apply L'Hôpital: differentiate top and bottom separately, $\\dfrac{d}{du}\\ln(1-ku)=\\dfrac{-k}{1-ku}$ and $\\dfrac{d}{du}u=1$.", "th": "**แทน $u=1/n$** ให้ $u\\to0^+$: $\\displaystyle\\lim_{u\\to0^+}\\frac{\\ln(1-ku)}{u}$ ใช้หลักเกณฑ์โลปีตาล หาอนุพันธ์ตัวเศษและตัวส่วนแยกกัน $\\dfrac{d}{du}\\ln(1-ku)=\\dfrac{-k}{1-ku}$ และ $\\dfrac{d}{du}u=1$"}, {"en": "**Evaluate.** $\\displaystyle\\lim_{u\\to0^+}\\frac{-k/(1-ku)}{1}=-k$. Hence $\\ln y\\to-kt$, and because $e^x$ is continuous, $y\\to e^{-kt}$.", "th": "**หาค่า** $\\displaystyle\\lim_{u\\to0^+}\\frac{-k/(1-ku)}{1}=-k$ ดังนั้น $\\ln y\\to-kt$ และเนื่องจาก $e^x$ ต่อเนื่อง จึงได้ $y\\to e^{-kt}$"}, {"en": "**Numbers with $k=0.3$, $t=5$ yr.** Yearly ($n=1$): $0.7^5=0.16807$. Monthly ($n=12$): $0.2189$. Daily ($n=365$): $0.2230$. Limit: $e^{-1.5}=0.22313$. The difference between yearly steps and the limit is about $0.055$.", "th": "**ตัวเลขเมื่อ $k=0.3$, $t=5$ ปี** รายปี ($n=1$): $0.7^5=0.16807$ รายเดือน ($n=12$): $0.2189$ รายวัน ($n=365$): $0.2230$ ลิมิต: $e^{-1.5}=0.22313$ ผลต่างระหว่างแบบรายปีกับลิมิตประมาณ $0.055$"}], "meaning": {"en": "Removing 30% once a year is more effective than removing it continuously: after 5 years 16.8% remains instead of 22.3%, because each yearly step acts on the full amount. As the steps get smaller the stepped curve approaches the smooth exponential $e^{-kt}$, which is the model used for flushing, radioactive decay and many first-order processes.", "th": "การกำจัด 30% ครั้งเดียวต่อปีได้ผลมากกว่าการกำจัดแบบต่อเนื่อง หลัง 5 ปีเหลือ 16.8% แทนที่จะเป็น 22.3% เพราะแต่ละขั้นรายปีกระทำกับปริมาณทั้งหมด เมื่อขั้นเล็กลงเรื่อย ๆ กราฟขั้นบันไดจะเข้าใกล้กราฟเอกซ์โพเนนเชียลเรียบ $e^{-kt}$ ซึ่งเป็นแบบจำลองของการชะล้าง การสลายกัมมันตรังสี และกระบวนการอันดับหนึ่งอื่น ๆ"}, "pitfalls": [{"en": "Concluding $1^\\infty=1$. The base and the power compete; you must take a logarithm first.", "th": "สรุปว่า $1^\\infty=1$ ฐานและเลขชี้กำลังแข่งกันอยู่ ต้องใส่ลอการิทึมก่อน"}, {"en": "Using the quotient rule on $\\dfrac{\\ln(1-ku)}{u}$ instead of L'Hôpital. L'Hôpital differentiates the top and bottom **separately**.", "th": "ใช้กฎผลหารกับ $\\dfrac{\\ln(1-ku)}{u}$ แทนโลปีตาล หลักเกณฑ์โลปีตาลหาอนุพันธ์ตัวเศษและตัวส่วน**แยกกัน**"}, {"en": "Stopping at $\\ln y\\to-kt$ and forgetting to exponentiate back to $y=e^{-kt}$.", "th": "หยุดที่ $\\ln y\\to-kt$ แล้วลืมยกกำลัง $e$ กลับเป็น $y=e^{-kt}$"}]}, "38": {"id": 38, "idea": {"en": "Seawater density depends on two variables, temperature $T$ and salinity $S$. A partial derivative changes one variable while holding the other fixed, so $\\partial\\rho/\\partial T$ and $\\partial\\rho/\\partial S$ measure separately how strongly heat and salt control density, which is what drives deep ocean circulation.", "th": "ความหนาแน่นของน้ำทะเลขึ้นกับสองตัวแปร คืออุณหภูมิ $T$ และความเค็ม $S$ อนุพันธ์ย่อย (partial derivative) เปลี่ยนตัวแปรหนึ่งโดยตรึงอีกตัวไว้ ดังนั้น $\\partial\\rho/\\partial T$ และ $\\partial\\rho/\\partial S$ จึงวัดแยกกันว่าความร้อนและเกลือควบคุมความหนาแน่นมากเพียงใด ซึ่งเป็นตัวขับเคลื่อนการไหลเวียนของมหาสมุทรลึก"}, "steps": [{"en": "**The model.** $\\rho(T,S)=1027\\left[1-\\alpha_0(T-10)-\\dfrac\\gamma2(T-10)^2+\\beta_0(S-35)\\right]$ with $\\alpha_0=1.7\\times10^{-4}$, $\\gamma=10^{-5}$, $\\beta_0=7.6\\times10^{-4}$.", "th": "**แบบจำลอง** $\\rho(T,S)=1027\\left[1-\\alpha_0(T-10)-\\dfrac\\gamma2(T-10)^2+\\beta_0(S-35)\\right]$ โดย $\\alpha_0=1.7\\times10^{-4}$, $\\gamma=10^{-5}$, $\\beta_0=7.6\\times10^{-4}$"}, {"en": "**Partial in $T$** (treat $S$ as a constant, so the salinity term differentiates to 0): $\\dfrac{\\partial\\rho}{\\partial T}=1027\\left[-\\alpha_0-\\gamma(T-10)\\right]=-1027\\left[\\alpha_0+\\gamma(T-10)\\right]$.", "th": "**อนุพันธ์ย่อยเทียบ $T$** (ถือ $S$ เป็นค่าคงตัว พจน์ความเค็มจึงมีอนุพันธ์เป็น 0): $\\dfrac{\\partial\\rho}{\\partial T}=1027\\left[-\\alpha_0-\\gamma(T-10)\\right]=-1027\\left[\\alpha_0+\\gamma(T-10)\\right]$"}, {"en": "**Partial in $S$** (treat $T$ as a constant): $\\dfrac{\\partial\\rho}{\\partial S}=1027\\,\\beta_0=0.7805$ kg/m³ per g/kg, the same everywhere in this linear-in-$S$ model.", "th": "**อนุพันธ์ย่อยเทียบ $S$** (ถือ $T$ เป็นค่าคงตัว): $\\dfrac{\\partial\\rho}{\\partial S}=1027\\,\\beta_0=0.7805$ kg/m³ ต่อ g/kg มีค่าเท่ากันทุกจุดเพราะแบบจำลองเป็นเชิงเส้นใน $S$"}, {"en": "**Tropical surface water, $T=25$ °C, $S=34$ g/kg.** $T-10=15$: $\\rho=1027[1-0.00255-0.001125-0.00076]=1022.445$ kg/m³ and $\\dfrac{\\partial\\rho}{\\partial T}=-1027(1.7\\times10^{-4}+1.5\\times10^{-4})=-0.3286$ kg/m³ per °C.", "th": "**น้ำผิวหน้าเขตร้อน $T=25$ °C, $S=34$ g/kg** $T-10=15$: $\\rho=1027[1-0.00255-0.001125-0.00076]=1022.445$ kg/m³ และ $\\dfrac{\\partial\\rho}{\\partial T}=-1027(1.7\\times10^{-4}+1.5\\times10^{-4})=-0.3286$ kg/m³ ต่อ °C"}, {"en": "**Compare the two effects.** Thermal expansion $\\alpha=-\\dfrac1\\rho\\dfrac{\\partial\\rho}{\\partial T}=\\dfrac{0.3286}{1022.445}\\approx3.21\\times10^{-4}$ /°C. One g/kg of salt changes density as much as $\\dfrac{0.7805}{0.3286}\\approx2.38$ °C of temperature.", "th": "**เปรียบเทียบสองผล** สัมประสิทธิ์การขยายตัวทางความร้อน $\\alpha=-\\dfrac1\\rho\\dfrac{\\partial\\rho}{\\partial T}=\\dfrac{0.3286}{1022.445}\\approx3.21\\times10^{-4}$ /°C เกลือ 1 g/kg เปลี่ยนความหนาแน่นได้เท่ากับอุณหภูมิประมาณ $\\dfrac{0.7805}{0.3286}\\approx2.38$ °C"}, {"en": "**Polar water, $T=2$ °C.** $\\dfrac{\\partial\\rho}{\\partial T}=-1027(1.7\\times10^{-4}-8\\times10^{-5})\\approx-0.092$ kg/m³ per °C, less than a third of the tropical value, while $\\partial\\rho/\\partial S$ is unchanged.", "th": "**น้ำขั้วโลก $T=2$ °C** $\\dfrac{\\partial\\rho}{\\partial T}=-1027(1.7\\times10^{-4}-8\\times10^{-5})\\approx-0.092$ kg/m³ ต่อ °C น้อยกว่าหนึ่งในสามของค่าในเขตร้อน ขณะที่ $\\partial\\rho/\\partial S$ ไม่เปลี่ยน"}], "meaning": {"en": "Warm water is lighter (negative $\\partial\\rho/\\partial T$) and salty water is heavier (positive $\\partial\\rho/\\partial S$). In cold polar seas temperature hardly matters, so salinity decides whether water sinks: when sea ice forms it leaves salt behind, the water becomes dense and sinks, and this feeds the global deep-water conveyor. A sanity check: all densities stay near 1020–1030 kg/m³, as real seawater does.", "th": "น้ำอุ่นเบากว่า ($\\partial\\rho/\\partial T$ เป็นลบ) และน้ำเค็มหนักกว่า ($\\partial\\rho/\\partial S$ เป็นบวก) ในทะเลขั้วโลกที่เย็น อุณหภูมิแทบไม่มีผล ความเค็มจึงเป็นตัวตัดสินว่าน้ำจะจมหรือไม่ เมื่อน้ำแข็งทะเลก่อตัวจะทิ้งเกลือไว้ น้ำจึงหนาแน่นขึ้นและจมลง เป็นต้นกำเนิดของสายพานน้ำลึกทั่วโลก ตรวจสอบความสมเหตุสมผล: ความหนาแน่นทั้งหมดอยู่ราว 1020–1030 kg/m³ เหมือนน้ำทะเลจริง"}, "pitfalls": [{"en": "Differentiating the salinity term with respect to $T$. When taking $\\partial/\\partial T$, every term without $T$ is a constant and gives 0.", "th": "หาอนุพันธ์ของพจน์ความเค็มเทียบกับ $T$ เมื่อหา $\\partial/\\partial T$ ทุกพจน์ที่ไม่มี $T$ เป็นค่าคงตัวและมีอนุพันธ์เป็น 0"}, {"en": "Losing the minus sign: density **decreases** as temperature rises, so $\\partial\\rho/\\partial T<0$.", "th": "ทำเครื่องหมายลบหาย ความหนาแน่น**ลดลง**เมื่ออุณหภูมิสูงขึ้น ดังนั้น $\\partial\\rho/\\partial T<0$"}, {"en": "Comparing $\\partial\\rho/\\partial T$ and $\\partial\\rho/\\partial S$ directly without units: they are per °C and per g/kg, so compare their ratio (°C equivalent to 1 g/kg) instead.", "th": "เปรียบเทียบ $\\partial\\rho/\\partial T$ กับ $\\partial\\rho/\\partial S$ ตรง ๆ โดยไม่ดูหน่วย ทั้งสองมีหน่วยต่อ °C และต่อ g/kg จึงควรเทียบอัตราส่วน (กี่ °C เทียบเท่า 1 g/kg)"}]}, "39": {"id": 39, "idea": {"en": "Bubble volume $V=\\dfrac{nRT}{P}$ depends on two changing quantities, temperature and pressure. The total differential adds up the small change caused by each, $dV=\\dfrac{\\partial V}{\\partial T}dT+\\dfrac{\\partial V}{\\partial P}dP$, so we can see which effect, cooling or decompression, really controls bubble growth as magma rises.", "th": "ปริมาตรฟอง $V=\\dfrac{nRT}{P}$ ขึ้นกับสองปริมาณที่เปลี่ยนไป คืออุณหภูมิและความดัน ผลต่างเชิงอนุพันธ์รวม (total differential) รวมการเปลี่ยนแปลงเล็ก ๆ จากแต่ละตัว $dV=\\dfrac{\\partial V}{\\partial T}dT+\\dfrac{\\partial V}{\\partial P}dP$ เราจึงเห็นได้ว่าผลใด ระหว่างการเย็นตัวกับการลดความดัน ที่ควบคุมการขยายตัวของฟองจริง ๆ เมื่อแมกมาลอยขึ้น"}, "steps": [{"en": "**Partial derivatives.** $\\dfrac{\\partial V}{\\partial T}=\\dfrac{nR}{P}=\\dfrac VT$ and $\\dfrac{\\partial V}{\\partial P}=-\\dfrac{nRT}{P^2}=-\\dfrac VP$.", "th": "**อนุพันธ์ย่อย** $\\dfrac{\\partial V}{\\partial T}=\\dfrac{nR}{P}=\\dfrac VT$ และ $\\dfrac{\\partial V}{\\partial P}=-\\dfrac{nRT}{P^2}=-\\dfrac VP$"}, {"en": "**Total differential, divided by $V$:** $\\dfrac{dV}{V}=\\dfrac{dT}{T}-\\dfrac{dP}{P}$. (Equivalently, take $d$ of $\\ln V=\\ln(nR)+\\ln T-\\ln P$.) The relative change is a sum of a cooling term and a decompression term.", "th": "**ผลต่างเชิงอนุพันธ์รวม หารด้วย $V$:** $\\dfrac{dV}{V}=\\dfrac{dT}{T}-\\dfrac{dP}{P}$ (หรือหา $d$ ของ $\\ln V=\\ln(nR)+\\ln T-\\ln P$ ก็ได้) การเปลี่ยนแปลงสัมพัทธ์จึงเป็นผลรวมของพจน์การเย็นตัวและพจน์การลดความดัน"}, {"en": "**Pressure at depth.** $P=\\rho gz=2600\\times9.81\\times2000\\approx51.01$ MPa. Rising by $100$ m gives $dP=-\\rho g\\,(100)$, so $-\\dfrac{dP}{P}=\\dfrac{100}{2000}=5\\%$.", "th": "**ความดันที่ความลึก** $P=\\rho gz=2600\\times9.81\\times2000\\approx51.01$ MPa การลอยขึ้น $100$ m ให้ $dP=-\\rho g\\,(100)$ ดังนั้น $-\\dfrac{dP}{P}=\\dfrac{100}{2000}=5\\%$"}, {"en": "**Cooling term.** $dT=-0.5$ K at $T=1273$ K: $\\dfrac{dT}{T}=-\\dfrac{0.5}{1273}\\approx-0.039\\%$, more than 100 times smaller than the pressure term.", "th": "**พจน์การเย็นตัว** $dT=-0.5$ K ที่ $T=1273$ K: $\\dfrac{dT}{T}=-\\dfrac{0.5}{1273}\\approx-0.039\\%$ เล็กกว่าพจน์ความดันกว่า 100 เท่า"}, {"en": "**Add them.** $\\dfrac{dV}{V}\\approx5\\%-0.039\\%\\approx4.96\\%$. The exact change is $\\dfrac{1272.5}{1273}\\cdot\\dfrac{2000}{1900}-1\\approx5.22\\%$, so the linear estimate is close.", "th": "**รวมกัน** $\\dfrac{dV}{V}\\approx5\\%-0.039\\%\\approx4.96\\%$ ค่าจริงคือ $\\dfrac{1272.5}{1273}\\cdot\\dfrac{2000}{1900}-1\\approx5.22\\%$ ค่าประมาณเชิงเส้นจึงใกล้เคียง"}, {"en": "**Same step near the surface, from 200 m.** $-\\dfrac{dP}{P}=\\dfrac{100}{200}=50\\%$ (differential $\\approx49.96\\%$), but the exact change is $\\approx99.9\\%$: the bubble almost doubles. The differential is only accurate when the change is small compared with $P$.", "th": "**ขั้นเดียวกันใกล้ผิวโลก เริ่มที่ 200 m** $-\\dfrac{dP}{P}=\\dfrac{100}{200}=50\\%$ (ผลต่างเชิงอนุพันธ์ $\\approx49.96\\%$) แต่ค่าจริงประมาณ $99.9\\%$ ฟองเกือบขยายเป็นสองเท่า ผลต่างเชิงอนุพันธ์แม่นยำเฉพาะเมื่อการเปลี่ยนแปลงเล็กเมื่อเทียบกับ $P$"}], "meaning": {"en": "Because $P$ is proportional to depth, the same 100 m rise produces a relative pressure drop ten times larger at 200 m than at 2 km. Bubbles therefore grow slowly at depth and then explosively in the last few hundred metres. When the gas fraction gets high enough, the magma fragments and a quiet lava flow becomes an explosive eruption.", "th": "เนื่องจาก $P$ แปรผันตรงกับความลึก การลอยขึ้น 100 m เท่ากันจึงทำให้ความดันลดลงเชิงสัมพัทธ์ที่ 200 m มากกว่าที่ 2 km ถึงสิบเท่า ฟองจึงโตช้าที่ระดับลึกแล้วโตอย่างรุนแรงในช่วงไม่กี่ร้อยเมตรสุดท้าย เมื่อสัดส่วนแก๊สสูงพอ แมกมาจะแตกเป็นชิ้น และการไหลของลาวาอย่างเงียบ ๆ จะกลายเป็นการปะทุแบบระเบิด"}, "pitfalls": [{"en": "Getting the sign of $dP$ wrong: moving **up** decreases pressure, so $dP<0$ and $-dP/P>0$ (the bubble grows).", "th": "เครื่องหมายของ $dP$ ผิด การเคลื่อนที่**ขึ้น**ทำให้ความดันลดลง $dP<0$ และ $-dP/P>0$ (ฟองขยาย)"}, {"en": "Using °C instead of kelvin in $dT/T$. The ideal gas law needs absolute temperature.", "th": "ใช้ °C แทนเคลวินใน $dT/T$ กฎแก๊สอุดมคติต้องใช้อุณหภูมิสัมบูรณ์"}, {"en": "Trusting the linear estimate for large steps. Compare $dV/V$ with the exact change to see when it fails.", "th": "เชื่อค่าประมาณเชิงเส้นแม้ขั้นจะใหญ่ ให้เทียบ $dV/V$ กับค่าจริงเพื่อดูว่าเมื่อใดใช้ไม่ได้"}]}, "40": {"id": 40, "idea": {"en": "Three wells fix a plane $h(x,y)=h_0+ax+by$ for the water table. Its partial derivatives form the gradient $\\nabla h=(a,b)$, which points uphill; groundwater flows the opposite way, along $-\\nabla h$, and its speed follows from Darcy's law. The same three-point method gives strike and dip from three boreholes.", "th": "บ่อน้ำสามบ่อกำหนดระนาบของระดับน้ำใต้ดิน $h(x,y)=h_0+ax+by$ อนุพันธ์ย่อยของระนาบรวมกันเป็นเกรเดียนต์ (gradient) $\\nabla h=(a,b)$ ซึ่งชี้ขึ้นเนิน น้ำใต้ดินไหลไปทางตรงข้าม คือตาม $-\\nabla h$ และความเร็วหาได้จากกฎของดาร์ซี วิธีสามจุดแบบเดียวกันใช้หาแนวระดับและมุมเท (strike and dip) จากหลุมเจาะสามหลุมได้"}, "steps": [{"en": "**Use well A at the origin.** $h(0,0)=52.0$, so $h_0=52.0$.", "th": "**ใช้บ่อ A ที่จุดกำเนิด** $h(0,0)=52.0$ ดังนั้น $h_0=52.0$"}, {"en": "**Well B at $(400,0)$:** $52.0+400a=50.4\\Rightarrow a=\\dfrac{-1.6}{400}=-0.004$. This is $\\dfrac{\\partial h}{\\partial x}$, the slope due east.", "th": "**บ่อ B ที่ $(400,0)$:** $52.0+400a=50.4\\Rightarrow a=\\dfrac{-1.6}{400}=-0.004$ ค่านี้คือ $\\dfrac{\\partial h}{\\partial x}$ ความชันในทิศตะวันออก"}, {"en": "**Well C at $(100,300)$:** $52.0+100(-0.004)+300b=50.9\\Rightarrow300b=-0.7\\Rightarrow b\\approx-0.002333=\\dfrac{\\partial h}{\\partial y}$.", "th": "**บ่อ C ที่ $(100,300)$:** $52.0+100(-0.004)+300b=50.9\\Rightarrow300b=-0.7\\Rightarrow b\\approx-0.002333=\\dfrac{\\partial h}{\\partial y}$"}, {"en": "**Size of the gradient.** $\\lVert\\nabla h\\rVert=\\sqrt{0.004^2+0.002333^2}\\approx0.004631$, i.e. the head drops about 4.6 m per km in the steepest direction.", "th": "**ขนาดของเกรเดียนต์** $\\lVert\\nabla h\\rVert=\\sqrt{0.004^2+0.002333^2}\\approx0.004631$ คือระดับน้ำลดลงประมาณ 4.6 m ต่อ km ในทิศที่ชันที่สุด"}, {"en": "**Flow direction.** $-\\nabla h=(0.004,\\ 0.002333)$ points east and north. Its bearing from north is $\\arctan\\dfrac{0.004}{0.002333}\\approx59.7^\\circ$ (towards ENE).", "th": "**ทิศการไหล** $-\\nabla h=(0.004,\\ 0.002333)$ ชี้ไปทางตะวันออกและเหนือ มุมทิศ (bearing) จากทิศเหนือคือ $\\arctan\\dfrac{0.004}{0.002333}\\approx59.7^\\circ$ (ไปทางตะวันออกเฉียงเหนือ)"}, {"en": "**Speed and directional derivatives.** Seepage velocity $v=\\dfrac{K\\lVert\\nabla h\\rVert}{n}=\\dfrac{10\\times0.004631}{0.25}\\approx0.185$ m/day ($\\approx68$ m/yr). Due east, $D_{\\mathbf u}h=\\nabla h\\cdot(1,0)=-0.004$; along the flow, $D_{\\mathbf u}h=-\\lVert\\nabla h\\rVert=-0.004631$, the steepest possible descent.", "th": "**ความเร็วและอนุพันธ์ระบุทิศทาง** ความเร็วซึม $v=\\dfrac{K\\lVert\\nabla h\\rVert}{n}=\\dfrac{10\\times0.004631}{0.25}\\approx0.185$ m/วัน ($\\approx68$ m/ปี) ในทิศตะวันออก $D_{\\mathbf u}h=\\nabla h\\cdot(1,0)=-0.004$ ตามทิศการไหล $D_{\\mathbf u}h=-\\lVert\\nabla h\\rVert=-0.004631$ ซึ่งเป็นการลดลงที่ชันที่สุดที่เป็นไปได้"}], "meaning": {"en": "A contaminant spilled near well A will move towards the east-northeast at roughly 68 m per year, so a monitoring well should be placed in that direction. The directional derivative is largest in magnitude along $-\\nabla h$ and zero along the contour lines, which is why groundwater crosses head contours at right angles.", "th": "สารปนเปื้อนที่หกใกล้บ่อ A จะเคลื่อนไปทางตะวันออกเฉียงเหนือด้วยความเร็วประมาณ 68 m ต่อปี จึงควรวางบ่อเฝ้าระวังในทิศนั้น อนุพันธ์ระบุทิศทางมีขนาดมากที่สุดตามทิศ $-\\nabla h$ และเป็นศูนย์ตามเส้นชั้นระดับน้ำ นี่คือเหตุผลที่น้ำใต้ดินไหลตัดเส้นชั้นความสูงระดับน้ำเป็นมุมฉาก"}, "pitfalls": [{"en": "Saying water flows along $+\\nabla h$. The gradient points **uphill**; water flows downhill, along $-\\nabla h$.", "th": "บอกว่าน้ำไหลตาม $+\\nabla h$ เกรเดียนต์ชี้**ขึ้นเนิน** น้ำไหลลงเนิน คือตาม $-\\nabla h$"}, {"en": "Computing $b$ from well C while ignoring the $100a$ term: C is not straight north of A, so its $x$-coordinate also changes $h$.", "th": "หา $b$ จากบ่อ C โดยลืมพจน์ $100a$ บ่อ C ไม่ได้อยู่ทางเหนือของ A พอดี พิกัด $x$ ของมันจึงทำให้ $h$ เปลี่ยนด้วย"}, {"en": "Mixing up the bearing: map bearings are measured clockwise from **north**, while $\\arctan(y/x)$ is measured from the east.", "th": "สับสนมุมทิศ มุมทิศบนแผนที่วัดตามเข็มนาฬิกาจาก**ทิศเหนือ** ส่วน $\\arctan(y/x)$ วัดจากทิศตะวันออก"}]}, "41": {"id": 41, "idea": {"en": "If we know how fast sediment piles up, $r(t)=H'(t)$, the thickness $H(t)$ is an antiderivative of the rate. The constant of integration is fixed by the starting condition $H(0)=0$. A rate that pulses with Earth's orbital cycles produces rhythmic layers that geologists count like tree rings.", "th": "ถ้ารู้ว่าตะกอนสะสมเร็วเพียงใด $r(t)=H'(t)$ ความหนา $H(t)$ คือปฏิยานุพันธ์ (antiderivative) ของอัตรานั้น ค่าคงตัวของการหาปริพันธ์กำหนดได้จากเงื่อนไขเริ่มต้น $H(0)=0$ อัตราที่เปลี่ยนเป็นจังหวะตามวัฏจักรวงโคจรของโลกทำให้เกิดชั้นตะกอนเป็นจังหวะที่นักธรณีวิทยานับได้เหมือนวงปีของต้นไม้"}, "steps": [{"en": "**Set up.** $H'(t)=r(t)=r_0+r_1\\sin\\dfrac{2\\pi t}{P}$ with $r_0=2$ cm/kyr, $r_1=0.8$ cm/kyr, $P=100$ kyr, and $H(0)=0$.", "th": "**ตั้งโจทย์** $H'(t)=r(t)=r_0+r_1\\sin\\dfrac{2\\pi t}{P}$ โดย $r_0=2$ cm/kyr, $r_1=0.8$ cm/kyr, $P=100$ kyr และ $H(0)=0$"}, {"en": "**Antiderivative.** $\\int r_0\\,dt=r_0t$. For the sine use $\\int\\sin(ct)\\,dt=-\\dfrac1c\\cos(ct)$ with $c=\\dfrac{2\\pi}{P}$: $H(t)=r_0t-\\dfrac{r_1P}{2\\pi}\\cos\\dfrac{2\\pi t}{P}+C$.", "th": "**ปฏิยานุพันธ์** $\\int r_0\\,dt=r_0t$ สำหรับไซน์ใช้ $\\int\\sin(ct)\\,dt=-\\dfrac1c\\cos(ct)$ โดย $c=\\dfrac{2\\pi}{P}$: $H(t)=r_0t-\\dfrac{r_1P}{2\\pi}\\cos\\dfrac{2\\pi t}{P}+C$"}, {"en": "**Initial condition.** $H(0)=0-\\dfrac{r_1P}{2\\pi}\\cdot1+C=0\\Rightarrow C=\\dfrac{r_1P}{2\\pi}=\\dfrac{0.8\\times100}{2\\pi}\\approx12.732$ cm. So $H(t)=r_0t+\\dfrac{r_1P}{2\\pi}\\left(1-\\cos\\dfrac{2\\pi t}{P}\\right)$.", "th": "**เงื่อนไขเริ่มต้น** $H(0)=0-\\dfrac{r_1P}{2\\pi}\\cdot1+C=0\\Rightarrow C=\\dfrac{r_1P}{2\\pi}=\\dfrac{0.8\\times100}{2\\pi}\\approx12.732$ cm ดังนั้น $H(t)=r_0t+\\dfrac{r_1P}{2\\pi}\\left(1-\\cos\\dfrac{2\\pi t}{P}\\right)$"}, {"en": "**Check by differentiating.** $H'(t)=r_0+\\dfrac{r_1P}{2\\pi}\\cdot\\sin\\dfrac{2\\pi t}{P}\\cdot\\dfrac{2\\pi}{P}=r(t)$ ✓.", "th": "**ตรวจคำตอบโดยหาอนุพันธ์** $H'(t)=r_0+\\dfrac{r_1P}{2\\pi}\\cdot\\sin\\dfrac{2\\pi t}{P}\\cdot\\dfrac{2\\pi}{P}=r(t)$ ✓"}, {"en": "**Numbers.** After half a cycle, $t=50$ kyr: $H=100+12.732(1-\\cos\\pi)=100+25.46=125.46$ cm. After one full cycle, $t=100$: $H=200$ cm. After $t=1000$ kyr (10 cycles): $H=2000$ cm $=20$ m, because $\\cos(20\\pi)=1$.", "th": "**ตัวเลข** หลังครึ่งวัฏจักร $t=50$ kyr: $H=100+12.732(1-\\cos\\pi)=100+25.46=125.46$ cm หลังครบหนึ่งวัฏจักร $t=100$: $H=200$ cm หลัง $t=1000$ kyr (10 วัฏจักร): $H=2000$ cm $=20$ m เพราะ $\\cos(20\\pi)=1$"}], "meaning": {"en": "Over whole cycles the sine part averages out, so the thickness equals the mean rate times time: 20 m per million years. Within each cycle the layer grows faster and slower, which shows up as alternating beds. Counting these 100-kyr (eccentricity), 41-kyr (obliquity) or 21-kyr (precession) rhythms gives an astronomical clock for dating sedimentary rocks.", "th": "เมื่อครบวัฏจักรเต็ม ส่วนไซน์จะเฉลี่ยหักล้างกัน ความหนาจึงเท่ากับอัตราเฉลี่ยคูณเวลา คือ 20 m ต่อล้านปี ภายในแต่ละวัฏจักรชั้นตะกอนจะโตเร็วสลับช้า ปรากฏเป็นชั้นหินสลับกัน การนับจังหวะ 100 kyr (ความรีของวงโคจร) 41 kyr (ความเอียงของแกน) หรือ 21 kyr (การส่ายของแกน) ให้นาฬิกาดาราศาสตร์สำหรับหาอายุหินตะกอน"}, "pitfalls": [{"en": "Forgetting the constant $C$, or setting $C=0$. Then $H(0)=-12.7$ cm, which is impossible.", "th": "ลืมค่าคงตัว $C$ หรือให้ $C=0$ ซึ่งทำให้ $H(0)=-12.7$ cm เป็นไปไม่ได้"}, {"en": "Integrating $\\sin\\dfrac{2\\pi t}{P}$ as $-\\cos\\dfrac{2\\pi t}{P}$ without the factor $\\dfrac{P}{2\\pi}$ from the inner function.", "th": "หาปริพันธ์ $\\sin\\dfrac{2\\pi t}{P}$ เป็น $-\\cos\\dfrac{2\\pi t}{P}$ โดยลืมตัวคูณ $\\dfrac{P}{2\\pi}$ จากฟังก์ชันภายใน"}, {"en": "Mixing units: the rate is in cm per kyr, so time must be in kyr and the answer comes out in cm.", "th": "หน่วยปนกัน อัตราอยู่ในหน่วย cm ต่อ kyr เวลาจึงต้องเป็น kyr และคำตอบจะออกมาเป็น cm"}]}, "42": {"id": 42, "idea": {"en": "A seismic wave crossing a thin slice $d\\zeta$ at speed $v$ takes time $d\\zeta/v$, so total travel time is the integral of slowness $1/v$ over depth. When velocity grows linearly with depth, the substitution $u=v_0+k\\zeta$ turns the integral into $\\int du/u$, a logarithm.", "th": "คลื่นไหวสะเทือนที่ผ่านชั้นบาง $d\\zeta$ ด้วยความเร็ว $v$ ใช้เวลา $d\\zeta/v$ เวลาเดินทางทั้งหมดจึงเป็นปริพันธ์ของความช้า (slowness) $1/v$ ตามความลึก เมื่อความเร็วเพิ่มเชิงเส้นตามความลึก การเปลี่ยนตัวแปร (substitution) $u=v_0+k\\zeta$ จะเปลี่ยนปริพันธ์เป็น $\\int du/u$ ซึ่งได้ลอการิทึม"}, "steps": [{"en": "**Set up.** $t(z)=\\displaystyle\\int_0^z\\frac{d\\zeta}{v_0+k\\zeta}$ with $v_0=1.8$ km/s, $k=0.6$ s⁻¹, $z=3$ km.", "th": "**ตั้งปริพันธ์** $t(z)=\\displaystyle\\int_0^z\\frac{d\\zeta}{v_0+k\\zeta}$ โดย $v_0=1.8$ km/s, $k=0.6$ s⁻¹, $z=3$ km"}, {"en": "**Substitute.** $u=v_0+k\\zeta\\Rightarrow du=k\\,d\\zeta\\Rightarrow d\\zeta=\\dfrac{du}{k}$. Change the limits too: $\\zeta=0\\to u=v_0$, $\\zeta=z\\to u=v_0+kz$.", "th": "**เปลี่ยนตัวแปร** $u=v_0+k\\zeta\\Rightarrow du=k\\,d\\zeta\\Rightarrow d\\zeta=\\dfrac{du}{k}$ เปลี่ยนขอบเขตด้วย: $\\zeta=0\\to u=v_0$ และ $\\zeta=z\\to u=v_0+kz$"}, {"en": "**Integrate.** $t(z)=\\dfrac1k\\displaystyle\\int_{v_0}^{v_0+kz}\\frac{du}{u}=\\frac1k\\Big[\\ln u\\Big]_{v_0}^{v_0+kz}=\\frac1k\\ln\\!\\left(1+\\frac{kz}{v_0}\\right)$.", "th": "**หาปริพันธ์** $t(z)=\\dfrac1k\\displaystyle\\int_{v_0}^{v_0+kz}\\frac{du}{u}=\\frac1k\\Big[\\ln u\\Big]_{v_0}^{v_0+kz}=\\frac1k\\ln\\!\\left(1+\\frac{kz}{v_0}\\right)$"}, {"en": "**Plug in.** $\\dfrac{kz}{v_0}=\\dfrac{0.6\\times3}{1.8}=1$, so $t=\\dfrac{\\ln2}{0.6}\\approx1.155$ s one way and the two-way time is $\\text{TWT}=2t\\approx2.310$ s. With a constant $1.8$ km/s it would be $2\\times3/1.8\\approx3.333$ s.", "th": "**แทนค่า** $\\dfrac{kz}{v_0}=\\dfrac{0.6\\times3}{1.8}=1$ ดังนั้น $t=\\dfrac{\\ln2}{0.6}\\approx1.155$ s ขาเดียว และเวลาไป-กลับ $\\text{TWT}=2t\\approx2.310$ s ถ้าความเร็วคงที่ $1.8$ km/s จะได้ $2\\times3/1.8\\approx3.333$ s"}, {"en": "**Invert for depth.** From $kt=\\ln(1+kz/v_0)$: $z=\\dfrac{v_0}{k}\\left(e^{kt}-1\\right)$. A reflector at TWT $2.0$ s has $t=1$ s, so $z=3(e^{0.6}-1)\\approx2.466$ km.", "th": "**หาความลึกย้อนกลับ** จาก $kt=\\ln(1+kz/v_0)$ ได้ $z=\\dfrac{v_0}{k}\\left(e^{kt}-1\\right)$ ตัวสะท้อนที่ TWT $2.0$ s มี $t=1$ s ดังนั้น $z=3(e^{0.6}-1)\\approx2.466$ km"}, {"en": "**Check the limit $k\\to0$.** Using $\\ln(1+x)\\approx x$ for small $x$ (or L'Hôpital), $\\dfrac1k\\ln(1+kz/v_0)\\to\\dfrac{z}{v_0}$, the constant-velocity formula ✓.", "th": "**ตรวจลิมิต $k\\to0$** ใช้ $\\ln(1+x)\\approx x$ เมื่อ $x$ เล็ก (หรือโลปีตาล) ได้ $\\dfrac1k\\ln(1+kz/v_0)\\to\\dfrac{z}{v_0}$ ตรงกับสูตรความเร็วคงที่ ✓"}], "meaning": {"en": "Because rocks get faster with depth, a wave reaches 3 km in 2.31 s two-way instead of 3.33 s. Average velocity is $3/1.155\\approx2.60$ km/s, between the 1.8 km/s at the surface and 3.6 km/s at the reflector. Converting reflection times to depth with a constant velocity would put deep targets in the wrong place, a costly mistake when drilling for oil, gas or geothermal water.", "th": "เพราะหินมีความเร็วสูงขึ้นตามความลึก คลื่นจึงไปถึง 3 km ด้วยเวลาไป-กลับ 2.31 s แทนที่จะเป็น 3.33 s ความเร็วเฉลี่ยคือ $3/1.155\\approx2.60$ km/s อยู่ระหว่าง 1.8 km/s ที่ผิวกับ 3.6 km/s ที่ตัวสะท้อน การแปลงเวลาสะท้อนเป็นความลึกด้วยความเร็วคงที่จะวางเป้าหมายลึกผิดตำแหน่ง เป็นความผิดพลาดที่มีราคาแพงเมื่อเจาะหาน้ำมัน แก๊ส หรือน้ำร้อนใต้พิภพ"}, "pitfalls": [{"en": "Forgetting the factor $\\dfrac1k$ from $d\\zeta=du/k$.", "th": "ลืมตัวคูณ $\\dfrac1k$ ที่มาจาก $d\\zeta=du/k$"}, {"en": "Changing the variable but keeping the old limits $0$ and $z$. Either change the limits to $u$-values or substitute back before evaluating.", "th": "เปลี่ยนตัวแปรแต่ยังใช้ขอบเขตเดิม $0$ และ $z$ ต้องเปลี่ยนขอบเขตเป็นค่าของ $u$ หรือแทนกลับก่อนหาค่า"}, {"en": "Comparing one-way time with the two-way time on a seismic section; reflection data are recorded as two-way time.", "th": "เทียบเวลาขาเดียวกับเวลาไป-กลับบนภาพตัดขวางไหวสะเทือน ข้อมูลการสะท้อนบันทึกเป็นเวลาไป-กลับ"}]}, "43": {"id": 43, "idea": {"en": "In a second-order reaction the rate depends on two shrinking amounts, $\\dfrac{dx}{dt}=k(a-x)(b-x)$. Separating the variables leaves $\\displaystyle\\int\\frac{dx}{(a-x)(b-x)}$, a rational function that partial fractions splits into two simple logarithms. The result tells us how long treatment takes.", "th": "ในปฏิกิริยาอันดับสอง อัตราขึ้นกับปริมาณสองตัวที่ลดลง $\\dfrac{dx}{dt}=k(a-x)(b-x)$ เมื่อแยกตัวแปรจะเหลือ $\\displaystyle\\int\\frac{dx}{(a-x)(b-x)}$ ซึ่งเป็นฟังก์ชันตรรกยะที่การแยกเศษส่วนย่อย (partial fractions) แยกออกเป็นลอการิทึมง่าย ๆ สองตัว ผลลัพธ์บอกว่าการบำบัดใช้เวลานานเท่าใด"}, "steps": [{"en": "**Separate variables.** $\\dfrac{dx}{(a-x)(b-x)}=k\\,dt$, with $a=2$ mmol/L of acid, $b=3$ mmol/L of carbonate, $k=0.5$ L/(mmol·h), $x(0)=0$.", "th": "**แยกตัวแปร** $\\dfrac{dx}{(a-x)(b-x)}=k\\,dt$ โดยกรด $a=2$ mmol/L คาร์บอเนต $b=3$ mmol/L $k=0.5$ L/(mmol·h) และ $x(0)=0$"}, {"en": "**Partial fractions.** Write $\\dfrac{1}{(a-x)(b-x)}=\\dfrac{A}{a-x}+\\dfrac{B}{b-x}$, so $1=A(b-x)+B(a-x)$. Put $x=a$: $A=\\dfrac1{b-a}$. Put $x=b$: $B=-\\dfrac1{b-a}$.", "th": "**แยกเศษส่วนย่อย** เขียน $\\dfrac{1}{(a-x)(b-x)}=\\dfrac{A}{a-x}+\\dfrac{B}{b-x}$ จะได้ $1=A(b-x)+B(a-x)$ แทน $x=a$: $A=\\dfrac1{b-a}$ แทน $x=b$: $B=-\\dfrac1{b-a}$"}, {"en": "**Integrate each piece.** $\\displaystyle\\int\\frac{dx}{a-x}=-\\ln(a-x)$, so $\\dfrac1{b-a}\\left[-\\ln(a-x)+\\ln(b-x)\\right]=\\dfrac1{b-a}\\ln\\dfrac{b-x}{a-x}=kt+C$.", "th": "**หาปริพันธ์ทีละส่วน** $\\displaystyle\\int\\frac{dx}{a-x}=-\\ln(a-x)$ ดังนั้น $\\dfrac1{b-a}\\left[-\\ln(a-x)+\\ln(b-x)\\right]=\\dfrac1{b-a}\\ln\\dfrac{b-x}{a-x}=kt+C$"}, {"en": "**Constant from $x(0)=0$:** $C=\\dfrac1{b-a}\\ln\\dfrac ba$. Subtract and solve for $t$: $t=\\dfrac{1}{(b-a)k}\\ln\\dfrac{a(b-x)}{b(a-x)}$.", "th": "**ค่าคงตัวจาก $x(0)=0$:** $C=\\dfrac1{b-a}\\ln\\dfrac ba$ นำมาลบกันแล้วแก้หา $t$: $t=\\dfrac{1}{(b-a)k}\\ln\\dfrac{a(b-x)}{b(a-x)}$"}, {"en": "**Time for 90% neutralisation**, $x=0.9a=1.8$: $t=\\dfrac{1}{1\\times0.5}\\ln\\dfrac{2\\times1.2}{3\\times0.2}=2\\ln4=\\ln16\\approx2.77$ h.", "th": "**เวลาที่กรดถูกสะเทินไป 90%** $x=0.9a=1.8$: $t=\\dfrac{1}{1\\times0.5}\\ln\\dfrac{2\\times1.2}{3\\times0.2}=2\\ln4=\\ln16\\approx2.77$ ชั่วโมง"}, {"en": "**Solve for $x(t)$ and check.** With $E=e^{(b-a)kt}$: $x(t)=\\dfrac{ab(E-1)}{bE-a}$. After 2 h, $E=e$ and $x\\approx1.675$, so about $0.325$ mmol/L of acid is left. As $t\\to\\infty$, $x\\to a=2$: all the acid is used up because there is more carbonate than acid.", "th": "**แก้หา $x(t)$ และตรวจสอบ** ให้ $E=e^{(b-a)kt}$ จะได้ $x(t)=\\dfrac{ab(E-1)}{bE-a}$ หลัง 2 ชั่วโมง $E=e$ และ $x\\approx1.675$ เหลือกรดประมาณ $0.325$ mmol/L เมื่อ $t\\to\\infty$ จะได้ $x\\to a=2$ กรดถูกใช้หมดเพราะมีคาร์บอเนตมากกว่ากรด"}], "meaning": {"en": "A treatment pond must hold the water for at least about 2.8 hours to remove 90% of the acid at this rate. The reaction slows down as both reactants are used up, so the last few percent take much longer than the first. If the limestone supply $b$ were smaller than $0.9a$, the 90% target could never be reached, a design check that falls straight out of the formula.", "th": "บ่อบำบัดต้องกักน้ำไว้อย่างน้อยประมาณ 2.8 ชั่วโมงเพื่อกำจัดกรด 90% ที่อัตรานี้ ปฏิกิริยาช้าลงเมื่อสารตั้งต้นทั้งสองถูกใช้ไป ไม่กี่เปอร์เซ็นต์สุดท้ายจึงใช้เวลานานกว่าช่วงแรกมาก ถ้าปริมาณหินปูน $b$ น้อยกว่า $0.9a$ เป้าหมาย 90% จะไม่มีวันถึง ซึ่งเป็นการตรวจสอบการออกแบบที่ได้จากสูตรโดยตรง"}, "pitfalls": [{"en": "Sign error in $\\displaystyle\\int\\frac{dx}{a-x}$: it is $-\\ln|a-x|$, not $+\\ln|a-x|$ (the inner derivative is $-1$).", "th": "เครื่องหมายผิดใน $\\displaystyle\\int\\frac{dx}{a-x}$ ค่าที่ถูกคือ $-\\ln|a-x|$ ไม่ใช่ $+\\ln|a-x|$ (อนุพันธ์ภายในคือ $-1$)"}, {"en": "Forgetting the constant of integration, which gives a wrong time because $x(0)=0$ is not satisfied.", "th": "ลืมค่าคงตัวของการหาปริพันธ์ ทำให้เวลาผิดเพราะไม่สอดคล้องกับ $x(0)=0$"}, {"en": "Using this formula when $a=b$: then $b-a=0$ and partial fractions do not apply; the integral becomes $\\int(a-x)^{-2}dx$ instead.", "th": "ใช้สูตรนี้เมื่อ $a=b$ ซึ่งทำให้ $b-a=0$ และใช้การแยกเศษส่วนย่อยไม่ได้ ปริพันธ์จะกลายเป็น $\\int(a-x)^{-2}dx$ แทน"}]}, "44": {"id": 44, "idea": {"en": "The heat stored in the ground is the integral of the temperature excess over all depths. The integrand is an exponential times a cosine, and integrating such a product by parts twice brings the original integral back. Moving it to one side solves the equation, a trick called cyclic integration by parts.", "th": "ความร้อนที่สะสมในดินคือปริพันธ์ของอุณหภูมิส่วนเกินตลอดทุกความลึก ตัวถูกหาปริพันธ์เป็นเอกซ์โพเนนเชียลคูณโคไซน์ และการหาปริพันธ์ผลคูณแบบนี้โดยการแยกส่วน (integration by parts) สองครั้งจะได้ปริพันธ์ตัวเดิมกลับมา การย้ายข้างจึงแก้สมการได้ เทคนิคนี้เรียกว่าการแยกส่วนแบบวนกลับ (cyclic)"}, "steps": [{"en": "**Set up.** $Q(t)=\\rho c\\displaystyle\\int_0^\\infty Ae^{-z/d}\\cos\\!\\left(\\omega t-\\frac zd\\right)dz$. Let $s=z/d$, $dz=d\\,ds$, $\\phi=\\omega t$: $Q=\\rho cAd\\displaystyle\\int_0^\\infty e^{-s}\\cos(\\phi-s)\\,ds$.", "th": "**ตั้งปริพันธ์** $Q(t)=\\rho c\\displaystyle\\int_0^\\infty Ae^{-z/d}\\cos\\!\\left(\\omega t-\\frac zd\\right)dz$ ให้ $s=z/d$, $dz=d\\,ds$, $\\phi=\\omega t$ จะได้ $Q=\\rho cAd\\displaystyle\\int_0^\\infty e^{-s}\\cos(\\phi-s)\\,ds$"}, {"en": "**Expand the cosine.** $\\cos(\\phi-s)=\\cos\\phi\\cos s+\\sin\\phi\\sin s$, so we need $I_c=\\displaystyle\\int_0^\\infty e^{-s}\\cos s\\,ds$ and $I_s=\\displaystyle\\int_0^\\infty e^{-s}\\sin s\\,ds$.", "th": "**กระจายโคไซน์** $\\cos(\\phi-s)=\\cos\\phi\\cos s+\\sin\\phi\\sin s$ จึงต้องหา $I_c=\\displaystyle\\int_0^\\infty e^{-s}\\cos s\\,ds$ และ $I_s=\\displaystyle\\int_0^\\infty e^{-s}\\sin s\\,ds$"}, {"en": "**First integration by parts.** Take $f=\\cos s$, $dg=e^{-s}ds$, so $g=-e^{-s}$: $I_c=\\Big[-e^{-s}\\cos s\\Big]_0^\\infty-\\displaystyle\\int_0^\\infty e^{-s}\\sin s\\,ds=1-I_s$.", "th": "**แยกส่วนครั้งแรก** ให้ $f=\\cos s$, $dg=e^{-s}ds$ จะได้ $g=-e^{-s}$: $I_c=\\Big[-e^{-s}\\cos s\\Big]_0^\\infty-\\displaystyle\\int_0^\\infty e^{-s}\\sin s\\,ds=1-I_s$"}, {"en": "**Second integration by parts.** Take $f=\\sin s$: $I_s=\\Big[-e^{-s}\\sin s\\Big]_0^\\infty+\\displaystyle\\int_0^\\infty e^{-s}\\cos s\\,ds=0+I_c$. The original integral has come back.", "th": "**แยกส่วนครั้งที่สอง** ให้ $f=\\sin s$: $I_s=\\Big[-e^{-s}\\sin s\\Big]_0^\\infty+\\displaystyle\\int_0^\\infty e^{-s}\\cos s\\,ds=0+I_c$ ปริพันธ์ตัวเดิมกลับมาอีกครั้ง"}, {"en": "**Solve.** $I_c=1-I_c\\Rightarrow I_c=I_s=\\tfrac12$. Therefore $Q(t)=\\rho cAd\\,\\dfrac{\\cos\\omega t+\\sin\\omega t}{2}=\\dfrac{\\rho cAd}{\\sqrt2}\\sin\\!\\left(\\omega t+\\dfrac\\pi4\\right)$, with amplitude $\\dfrac{\\rho cAd}{\\sqrt2}$.", "th": "**แก้สมการ** $I_c=1-I_c\\Rightarrow I_c=I_s=\\tfrac12$ ดังนั้น $Q(t)=\\rho cAd\\,\\dfrac{\\cos\\omega t+\\sin\\omega t}{2}=\\dfrac{\\rho cAd}{\\sqrt2}\\sin\\!\\left(\\omega t+\\dfrac\\pi4\\right)$ มีแอมพลิจูด $\\dfrac{\\rho cAd}{\\sqrt2}$"}, {"en": "**Numbers for the yearly wave.** $\\omega=\\dfrac{2\\pi}{365\\times86400}\\approx1.99\\times10^{-7}$ s⁻¹, $d=\\sqrt{2\\kappa/\\omega}=\\sqrt{2\\times5\\times10^{-7}/1.99\\times10^{-7}}\\approx2.24$ m. Amplitude $=\\dfrac{2\\times10^6\\times10\\times2.24}{\\sqrt2}\\approx3.17\\times10^7$ J/m² $\\approx31.7$ MJ/m². For the daily wave $d$ is $\\sqrt{365}$ times smaller, about $0.117$ m.", "th": "**ตัวเลขของคลื่นรายปี** $\\omega=\\dfrac{2\\pi}{365\\times86400}\\approx1.99\\times10^{-7}$ s⁻¹ และ $d=\\sqrt{2\\kappa/\\omega}=\\sqrt{2\\times5\\times10^{-7}/1.99\\times10^{-7}}\\approx2.24$ m แอมพลิจูด $=\\dfrac{2\\times10^6\\times10\\times2.24}{\\sqrt2}\\approx3.17\\times10^7$ J/m² $\\approx31.7$ MJ/m² สำหรับคลื่นรายวัน $d$ เล็กลง $\\sqrt{365}$ เท่า เหลือประมาณ $0.117$ m"}], "meaning": {"en": "Each square metre of ground soaks up and releases about 32 MJ of heat over a year, roughly the energy in a litre of petrol. The amplitude shrinks to 5% by $3d\\approx6.7$ m, and the wave arrives about 26 days late at 1 m depth, so cellars stay cool in summer and ground-source heat pumps work. The daily wave is gone within about 30 cm.", "th": "ดินแต่ละตารางเมตรดูดซับและคายความร้อนประมาณ 32 MJ ต่อปี ราวพลังงานในน้ำมันเบนซิน 1 ลิตร แอมพลิจูดลดเหลือ 5% ที่ $3d\\approx6.7$ m และคลื่นไปถึงความลึก 1 m ช้ากว่าผิวดินประมาณ 26 วัน ห้องใต้ดินจึงเย็นในฤดูร้อน และปั๊มความร้อนใต้ดินจึงใช้งานได้ ส่วนคลื่นรายวันหายไปภายในราว 30 cm"}, "pitfalls": [{"en": "Swapping the roles of $f$ and $dg$ in the second step. Keep $e^{-s}$ as the part you integrate both times, or you just undo the first step.", "th": "สลับบทบาทของ $f$ กับ $dg$ ในขั้นที่สอง ต้องให้ $e^{-s}$ เป็นส่วนที่หาปริพันธ์ทั้งสองครั้ง มิฉะนั้นจะย้อนขั้นแรกกลับไปเฉย ๆ"}, {"en": "Thinking the reappearing integral means you are stuck. Treat it as an unknown and solve $I_c=1-I_c$.", "th": "คิดว่าเมื่อปริพันธ์ตัวเดิมกลับมาแปลว่าทำต่อไม่ได้ ให้ถือเป็นตัวไม่ทราบค่าแล้วแก้ $I_c=1-I_c$"}, {"en": "Forgetting $dz=d\\,ds$ when substituting $s=z/d$, which loses the factor $d$ in the stored heat.", "th": "ลืม $dz=d\\,ds$ เมื่อแทน $s=z/d$ ทำให้ตัวคูณ $d$ ในความร้อนสะสมหายไป"}]}, "45": {"id": 45, "idea": {"en": "Gravity weakens as $1/r^2$ but never becomes zero, so lifting a mass to infinity means integrating force over an infinite distance. This improper integral is still finite, which is why a fast enough object can escape a planet. Setting kinetic energy equal to that work gives the escape velocity.", "th": "แรงโน้มถ่วงลดลงตาม $1/r^2$ แต่ไม่เคยเป็นศูนย์ การยกมวลไปถึงระยะอนันต์จึงต้องหาปริพันธ์ของแรงตลอดระยะทางที่ไม่สิ้นสุด ปริพันธ์ไม่ตรงแบบ (improper integral) นี้ยังมีค่าจำกัด วัตถุที่เร็วพอจึงหลุดพ้นจากดาวเคราะห์ได้ การตั้งพลังงานจลน์ให้เท่ากับงานนี้ให้ความเร็วหลุดพ้น (escape velocity)"}, "steps": [{"en": "**Write the improper integral as a limit.** $W=\\displaystyle\\int_R^\\infty\\frac{GMm}{r^2}dr=\\lim_{b\\to\\infty}\\int_R^b\\frac{GMm}{r^2}dr$.", "th": "**เขียนปริพันธ์ไม่ตรงแบบเป็นลิมิต** $W=\\displaystyle\\int_R^\\infty\\frac{GMm}{r^2}dr=\\lim_{b\\to\\infty}\\int_R^b\\frac{GMm}{r^2}dr$"}, {"en": "**Integrate.** An antiderivative of $r^{-2}$ is $-r^{-1}$: $\\displaystyle\\int_R^b\\frac{GMm}{r^2}dr=GMm\\left(\\frac1R-\\frac1b\\right)$. As $b\\to\\infty$, $\\dfrac1b\\to0$, so $W=\\dfrac{GMm}{R}$ (finite: the integral converges).", "th": "**หาปริพันธ์** ปฏิยานุพันธ์ของ $r^{-2}$ คือ $-r^{-1}$: $\\displaystyle\\int_R^b\\frac{GMm}{r^2}dr=GMm\\left(\\frac1R-\\frac1b\\right)$ เมื่อ $b\\to\\infty$ จะได้ $\\dfrac1b\\to0$ ดังนั้น $W=\\dfrac{GMm}{R}$ (มีค่าจำกัด ปริพันธ์ลู่เข้า)"}, {"en": "**Escape velocity.** $\\tfrac12mv^2=\\dfrac{GMm}{R}\\Rightarrow v_{\\text{esc}}=\\sqrt{\\dfrac{2GM}{R}}$. The mass $m$ cancels, so it is the same for a dust grain and a boulder.", "th": "**ความเร็วหลุดพ้น** $\\tfrac12mv^2=\\dfrac{GMm}{R}\\Rightarrow v_{\\text{esc}}=\\sqrt{\\dfrac{2GM}{R}}$ มวล $m$ ตัดกันหมด ค่านี้จึงเท่ากันทั้งเม็ดฝุ่นและก้อนหินใหญ่"}, {"en": "**Io:** $GM=5.96\\times10^{12}$ m³/s², $R=1.8216\\times10^6$ m. $v_{\\text{esc}}=\\sqrt{2\\times5.96\\times10^{12}/1.8216\\times10^6}\\approx2558$ m/s $\\approx2.56$ km/s. (Earth: 11.19 km/s; Moon: 2.38 km/s.)", "th": "**ไอโอ (Io):** $GM=5.96\\times10^{12}$ m³/s², $R=1.8216\\times10^6$ m จะได้ $v_{\\text{esc}}=\\sqrt{2\\times5.96\\times10^{12}/1.8216\\times10^6}\\approx2558$ m/s $\\approx2.56$ km/s (โลก 11.19 km/s ดวงจันทร์ 2.38 km/s)"}, {"en": "**Height of a slower plume.** For $v<v_{\\text{esc}}$ the same integral from $R$ to $r_{\\max}$ gives $\\dfrac1R-\\dfrac1{r_{\\max}}=\\dfrac{v^2}{2GM}$. With $v=1$ km/s: $\\dfrac1{r_{\\max}}=5.490\\times10^{-7}-8.39\\times10^{-8}\\approx4.651\\times10^{-7}$ m⁻¹, so $r_{\\max}\\approx2150$ km and the height is $r_{\\max}-R\\approx329$ km.", "th": "**ความสูงของพลูมที่ช้ากว่า** เมื่อ $v<v_{\\text{esc}}$ ปริพันธ์เดียวกันจาก $R$ ถึง $r_{\\max}$ ให้ $\\dfrac1R-\\dfrac1{r_{\\max}}=\\dfrac{v^2}{2GM}$ เมื่อ $v=1$ km/s: $\\dfrac1{r_{\\max}}=5.490\\times10^{-7}-8.39\\times10^{-8}\\approx4.651\\times10^{-7}$ m⁻¹ ดังนั้น $r_{\\max}\\approx2150$ km และความสูงคือ $r_{\\max}-R\\approx329$ km"}], "meaning": {"en": "Io's gravity is weak ($g\\approx1.80$ m/s²), so volcanic gas leaving at 1 km/s rises about 330 km, matching the giant plumes of Pele and Loki seen by spacecraft. The constant-gravity formula $v^2/2g\\approx278$ km underestimates the height because gravity gets weaker as the plume rises. On Earth the same vent speed is far below 11.2 km/s, so volcanic ejecta always fall back.", "th": "แรงโน้มถ่วงของไอโอน้อย ($g\\approx1.80$ m/s²) แก๊สภูเขาไฟที่พุ่งออกด้วยความเร็ว 1 km/s จึงขึ้นไปได้ประมาณ 330 km สอดคล้องกับพลูมขนาดยักษ์ของ Pele และ Loki ที่ยานอวกาศถ่ายไว้ สูตรแรงโน้มถ่วงคงที่ $v^2/2g\\approx278$ km ให้ค่าต่ำเกินไปเพราะแรงโน้มถ่วงอ่อนลงเมื่อพลูมสูงขึ้น บนโลกความเร็วพ่นเท่ากันนี้ต่ำกว่า 11.2 km/s มาก วัตถุจากภูเขาไฟจึงตกกลับลงมาเสมอ"}, "pitfalls": [{"en": "Plugging $\\infty$ into $-1/r$ directly. Write the limit $b\\to\\infty$ explicitly; that is what makes the improper integral meaningful.", "th": "แทน $\\infty$ ลงใน $-1/r$ ตรง ๆ ควรเขียนลิมิต $b\\to\\infty$ ให้ชัดเจน ซึ่งทำให้ปริพันธ์ไม่ตรงแบบมีความหมาย"}, {"en": "Mixing km and m. $GM$ is in m³/s², so $R$ must be in metres and $v$ in m/s.", "th": "ปน km กับ m $GM$ มีหน่วย m³/s² ดังนั้น $R$ ต้องเป็นเมตรและ $v$ เป็น m/s"},
