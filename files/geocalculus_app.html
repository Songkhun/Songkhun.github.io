อหารด้วย $g=981$ ซม./วินาที²"}, {"en": "Quick check with $\\omega^2A$: $(9.425)^2\\times5=444$ cm/s² $=0.453$ g. It overestimates a little because damping and the peak displacement (3.99 cm, not 5 cm) reduce the real value.", "th": "ตรวจสอบอย่างเร็วด้วย $\\omega^2A$: $(9.425)^2\\times5=444$ ซม./วินาที² $=0.453$ g ซึ่งสูงไปเล็กน้อย เพราะการหน่วงและการกระจัดสูงสุดจริง (3.99 ซม. ไม่ใช่ 5 ซม.) ทำให้ค่าจริงลดลง"}], "meaning": {"en": "A ground displacement of only 4 cm at 1.5 Hz produces a peak acceleration of about **0.39 g**, enough to damage weak buildings. Doubling the frequency roughly quadruples PGA ($\\propto\\omega^2$), so short, stiff buildings that respond to high frequencies are most at risk. Engineers integrate accelerograms to get velocity and displacement, the reverse of this calculation.", "th": "การกระจัดของพื้นดินเพียง 4 ซม. ที่ความถี่ 1.5 เฮิรตซ์ ให้ความเร่งสูงสุดราว **0.39 g** ซึ่งพอจะทำให้อาคารที่ไม่แข็งแรงเสียหาย การเพิ่มความถี่เป็นสองเท่าทำให้ PGA เพิ่มราวสี่เท่า ($\\propto\\omega^2$) อาคารเตี้ยและแข็งที่ตอบสนองต่อความถี่สูงจึงเสี่ยงที่สุด วิศวกรหาปริพันธ์ของบันทึกความเร่งเพื่อได้ความเร็วและการกระจัด ซึ่งเป็นการคำนวณย้อนกลับของตัวอย่างนี้"}, "pitfalls": [{"en": "Differentiating $e^{-\\alpha t}\\sin\\omega t$ as $(-\\alpha e^{-\\alpha t})(\\omega\\cos\\omega t)$. The derivative of a product is not the product of the derivatives.", "th": "หาอนุพันธ์ของ $e^{-\\alpha t}\\sin\\omega t$ เป็น $(-\\alpha e^{-\\alpha t})(\\omega\\cos\\omega t)$ อนุพันธ์ของผลคูณไม่ใช่ผลคูณของอนุพันธ์"}, {"en": "Using $f$ (Hz) instead of $\\omega=2\\pi f$ (rad/s), which makes everything $2\\pi$ times too small.", "th": "ใช้ $f$ (เฮิรตซ์) แทน $\\omega=2\\pi f$ (เรเดียน/วินาที) ทำให้ทุกค่าน้อยไป $2\\pi$ เท่า"}, {"en": "Forgetting to convert cm/s² into g (divide by 981 cm/s²).", "th": "ลืมแปลง ซม./วินาที² เป็นหน่วย g (หารด้วย 981 ซม./วินาที²)"}]}, "10": {"id": 10, "idea": {"en": "The Dupuit equation gives the water table as $h^2$, not $h$, so the relationship between $h$ and $x$ is easiest to differentiate **implicitly**: differentiate both sides with respect to $x$, treating $h$ as a function of $x$, then solve for $dh/dx$. Darcy's law then turns the slope into a flow rate.", "th": "สมการดูปุย (Dupuit) ให้ระดับน้ำใต้ดินในรูป $h^2$ ไม่ใช่ $h$ ความสัมพันธ์ระหว่าง $h$ กับ $x$ จึงหาอนุพันธ์ได้ง่ายที่สุดแบบ **โดยปริยาย (implicit)** คือหาอนุพันธ์ทั้งสองข้างเทียบกับ $x$ โดยถือว่า $h$ เป็นฟังก์ชันของ $x$ แล้วแก้หา $dh/dx$ จากนั้นกฎของดาร์ซี (Darcy's law) เปลี่ยนความชันเป็นอัตราการไหล"}, "steps": [{"en": "Defaults: $h_1=20$ m, $h_2=12$ m, $L=500$ m, $K=10$ m/day. The water table satisfies $h^2=400-256\\,\\dfrac{x}{500}$, since $h_1^2-h_2^2=400-144=256$ m².", "th": "ค่าเริ่มต้น: $h_1=20$ ม. $h_2=12$ ม. $L=500$ ม. $K=10$ ม./วัน ระดับน้ำใต้ดินสอดคล้องกับ $h^2=400-256\\,\\dfrac{x}{500}$ เพราะ $h_1^2-h_2^2=400-144=256$ ม.²"}, {"en": "Differentiate both sides with respect to $x$. On the left the chain rule gives $\\frac{d}{dx}h^2=2h\\frac{dh}{dx}$: $$2h\\frac{dh}{dx}=-\\frac{256}{500}\\ \\Rightarrow\\ \\frac{dh}{dx}=-\\frac{256}{1000\\,h}.$$", "th": "หาอนุพันธ์ทั้งสองข้างเทียบกับ $x$ ด้านซ้ายใช้หลักเกณฑ์ลูกโซ่ได้ $\\frac{d}{dx}h^2=2h\\frac{dh}{dx}$: $$2h\\frac{dh}{dx}=-\\frac{256}{500}\\ \\Rightarrow\\ \\frac{dh}{dx}=-\\frac{256}{1000\\,h}$$"}, {"en": "Evaluate at the two rivers: at $x=0$ ($h=20$) $dh/dx=-0.0128$; at $x=L$ ($h=12$) $dh/dx=-0.0213$. The water table is steeper downstream where it is thinner. Midway, $h=\\sqrt{400-128}=16.49$ m, a little above the straight-line value of 16 m.", "th": "คำนวณที่แม่น้ำทั้งสองสาย: ที่ $x=0$ ($h=20$) $dh/dx=-0.0128$ ที่ $x=L$ ($h=12$) $dh/dx=-0.0213$ ระดับน้ำใต้ดินชันขึ้นทางท้ายน้ำซึ่งชั้นน้ำบางกว่า ที่กึ่งกลาง $h=\\sqrt{400-128}=16.49$ ม. สูงกว่าค่าจากเส้นตรง 16 ม. เล็กน้อย"}, {"en": "Darcy's law for an unconfined aquifer: discharge per metre of bank $q=-Kh\\dfrac{dh}{dx}$. Substituting the implicit result, $h$ cancels: $$q=Kh\\cdot\\frac{256}{1000h}=\\frac{K(h_1^2-h_2^2)}{2L}=\\frac{10\\times256}{1000}=2.56\\ \\text{m}^2/\\text{day}.$$", "th": "กฎของดาร์ซีสำหรับชั้นหินอุ้มน้ำไร้แรงดัน: อัตราการไหลต่อความยาวตลิ่งหนึ่งเมตร $q=-Kh\\dfrac{dh}{dx}$ แทนผลจากการหาอนุพันธ์โดยปริยาย $h$ ตัดกันหมด: $$q=Kh\\cdot\\frac{256}{1000h}=\\frac{K(h_1^2-h_2^2)}{2L}=\\frac{10\\times256}{1000}=2.56\\ \\text{ม.}^2/\\text{วัน}$$"}, {"en": "Scale up: along 1 km of river, $2.56\\times1000=2560$ m³/day flows from the upper river to the lower one.", "th": "ขยายขนาด: ตลอดแม่น้ำยาว 1 กม. น้ำไหลจากแม่น้ำสายบนไปสายล่าง $2.56\\times1000=2560$ ม.³/วัน"}], "meaning": {"en": "The water table is a curve, not a straight line, and it steepens where the aquifer thins so that $h\\,dh/dx$ stays constant. That constant is the statement of **mass conservation**: the same 2.56 m²/day passes through every cross-section. Hydrogeologists use this to estimate how much a river gains from or loses to groundwater.", "th": "ระดับน้ำใต้ดินเป็นเส้นโค้ง ไม่ใช่เส้นตรง และชันขึ้นในบริเวณที่ชั้นน้ำบางลง เพื่อให้ $h\\,dh/dx$ คงที่ ค่าคงที่นี้คือการแสดง **การอนุรักษ์มวล** คือน้ำ 2.56 ม.²/วัน เท่ากันไหลผ่านทุกหน้าตัด นักอุทกธรณีวิทยาใช้หลักนี้ประมาณว่าแม่น้ำได้รับน้ำจากหรือสูญเสียน้ำให้น้ำใต้ดินเท่าใด"}, "pitfalls": [{"en": "Writing $\\frac{d}{dx}h^2=2h$ and forgetting the factor $dh/dx$. In implicit differentiation every $h$ term needs it.", "th": "เขียน $\\frac{d}{dx}h^2=2h$ แล้วลืมตัวคูณ $dh/dx$ ในการหาอนุพันธ์โดยปริยาย ทุกพจน์ที่มี $h$ ต้องมีตัวคูณนี้"}, {"en": "Assuming the water table is a straight line between the rivers; that would give a different, non-constant discharge.", "th": "สมมติว่าระดับน้ำใต้ดินเป็นเส้นตรงระหว่างแม่น้ำสองสาย ซึ่งจะทำให้อัตราการไหลไม่คงที่และผิด"}, {"en": "Mixing units: $K$ in m/day gives $q$ in m²/day; using $K$ in m/s without converting changes the answer by 86,400.", "th": "ใช้หน่วยปนกัน $K$ หน่วย ม./วัน ให้ $q$ หน่วย ม.²/วัน ถ้าใช้ $K$ หน่วย ม./วินาที โดยไม่แปลง คำตอบจะต่างกัน 86,400 เท่า"}]}, "11": {"id": 11, "idea": {"en": "Gravity follows the inverse-square law $g(h)=GM/(R+h)^2$. For heights much smaller than Earth's radius, the curve is almost a straight line, so the **differential** $dg=g'(0)\\,dh$ (the tangent-line approximation) is enough. This one number, the free-air gradient, is used to correct every gravity measurement for station height.", "th": "แรงโน้มถ่วงเป็นไปตามกฎกำลังสองผกผัน $g(h)=GM/(R+h)^2$ สำหรับความสูงที่น้อยกว่ารัศมีโลกมาก กราฟเกือบเป็นเส้นตรง **ผลต่างเชิงอนุพันธ์ (differential)** $dg=g'(0)\\,dh$ (การประมาณด้วยเส้นสัมผัส) จึงเพียงพอ ตัวเลขเดียวนี้ คือเกรเดียนต์อากาศอิสระ (free-air gradient) ใช้แก้ค่าการวัดแรงโน้มถ่วงทุกครั้งตามความสูงของสถานี"}, "steps": [{"en": "Sea-level gravity: $g_0=\\dfrac{GM}{R^2}=\\dfrac{3.986\\times10^{14}}{(6.371\\times10^6)^2}=9.8202$ m/s².", "th": "แรงโน้มถ่วงที่ระดับน้ำทะเล: $g_0=\\dfrac{GM}{R^2}=\\dfrac{3.986\\times10^{14}}{(6.371\\times10^6)^2}=9.8202$ ม./วินาที²"}, {"en": "Differentiate with the power rule on $(R+h)^{-2}$: $$g'(h)=-\\frac{2GM}{(R+h)^3},\\qquad g'(0)=-\\frac{2GM}{R^3}=-\\frac{2g_0}{R}.$$", "th": "หาอนุพันธ์ด้วยกฎยกกำลังกับ $(R+h)^{-2}$: $$g'(h)=-\\frac{2GM}{(R+h)^3},\\qquad g'(0)=-\\frac{2GM}{R^3}=-\\frac{2g_0}{R}$$"}, {"en": "Numerical value: $g'(0)=-\\dfrac{2\\times9.8202}{6.371\\times10^6}=-3.083\\times10^{-6}$ s⁻². With 1 mGal $=10^{-5}$ m/s², that is $-0.3083$ mGal per metre.", "th": "ค่าตัวเลข: $g'(0)=-\\dfrac{2\\times9.8202}{6.371\\times10^6}=-3.083\\times10^{-6}$ ต่อวินาที² เมื่อ 1 มิลลิแกล $=10^{-5}$ ม./วินาที² จะได้ $-0.3083$ มิลลิแกลต่อเมตร"}, {"en": "Apply the differential at Doi Inthanon, $dh=2565$ m: $dg=-0.3083\\times2565=-790.74$ mGal. The exact value is $g(2565)-g_0=-790.26$ mGal.", "th": "ใช้ผลต่างเชิงอนุพันธ์ที่ดอยอินทนนท์ $dh=2565$ ม.: $dg=-0.3083\\times2565=-790.74$ มิลลิแกล ค่าแท้จริงคือ $g(2565)-g_0=-790.26$ มิลลิแกล"}, {"en": "Relative error: $\\dfrac{|-790.74+790.26|}{790.26}\\approx0.06\\%$. Even at 20 km height the error is only 0.47%, because $h/R$ is tiny.", "th": "ความคลาดเคลื่อนสัมพัทธ์: $\\dfrac{|-790.74+790.26|}{790.26}\\approx0.06\\%$ แม้ที่ความสูง 20 กม. ความคลาดเคลื่อนก็เพียง 0.47% เพราะ $h/R$ เล็กมาก"}], "meaning": {"en": "Gravity drops by about **0.308 mGal for every metre** you climb (textbooks quote 0.3086 using a slightly different reference). On Doi Inthanon the reading is about 790 mGal lower than at sea level, so this free-air correction must be **added** back. Since ore bodies and basins produce anomalies of only 1–10 mGal, a 3 m height error (≈ 1 mGal) already matters, which is why gravity surveys need precise GPS heights.", "th": "แรงโน้มถ่วงลดลงราว **0.308 มิลลิแกลทุก ๆ หนึ่งเมตร** ที่สูงขึ้น (ตำราใช้ 0.3086 ซึ่งมาจากค่าอ้างอิงที่ต่างเล็กน้อย) บนดอยอินทนนท์ ค่าที่อ่านได้ต่ำกว่าที่ระดับน้ำทะเลราว 790 มิลลิแกล จึงต้อง **บวก** ค่าแก้อากาศอิสระนี้กลับเข้าไป เนื่องจากแหล่งแร่และแอ่งตะกอนให้ค่าผิดปกติเพียง 1–10 มิลลิแกล ความคลาดเคลื่อนของความสูง 3 ม. (≈ 1 มิลลิแกล) ก็มีผลแล้ว การสำรวจแรงโน้มถ่วงจึงต้องใช้ความสูงจาก GPS ที่แม่นยำ"}, "pitfalls": [{"en": "Forgetting the minus sign: gravity decreases with height, so the reading must be corrected upward.", "th": "ลืมเครื่องหมายลบ แรงโน้มถ่วงลดลงตามความสูง ค่าที่อ่านได้จึงต้องแก้ให้สูงขึ้น"}, {"en": "Mixing m/s² and mGal. 1 mGal $=10^{-5}$ m/s², not $10^{-3}$.", "th": "ใช้หน่วย ม./วินาที² กับมิลลิแกลปนกัน 1 มิลลิแกล $=10^{-5}$ ม./วินาที² ไม่ใช่ $10^{-3}$"}, {"en": "Using $R$ in km together with $GM$ in m³/s²; all lengths must be in metres.", "th": "ใช้ $R$ หน่วยกิโลเมตรร่วมกับ $GM$ หน่วย ม.³/วินาที² ความยาวทุกตัวต้องเป็นเมตร"}]}, "12": {"id": 12, "idea": {"en": "In a **related-rates** problem two quantities change together and are linked by an equation. Here the cone's volume and height are linked by geometry, and both change with time. Differentiating the volume formula with respect to $t$ (chain rule) connects the known eruption rate $dV/dt$ to the unknown growth rate $dh/dt$.", "th": "ในโจทย์ **อัตราการเปลี่ยนแปลงสัมพัทธ์ (related rates)** ปริมาณสองตัวเปลี่ยนไปพร้อมกันและเชื่อมกันด้วยสมการ ในที่นี้ปริมาตรกับความสูงของกรวยเชื่อมกันด้วยเรขาคณิต และทั้งสองเปลี่ยนตามเวลา การหาอนุพันธ์ของสูตรปริมาตรเทียบกับ $t$ (หลักเกณฑ์ลูกโซ่) เชื่อมอัตราการปะทุที่รู้ค่า $dV/dt$ เข้ากับอัตราการสูงขึ้นที่ไม่รู้ค่า $dh/dt$"}, "steps": [{"en": "Geometry first: tephra rests at the angle of repose $\\varphi$, so $\\tan\\varphi=h/r$ and $r=h/\\tan\\varphi$. Substituting into $V=\\tfrac13\\pi r^2h$ removes $r$: $$V=\\frac{\\pi h^3}{3\\tan^2\\varphi}.$$", "th": "เริ่มจากเรขาคณิต: เทฟราวางตัวที่มุมพัก $\\varphi$ จึงได้ $\\tan\\varphi=h/r$ และ $r=h/\\tan\\varphi$ แทนลงใน $V=\\tfrac13\\pi r^2h$ เพื่อกำจัด $r$: $$V=\\frac{\\pi h^3}{3\\tan^2\\varphi}$$"}, {"en": "Differentiate both sides with respect to time; $h$ depends on $t$, so the chain rule gives $$\\frac{dV}{dt}=\\frac{\\pi h^2}{\\tan^2\\varphi}\\frac{dh}{dt}\\ \\Rightarrow\\ \\frac{dh}{dt}=\\frac{\\tan^2\\varphi}{\\pi h^2}\\frac{dV}{dt}.$$", "th": "หาอนุพันธ์ทั้งสองข้างเทียบกับเวลา เนื่องจาก $h$ ขึ้นกับ $t$ หลักเกณฑ์ลูกโซ่จึงให้ $$\\frac{dV}{dt}=\\frac{\\pi h^2}{\\tan^2\\varphi}\\frac{dh}{dt}\\ \\Rightarrow\\ \\frac{dh}{dt}=\\frac{\\tan^2\\varphi}{\\pi h^2}\\frac{dV}{dt}$$"}, {"en": "Substitute the defaults $\\varphi=33^\\circ$ ($\\tan^2\\varphi=0.4217$), $h=50$ m and $dV/dt=10$ m³/s: $$\\frac{dh}{dt}=\\frac{0.4217}{\\pi(2500)}\\times10=5.37\\times10^{-4}\\ \\text{m/s}.$$", "th": "แทนค่าเริ่มต้น $\\varphi=33^\\circ$ ($\\tan^2\\varphi=0.4217$) $h=50$ ม. และ $dV/dt=10$ ม.³/วินาที: $$\\frac{dh}{dt}=\\frac{0.4217}{\\pi(2500)}\\times10=5.37\\times10^{-4}\\ \\text{ม./วินาที}$$"}, {"en": "Convert to a useful unit: $5.37\\times10^{-4}\\times86{,}400=46.4$ m/day. At $h=200$ m the rate is $16$ times smaller, $2.90$ m/day, because $dh/dt\\propto1/h^2$.", "th": "แปลงเป็นหน่วยที่ใช้ง่าย: $5.37\\times10^{-4}\\times86{,}400=46.4$ ม./วัน ที่ $h=200$ ม. อัตราลดลง 16 เท่าเหลือ $2.90$ ม./วัน เพราะ $dh/dt\\propto1/h^2$"}, {"en": "Size of the cone now: $r=50/\\tan33^\\circ=77.0$ m and $V=\\pi(50)^3/(3\\times0.4217)=0.310$ million m³, which took $V/(dV/dt)=31{,}039$ s $\\approx0.36$ day to build at this rate.", "th": "ขนาดของกรวยตอนนี้: $r=50/\\tan33^\\circ=77.0$ ม. และ $V=\\pi(50)^3/(3\\times0.4217)=0.310$ ล้าน ม.³ ซึ่งใช้เวลาสร้าง $V/(dV/dt)=31{,}039$ วินาที $\\approx0.36$ วัน ที่อัตรานี้"}], "meaning": {"en": "At 50 m tall the cone grows about **46 m per day**, but at 200 m only about 3 m per day, even though the eruption rate is unchanged. Each new metre of height needs a much larger shell of tephra (the area of the cone's surface grows like $h^2$). This matches Parícutin (Mexico, 1943), which grew about 50 m on its first day but took years to reach 400 m.", "th": "เมื่อสูง 50 ม. กรวยสูงขึ้นราว **46 ม. ต่อวัน** แต่เมื่อสูง 200 ม. สูงขึ้นเพียงราว 3 ม. ต่อวัน แม้อัตราการปะทุจะเท่าเดิม ความสูงที่เพิ่มขึ้นแต่ละเมตรต้องใช้เปลือกเทฟราที่ใหญ่กว่ามาก (พื้นที่ผิวกรวยเพิ่มตาม $h^2$) ซึ่งตรงกับภูเขาไฟปาริกุติน (Parícutin, เม็กซิโก ค.ศ. 1943) ที่สูงขึ้นราว 50 ม. ในวันแรก แต่ใช้เวลาหลายปีกว่าจะสูงถึง 400 ม."}, "pitfalls": [{"en": "Substituting $h=50$ before differentiating. Then $V$ becomes a constant and its derivative is 0; numbers go in only after differentiating.", "th": "แทน $h=50$ ก่อนหาอนุพันธ์ จะทำให้ $V$ เป็นค่าคงตัวและอนุพันธ์เป็น 0 ต้องแทนตัวเลขหลังจากหาอนุพันธ์แล้วเท่านั้น"}, {"en": "Keeping both $r$ and $h$ as variables without using $r=h/\\tan\\varphi$, which leaves an unknown $dr/dt$.", "th": "เก็บทั้ง $r$ และ $h$ เป็นตัวแปรโดยไม่ใช้ $r=h/\\tan\\varphi$ ทำให้เหลือตัวไม่ทราบค่า $dr/dt$"}, {"en": "Forgetting to convert m/s into m/day (×86,400) or using $\\varphi$ in degrees inside a formula that expects radians on a calculator.", "th": "ลืมแปลง ม./วินาที เป็น ม./วัน (×86,400) หรือใส่ $\\varphi$ เป็นองศาในเครื่องคิดเลขที่ตั้งเป็นเรเดียน"}]}, "13": {"id": 13, "idea": {"en": "A seismic wave does not travel in a straight line between two layers; it takes the path of **least travel time** (Fermat's principle). Writing the travel time as a function of the crossing point $x$ turns this into an **optimisation problem**: find where $T'(x)=0$ and check that it is a minimum. The condition $T'(x)=0$ turns out to be exactly Snell's law.", "th": "คลื่นไหวสะเทือนไม่ได้เดินทางเป็นเส้นตรงเมื่อผ่านสองชั้นหิน แต่เลือกเส้นทางที่ใช้ **เวลาน้อยที่สุด** (หลักของแฟร์มา (Fermat's principle)) เมื่อเขียนเวลาเดินทางเป็นฟังก์ชันของจุดตัด $x$ ปัญหานี้จึงกลายเป็น **การหาค่าสูงสุดต่ำสุด (optimisation)** คือหาจุดที่ $T'(x)=0$ แล้วตรวจว่าเป็นค่าต่ำสุด ซึ่งเงื่อนไข $T'(x)=0$ นี้ก็คือกฎของสเนลล์ (Snell's law) นั่นเอง"}, "steps": [{"en": "**Set up the function.** The source is $a=2$ km above the interface, the receiver $b=3$ km below it and $d=6$ km away. By Pythagoras the two straight segments have lengths $\\sqrt{a^2+x^2}$ and $\\sqrt{b^2+(d-x)^2}$; time = distance / speed, so $$T(x)=\\frac{\\sqrt{4+x^2}}{3}+\\frac{\\sqrt{9+(6-x)^2}}{5}.$$", "th": "**ตั้งฟังก์ชัน** แหล่งกำเนิดอยู่เหนือรอยต่อ $a=2$ km ตัวรับอยู่ใต้รอยต่อ $b=3$ km และห่างออกไปในแนวราบ $d=6$ km จากทฤษฎีบทพีทาโกรัส ความยาวของสองช่วงคือ $\\sqrt{a^2+x^2}$ และ $\\sqrt{b^2+(d-x)^2}$ และเวลา = ระยะทาง / อัตราเร็ว จึงได้ $$T(x)=\\frac{\\sqrt{4+x^2}}{3}+\\frac{\\sqrt{9+(6-x)^2}}{5}.$$"}, {"en": "**Differentiate with the chain rule.** $\\dfrac{d}{dx}\\sqrt{4+x^2}=\\dfrac{x}{\\sqrt{4+x^2}}$ and $\\dfrac{d}{dx}\\sqrt{9+(6-x)^2}=\\dfrac{-(6-x)}{\\sqrt{9+(6-x)^2}}$ (the inner derivative of $6-x$ is $-1$). So $$T'(x)=\\frac{x}{3\\sqrt{4+x^2}}-\\frac{6-x}{5\\sqrt{9+(6-x)^2}}.$$", "th": "**หาอนุพันธ์ด้วยหลักเกณฑ์ลูกโซ่ (chain rule)** $\\dfrac{d}{dx}\\sqrt{4+x^2}=\\dfrac{x}{\\sqrt{4+x^2}}$ และ $\\dfrac{d}{dx}\\sqrt{9+(6-x)^2}=\\dfrac{-(6-x)}{\\sqrt{9+(6-x)^2}}$ (อนุพันธ์ภายในของ $6-x$ คือ $-1$) ดังนั้น $$T'(x)=\\frac{x}{3\\sqrt{4+x^2}}-\\frac{6-x}{5\\sqrt{9+(6-x)^2}}.$$"}, {"en": "**Recognise the sines.** In the picture, $\\dfrac{x}{\\sqrt{4+x^2}}=\\sin\\theta_1$ and $\\dfrac{6-x}{\\sqrt{9+(6-x)^2}}=\\sin\\theta_2$, where the angles are measured from the vertical. Setting $T'(x)=0$ therefore says $\\dfrac{\\sin\\theta_1}{v_1}=\\dfrac{\\sin\\theta_2}{v_2}$: Snell's law falls out of the derivative.", "th": "**มองให้เห็นค่าไซน์** จากรูป $\\dfrac{x}{\\sqrt{4+x^2}}=\\sin\\theta_1$ และ $\\dfrac{6-x}{\\sqrt{9+(6-x)^2}}=\\sin\\theta_2$ โดยวัดมุมจากแนวดิ่ง การตั้ง $T'(x)=0$ จึงหมายถึง $\\dfrac{\\sin\\theta_1}{v_1}=\\dfrac{\\sin\\theta_2}{v_2}$ กฎของสเนลล์จึงได้มาจากอนุพันธ์โดยตรง"}, {"en": "**Solve numerically.** The equation $T'(x)=0$ has no neat algebraic solution, so we solve it numerically (Newton's method or bisection) and get $x^*\\approx 1.1836$ km. Then $\\sin\\theta_1=1.1836/\\sqrt{4+1.1836^2}=0.5093$, so $\\theta_1\\approx30.62^\\circ$, and $\\theta_2\\approx58.08^\\circ$. Both ratios equal $0.169762$ s/km.", "th": "**แก้สมการเชิงตัวเลข** สมการ $T'(x)=0$ ไม่มีคำตอบรูปปิดที่สวยงาม จึงแก้ด้วยวิธีเชิงตัวเลข (วิธีของนิวตันหรือการแบ่งครึ่งช่วง) ได้ $x^*\\approx 1.1836$ km จากนั้น $\\sin\\theta_1=1.1836/\\sqrt{4+1.1836^2}=0.5093$ จึงได้ $\\theta_1\\approx30.62^\\circ$ และ $\\theta_2\\approx58.08^\\circ$ ทั้งสองอัตราส่วนมีค่าเท่ากันคือ $0.169762$ s/km"}, {"en": "**Check it is a minimum.** $T''(x^*)\\approx0.1161>0$, so the graph is concave up there and $x^*$ is a minimum (second-derivative test). Compare: $T(x^*)=1.9095$ s, while the trial crossing $x=3.5$ km gives $2.1247$ s and the end points give $T(0)=2.008$ s and $T(6)=2.708$ s.", "th": "**ตรวจว่าเป็นค่าต่ำสุด** $T''(x^*)\\approx0.1161>0$ กราฟจึงเว้าขึ้นที่จุดนั้น และ $x^*$ เป็นจุดต่ำสุด (การทดสอบด้วยอนุพันธ์อันดับสอง) เปรียบเทียบ: $T(x^*)=1.9095$ s ขณะที่จุดตัดทดลอง $x=3.5$ km ให้ $2.1247$ s และที่ปลายช่วงได้ $T(0)=2.008$ s และ $T(6)=2.708$ s"}], "meaning": {"en": "The fastest ray bends **away** from the vertical when it enters the faster layer ($\\theta_2>\\theta_1$). The minimum time of about 1.91 s is what a seismometer would record as the first arrival. Seismic refraction surveys use exactly this bending to measure layer speeds and depths, and it is how the Moho (crust–mantle boundary) was discovered. Sanity check: the crossing point lies closer to the source, so the wave spends less distance in the slow layer, which makes sense.", "th": "รังสีที่เร็วที่สุดจะหักเห **ออกจาก** แนวดิ่งเมื่อเข้าสู่ชั้นที่เร็วกว่า ($\\theta_2>\\theta_1$) เวลาต่ำสุดประมาณ 1.91 s คือสิ่งที่เครื่องวัดแผ่นดินไหวบันทึกเป็นคลื่นที่มาถึงก่อน การสำรวจแบบหักเหคลื่นไหวสะเทือน (seismic refraction) ใช้การหักเหนี้วัดความเร็วและความลึกของชั้นหิน และเป็นวิธีที่ค้นพบแนวไม่ต่อเนื่องโมโฮ (Moho) ตรวจสอบความสมเหตุสมผล: จุดตัดอยู่ใกล้แหล่งกำเนิด คลื่นจึงเดินทางในชั้นที่ช้าเป็นระยะสั้น ซึ่งสมเหตุสมผล"}, "pitfalls": [{"en": "Forgetting the inner derivative $-1$ of $(6-x)$, which gives the wrong sign in the second term of $T'(x)$.", "th": "ลืมอนุพันธ์ภายใน $-1$ ของ $(6-x)$ ทำให้พจน์ที่สองของ $T'(x)$ มีเครื่องหมายผิด"}, {"en": "Measuring the angles from the interface instead of from the vertical (the normal); Snell's law uses angles from the normal.", "th": "วัดมุมจากรอยต่อชั้นหินแทนที่จะวัดจากแนวดิ่ง (แนวตั้งฉาก) กฎของสเนลล์ใช้มุมที่วัดจากแนวตั้งฉาก"}, {"en": "Stopping at $T'(x)=0$ without checking it is a minimum (second derivative or comparing with end points).", "th": "หยุดแค่ $T'(x)=0$ โดยไม่ตรวจว่าเป็นค่าต่ำสุด (ด้วยอนุพันธ์อันดับสองหรือเทียบกับค่าที่ปลายช่วง)"}]}, "14": {"id": 14, "idea": {"en": "The Bateman equation for a daughter isotope contains the factor $\\dfrac{1}{\\lambda_2-\\lambda_1}$, so plugging in equal decay constants gives the **indeterminate form** $\\tfrac00$. **L'Hôpital's rule** says the limit of a $\\tfrac00$ quotient equals the limit of the quotient of the derivatives, which gives a perfectly finite formula for this special case.", "th": "สมการเบตแมน (Bateman equation) ของไอโซโทปลูกมีตัวประกอบ $\\dfrac{1}{\\lambda_2-\\lambda_1}$ เมื่อแทนค่าคงที่การสลายตัวที่เท่ากันจึงได้ **รูปแบบไม่กำหนด (indeterminate form)** $\\tfrac00$ **หลักเกณฑ์โลปีตาล (L'Hôpital's rule)** บอกว่าลิมิตของผลหารรูป $\\tfrac00$ เท่ากับลิมิตของผลหารของอนุพันธ์ ซึ่งให้สูตรที่มีค่าจำกัดสำหรับกรณีพิเศษนี้"}, "steps": [{"en": "**Spot the $\\tfrac00$.** With $N_2(t)=N_0\\dfrac{\\lambda_1\\left(e^{-\\lambda_1t}-e^{-\\lambda_2t}\\right)}{\\lambda_2-\\lambda_1}$, setting $\\lambda_2=\\lambda_1=\\lambda$ makes the numerator $\\lambda(e^{-\\lambda t}-e^{-\\lambda t})=0$ and the denominator $0$. The formula is undefined, but the physics is not, so we take the limit $\\lambda_2\\to\\lambda$.", "th": "**สังเกตรูป $\\tfrac00$** จาก $N_2(t)=N_0\\dfrac{\\lambda_1\\left(e^{-\\lambda_1t}-e^{-\\lambda_2t}\\right)}{\\lambda_2-\\lambda_1}$ เมื่อ $\\lambda_2=\\lambda_1=\\lambda$ ตัวเศษเป็น $\\lambda(e^{-\\lambda t}-e^{-\\lambda t})=0$ และตัวส่วนเป็น $0$ สูตรจึงหาค่าไม่ได้ แต่ปรากฏการณ์ทางฟิสิกส์ยังมีความหมาย จึงหาลิมิตเมื่อ $\\lambda_2\\to\\lambda$"}, {"en": "**Differentiate top and bottom with respect to $\\lambda_2$** (the variable that is moving; $t$ and $\\lambda$ are held fixed). $\\dfrac{d}{d\\lambda_2}\\left[\\lambda\\left(e^{-\\lambda t}-e^{-\\lambda_2 t}\\right)\\right]=\\lambda t\\,e^{-\\lambda_2 t}$ (chain rule: the derivative of $-e^{-\\lambda_2 t}$ is $+t e^{-\\lambda_2 t}$), and $\\dfrac{d}{d\\lambda_2}(\\lambda_2-\\lambda)=1$.", "th": "**หาอนุพันธ์ทั้งเศษและส่วนเทียบกับ $\\lambda_2$** (ตัวแปรที่กำลังเปลี่ยน โดยถือ $t$ และ $\\lambda$ เป็นค่าคงที่) $\\dfrac{d}{d\\lambda_2}\\left[\\lambda\\left(e^{-\\lambda t}-e^{-\\lambda_2 t}\\right)\\right]=\\lambda t\\,e^{-\\lambda_2 t}$ (หลักเกณฑ์ลูกโซ่: อนุพันธ์ของ $-e^{-\\lambda_2 t}$ คือ $+t e^{-\\lambda_2 t}$) และ $\\dfrac{d}{d\\lambda_2}(\\lambda_2-\\lambda)=1$"}, {"en": "**Take the limit.** $$\\lim_{\\lambda_2\\to\\lambda}\\frac{N_2}{N_0}=\\lim_{\\lambda_2\\to\\lambda}\\frac{\\lambda t e^{-\\lambda_2 t}}{1}=\\lambda t\\,e^{-\\lambda t}.$$ The daughter grows linearly at first (factor $t$) and then decays (factor $e^{-\\lambda t}$).", "th": "**หาลิมิต** $$\\lim_{\\lambda_2\\to\\lambda}\\frac{N_2}{N_0}=\\lim_{\\lambda_2\\to\\lambda}\\frac{\\lambda t e^{-\\lambda_2 t}}{1}=\\lambda t\\,e^{-\\lambda t}.$$ ไอโซโทปลูกเพิ่มขึ้นแบบเชิงเส้นในตอนแรก (ตัวประกอบ $t$) แล้วจึงสลายตัวลง (ตัวประกอบ $e^{-\\lambda t}$)"}, {"en": "**Find the maximum (default case $\\lambda_1=0.1$, $\\lambda_2=0.15$).** Set $\\dfrac{dN_2}{dt}=0$: $\\lambda_1e^{-\\lambda_1t}=\\lambda_2e^{-\\lambda_2t}$, so $t_{\\max}=\\dfrac{\\ln(\\lambda_2/\\lambda_1)}{\\lambda_2-\\lambda_1}=\\dfrac{\\ln1.5}{0.05}\\approx8.11$, and $N_2/N_0=\\dfrac{0.1}{0.05}\\left(e^{-0.811}-e^{-1.216}\\right)\\approx0.2963$.", "th": "**หาค่าสูงสุด (กรณีค่าเริ่มต้น $\\lambda_1=0.1$, $\\lambda_2=0.15$)** ตั้ง $\\dfrac{dN_2}{dt}=0$: $\\lambda_1e^{-\\lambda_1t}=\\lambda_2e^{-\\lambda_2t}$ จึงได้ $t_{\\max}=\\dfrac{\\ln(\\lambda_2/\\lambda_1)}{\\lambda_2-\\lambda_1}=\\dfrac{\\ln1.5}{0.05}\\approx8.11$ และ $N_2/N_0=\\dfrac{0.1}{0.05}\\left(e^{-0.811}-e^{-1.216}\\right)\\approx0.2963$"}, {"en": "**Equal-constant case.** For $N_2/N_0=\\lambda te^{-\\lambda t}$ the product rule gives $\\dfrac{d}{dt}=\\lambda e^{-\\lambda t}(1-\\lambda t)=0$, so $t_{\\max}=1/\\lambda=10$ and the peak value is $e^{-1}\\approx0.3679$. (Notice $t_{\\max}=\\ln(\\lambda_2/\\lambda_1)/(\\lambda_2-\\lambda_1)$ is itself $\\tfrac00$ at equal constants; L'Hôpital again gives $1/\\lambda$.)", "th": "**กรณีค่าคงที่เท่ากัน** สำหรับ $N_2/N_0=\\lambda te^{-\\lambda t}$ กฎผลคูณให้ $\\dfrac{d}{dt}=\\lambda e^{-\\lambda t}(1-\\lambda t)=0$ จึงได้ $t_{\\max}=1/\\lambda=10$ และค่าสูงสุดคือ $e^{-1}\\approx0.3679$ (สังเกตว่า $t_{\\max}=\\ln(\\lambda_2/\\lambda_1)/(\\lambda_2-\\lambda_1)$ เองก็เป็นรูป $\\tfrac00$ เมื่อค่าคงที่เท่ากัน ใช้โลปีตาลอีกครั้งก็ได้ $1/\\lambda$)"}, {"en": "**Why a computer needs this.** With $\\lambda=0.1$, $t=10$ and $\\lambda_2-\\lambda_1=10^{-13}$, the original formula gives $0.36793$ instead of the true $0.36788$: subtracting two almost-equal exponentials loses digits (catastrophic cancellation). The L'Hôpital form has no subtraction and stays accurate.", "th": "**เหตุที่คอมพิวเตอร์ต้องใช้สูตรนี้** เมื่อ $\\lambda=0.1$, $t=10$ และ $\\lambda_2-\\lambda_1=10^{-13}$ สูตรเดิมให้ $0.36793$ แทนค่าจริง $0.36788$ เพราะการลบเลขชี้กำลังสองค่าที่เกือบเท่ากันทำให้เลขนัยสำคัญหายไป (catastrophic cancellation) สูตรจากโลปีตาลไม่มีการลบลักษณะนี้จึงแม่นยำ"}], "meaning": {"en": "Even when parent and daughter decay at the same rate, the amount of daughter is finite: it rises, peaks at $t=1/\\lambda$ (one mean life) at $N_0/e\\approx37\\%$ of the original parent, and then falls. Geochronologists working with uranium-series chains meet near-equal constants, and the limit formula is the one to trust there. Sanity check: as $\\lambda_2$ slides onto $\\lambda_1$ in the app, the curve moves smoothly onto the dashed limit instead of blowing up.", "th": "แม้ไอโซโทปแม่และลูกสลายตัวด้วยอัตราเท่ากัน ปริมาณไอโซโทปลูกยังมีค่าจำกัด โดยเพิ่มขึ้นจนสูงสุดที่ $t=1/\\lambda$ (หนึ่งช่วงชีวิตเฉลี่ย) ที่ $N_0/e\\approx37\\%$ ของไอโซโทปแม่ตั้งต้น แล้วจึงลดลง นักธรณีกาลวิทยาที่ศึกษาอนุกรมยูเรเนียมพบค่าคงที่ที่ใกล้กันมาก และสูตรลิมิตคือสูตรที่เชื่อถือได้ ตรวจสอบ: เมื่อเลื่อน $\\lambda_2$ เข้าหา $\\lambda_1$ ในแอป กราฟจะเคลื่อนเข้าหาเส้นประของลิมิตอย่างราบเรียบ ไม่พุ่งขึ้นเป็นอนันต์"}, "pitfalls": [{"en": "Differentiating with respect to $t$ instead of $\\lambda_2$. The limit is in $\\lambda_2$, so L'Hôpital must differentiate in $\\lambda_2$.", "th": "หาอนุพันธ์เทียบกับ $t$ แทน $\\lambda_2$ ลิมิตนี้เป็นลิมิตใน $\\lambda_2$ จึงต้องหาอนุพันธ์เทียบกับ $\\lambda_2$"}, {"en": "Using the quotient rule on $\\dfrac{f}{g}$: L'Hôpital differentiates numerator and denominator **separately**, $\\dfrac{f'}{g'}$.", "th": "ใช้กฎผลหารกับ $\\dfrac{f}{g}$ ซึ่งผิด หลักเกณฑ์โลปีตาลหาอนุพันธ์ของเศษและส่วน **แยกกัน** คือ $\\dfrac{f'}{g'}$"}, {"en": "Applying L'Hôpital without first checking that the form really is $\\tfrac00$ or $\\tfrac{\\infty}{\\infty}$.", "th": "ใช้โลปีตาลโดยไม่ตรวจก่อนว่าเป็นรูป $\\tfrac00$ หรือ $\\tfrac{\\infty}{\\infty}$ จริง"}]}, "15": {"id": 15, "idea": {"en": "A digital elevation model (DEM) is a function of two variables, $z(x,y)$. Its **partial derivatives** $\\partial z/\\partial x$ and $\\partial z/\\partial y$ are the rates of climb going east and going north; together they form the **gradient** $\\nabla z$, which points straight uphill. Its length gives the slope, and $-\\nabla z$ is the direction water flows.", "th": "แบบจำลองความสูงเชิงเลข (DEM) คือฟังก์ชันสองตัวแปร $z(x,y)$ **อนุพันธ์ย่อย (partial derivatives)** $\\partial z/\\partial x$ และ $\\partial z/\\partial y$ คืออัตราการไต่ขึ้นเมื่อเดินไปทางตะวันออกและทางเหนือ เมื่อรวมกันเป็น **เกรเดียนต์ (gradient)** $\\nabla z$ ซึ่งชี้ขึ้นเนินโดยตรง ความยาวของเกรเดียนต์ให้ความลาดชัน และ $-\\nabla z$ คือทิศทางที่น้ำไหล"}, "steps": [{"en": "**Name the pieces.** Write $z=g_1+g_2+40x$ with $g_1=600e^{-[(x-1)^2+(y-0.5)^2]/1.5}$ (main hill) and $g_2=350e^{-[(x+1.5)^2+(y+1)^2]/0.8}$ (small hill). At the probe $(0,-0.5)$: $g_1=600e^{-4/3}=158.16$ m and $g_2=350e^{-3.125}=15.38$ m, so $z=158.16+15.38+0=173.5$ m.", "th": "**ตั้งชื่อส่วนประกอบ** เขียน $z=g_1+g_2+40x$ โดย $g_1=600e^{-[(x-1)^2+(y-0.5)^2]/1.5}$ (เนินหลัก) และ $g_2=350e^{-[(x+1.5)^2+(y+1)^2]/0.8}$ (เนินเล็ก) ที่จุดวัด $(0,-0.5)$: $g_1=600e^{-4/3}=158.16$ m และ $g_2=350e^{-3.125}=15.38$ m ดังนั้น $z=158.16+15.38+0=173.5$ m"}, {"en": "**Partial derivative in $x$** (treat $y$ as a constant). By the chain rule $\\dfrac{\\partial}{\\partial x}e^{-u}=-e^{-u}\\dfrac{\\partial u}{\\partial x}$, so $$\\frac{\\partial z}{\\partial x}=g_1\\cdot\\frac{-2(x-1)}{1.5}+g_2\\cdot\\frac{-2(x+1.5)}{0.8}+40.$$ At the probe: $158.16(1.333)+15.38(-3.75)+40=210.88-57.67+40=193.2$ m/km.", "th": "**อนุพันธ์ย่อยเทียบกับ $x$** (ถือ $y$ เป็นค่าคงที่) จากหลักเกณฑ์ลูกโซ่ $\\dfrac{\\partial}{\\partial x}e^{-u}=-e^{-u}\\dfrac{\\partial u}{\\partial x}$ จึงได้ $$\\frac{\\partial z}{\\partial x}=g_1\\cdot\\frac{-2(x-1)}{1.5}+g_2\\cdot\\frac{-2(x+1.5)}{0.8}+40.$$ ที่จุดวัด: $158.16(1.333)+15.38(-3.75)+40=210.88-57.67+40=193.2$ m/km"}, {"en": "**Partial derivative in $y$** (treat $x$ as a constant; the tilt $40x$ has no $y$, so it disappears): $$\\frac{\\partial z}{\\partial y}=g_1\\cdot\\frac{-2(y-0.5)}{1.5}+g_2\\cdot\\frac{-2(y+1)}{0.8}=210.88-19.22=191.7\\ \\text{m/km}.$$", "th": "**อนุพันธ์ย่อยเทียบกับ $y$** (ถือ $x$ เป็นค่าคงที่ พจน์ความเอียง $40x$ ไม่มี $y$ จึงหายไป): $$\\frac{\\partial z}{\\partial y}=g_1\\cdot\\frac{-2(y-0.5)}{1.5}+g_2\\cdot\\frac{-2(y+1)}{0.8}=210.88-19.22=191.7\\ \\text{m/km}.$$"}, {"en": "**Slope angle.** $\\lVert\\nabla z\\rVert=\\sqrt{193.2^2+191.7^2}=272.1$ m/km $=0.2721$ m/m (divide by 1000 so both lengths are in metres). Then $\\theta=\\arctan(0.2721)\\approx15.2^\\circ$.", "th": "**มุมความลาดชัน** $\\lVert\\nabla z\\rVert=\\sqrt{193.2^2+191.7^2}=272.1$ m/km $=0.2721$ m/m (หารด้วย 1000 เพื่อให้ความยาวทั้งสองเป็นเมตร) จากนั้น $\\theta=\\arctan(0.2721)\\approx15.2^\\circ$"}, {"en": "**Flow direction.** Water moves along $-\\nabla z=(-193.2,-191.7)$: west and south in almost equal amounts. As a compass bearing (0° = north, 90° = east) that is about $225^\\circ$, i.e. toward the south-west.", "th": "**ทิศทางการไหล** น้ำเคลื่อนตาม $-\\nabla z=(-193.2,-191.7)$ คือไปทางตะวันตกและทางใต้ในปริมาณเกือบเท่ากัน เมื่อเขียนเป็นมุมทิศ (0° = เหนือ, 90° = ตะวันออก) ได้ประมาณ $225^\\circ$ คือไปทางตะวันตกเฉียงใต้"}], "meaning": {"en": "The probe sits on the south-west flank of the main hill, on a moderate 15° slope, and rain there drains to the south-west, perpendicular to the contours. GIS software computes exactly these two partial derivatives at every DEM cell (by finite differences) to make slope maps, flow-direction grids, watershed boundaries and landslide-hazard maps. Sanity check: on a hilltop both partials are zero, so the slope is 0° and water has no preferred direction.", "th": "จุดวัดอยู่บนไหล่ด้านตะวันตกเฉียงใต้ของเนินหลัก มีความลาดชันปานกลาง 15° และน้ำฝนที่ตกตรงนั้นจะไหลไปทางตะวันตกเฉียงใต้ ตั้งฉากกับเส้นชั้นความสูง ซอฟต์แวร์ GIS คำนวณอนุพันธ์ย่อยสองค่านี้ทุกช่องกริดของ DEM (ด้วยผลต่างจำกัด) เพื่อทำแผนที่ความลาดชัน ทิศทางการไหล ขอบเขตลุ่มน้ำ และแผนที่ความเสี่ยงดินถล่ม ตรวจสอบ: บนยอดเนินอนุพันธ์ย่อยทั้งสองเป็นศูนย์ ความลาดชันจึงเป็น 0° และน้ำไม่มีทิศทางที่ชัดเจน"}, "pitfalls": [{"en": "Mixing units: the gradient is in m/km, so it must be divided by 1000 before taking $\\arctan$; otherwise you get almost $90^\\circ$.", "th": "ใช้หน่วยปนกัน เกรเดียนต์มีหน่วย m/km จึงต้องหารด้วย 1000 ก่อนหา $\\arctan$ มิฉะนั้นจะได้มุมเกือบ $90^\\circ$"}, {"en": "Forgetting that water flows along $-\\nabla z$ (downhill), not $+\\nabla z$ (uphill).", "th": "ลืมว่าน้ำไหลตาม $-\\nabla z$ (ลงเนิน) ไม่ใช่ $+\\nabla z$ (ขึ้นเนิน)"}, {"en": "Dropping the constant $40$ from $\\partial z/\\partial x$, or keeping it in $\\partial z/\\partial y$ where it does not belong.", "th": "ตกหล่นค่าคงที่ $40$ ใน $\\partial z/\\partial x$ หรือใส่ไว้ใน $\\partial z/\\partial y$ ซึ่งไม่ควรมี"}]}, "16": {"id": 16, "idea": {"en": "When a result depends on several measured quantities, the **total differential** $dQ=\\sum\\dfrac{\\partial Q}{\\partial x_i}dx_i$ estimates how small errors in each input combine into the error of the output. For a product/quotient like Darcy's law this simplifies to **adding relative errors**, which instantly shows which measurement matters most. The same chain-rule idea, applied along a moving path, gives the **total derivative** of temperature felt by an uplifting rock.", "th": "เมื่อผลลัพธ์ขึ้นกับปริมาณที่วัดได้หลายค่า **ผลต่างเชิงอนุพันธ์รวม (total differential)** $dQ=\\sum\\dfrac{\\partial Q}{\\partial x_i}dx_i$ ใช้ประมาณว่าความคลาดเคลื่อนเล็ก ๆ ของแต่ละตัวแปรรวมกันเป็นความคลาดเคลื่อนของผลลัพธ์อย่างไร สำหรับผลคูณ/ผลหารแบบกฎของดาร์ซี สูตรนี้ลดรูปเป็น **การบวกความคลาดเคลื่อนสัมพัทธ์** ซึ่งชี้ได้ทันทีว่าการวัดใดสำคัญที่สุด แนวคิดหลักเกณฑ์ลูกโซ่เดียวกันเมื่อใช้ตามเส้นทางที่เคลื่อนที่ จะได้ **อนุพันธ์รวม (total derivative)** ของอุณหภูมิที่หินซึ่งถูกยกตัวขึ้นได้รับ"}, "steps": [{"en": "**Compute $Q$.** With $K=2\\times10^{-4}$ m/s, $A=0.05$ m², $\\Delta h=0.40$ m, $L=1.20$ m: $$Q=\\frac{KA\\,\\Delta h}{L}=\\frac{(2\\times10^{-4})(0.05)(0.40)}{1.20}=3.333\\times10^{-6}\\ \\text{m}^3/\\text{s}.$$", "th": "**คำนวณ $Q$** เมื่อ $K=2\\times10^{-4}$ m/s, $A=0.05$ m², $\\Delta h=0.40$ m, $L=1.20$ m: $$Q=\\frac{KA\\,\\Delta h}{L}=\\frac{(2\\times10^{-4})(0.05)(0.40)}{1.20}=3.333\\times10^{-6}\\ \\text{m}^3/\\text{s}.$$"}, {"en": "**Partial derivatives.** $\\dfrac{\\partial Q}{\\partial K}=\\dfrac{A\\Delta h}{L}=\\dfrac{Q}{K}$, $\\dfrac{\\partial Q}{\\partial A}=\\dfrac{Q}{A}$, $\\dfrac{\\partial Q}{\\partial \\Delta h}=\\dfrac{Q}{\\Delta h}$, and $\\dfrac{\\partial Q}{\\partial L}=-\\dfrac{KA\\Delta h}{L^2}=-\\dfrac{Q}{L}$. Each one is found by treating the other three variables as constants.", "th": "**อนุพันธ์ย่อย** $\\dfrac{\\partial Q}{\\partial K}=\\dfrac{A\\Delta h}{L}=\\dfrac{Q}{K}$, $\\dfrac{\\partial Q}{\\partial A}=\\dfrac{Q}{A}$, $\\dfrac{\\partial Q}{\\partial \\Delta h}=\\dfrac{Q}{\\Delta h}$ และ $\\dfrac{\\partial Q}{\\partial L}=-\\dfrac{KA\\Delta h}{L^2}=-\\dfrac{Q}{L}$ แต่ละค่าหาได้โดยถือตัวแปรอีกสามตัวเป็นค่าคงที่"}, {"en": "**Divide by $Q$ to get relative errors.** $$\\frac{dQ}{Q}=\\frac{dK}{K}+\\frac{dA}{A}+\\frac{d\\Delta h}{\\Delta h}-\\frac{dL}{L}.$$ With $dK=2\\times10^{-5}$, $dA=0.001$, $d\\Delta h=0.01$, $dL=0.01$, the four terms are $10\\%$, $2\\%$, $2.5\\%$ and $0.8\\%$ of $Q$.", "th": "**หารด้วย $Q$ เพื่อให้ได้ความคลาดเคลื่อนสัมพัทธ์** $$\\frac{dQ}{Q}=\\frac{dK}{K}+\\frac{dA}{A}+\\frac{d\\Delta h}{\\Delta h}-\\frac{dL}{L}.$$ เมื่อ $dK=2\\times10^{-5}$, $dA=0.001$, $d\\Delta h=0.01$, $dL=0.01$ สี่พจน์มีค่า $10\\%$, $2\\%$, $2.5\\%$ และ $0.8\\%$ ของ $Q$"}, {"en": "**Worst case and typical case.** In the worst case the errors all push the same way, so we add absolute values: $10+2+2.5+0.8=15.3\\%$, i.e. $|dQ|\\approx5.11\\times10^{-7}$ m³/s. If the errors are independent and random, they partly cancel; the usual estimate is $\\sqrt{10^2+2^2+2.5^2+0.8^2}\\approx10.53\\%$.", "th": "**กรณีเลวร้ายที่สุดและกรณีทั่วไป** ในกรณีเลวร้ายที่สุด ความคลาดเคลื่อนทั้งหมดไปทางเดียวกัน จึงบวกค่าสัมบูรณ์: $10+2+2.5+0.8=15.3\\%$ คือ $|dQ|\\approx5.11\\times10^{-7}$ m³/s ถ้าความคลาดเคลื่อนเป็นอิสระและสุ่ม จะหักล้างกันบางส่วน ค่าประมาณที่นิยมคือ $\\sqrt{10^2+2^2+2.5^2+0.8^2}\\approx10.53\\%$"}, {"en": "**Total derivative along a path.** A rock rises as $z=10-0.15t$ (km, Myr) through a cooling geotherm $T=10+30ze^{-t/50}$. By the chain rule $$\\frac{dT}{dt}=\\frac{\\partial T}{\\partial z}\\frac{dz}{dt}+\\frac{\\partial T}{\\partial t}=30e^{-t/50}(-0.15)-\\frac{30z}{50}e^{-t/50}.$$ At $t=0$, $z=10$: $-4.5-6.0=-10.5$ °C/Myr.", "th": "**อนุพันธ์รวมตามเส้นทาง** หินถูกยกตัวขึ้นตาม $z=10-0.15t$ (km, ล้านปี) ผ่านเส้นอุณหภูมิตามความลึกที่กำลังเย็นตัว $T=10+30ze^{-t/50}$ จากหลักเกณฑ์ลูกโซ่ $$\\frac{dT}{dt}=\\frac{\\partial T}{\\partial z}\\frac{dz}{dt}+\\frac{\\partial T}{\\partial t}=30e^{-t/50}(-0.15)-\\frac{30z}{50}e^{-t/50}.$$ ที่ $t=0$, $z=10$: $-4.5-6.0=-10.5$ °C ต่อล้านปี"}], "meaning": {"en": "The 10% error in hydraulic conductivity $K$ is by itself bigger than all other errors combined, so the best way to improve the discharge estimate is a better pumping or permeameter test for $K$, not a better ruler. In the cooling problem, the rock cools at 10.5 °C/Myr at first: 4.5 from moving up the geotherm and 6.0 from the geotherm itself cooling. Thermochronologists use this split to turn mineral cooling ages into uplift rates.", "th": "ความคลาดเคลื่อน 10% ของสัมประสิทธิ์การซึมผ่านได้ $K$ เพียงค่าเดียวมากกว่าความคลาดเคลื่อนอื่นรวมกันทั้งหมด วิธีที่ดีที่สุดในการปรับปรุงค่าประมาณอัตราการไหลจึงเป็นการทดสอบหาค่า $K$ ให้ดีขึ้น (เช่นการทดสอบสูบน้ำ) ไม่ใช่การใช้ไม้บรรทัดที่ดีขึ้น ในปัญหาการเย็นตัว หินเย็นลงด้วยอัตรา 10.5 °C ต่อล้านปีในตอนแรก โดย 4.5 มาจากการเคลื่อนขึ้นตามเส้นอุณหภูมิ และ 6.0 มาจากการที่เส้นอุณหภูมิเองเย็นลง นักเทอร์โมโครโนโลยีใช้การแยกส่วนนี้แปลงอายุการเย็นตัวของแร่เป็นอัตราการยกตัว"}, "pitfalls": [{"en": "Letting the negative term $-dL/L$ cancel positive terms in a worst-case estimate; use absolute values.", "th": "ปล่อยให้พจน์ลบ $-dL/L$ หักล้างพจน์บวกในการประมาณกรณีเลวร้ายที่สุด ต้องใช้ค่าสัมบูรณ์"}, {"en": "Adding absolute errors with different units (m/s, m², m) instead of relative errors (%).", "th": "บวกความคลาดเคลื่อนสัมบูรณ์ที่มีหน่วยต่างกัน (m/s, m², m) แทนที่จะบวกความคลาดเคลื่อนสัมพัทธ์ (%)"}, {"en": "In the total derivative, keeping only $\\partial T/\\partial t$ and forgetting that the rock's depth also changes with time.", "th": "ในอนุพันธ์รวม คิดแค่ $\\partial T/\\partial t$ แล้วลืมว่าความลึกของหินก็เปลี่ยนตามเวลาด้วย"}]}, "17": {"id": 17, "idea": {"en": "Heat production in granite decays exponentially with depth, and the heat flowing out at the surface is the **integral** of all the heat produced below. A simple **substitution** $u=-z/h_r$ turns the exponential integral into $\\int e^u\\,du$. Integrating a second time, using Fourier's law, gives the temperature at every depth.", "th": "การผลิตความร้อนในหินแกรนิตลดลงแบบเลขชี้กำลังตามความลึก และความร้อนที่ไหลออกที่ผิวโลกคือ **ปริพันธ์** ของความร้อนทั้งหมดที่ผลิตอยู่ข้างใต้ **การเปลี่ยนตัวแปร (substitution)** อย่างง่าย $u=-z/h_r$ เปลี่ยนปริพันธ์ของฟังก์ชันเลขชี้กำลังให้เป็น $\\int e^u\\,du$ การหาปริพันธ์ครั้งที่สองโดยใช้กฎของฟูรีเย (Fourier's law) ให้อุณหภูมิที่ทุกความลึก"}, "steps": [{"en": "**Substitute.** Let $u=-z/h_r$, so $du=-dz/h_r$ and $dz=-h_r\\,du$. Then $$\\int A_0e^{-z/h_r}dz=-A_0h_r\\int e^u\\,du=-A_0h_re^{-z/h_r}+C.$$ Check: differentiating $-A_0h_re^{-z/h_r}$ gives back $A_0e^{-z/h_r}$.", "th": "**เปลี่ยนตัวแปร** ให้ $u=-z/h_r$ ดังนั้น $du=-dz/h_r$ และ $dz=-h_r\\,du$ จะได้ $$\\int A_0e^{-z/h_r}dz=-A_0h_r\\int e^u\\,du=-A_0h_re^{-z/h_r}+C.$$ ตรวจสอบ: หาอนุพันธ์ของ $-A_0h_re^{-z/h_r}$ จะได้ $A_0e^{-z/h_r}$ กลับคืนมา"}, {"en": "**Total crustal contribution (improper integral).** $$\\int_0^\\infty A_0e^{-z/h_r}dz=\\lim_{b\\to\\infty}\\left[-A_0h_re^{-z/h_r}\\right]_0^b=0-(-A_0h_r)=A_0h_r.$$ With $A_0=2.5\\times10^{-6}$ W/m³ and $h_r=10^4$ m: $A_0h_r=0.025$ W/m² $=25$ mW/m².", "th": "**ส่วนที่มาจากเปลือกโลกทั้งหมด (ปริพันธ์ไม่ตรงแบบ)** $$\\int_0^\\infty A_0e^{-z/h_r}dz=\\lim_{b\\to\\infty}\\left[-A_0h_re^{-z/h_r}\\right]_0^b=0-(-A_0h_r)=A_0h_r.$$ เมื่อ $A_0=2.5\\times10^{-6}$ W/m³ และ $h_r=10^4$ m: $A_0h_r=0.025$ W/m² $=25$ mW/m²"}, {"en": "**Surface heat flow.** Add the heat coming up from the mantle: $q_s=q_m+A_0h_r=30+25=55$ mW/m². At depth $z$ only the heat produced below $z$ is still flowing, so $q(z)=q_m+A_0h_re^{-z/h_r}$.", "th": "**ฟลักซ์ความร้อนที่ผิว** บวกความร้อนที่มาจากเนื้อโลก: $q_s=q_m+A_0h_r=30+25=55$ mW/m² ที่ความลึก $z$ มีเพียงความร้อนที่ผลิตใต้ $z$ ลงไปที่ยังไหลอยู่ ดังนั้น $q(z)=q_m+A_0h_re^{-z/h_r}$"}, {"en": "**Second integration (Fourier's law $kT'(z)=q(z)$).** $$T(z)=T_s+\\frac1k\\int_0^z q(\\zeta)\\,d\\zeta=T_s+\\frac{q_mz}{k}+\\frac{A_0h_r^2}{k}\\left(1-e^{-z/h_r}\\right),$$ using the same substitution for the exponential term.", "th": "**หาปริพันธ์ครั้งที่สอง (กฎของฟูรีเย $kT'(z)=q(z)$)** $$T(z)=T_s+\\frac1k\\int_0^z q(\\zeta)\\,d\\zeta=T_s+\\frac{q_mz}{k}+\\frac{A_0h_r^2}{k}\\left(1-e^{-z/h_r}\\right),$$ โดยใช้การเปลี่ยนตัวแปรแบบเดิมกับพจน์เลขชี้กำลัง"}, {"en": "**Numbers at 30 km** ($T_s=15$ °C, $k=2.5$ W/m/K, $z=3\\times10^4$ m): $\\dfrac{q_mz}{k}=\\dfrac{0.03\\times30000}{2.5}=360$ °C and $\\dfrac{A_0h_r^2}{k}(1-e^{-3})=100\\times0.950=95.0$ °C, so $T=15+360+95=470$ °C. At 10 km the same formula gives about 198 °C.", "th": "**ค่าที่ความลึก 30 km** ($T_s=15$ °C, $k=2.5$ W/m/K, $z=3\\times10^4$ m): $\\dfrac{q_mz}{k}=\\dfrac{0.03\\times30000}{2.5}=360$ °C และ $\\dfrac{A_0h_r^2}{k}(1-e^{-3})=100\\times0.950=95.0$ °C ดังนั้น $T=15+360+95=470$ °C ที่ความลึก 10 km สูตรเดียวกันให้ประมาณ 198 °C"}], "meaning": {"en": "Radioactivity in the upper crust supplies 25 of the 55 mW/m² reaching the surface, almost doubling the heat flow and making the crust about 95 °C hotter at 30 km than mantle heat alone would (375 °C). This is why granite belts such as northern Thailand's have hot springs (Fang, San Kamphaeng) and geothermal potential. Sanity check: continental heat flows of 50–70 mW/m² are typical, so 55 mW/m² is realistic.", "th": "กัมมันตภาพรังสีในเปลือกโลกตอนบนให้ความร้อน 25 จาก 55 mW/m² ที่มาถึงผิวโลก ทำให้ฟลักซ์ความร้อนเพิ่มเกือบเท่าตัว และทำให้เปลือกโลกที่ความลึก 30 km ร้อนกว่ากรณีมีแค่ความร้อนจากเนื้อโลก (375 °C) ประมาณ 95 °C นี่คือเหตุที่แนวหินแกรนิต เช่น ในภาคเหนือของไทย มีบ่อน้ำพุร้อน (ฝาง สันกำแพง) และมีศักยภาพพลังงานความร้อนใต้พิภพ ตรวจสอบ: ฟลักซ์ความร้อนของทวีปโดยทั่วไปอยู่ที่ 50–70 mW/m² ค่า 55 mW/m² จึงสมจริง"}, "pitfalls": [{"en": "Forgetting the factor $-h_r$ from $dz=-h_r\\,du$, which gives $A_0$ instead of $A_0h_r$.", "th": "ลืมตัวประกอบ $-h_r$ จาก $dz=-h_r\\,du$ ทำให้ได้ $A_0$ แทน $A_0h_r$"}, {"en": "Mixing units: $h_r$ must be in metres (not km) when $A_0$ is in W/m³, otherwise the heat flow is wrong by a factor of 1000.", "th": "ใช้หน่วยปนกัน $h_r$ ต้องเป็นเมตร (ไม่ใช่ km) เมื่อ $A_0$ มีหน่วย W/m³ มิฉะนั้นฟลักซ์ความร้อนจะผิดไป 1000 เท่า"}, {"en": "Writing $\\lim_{b\\to\\infty}e^{-b/h_r}=1$; it is $0$, since the exponent goes to $-\\infty$.", "th": "เขียนว่า $\\lim_{b\\to\\infty}e^{-b/h_r}=1$ ซึ่งผิด ค่าที่ถูกคือ $0$ เพราะเลขชี้กำลังเข้าใกล้ $-\\infty$"}]}, "18": {"id": 18, "idea": {"en": "The logistic equation $dQ/dt=rQ(1-Q/Q_\\infty)$ says production grows with what has been found but slows as the resource runs out. To solve it we **separate variables**, and the resulting integral $\\int\\frac{dQ}{Q(1-Q/Q_\\infty)}$ can only be done after **partial fractions** split it into two simple logarithms.", "th": "สมการลอจิสติก $dQ/dt=rQ(1-Q/Q_\\infty)$ บอกว่าการผลิตเพิ่มขึ้นตามปริมาณที่ค้นพบ แต่จะช้าลงเมื่อทรัพยากรใกล้หมด ในการแก้สมการเราต้อง **แยกตัวแปร** และปริพันธ์ที่ได้ $\\int\\frac{dQ}{Q(1-Q/Q_\\infty)}$ จะหาได้ก็ต่อเมื่อใช้ **การแยกเศษส่วนย่อย (partial fractions)** แยกออกเป็นลอการิทึมอย่างง่ายสองพจน์"}, "steps": [{"en": "**Separate the variables.** Move all $Q$ to the left and $t$ to the right: $$\\int\\frac{dQ}{Q(1-Q/Q_\\infty)}=\\int r\\,dt.$$", "th": "**แยกตัวแปร** ย้าย $Q$ ทั้งหมดไปทางซ้าย และ $t$ ไปทางขวา: $$\\int\\frac{dQ}{Q(1-Q/Q_\\infty)}=\\int r\\,dt.$$"}, {"en": "**Partial fractions.** Rewrite $\\dfrac{1}{Q(1-Q/Q_\\infty)}=\\dfrac{Q_\\infty}{Q(Q_\\infty-Q)}=\\dfrac{A}{Q}+\\dfrac{B}{Q_\\infty-Q}$. Multiply out: $Q_\\infty=A(Q_\\infty-Q)+BQ$. Put $Q=0$: $A=1$. Put $Q=Q_\\infty$: $B=1$. So the integrand is $\\dfrac1Q+\\dfrac{1}{Q_\\infty-Q}$.", "th": "**แยกเศษส่วนย่อย** เขียนใหม่เป็น $\\dfrac{1}{Q(1-Q/Q_\\infty)}=\\dfrac{Q_\\infty}{Q(Q_\\infty-Q)}=\\dfrac{A}{Q}+\\dfrac{B}{Q_\\infty-Q}$ คูณตลอดได้ $Q_\\infty=A(Q_\\infty-Q)+BQ$ แทน $Q=0$: $A=1$ แทน $Q=Q_\\infty$: $B=1$ ดังนั้นตัวถูกหาปริพันธ์คือ $\\dfrac1Q+\\dfrac{1}{Q_\\infty-Q}$"}, {"en": "**Integrate and solve for $Q$.** $\\ln Q-\\ln(Q_\\infty-Q)=rt+C$, i.e. $\\ln\\dfrac{Q}{Q_\\infty-Q}=rt+C$. Exponentiate and rearrange: $$Q(t)=\\frac{Q_\\infty}{1+e^{-(rt+C)}}.$$", "th": "**หาปริพันธ์แล้วแก้หา $Q$** $\\ln Q-\\ln(Q_\\infty-Q)=rt+C$ คือ $\\ln\\dfrac{Q}{Q_\\infty-Q}=rt+C$ ยกกำลัง $e$ ทั้งสองข้างแล้วจัดรูป: $$Q(t)=\\frac{Q_\\infty}{1+e^{-(rt+C)}}.$$"}, {"en": "**Use the starting value.** Measure $t$ in years after 1900, when $Q=0.5$ Gbbl, with $Q_\\infty=230$ Gbbl and $r=0.065$/yr: $C=\\ln\\dfrac{0.5}{229.5}=-6.129$.", "th": "**ใช้ค่าเริ่มต้น** วัด $t$ เป็นจำนวนปีหลัง ค.ศ. 1900 ซึ่งมี $Q=0.5$ Gbbl โดย $Q_\\infty=230$ Gbbl และ $r=0.065$ ต่อปี: $C=\\ln\\dfrac{0.5}{229.5}=-6.129$"}, {"en": "**Find the peak.** Production $P(Q)=rQ(1-Q/Q_\\infty)$ is a downward parabola in $Q$; $P'(Q)=r(1-2Q/Q_\\infty)=0$ gives $Q=Q_\\infty/2$, where $P=rQ_\\infty/4=0.065\\times230/4=3.74$ Gbbl/yr. $Q=Q_\\infty/2$ happens when $rt+C=0$: $t=6.129/0.065=94.3$, i.e. about **1994**.", "th": "**หาจุดสูงสุด** อัตราการผลิต $P(Q)=rQ(1-Q/Q_\\infty)$ เป็นพาราโบลาคว่ำในตัวแปร $Q$ จาก $P'(Q)=r(1-2Q/Q_\\infty)=0$ ได้ $Q=Q_\\infty/2$ ซึ่ง $P=rQ_\\infty/4=0.065\\times230/4=3.74$ Gbbl ต่อปี และ $Q=Q_\\infty/2$ เกิดเมื่อ $rt+C=0$: $t=6.129/0.065=94.3$ คือประมาณ **ค.ศ. 1994**"}, {"en": "**Read off the future.** In 2025 ($t=125$): $Q=230/(1+e^{-(8.125-6.129)})\\approx202$ Gbbl produced, so only about 28 Gbbl remain.", "th": "**อ่านค่าในอนาคต** ใน ค.ศ. 2025 ($t=125$): $Q=230/(1+e^{-(8.125-6.129)})\\approx202$ Gbbl ถูกผลิตไปแล้ว จึงเหลือเพียงประมาณ 28 Gbbl"}], "meaning": {"en": "Cumulative production follows an S-curve and the annual production (its derivative) is the bell-shaped **Hubbert curve**, which peaks when exactly half of the resource has been extracted. Hubbert used this in 1956 to predict the 1970 US oil peak, and the same model is applied to mineral deposits and groundwater mining. Sanity check: the peak rate $rQ_\\infty/4$ grows with both the resource size and the growth rate, as it should.", "th": "ผลผลิตสะสมมีรูปเส้นโค้ง S และอัตราการผลิตต่อปี (อนุพันธ์ของมัน) เป็น **เส้นโค้งฮับเบิร์ต (Hubbert curve)** รูประฆังคว่ำ ซึ่งสูงสุดเมื่อผลิตทรัพยากรไปแล้วครึ่งหนึ่งพอดี ฮับเบิร์ตใช้แบบจำลองนี้ในปี 1956 ทำนายจุดสูงสุดการผลิตน้ำมันของสหรัฐฯ ในปี 1970 และแบบจำลองเดียวกันใช้กับแหล่งแร่และการสูบน้ำบาดาลเกินสมดุล ตรวจสอบ: อัตราสูงสุด $rQ_\\infty/4$ เพิ่มขึ้นตามทั้งขนาดทรัพยากรและอัตราการเติบโต ซึ่งสมเหตุสมผล"}, "pitfalls": [{"en": "Integrating $\\dfrac{1}{Q_\\infty-Q}$ as $+\\ln(Q_\\infty-Q)$; because of the minus sign in front of $Q$, it is $-\\ln(Q_\\infty-Q)$.", "th": "หาปริพันธ์ของ $\\dfrac{1}{Q_\\infty-Q}$ ได้ $+\\ln(Q_\\infty-Q)$ ซึ่งผิด เนื่องจากมีเครื่องหมายลบหน้า $Q$ คำตอบที่ถูกคือ $-\\ln(Q_\\infty-Q)$"}, {"en": "Forgetting the constant $C$, so the curve cannot be matched to the 1900 starting value.", "th": "ลืมค่าคงที่ $C$ ทำให้ไม่สามารถปรับเส้นโค้งให้ตรงกับค่าเริ่มต้นใน ค.ศ. 1900"}, {"en": "Confusing cumulative production $Q$ (Gbbl) with the production rate $dQ/dt$ (Gbbl/yr).", "th": "สับสนระหว่างผลผลิตสะสม $Q$ (Gbbl) กับอัตราการผลิต $dQ/dt$ (Gbbl ต่อปี)"}]}, "19": {"id": 19, "idea": {"en": "A buried dense sphere pulls gravity up by an amount that depends on $(x^2+z^2)^{-3/2}$. Integrals containing $x^2+z^2$ are solved neatly with the **trigonometric substitution** $x=z\\tan\\theta$, because $1+\\tan^2\\theta=\\sec^2\\theta$ removes the square root. The total area under the anomaly then measures the buried mass, and the anomaly's width measures its depth.", "th": "ทรงกลมหนาแน่นที่ฝังอยู่ใต้ดินทำให้ค่าแรงโน้มถ่วงเพิ่มขึ้นตาม $(x^2+z^2)^{-3/2}$ ปริพันธ์ที่มี $x^2+z^2$ แก้ได้สวยงามด้วย **การแทนค่าด้วยฟังก์ชันตรีโกณมิติ (trigonometric substitution)** $x=z\\tan\\theta$ เพราะ $1+\\tan^2\\theta=\\sec^2\\theta$ ช่วยกำจัดรากที่สอง พื้นที่ใต้กราฟความผิดปกติจึงบอกมวลที่ฝังอยู่ และความกว้างของกราฟบอกความลึก"}, "steps": [{"en": "**Mass and peak.** $\\Delta M=\\tfrac43\\pi R^3\\Delta\\rho=\\tfrac43\\pi(150)^3(1500)=2.12\\times10^{10}$ kg (about 21.2 million tonnes). Directly above it ($x=0$): $\\Delta g=\\dfrac{G\\Delta M}{z^2}=\\dfrac{6.674\\times10^{-11}\\times2.12\\times10^{10}}{400^2}=8.85\\times10^{-6}$ m/s² $=0.885$ mGal (1 mGal $=10^{-5}$ m/s²).", "th": "**มวลและค่าสูงสุด** $\\Delta M=\\tfrac43\\pi R^3\\Delta\\rho=\\tfrac43\\pi(150)^3(1500)=2.12\\times10^{10}$ kg (ประมาณ 21.2 ล้านตัน) ตรงเหนือทรงกลม ($x=0$): $\\Delta g=\\dfrac{G\\Delta M}{z^2}=\\dfrac{6.674\\times10^{-11}\\times2.12\\times10^{10}}{400^2}=8.85\\times10^{-6}$ m/s² $=0.885$ mGal (1 mGal $=10^{-5}$ m/s²)"}, {"en": "**Substitute $x=z\\tan\\theta$.** Then $dx=z\\sec^2\\theta\\,d\\theta$ and $x^2+z^2=z^2\\sec^2\\theta$, so $(x^2+z^2)^{3/2}=z^3\\sec^3\\theta$: $$\\int\\frac{dx}{(x^2+z^2)^{3/2}}=\\int\\frac{z\\sec^2\\theta}{z^3\\sec^3\\theta}d\\theta=\\frac{1}{z^2}\\int\\cos\\theta\\,d\\theta=\\frac{\\sin\\theta}{z^2}+C.$$", "th": "**แทน $x=z\\tan\\theta$** จะได้ $dx=z\\sec^2\\theta\\,d\\theta$ และ $x^2+z^2=z^2\\sec^2\\theta$ ดังนั้น $(x^2+z^2)^{3/2}=z^3\\sec^3\\theta$: $$\\int\\frac{dx}{(x^2+z^2)^{3/2}}=\\int\\frac{z\\sec^2\\theta}{z^3\\sec^3\\theta}d\\theta=\\frac{1}{z^2}\\int\\cos\\theta\\,d\\theta=\\frac{\\sin\\theta}{z^2}+C.$$"}, {"en": "**Return to $x$.** Draw a right triangle with opposite side $x$ and adjacent side $z$; the hypotenuse is $\\sqrt{x^2+z^2}$, so $\\sin\\theta=\\dfrac{x}{\\sqrt{x^2+z^2}}$ and the antiderivative is $\\dfrac{x}{z^2\\sqrt{x^2+z^2}}$.", "th": "**กลับไปเป็นตัวแปร $x$** วาดสามเหลี่ยมมุมฉากที่มีด้านตรงข้ามมุมเป็น $x$ และด้านประชิดเป็น $z$ ด้านตรงข้ามมุมฉากคือ $\\sqrt{x^2+z^2}$ ดังนั้น $\\sin\\theta=\\dfrac{x}{\\sqrt{x^2+z^2}}$ และปฏิยานุพันธ์คือ $\\dfrac{x}{z^2\\sqrt{x^2+z^2}}$"}, {"en": "**Integrate along the whole line.** As $x\\to\\pm\\infty$ the antiderivative tends to $\\pm\\dfrac{1}{z^2}$ (that is, $\\theta\\to\\pm\\tfrac{\\pi}{2}$), so $$\\int_{-\\infty}^{\\infty}\\Delta g\\,dx=G\\Delta Mz\\cdot\\frac{2}{z^2}=\\frac{2G\\Delta M}{z}\\approx708\\ \\text{mGal·m}.$$", "th": "**หาปริพันธ์ตลอดแนวสำรวจ** เมื่อ $x\\to\\pm\\infty$ ปฏิยานุพันธ์เข้าใกล้ $\\pm\\dfrac{1}{z^2}$ (คือ $\\theta\\to\\pm\\tfrac{\\pi}{2}$) ดังนั้น $$\\int_{-\\infty}^{\\infty}\\Delta g\\,dx=G\\Delta Mz\\cdot\\frac{2}{z^2}=\\frac{2G\\Delta M}{z}\\approx708\\ \\text{mGal·m}.$$"}, {"en": "**Depth from the half-width.** $\\Delta g$ falls to half its peak when $(x^2+z^2)^{3/2}=2z^3$, i.e. $x_{1/2}=z\\sqrt{2^{2/3}-1}=0.766z=307$ m. Turning it around, $z=x_{1/2}/0.766\\approx1.305\\,x_{1/2}$, which gives back the true depth of 400 m.", "th": "**ความลึกจากครึ่งความกว้าง** $\\Delta g$ ลดลงเหลือครึ่งหนึ่งของค่าสูงสุดเมื่อ $(x^2+z^2)^{3/2}=2z^3$ คือ $x_{1/2}=z\\sqrt{2^{2/3}-1}=0.766z=307$ m เมื่อกลับสูตรจะได้ $z=x_{1/2}/0.766\\approx1.305\\,x_{1/2}$ ซึ่งให้ความลึกจริง 400 m กลับคืนมา"}], "meaning": {"en": "A 150 m ore body 400 m deep produces a bump of less than 1 mGal, small but easily measured by a modern gravimeter (about 0.01 mGal resolution). The half-width tells the geophysicist how deep to drill, and the area under the profile gives the excess mass, i.e. the tonnage. Sanity check: deeper bodies give wider and flatter curves, so a wide, weak anomaly means a deep source.", "th": "สายแร่ขนาด 150 m ที่ความลึก 400 m ทำให้เกิดความผิดปกติไม่ถึง 1 mGal ซึ่งน้อยแต่เครื่องวัดแรงโน้มถ่วงสมัยใหม่วัดได้ง่าย (ความละเอียดประมาณ 0.01 mGal) ครึ่งความกว้างบอกนักธรณีฟิสิกส์ว่าต้องเจาะลึกเท่าใด และพื้นที่ใต้กราฟบอกมวลส่วนเกิน คือปริมาณแร่ ตรวจสอบ: วัตถุที่ลึกกว่าให้กราฟที่กว้างและแบนกว่า ดังนั้นความผิดปกติที่กว้างและอ่อนแสดงว่าแหล่งอยู่ลึก"}, "pitfalls": [{"en": "Forgetting to convert m/s² to mGal (multiply by $10^5$).", "th": "ลืมแปลงหน่วย m/s² เป็น mGal (คูณด้วย $10^5$)"}, {"en": "Leaving the answer in terms of $\\theta$ instead of converting back to $x$ with a reference triangle.", "th": "ตอบในรูปของ $\\theta$ โดยไม่แปลงกลับเป็น $x$ ด้วยสามเหลี่ยมอ้างอิง"}, {"en": "Using the full width at half maximum ($2x_{1/2}$) in the rule $z\\approx1.305\\,x_{1/2}$, which doubles the depth.", "th": "ใช้ความกว้างเต็มที่ครึ่งความสูง ($2x_{1/2}$) ในสูตร $z\\approx1.305\\,x_{1/2}$ ทำให้ความลึกเพิ่มเป็นสองเท่า"}]}, "20": {"id": 20, "idea": {"en": "The mean (average) of a probability distribution is $\\int t\\,f(t)\\,dt$. For radioactive decay $f(t)=\\lambda e^{-\\lambda t}$, so we must integrate a **product** of $t$ and an exponential, which is exactly what **integration by parts** is for: choose $u=t$ so that its derivative becomes simple.", "th": "ค่าเฉลี่ยของการแจกแจงความน่าจะเป็นคือ $\\int t\\,f(t)\\,dt$ สำหรับการสลายตัวของสารกัมมันตรังสี $f(t)=\\lambda e^{-\\lambda t}$ เราจึงต้องหาปริพันธ์ของ **ผลคูณ** ระหว่าง $t$ กับฟังก์ชันเลขชี้กำลัง ซึ่งเป็นงานของ **การหาปริพันธ์โดยการแยกส่วน (integration by parts)** โดยเลือก $u=t$ เพื่อให้อนุพันธ์ของมันง่ายขึ้น"}, "steps": [{"en": "**Choose $u$ and $dv$.** Take $u=t$ (it simplifies when differentiated: $du=dt$) and $dv=\\lambda e^{-\\lambda t}dt$ (easy to integrate: $v=-e^{-\\lambda t}$).", "th": "**เลือก $u$ และ $dv$** ให้ $u=t$ (หาอนุพันธ์แล้วง่ายขึ้น: $du=dt$) และ $dv=\\lambda e^{-\\lambda t}dt$ (หาปริพันธ์ได้ง่าย: $v=-e^{-\\lambda t}$)"}, {"en": "**Apply $\\int u\\,dv=uv-\\int v\\,du$.** $$\\int t\\lambda e^{-\\lambda t}dt=-te^{-\\lambda t}+\\int e^{-\\lambda t}dt=-te^{-\\lambda t}-\\frac1\\lambda e^{-\\lambda t}+C.$$ Check by differentiating: the product rule gives back $t\\lambda e^{-\\lambda t}$.", "th": "**ใช้สูตร $\\int u\\,dv=uv-\\int v\\,du$** $$\\int t\\lambda e^{-\\lambda t}dt=-te^{-\\lambda t}+\\int e^{-\\lambda t}dt=-te^{-\\lambda t}-\\frac1\\lambda e^{-\\lambda t}+C.$$ ตรวจโดยหาอนุพันธ์: กฎผลคูณให้ $t\\lambda e^{-\\lambda t}$ กลับคืนมา"}, {"en": "**Definite integral to $T$.** $$\\int_0^T t\\lambda e^{-\\lambda t}dt=\\frac1\\lambda-\\left(T+\\frac1\\lambda\\right)e^{-\\lambda T}.$$", "th": "**ปริพันธ์จำกัดเขตถึง $T$** $$\\int_0^T t\\lambda e^{-\\lambda t}dt=\\frac1\\lambda-\\left(T+\\frac1\\lambda\\right)e^{-\\lambda T}.$$"}, {"en": "**Let $T\\to\\infty$.** $Te^{-\\lambda T}\\to0$ (the exponential beats the linear factor; L'Hôpital confirms it), so the mean life is $\\bar t=\\dfrac1\\lambda$. Since $\\lambda=\\dfrac{\\ln2}{t_{1/2}}$, $\\bar t=\\dfrac{t_{1/2}}{\\ln2}\\approx1.44\\,t_{1/2}$.", "th": "**ให้ $T\\to\\infty$** $Te^{-\\lambda T}\\to0$ (ฟังก์ชันเลขชี้กำลังลดลงเร็วกว่าตัวประกอบเชิงเส้นที่เพิ่มขึ้น ยืนยันได้ด้วยโลปีตาล) ดังนั้นช่วงชีวิตเฉลี่ยคือ $\\bar t=\\dfrac1\\lambda$ และเนื่องจาก $\\lambda=\\dfrac{\\ln2}{t_{1/2}}$ จึงได้ $\\bar t=\\dfrac{t_{1/2}}{\\ln2}\\approx1.44\\,t_{1/2}$"}, {"en": "**Tritium numbers.** $t_{1/2}=12.3$ yr gives $\\lambda=0.6931/12.3=0.05635$ /yr and $\\bar t=17.75$ yr. With the upper limit $T=40$ yr: $e^{-\\lambda T}=0.105$, so $\\int_0^{40}=17.75-(40+17.75)(0.105)=11.68$ yr, which is $65.8\\%$ of the limit; the rest comes from the long tail of late decays.", "th": "**ตัวเลขของทริเทียม** $t_{1/2}=12.3$ ปี ให้ $\\lambda=0.6931/12.3=0.05635$ ต่อปี และ $\\bar t=17.75$ ปี เมื่อขีดจำกัดบน $T=40$ ปี: $e^{-\\lambda T}=0.105$ ดังนั้น $\\int_0^{40}=17.75-(40+17.75)(0.105)=11.68$ ปี คิดเป็น $65.8\\%$ ของลิมิต ส่วนที่เหลือมาจากอะตอมจำนวนน้อยที่สลายตัวช้ามาก"}], "meaning": {"en": "The mean life is about 44% longer than the half-life because a few atoms survive for a very long time and pull the average up. For carbon-14 this gives 8267 years and for tritium about 17.7 years. In hydrogeology the same integral gives the mean transit time of water in a well-mixed aquifer: how long, on average, a pollutant takes to reach a well. Sanity check: the result $1/\\lambda$ has units of time, as a mean age must.", "th": "ช่วงชีวิตเฉลี่ยยาวกว่าครึ่งชีวิตประมาณ 44% เพราะอะตอมจำนวนน้อยอยู่รอดได้นานมาก จึงดึงค่าเฉลี่ยให้สูงขึ้น สำหรับคาร์บอน-14 ได้ 8267 ปี และสำหรับทริเทียมประมาณ 17.7 ปี ในอุทกธรณีวิทยา ปริพันธ์เดียวกันให้เวลาเดินทางเฉลี่ยของน้ำในชั้นหินอุ้มน้ำที่ผสมกันดี คือเวลาเฉลี่ยที่สารปนเปื้อนใช้เดินทางถึงบ่อ ตรวจสอบ: ผลลัพธ์ $1/\\lambda$ มีหน่วยเป็นเวลา ซึ่งถูกต้องสำหรับอายุเฉลี่ย"}, "pitfalls": [{"en": "Choosing $u=e^{-\\lambda t}$ and $dv=t\\,dt$: the new integral $\\int\\tfrac{t^2}{2}\\lambda e^{-\\lambda t}dt$ is harder, not easier.", "th": "เลือก $u=e^{-\\lambda t}$ และ $dv=t\\,dt$ ทำให้ปริพันธ์ใหม่ $\\int\\tfrac{t^2}{2}\\lambda e^{-\\lambda t}dt$ ยากขึ้น ไม่ใช่ง่ายขึ้น"}, {"en": "Losing the minus sign in $v=-e^{-\\lambda t}$, which makes the mean negative.", "th": "ทำเครื่องหมายลบใน $v=-e^{-\\lambda t}$ หาย ทำให้ค่าเฉลี่ยติดลบ"}, {"en": "Confusing the half-life $t_{1/2}$ with the mean life $1/\\lambda$.", "th": "สับสนระหว่างครึ่งชีวิต $t_{1/2}$ กับช่วงชีวิตเฉลี่ย $1/\\lambda$"}]}, "21": {"id": 21, "idea": {"en": "The Omori–Utsu law gives the aftershock **rate**, so the total number of aftershocks is the **integral** of the rate. Asking for the total over all future time makes it an **improper integral** $\\int_0^\\infty$, defined as a limit; whether it is finite depends on the exponent $p$, exactly like the $p$-test for $\\int_1^\\infty x^{-p}dx$.", "th": "กฎของโอโมริ–อุตสึ (Omori–Utsu law) ให้ **อัตรา** การเกิดแผ่นดินไหวตาม ดังนั้นจำนวนทั้งหมดคือ **ปริพันธ์** ของอัตรา เมื่อถามจำนวนรวมตลอดเวลาในอนาคต จึงเป็น **ปริพันธ์ไม่ตรงแบบ (improper integral)** $\\int_0^\\infty$ ซึ่งนิยามด้วยลิมิต การที่ค่าเป็นจำนวนจำกัดหรือไม่ขึ้นกับเลขชี้กำลัง $p$ เหมือนกับการทดสอบ $p$ ของ $\\int_1^\\infty x^{-p}dx$"}, "steps": [{"en": "**Integrate up to a finite time $T$** (power rule with $u=t+c$, valid when $p\\neq1$): $$N(T)=\\int_0^T\\frac{K\\,dt}{(t+c)^p}=\\frac{K}{1-p}\\left[(T+c)^{1-p}-c^{1-p}\\right].$$", "th": "**หาปริพันธ์ถึงเวลาจำกัด $T$** (กฎยกกำลังโดยให้ $u=t+c$ ใช้ได้เมื่อ $p\\neq1$): $$N(T)=\\int_0^T\\frac{K\\,dt}{(t+c)^p}=\\frac{K}{1-p}\\left[(T+c)^{1-p}-c^{1-p}\\right].$$"}, {"en": "**Take the limit $T\\to\\infty$.** If $p>1$, then $1-p<0$ and $(T+c)^{1-p}\\to0$, so $$N_\\infty=\\frac{K}{1-p}\\left(0-c^{1-p}\\right)=\\frac{Kc^{1-p}}{p-1}.$$ If $p<1$ the power grows without bound, and if $p=1$ the integral is $K\\ln\\frac{T+c}{c}\\to\\infty$: both **diverge**.", "th": "**หาลิมิตเมื่อ $T\\to\\infty$** ถ้า $p>1$ จะได้ $1-p<0$ และ $(T+c)^{1-p}\\to0$ ดังนั้น $$N_\\infty=\\frac{K}{1-p}\\left(0-c^{1-p}\\right)=\\frac{Kc^{1-p}}{p-1}.$$ ถ้า $p<1$ พจน์ยกกำลังโตไม่จำกัด และถ้า $p=1$ ปริพันธ์คือ $K\\ln\\frac{T+c}{c}\\to\\infty$ ทั้งสองกรณี **ลู่ออก (diverge)**"}, {"en": "**Numbers ($K=200$, $c=0.05$ day, $p=1.1$).** $c^{1-p}=0.05^{-0.1}=1.349$, so $N_\\infty=\\dfrac{200\\times1.349}{0.1}\\approx2699$ aftershocks.", "th": "**แทนค่า ($K=200$, $c=0.05$ วัน, $p=1.1$)** $c^{1-p}=0.05^{-0.1}=1.349$ ดังนั้น $N_\\infty=\\dfrac{200\\times1.349}{0.1}\\approx2699$ ครั้ง"}, {"en": "**How fast does it converge?** After 1 day $N\\approx708$ (26%); after $T\\approx363$ days (the app's default) $N\\approx1589$ (58.9%), and the rate has dropped to $n=200/(363.05)^{1.1}\\approx0.31$ per day; after 10 years only 67%. Solving $N(T)=0.9N_\\infty$ gives $T\\approx1.4$ million years.", "th": "**ลู่เข้าเร็วเพียงใด** หลัง 1 วัน $N\\approx708$ (26%) หลัง $T\\approx363$ วัน (ค่าเริ่มต้นในแอป) $N\\approx1589$ (58.9%) และอัตราลดลงเหลือ $n=200/(363.05)^{1.1}\\approx0.31$ ครั้งต่อวัน หลัง 10 ปีได้เพียง 67% การแก้สมการ $N(T)=0.9N_\\infty$ ให้ $T\\approx1.4$ ล้านปี"}], "meaning": {"en": "With $p=1.1$ the theoretical total is finite (about 2700), but most of the activity is front-loaded: a quarter happens on the first day, and the tail is so long that in practice aftershocks fade into normal background seismicity long before the integral 'finishes'. For hazard planning, the useful numbers are $N(T)$ for the next days and weeks, which is how aftershock forecasts are issued. Sanity check: if $p\\le1$ the formula would predict infinitely many aftershocks, which is why measured $p$ values are usually slightly above 1.", "th": "เมื่อ $p=1.1$ จำนวนรวมตามทฤษฎีมีค่าจำกัด (ประมาณ 2700 ครั้ง) แต่ส่วนใหญ่เกิดในช่วงแรก หนึ่งในสี่เกิดในวันแรก และหางของการแจกแจงยาวมากจนในทางปฏิบัติแผ่นดินไหวตามจะกลืนไปกับแผ่นดินไหวพื้นหลังนานก่อนที่ปริพันธ์จะ \\\"ครบ\\\" สำหรับการวางแผนรับมือภัย ค่าที่มีประโยชน์คือ $N(T)$ ในอีกไม่กี่วันหรือสัปดาห์ ซึ่งเป็นวิธีออกคำพยากรณ์แผ่นดินไหวตาม ตรวจสอบ: ถ้า $p\\le1$ สูตรจะทำนายว่ามีแผ่นดินไหวตามไม่จำกัด จึงเป็นเหตุผลที่ค่า $p$ ที่วัดได้มักมากกว่า 1 เล็กน้อย"}, "pitfalls": [{"en": "Using the power-rule antiderivative when $p=1$; that case needs $\\ln(t+c)$.", "th": "ใช้ปฏิยานุพันธ์จากกฎยกกำลังเมื่อ $p=1$ กรณีนี้ต้องใช้ $\\ln(t+c)$"}, {"en": "Plugging in $T=\\infty$ directly instead of writing a limit; an improper integral is always defined as $\\lim_{T\\to\\infty}\\int_0^T$.", "th": "แทน $T=\\infty$ ตรง ๆ แทนที่จะเขียนเป็นลิมิต ปริพันธ์ไม่ตรงแบบนิยามเป็น $\\lim_{T\\to\\infty}\\int_0^T$ เสมอ"}, {"en": "Thinking that a decreasing rate ($n(t)\\to0$) guarantees a finite total; $p=1$ decreases too but still diverges.", "th": "คิดว่าอัตราที่ลดลง ($n(t)\\to0$) ทำให้จำนวนรวมมีค่าจำกัดเสมอ กรณี $p=1$ อัตราก็ลดลงแต่ยังลู่ออก"}]}, "22": {"id": 22, "idea": {"en": "Discharge $Q(t)$ is a rate (m³ per second), so the **area under the hydrograph** $\\int Q\\,dt$ is a volume of water. Subtracting the baseflow gives the **area between two curves**, the storm runoff. Real gauges only record every few hours, so we also compare **numerical integration** (trapezoid and Simpson rules) with the exact integral.", "th": "อัตราการไหล $Q(t)$ เป็นอัตรา (ลูกบาศก์เมตรต่อวินาที) ดังนั้น **พื้นที่ใต้กราฟชลภาพ (hydrograph)** $\\int Q\\,dt$ คือปริมาตรน้ำ เมื่อหักการไหลพื้นฐาน (baseflow) ออก จะได้ **พื้นที่ระหว่างเส้นโค้งสองเส้น** ซึ่งคือน้ำท่าจากพายุ สถานีวัดจริงบันทึกค่าทุก ๆ ไม่กี่ชั่วโมง เราจึงเปรียบเทียบ **การหาปริพันธ์เชิงตัวเลข** (กฎสี่เหลี่ยมคางหมูและกฎของซิมป์สัน) กับปริพันธ์ที่แม่นตรง"}, "steps": [{"en": "**Baseflow volume (simple polynomial).** $$\\int_0^{120}(35+0.15t)\\,dt=\\left[35t+0.075t^2\\right]_0^{120}=4200+1080=5280\\ \\text{m}^3\\text{/s·h}.$$ Multiply by 3600 s/h: $1.90\\times10^7$ m³ $=19.01$ million m³.", "th": "**ปริมาตรการไหลพื้นฐาน (พหุนามอย่างง่าย)** $$\\int_0^{120}(35+0.15t)\\,dt=\\left[35t+0.075t^2\\right]_0^{120}=4200+1080=5280\\ \\text{m}^3\\text{/s·h}.$$ คูณด้วย 3600 s/h: $1.90\\times10^7$ m³ $=19.01$ ล้าน m³"}, {"en": "**Direct runoff (substitution $s=t/t_p$).** $$\\int_0^\\infty Q_p\\left(\\tfrac{t}{t_p}\\right)^3e^{3(1-t/t_p)}dt=Q_pt_pe^3\\int_0^\\infty s^3e^{-3s}ds=Q_pt_pe^3\\cdot\\frac{3!}{3^4}.$$ The last integral uses integration by parts three times. Numbers: $420\\times18\\times20.09\\times\\tfrac{6}{81}=11\\,248$ m³/s·h $=40.49$ million m³. Stopping at 120 h changes nothing visible, because the storm is over by then.", "th": "**น้ำท่าโดยตรง (เปลี่ยนตัวแปร $s=t/t_p$)** $$\\int_0^\\infty Q_p\\left(\\tfrac{t}{t_p}\\right)^3e^{3(1-t/t_p)}dt=Q_pt_pe^3\\int_0^\\infty s^3e^{-3s}ds=Q_pt_pe^3\\cdot\\frac{3!}{3^4}.$$ ปริพันธ์ตัวสุดท้ายใช้การหาปริพันธ์โดยการแยกส่วนสามครั้ง แทนค่า: $420\\times18\\times20.09\\times\\tfrac{6}{81}=11\\,248$ m³/s·h $=40.49$ ล้าน m³ การหยุดที่ 120 ชั่วโมงแทบไม่เปลี่ยนค่า เพราะพายุจบไปแล้ว"}, {"en": "**Total volume.** $19.01+40.49=59.50$ million m³, the exact area under the whole hydrograph.", "th": "**ปริมาตรรวม** $19.01+40.49=59.50$ ล้าน m³ คือพื้นที่แม่นตรงใต้ชลภาพทั้งหมด"}, {"en": "**Numerical check with gauge data.** With readings every $\\Delta t=3$ h, the trapezoid rule $T_n=\\tfrac{\\Delta t}{2}\\left[Q_0+2Q_1+\\cdots+2Q_{n-1}+Q_n\\right]$ gives 59.50 million m³ and Simpson's rule 59.49, both within about 0.01% of the exact value. With 12 h or 24 h spacing the error grows, because the samples miss the sharp peak.", "th": "**ตรวจสอบเชิงตัวเลขด้วยข้อมูลสถานีวัด** เมื่ออ่านค่าทุก $\\Delta t=3$ ชั่วโมง กฎสี่เหลี่ยมคางหมู $T_n=\\tfrac{\\Delta t}{2}\\left[Q_0+2Q_1+\\cdots+2Q_{n-1}+Q_n\\right]$ ให้ 59.50 ล้าน m³ และกฎของซิมป์สันให้ 59.49 ทั้งสองต่างจากค่าแม่นตรงประมาณ 0.01% เมื่อเว้นช่วง 12 หรือ 24 ชั่วโมง ความคลาดเคลื่อนจะเพิ่มขึ้น เพราะจุดข้อมูลพลาดยอดที่แหลม"}, {"en": "**Runoff depth.** Spread the direct runoff over the 1250 km² catchment: $\\dfrac{40.49\\times10^6\\ \\text{m}^3}{1250\\times10^6\\ \\text{m}^2}=0.0324$ m $=32.4$ mm of water.", "th": "**ความลึกน้ำท่า** กระจายน้ำท่าโดยตรงบนพื้นที่ลุ่มน้ำ 1250 km²: $\\dfrac{40.49\\times10^6\\ \\text{m}^3}{1250\\times10^6\\ \\text{m}^2}=0.0324$ m $=32.4$ mm"}], "meaning": {"en": "The storm sent about 40 million m³ of rain-driven runoff down the river, equivalent to a 32 mm layer of water over the whole catchment. Dividing by the rainfall depth gives the **runoff coefficient**, which engineers use to design dams, spillways and flood defences, for example in the Chao Phraya basin. Sanity check: units work out as (m³/s) × s = m³, and the numerical rules agree with the exact integral when sampling is dense.", "th": "พายุครั้งนี้ทำให้เกิดน้ำท่าประมาณ 40 ล้าน m³ ไหลลงแม่น้ำ เทียบเท่ากับชั้นน้ำหนา 32 mm ทั่วทั้งลุ่มน้ำ เมื่อหารด้วยความลึกฝนจะได้ **สัมประสิทธิ์น้ำท่า (runoff coefficient)** ซึ่งวิศวกรใช้ออกแบบเขื่อน ทางระบายน้ำล้น และระบบป้องกันน้ำท่วม เช่นในลุ่มน้ำเจ้าพระยา ตรวจสอบ: หน่วยคือ (m³/s) × s = m³ และกฎเชิงตัวเลขให้ค่าตรงกับปริพันธ์แม่นตรงเมื่อเก็บข้อมูลถี่พอ"}, "pitfalls": [{"en": "Forgetting to convert hours to seconds (×3600) when $Q$ is in m³/s and $t$ is in hours.", "th": "ลืมแปลงชั่วโมงเป็นวินาที (×3600) เมื่อ $Q$ มีหน่วย m³/s และ $t$ มีหน่วยชั่วโมง"}, {"en": "Including the baseflow in the 'storm runoff'; the storm's contribution is the area **between** $Q$ and $Q_b$.", "th": "นับการไหลพื้นฐานรวมใน \\\"น้ำท่าจากพายุ\\\" ส่วนที่มาจากพายุคือพื้นที่ **ระหว่าง** $Q$ และ $Q_b$"}, {"en": "In the trapezoid rule, giving the end points weight 2 instead of weight 1.", "th": "ในกฎสี่เหลี่ยมคางหมู ให้น้ำหนักจุดปลายเป็น 2 แทนที่จะเป็น 1"}]}, "23": {"id": 23, "idea": {"en": "Comparing two surveys of the same slope, the material removed or added at each point is the vertical gap $z_1-z_2$. Its **area between curves** (per metre width) measures how much moved, but the gap changes sign, so the integral must be **split where the curves cross**: one part for erosion, one for deposition.", "th": "เมื่อเปรียบเทียบการสำรวจลาดเขาเดียวกันสองครั้ง วัสดุที่ถูกกัดเซาะหรือทับถมที่แต่ละจุดคือระยะห่างแนวดิ่ง $z_1-z_2$ **พื้นที่ระหว่างเส้นโค้ง** (ต่อความกว้าง 1 เมตร) บอกปริมาณวัสดุที่เคลื่อนที่ แต่ระยะห่างนี้เปลี่ยนเครื่องหมาย จึงต้อง **แบ่งปริพันธ์ที่จุดที่เส้นโค้งตัดกัน** ส่วนหนึ่งสำหรับการกัดเซาะ อีกส่วนสำหรับการทับถม"}, "steps": [{"en": "**Find the gap.** $z_1-z_2=12\\sin\\!\\left(\\dfrac{\\pi x}{150}\\right)e^{-x/400}$; the straight line $120-0.4x$ cancels.", "th": "**หาระยะห่าง** $z_1-z_2=12\\sin\\!\\left(\\dfrac{\\pi x}{150}\\right)e^{-x/400}$ เส้นตรง $120-0.4x$ หักล้างกันหมด"}, {"en": "**Find where the curves cross.** $e^{-x/400}>0$ always, so the gap is zero only where $\\sin(\\pi x/150)=0$: $x=0,150,300$ m. On $(0,150)$ the sine is positive ($z_1>z_2$, erosion); on $(150,300)$ it is negative (deposition).", "th": "**หาจุดที่เส้นโค้งตัดกัน** $e^{-x/400}>0$ เสมอ ระยะห่างจึงเป็นศูนย์เฉพาะเมื่อ $\\sin(\\pi x/150)=0$: $x=0,150,300$ m บนช่วง $(0,150)$ ไซน์เป็นบวก ($z_1>z_2$ คือการกัดเซาะ) บนช่วง $(150,300)$ เป็นลบ (การทับถม)"}, {"en": "**Antiderivative (integration by parts twice, cyclic).** With $a=1/400$ and $k=\\pi/150$: $$\\int e^{-ax}\\sin kx\\,dx=-\\frac{e^{-ax}\\left(a\\sin kx+k\\cos kx\\right)}{a^2+k^2}+C.$$ Differentiate to check.", "th": "**ปฏิยานุพันธ์ (หาปริพันธ์โดยการแยกส่วนสองครั้งแบบวนกลับ)** ให้ $a=1/400$ และ $k=\\pi/150$: $$\\int e^{-ax}\\sin kx\\,dx=-\\frac{e^{-ax}\\left(a\\sin kx+k\\cos kx\\right)}{a^2+k^2}+C.$$ ตรวจสอบโดยหาอนุพันธ์"}, {"en": "**Evaluate each piece.** $$A_{\\text{erosion}}=12\\int_0^{150}e^{-ax}\\sin kx\\,dx=\\frac{12k\\left(1+e^{-150a}\\right)}{a^2+k^2}=953.2\\ \\text{m}^2,$$ $$A_{\\text{deposit}}=-12\\int_{150}^{300}e^{-ax}\\sin kx\\,dx=\\frac{12k\\left(e^{-150a}+e^{-300a}\\right)}{a^2+k^2}=655.1\\ \\text{m}^2.$$", "th": "**คำนวณแต่ละส่วน** $$A_{\\text{erosion}}=12\\int_0^{150}e^{-ax}\\sin kx\\,dx=\\frac{12k\\left(1+e^{-150a}\\right)}{a^2+k^2}=953.2\\ \\text{m}^2,$$ $$A_{\\text{deposit}}=-12\\int_{150}^{300}e^{-ax}\\sin kx\\,dx=\\frac{12k\\left(e^{-150a}+e^{-300a}\\right)}{a^2+k^2}=655.1\\ \\text{m}^2.$$"}, {"en": "**Volumes.** For a slide 80 m wide: eroded $953.2\\times80\\approx76\\,253$ m³, deposited $655.1\\times80\\approx52\\,408$ m³; clearing the deposit needs $\\lceil52\\,408/10\\rceil=5241$ ten-cubic-metre truckloads. Net loss: $953.2-655.1=298.1$ m² per metre width.", "th": "**ปริมาตร** สำหรับดินถล่มกว้าง 80 m: ถูกกัดเซาะ $953.2\\times80\\approx76\\,253$ m³ ทับถม $655.1\\times80\\approx52\\,408$ m³ การขนดินที่ทับถมออกต้องใช้รถบรรทุกขนาด 10 m³ จำนวน $\\lceil52\\,408/10\\rceil=5241$ เที่ยว สูญเสียสุทธิ $953.2-655.1=298.1$ m² ต่อความกว้าง 1 เมตร"}], "meaning": {"en": "More material left the scar (953 m²) than piled up at the toe (655 m²), so about 300 m² per metre width left the profile, for example carried away by a stream or compacted differently. This 'DEM of difference' calculation is done on repeat drone or LiDAR surveys after landslides in northern Thailand to estimate volumes and clean-up costs. Sanity check: if you integrated $z_1-z_2$ over the whole 0–300 m without splitting, you would get only the net 298 m² and miss both the erosion and the deposition.", "th": "วัสดุที่ออกจากรอยแผลถล่ม (953 m²) มากกว่าที่ทับถมที่ตีนลาด (655 m²) ดังนั้นประมาณ 300 m² ต่อความกว้าง 1 เมตรออกไปจากแนวสำรวจ เช่นถูกลำธารพาไปหรือถูกอัดตัวต่างกัน การคำนวณ \\\"ผลต่างของ DEM\\\" แบบนี้ใช้กับการสำรวจด้วยโดรนหรือไลดาร์ซ้ำหลังเกิดดินถล่มในภาคเหนือของไทย เพื่อประมาณปริมาตรและค่าใช้จ่ายในการฟื้นฟู ตรวจสอบ: ถ้าหาปริพันธ์ $z_1-z_2$ ตลอดช่วง 0–300 m โดยไม่แบ่ง จะได้แค่ค่าสุทธิ 298 m² และพลาดทั้งการกัดเซาะและการทับถม"}, "pitfalls": [{"en": "Integrating $z_1-z_2$ over the whole interval without splitting, so erosion and deposition cancel.", "th": "หาปริพันธ์ $z_1-z_2$ ตลอดช่วงโดยไม่แบ่ง ทำให้การกัดเซาะและการทับถมหักล้างกัน"}, {"en": "Reporting the deposition area as negative; area between curves is always positive (integrate top minus bottom).", "th": "รายงานพื้นที่การทับถมเป็นค่าลบ พื้นที่ระหว่างเส้นโค้งเป็นบวกเสมอ (หาปริพันธ์ของเส้นบนลบเส้นล่าง)"}, {"en": "Calling the result a volume: it is an area per metre of width (m²) until multiplied by the slide width.", "th": "เรียกผลลัพธ์ว่าปริมาตร ซึ่งยังเป็นพื้นที่ต่อความกว้าง 1 เมตร (m²) จนกว่าจะคูณด้วยความกว้างของดินถล่ม"}]}, "24": {"id": 24, "idea": {"en": "A falling grain never reaches its final speed in finite time; the speed only *approaches* it. A **limit at infinity** turns that endless approach into one number, the terminal velocity $v_t$, which is the speed that actually controls how sediment settles.", "th": "เม็ดตะกอนที่จมลงในน้ำไม่มีวันถึงความเร็วสุดท้ายในเวลาจำกัด ความเร็วเพียง *เข้าใกล้* ค่านั้นเรื่อย ๆ **ลิมิตที่อนันต์ (limit at infinity)** เปลี่ยนการเข้าใกล้อย่างไม่สิ้นสุดนี้ให้เป็นตัวเลขเดียว คือความเร็วปลาย (terminal velocity) $v_t$ ซึ่งเป็นความเร็วที่ควบคุมการตกตะกอนจริง"}, "steps": [{"en": "**Write the model.** The speed of the grain is $v(t) = v_t\\left(1-e^{-t/\\tau}\\right)$. At $t=0$ it is $0$, and it grows as the exponential term shrinks.", "th": "**เขียนแบบจำลอง** ความเร็วของเม็ดตะกอนคือ $v(t) = v_t\\left(1-e^{-t/\\tau}\\right)$ เมื่อ $t=0$ ความเร็วเป็น $0$ และเพิ่มขึ้นเมื่อพจน์เอกซ์โพเนนเชียลเล็กลง"}, {"en": "**Take the limit.** Since $\\tau>0$, $-t/\\tau\\to-\\infty$ as $t\\to\\infty$, so $e^{-t/\\tau}\\to0$. Using the limit laws, $$\\lim_{t\\to\\infty}v(t)=v_t\\left(1-\\lim_{t\\to\\infty}e^{-t/\\tau}\\right)=v_t(1-0)=v_t.$$", "th": "**หาลิมิต** เนื่องจาก $\\tau>0$ เมื่อ $t\\to\\infty$ จะได้ $-t/\\tau\\to-\\infty$ ดังนั้น $e^{-t/\\tau}\\to0$ ใช้สมบัติของลิมิตได้ $$\\lim_{t\\to\\infty}v(t)=v_t\\left(1-\\lim_{t\\to\\infty}e^{-t/\\tau}\\right)=v_t(1-0)=v_t$$"}, {"en": "**Compute $v_t$ from Stokes' law** with $D = 0.1$ mm $=10^{-4}$ m: $$v_t=\\frac{(2650-1000)(9.81)(10^{-4})^2}{18(1.0\\times10^{-3})}=\\frac{1.619\\times10^{-4}}{0.018}\\approx 8.99\\times10^{-3}\\ \\text{m/s}=8.99\\ \\text{mm/s}.$$", "th": "**คำนวณ $v_t$ จากกฎของสโตกส์ (Stokes' law)** โดย $D = 0.1$ mm $=10^{-4}$ m $$v_t=\\frac{(2650-1000)(9.81)(10^{-4})^2}{18(1.0\\times10^{-3})}=\\frac{1.619\\times10^{-4}}{0.018}\\approx 8.99\\times10^{-3}\\ \\text{m/s}=8.99\\ \\text{mm/s}$$"}, {"en": "**How fast is the limit reached?** The time scale is $\\tau=v_t/g=0.00899/9.81\\approx0.917$ ms. After $5\\tau$ (under 5 ms) the factor $e^{-5}\\approx0.007$, so the grain is within 1 % of $v_t$.", "th": "**เข้าใกล้ลิมิตเร็วแค่ไหน** มาตราส่วนเวลาคือ $\\tau=v_t/g=0.00899/9.81\\approx0.917$ ms หลังผ่านไป $5\\tau$ (ไม่ถึง 5 ms) ตัวประกอบ $e^{-5}\\approx0.007$ เม็ดตะกอนจึงมีความเร็วต่างจาก $v_t$ ไม่ถึง 1 %"}, {"en": "**Use the limit.** Because the transient is so short, the settling time through 10 m is simply $10/0.00899\\approx1112$ s $\\approx18.5$ min.", "th": "**นำลิมิตไปใช้** เนื่องจากช่วงเร่งความเร็วสั้นมาก เวลาที่ใช้จมผ่านน้ำลึก 10 m จึงเท่ากับ $10/0.00899\\approx1112$ s $\\approx18.5$ นาที"}, {"en": "**Check the assumption.** Stokes' law needs a Reynolds number $Re=v_tD\\rho_w/\\mu<1$: here $Re=0.00899\\times10^{-4}\\times1000/10^{-3}\\approx0.90$, so the result is valid.", "th": "**ตรวจสอบสมมติฐาน** กฎของสโตกส์ใช้ได้เมื่อเลขเรย์โนลด์ส (Reynolds number) $Re=v_tD\\rho_w/\\mu<1$ ในที่นี้ $Re=0.00899\\times10^{-4}\\times1000/10^{-3}\\approx0.90$ ผลลัพธ์จึงใช้ได้"}], "meaning": {"en": "A very fine sand grain sinks at about 9 mm/s and crosses 10 m of still water in about 18 minutes. Because $v_t\\propto D^2$, a grain half as big sinks four times slower, which is why rivers and the sea sort sediment by size and carry mud far offshore. The units check: (kg/m³)(m/s²)(m²)/(Pa·s) = m/s.", "th": "เม็ดทรายละเอียดมากจมด้วยความเร็วประมาณ 9 mm/s และใช้เวลาราว 18 นาทีในการจมผ่านน้ำนิ่งลึก 10 m เนื่องจาก $v_t\\propto D^2$ เม็ดที่เล็กลงครึ่งหนึ่งจะจมช้าลงสี่เท่า แม่น้ำและทะเลจึงคัดขนาดตะกอน และพาโคลไปได้ไกลจากฝั่ง ตรวจหน่วย: (kg/m³)(m/s²)(m²)/(Pa·s) = m/s"}, "pitfalls": [{"en": "Forgetting to convert the diameter from mm to m before squaring: using $D=0.1$ instead of $10^{-4}$ makes $v_t$ a million times too large.", "th": "ลืมแปลงเส้นผ่านศูนย์กลางจาก mm เป็น m ก่อนยกกำลังสอง ถ้าใช้ $D=0.1$ แทน $10^{-4}$ จะได้ $v_t$ ใหญ่เกินจริงล้านเท่า"}, {"en": "Thinking the limit is \\\"never reached so it is useless\\\": the approach is exponential, so after a few $\\tau$ the difference is negligible.", "th": "คิดว่าลิมิต \\\"ไปไม่ถึงจึงไม่มีประโยชน์\\\" ที่จริงการเข้าใกล้เป็นแบบเอกซ์โพเนนเชียล หลังผ่านไปไม่กี่เท่าของ $\\tau$ ผลต่างก็เล็กจนละเลยได้"}, {"en": "Applying Stokes' law to coarse grains where $Re>1$; for $D=0.2$ mm, $Re\\approx7$ and the formula overestimates the speed.", "th": "ใช้กฎของสโตกส์กับเม็ดหยาบที่ $Re>1$ เช่น $D=0.2$ mm ได้ $Re\\approx7$ สูตรนี้จะให้ความเร็วสูงเกินจริง"}]}, "25": {"id": 25, "idea": {"en": "We want the depth where the temperature first reaches the melting point, but the equation $T(z)=T_s(z)$ cannot be solved with algebra. The **Intermediate Value Theorem** (IVT) proves a solution exists from two sign checks, and the **bisection method** then traps it in a smaller and smaller interval.", "th": "เราต้องการความลึกที่อุณหภูมิถึงจุดหลอมเหลวเป็นครั้งแรก แต่สมการ $T(z)=T_s(z)$ แก้ด้วยพีชคณิตไม่ได้ **ทฤษฎีบทค่าระหว่างกลาง (Intermediate Value Theorem, IVT)** พิสูจน์ว่ามีคำตอบจากการตรวจเครื่องหมายเพียงสองครั้ง แล้ว **วิธีแบ่งครึ่งช่วง (bisection method)** บีบคำตอบให้อยู่ในช่วงที่แคบลงเรื่อย ๆ"}, "steps": [{"en": "**Make one function.** Define $f(z)=T(z)-T_s(z)=15+1600\\left(1-e^{-z/60}\\right)-(1100+2z)$. Rock is solid where $f<0$ and starts to melt where $f=0$.", "th": "**สร้างฟังก์ชันเดียว** นิยาม $f(z)=T(z)-T_s(z)=15+1600\\left(1-e^{-z/60}\\right)-(1100+2z)$ หินเป็นของแข็งเมื่อ $f<0$ และเริ่มหลอมเมื่อ $f=0$"}, {"en": "**Check continuity.** $f$ is built from an exponential and a polynomial, both continuous for all $z$, so $f$ is continuous on $[50,100]$. This is the condition the IVT needs.", "th": "**ตรวจความต่อเนื่อง** $f$ ประกอบด้วยฟังก์ชันเลขชี้กำลังและพหุนาม ซึ่งต่อเนื่องทุกค่า $z$ ดังนั้น $f$ ต่อเนื่องบน $[50,100]$ ซึ่งเป็นเงื่อนไขที่ IVT ต้องการ"}, {"en": "**Check the signs at the ends.** $f(50)=15+1600(1-e^{-0.833})-1200=15+904.6-1200\\approx-280.4$ and $f(100)=15+1600(1-e^{-1.667})-1300=15+1297.8-1300\\approx+12.8$. The signs differ, so by the IVT there is a $c\\in(50,100)$ with $f(c)=0$.", "th": "**ตรวจเครื่องหมายที่ปลายช่วง** $f(50)=15+1600(1-e^{-0.833})-1200=15+904.6-1200\\approx-280.4$ และ $f(100)=15+1600(1-e^{-1.667})-1300=15+1297.8-1300\\approx+12.8$ เครื่องหมายต่างกัน ตาม IVT จึงมี $c\\in(50,100)$ ที่ $f(c)=0$"}, {"en": "**Bisect.** Evaluate the midpoint and keep the half where the sign changes: $f(75)\\approx-93.4$ → root in $[75,100]$; $f(87.5)\\approx-32.2$ → $[87.5,100]$; $f(93.75)\\approx-7.9$ → $[93.75,100]$; $f(96.875)\\approx+2.9$ → $[93.75,96.875]$, and so on.", "th": "**แบ่งครึ่งช่วง** หาค่าที่จุดกึ่งกลางแล้วเก็บครึ่งที่เครื่องหมายเปลี่ยน: $f(75)\\approx-93.4$ → รากอยู่ใน $[75,100]$; $f(87.5)\\approx-32.2$ → $[87.5,100]$; $f(93.75)\\approx-7.9$ → $[93.75,100]$; $f(96.875)\\approx+2.9$ → $[93.75,96.875]$ ทำต่อไปเรื่อย ๆ"}, {"en": "**Count the steps.** After $n$ halvings the interval width is $50/2^n$. For a width below $0.01$ km we need $2^n>5000$, i.e. $n\\ge13$ ($50/2^{13}\\approx0.006$ km).", "th": "**นับจำนวนขั้น** หลังแบ่งครึ่ง $n$ ครั้ง ความกว้างช่วงคือ $50/2^n$ ถ้าต้องการความกว้างน้อยกว่า $0.01$ km ต้องให้ $2^n>5000$ นั่นคือ $n\\ge13$ ($50/2^{13}\\approx0.006$ km)"}, {"en": "**Answer.** The root is $z\\approx96.01$ km, where the temperature is $T_s\\approx1100+2(96.01)\\approx1292$ °C.", "th": "**คำตอบ** รากคือ $z\\approx96.01$ km ซึ่งมีอุณหภูมิ $T_s\\approx1100+2(96.01)\\approx1292$ °C"}], "meaning": {"en": "Below about 96 km the mantle is hot enough to begin partial melting. This matches the top of the asthenosphere's low-velocity zone, where seismic waves slow down because of a little melt between grains. The IVT tells us *that* the crossing exists before we spend any effort finding it.", "th": "ใต้ความลึกประมาณ 96 km แมนเทิลร้อนพอที่จะเริ่มหลอมบางส่วน ซึ่งตรงกับขอบบนของเขตความเร็วต่ำในแอสทีโนสเฟียร์ ที่คลื่นไหวสะเทือนช้าลงเพราะมีหินหลอมเล็กน้อยแทรกระหว่างเม็ดแร่ IVT บอกเราว่าจุดตัด *มีอยู่จริง* ก่อนที่เราจะลงแรงหามัน"}, "pitfalls": [{"en": "Using the IVT without checking continuity, or concluding there is exactly one root; the IVT only guarantees *at least* one.", "th": "ใช้ IVT โดยไม่ตรวจความต่อเนื่อง หรือสรุปว่ามีรากเพียงหนึ่งราก ที่จริง IVT รับประกันเพียงว่ามี *อย่างน้อย* หนึ่งราก"}, {"en": "Keeping the wrong half in bisection: always keep the half whose endpoints still have opposite signs, i.e. where $f(a)f(m)\\le0$.", "th": "เก็บครึ่งช่วงผิดด้านในวิธีแบ่งครึ่ง ต้องเก็บครึ่งที่ค่าปลายทั้งสองยังมีเครื่องหมายตรงข้าม คือเมื่อ $f(a)f(m)\\le0$"}, {"en": "Thinking same signs at both ends mean no root: there could be two crossings. The IVT simply gives no information then.", "th": "คิดว่าเครื่องหมายเหมือนกันที่ปลายทั้งสองแปลว่าไม่มีราก ที่จริงอาจมีจุดตัดสองจุด IVT เพียงแต่ไม่ให้ข้อมูลในกรณีนี้"}]}, "26": {"id": 26, "idea": {"en": "The factor of safety is a sum of two **quotients** of trigonometric functions of the slope angle $\\beta$. Its derivative $FS'(\\beta)$, found with the **quotient rule**, tells how quickly stability is lost as a hillslope gets steeper.", "th": "อัตราส่วนความปลอดภัยเป็นผลบวกของ **ผลหาร (quotient)** สองพจน์ของฟังก์ชันตรีโกณมิติของมุมลาด $\\beta$ อนุพันธ์ $FS'(\\beta)$ ที่หาด้วย **กฎผลหาร (quotient rule)** บอกว่าความมั่นคงลดลงเร็วแค่ไหนเมื่อลาดชันขึ้น"}, "steps": [{"en": "**Simplify the constants.** With $c=5$ kPa, $\\gamma=19$ kN/m³, $z=2$ m: $c/(\\gamma z)=5/38\\approx0.1316$. So $$FS(\\beta)=\\frac{0.1316}{\\sin\\beta\\cos\\beta}+\\frac{\\tan30^\\circ}{\\tan\\beta}.$$", "th": "**ทำค่าคงตัวให้ง่าย** เมื่อ $c=5$ kPa, $\\gamma=19$ kN/m³, $z=2$ m จะได้ $c/(\\gamma z)=5/38\\approx0.1316$ ดังนั้น $$FS(\\beta)=\\frac{0.1316}{\\sin\\beta\\cos\\beta}+\\frac{\\tan30^\\circ}{\\tan\\beta}$$"}, {"en": "**Differentiate the first term.** Let $u=c$ (constant, $u'=0$) and $v=\\gamma z\\sin\\beta\\cos\\beta$. By the product rule $v'=\\gamma z(\\cos^2\\beta-\\sin^2\\beta)=\\gamma z\\cos2\\beta$. The quotient rule gives $$\\left(\\frac{u}{v}\\right)'=\\frac{0\\cdot v-c\\,v'}{v^2}=-\\frac{c\\cos2\\beta}{\\gamma z\\sin^2\\beta\\cos^2\\beta}.$$", "th": "**หาอนุพันธ์ของพจน์แรก** ให้ $u=c$ (ค่าคงตัว $u'=0$) และ $v=\\gamma z\\sin\\beta\\cos\\beta$ จากกฎผลคูณ $v'=\\gamma z(\\cos^2\\beta-\\sin^2\\beta)=\\gamma z\\cos2\\beta$ กฎผลหารให้ $$\\left(\\frac{u}{v}\\right)'=\\frac{0\\cdot v-c\\,v'}{v^2}=-\\frac{c\\cos2\\beta}{\\gamma z\\sin^2\\beta\\cos^2\\beta}$$"}, {"en": "**Differentiate the second term.** With $u=\\tan\\varphi$ (constant) and $v=\\tan\\beta$, $v'=\\sec^2\\beta$: $$\\left(\\frac{\\tan\\varphi}{\\tan\\beta}\\right)'=-\\frac{\\tan\\varphi\\sec^2\\beta}{\\tan^2\\beta}=-\\frac{\\tan\\varphi}{\\sin^2\\beta}.$$", "th": "**หาอนุพันธ์ของพจน์ที่สอง** ให้ $u=\\tan\\varphi$ (ค่าคงตัว) และ $v=\\tan\\beta$ ซึ่ง $v'=\\sec^2\\beta$ $$\\left(\\frac{\\tan\\varphi}{\\tan\\beta}\\right)'=-\\frac{\\tan\\varphi\\sec^2\\beta}{\\tan^2\\beta}=-\\frac{\\tan\\varphi}{\\sin^2\\beta}$$"}, {"en": "**Evaluate at $\\beta=30^\\circ$.** $\\sin30^\\circ\\cos30^\\circ=0.4330$, so $FS=0.1316/0.4330+1=1.30$. Since $\\cos60^\\circ=0.5$ and $\\sin^2\\beta\\cos^2\\beta=0.1875$: $FS'=-0.1316(0.5)/0.1875-0.5774/0.25=-0.351-2.309\\approx-2.66$ per radian.", "th": "**แทนค่าที่ $\\beta=30^\\circ$** $\\sin30^\\circ\\cos30^\\circ=0.4330$ ดังนั้น $FS=0.1316/0.4330+1=1.30$ และเนื่องจาก $\\cos60^\\circ=0.5$ และ $\\sin^2\\beta\\cos^2\\beta=0.1875$ จะได้ $FS'=-0.1316(0.5)/0.1875-0.5774/0.25=-0.351-2.309\\approx-2.66$ ต่อเรเดียน"}, {"en": "**Read the sign.** For $\\beta<45^\\circ$ both terms of $FS'$ are negative ($\\cos2\\beta>0$), so $FS$ decreases: every extra degree of slope makes failure more likely.", "th": "**อ่านเครื่องหมาย
