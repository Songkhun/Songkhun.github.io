 {"en": "Reporting $r_{\\max}$ as the plume height. $r_{\\max}$ is measured from the centre; subtract $R$.", "th": "รายงาน $r_{\\max}$ เป็นความสูงของพลูม $r_{\\max}$ วัดจากจุดศูนย์กลาง ต้องลบ $R$ ออก"}]}, "46": {"id": 46, "idea": {"en": "Mass and moment of inertia are both sums over thin spherical shells, so they are definite integrals of density times a power of $r$. Because the moment of inertia weights outer shells much more ($r^4$ instead of $r^2$), comparing the two tells us how mass is distributed inside the Earth, a planet we cannot sample below a few kilometres.", "th": "มวลและโมเมนต์ความเฉื่อยต่างเป็นผลรวมของเปลือกทรงกลมบาง ๆ จึงเป็นปริพันธ์จำกัดเขต (definite integral) ของความหนาแน่นคูณกำลังของ $r$ เนื่องจากโมเมนต์ความเฉื่อยให้น้ำหนักกับเปลือกชั้นนอกมากกว่ามาก ($r^4$ แทน $r^2$) การเปรียบเทียบสองค่านี้จึงบอกการกระจายมวลภายในโลก ทั้งที่เราเก็บตัวอย่างได้ลึกเพียงไม่กี่กิโลเมตร"}, "steps": [{"en": "**Shell elements.** A shell of radius $r$ and thickness $dr$ has volume $4\\pi r^2dr$ and mass $dm=4\\pi r^2\\rho(r)\\,dr$. Its moment of inertia about an axis is $\\tfrac23r^2\\,dm$.", "th": "**ชิ้นเปลือก** เปลือกรัศมี $r$ หนา $dr$ มีปริมาตร $4\\pi r^2dr$ และมวล $dm=4\\pi r^2\\rho(r)\\,dr$ โมเมนต์ความเฉื่อยรอบแกนคือ $\\tfrac23r^2\\,dm$"}, {"en": "**Mass.** With $\\rho=\\rho_0(1-\\alpha r^2/R^2)$: $M=4\\pi\\rho_0\\displaystyle\\int_0^R\\left(r^2-\\frac{\\alpha r^4}{R^2}\\right)dr=4\\pi\\rho_0\\left(\\frac{R^3}3-\\frac{\\alpha R^3}5\\right)=4\\pi\\rho_0R^3\\left(\\frac13-\\frac\\alpha5\\right)$.", "th": "**มวล** เมื่อ $\\rho=\\rho_0(1-\\alpha r^2/R^2)$: $M=4\\pi\\rho_0\\displaystyle\\int_0^R\\left(r^2-\\frac{\\alpha r^4}{R^2}\\right)dr=4\\pi\\rho_0\\left(\\frac{R^3}3-\\frac{\\alpha R^3}5\\right)=4\\pi\\rho_0R^3\\left(\\frac13-\\frac\\alpha5\\right)$"}, {"en": "**Moment of inertia.** $I=\\dfrac{8\\pi}3\\rho_0\\displaystyle\\int_0^R\\left(r^4-\\frac{\\alpha r^6}{R^2}\\right)dr=\\frac{8\\pi}3\\rho_0R^5\\left(\\frac15-\\frac\\alpha7\\right)$.", "th": "**โมเมนต์ความเฉื่อย** $I=\\dfrac{8\\pi}3\\rho_0\\displaystyle\\int_0^R\\left(r^4-\\frac{\\alpha r^6}{R^2}\\right)dr=\\frac{8\\pi}3\\rho_0R^5\\left(\\frac15-\\frac\\alpha7\\right)$"}, {"en": "**The ratio** ($\\rho_0$ and $R$ cancel): $\\dfrac{I}{MR^2}=\\dfrac23\\cdot\\dfrac{\\frac15-\\frac\\alpha7}{\\frac13-\\frac\\alpha5}$. For a uniform planet ($\\alpha=0$) this is $\\dfrac23\\cdot\\dfrac35=0.4$.", "th": "**อัตราส่วน** ($\\rho_0$ และ $R$ ตัดกัน): $\\dfrac{I}{MR^2}=\\dfrac23\\cdot\\dfrac{\\frac15-\\frac\\alpha7}{\\frac13-\\frac\\alpha5}$ สำหรับดาวที่เนื้อเดียวกัน ($\\alpha=0$) ได้ $\\dfrac23\\cdot\\dfrac35=0.4$"}, {"en": "**Match the measured 0.3307.** Trying $\\alpha=0.794$: $\\dfrac15-\\dfrac{0.794}7\\approx0.08657$, $\\dfrac13-\\dfrac{0.794}5\\approx0.17453$, ratio $\\approx\\dfrac23\\times0.4960\\approx0.3307$ ✓.", "th": "**จับคู่กับค่าวัดได้ 0.3307** ลอง $\\alpha=0.794$: $\\dfrac15-\\dfrac{0.794}7\\approx0.08657$, $\\dfrac13-\\dfrac{0.794}5\\approx0.17453$ อัตราส่วน $\\approx\\dfrac23\\times0.4960\\approx0.3307$ ✓"}, {"en": "**Densities.** The mean density is $\\dfrac{M}{\\frac43\\pi R^3}=3\\rho_0\\left(\\frac13-\\frac\\alpha5\\right)=\\rho_0(1-0.6\\alpha)=5514$ kg/m³, so $\\rho_0=\\dfrac{5514}{1-0.4764}\\approx10{,}530$ kg/m³ at the centre and $\\rho_0(1-\\alpha)\\approx2170$ kg/m³ at the surface. The total mass is $\\tfrac43\\pi R^3\\times5514\\approx5.97\\times10^{24}$ kg.", "th": "**ความหนาแน่น** ความหนาแน่นเฉลี่ยคือ $\\dfrac{M}{\\frac43\\pi R^3}=3\\rho_0\\left(\\frac13-\\frac\\alpha5\\right)=\\rho_0(1-0.6\\alpha)=5514$ kg/m³ ดังนั้น $\\rho_0=\\dfrac{5514}{1-0.4764}\\approx10{,}530$ kg/m³ ที่ใจกลาง และ $\\rho_0(1-\\alpha)\\approx2170$ kg/m³ ที่ผิว มวลรวมคือ $\\tfrac43\\pi R^3\\times5514\\approx5.97\\times10^{24}$ kg"}], "meaning": {"en": "A value below 0.4 can only happen if mass is concentrated towards the centre. This simple model needs a centre about twice as dense as the average and a surface density close to real crustal rock (about 2700 kg/m³), so the Earth must have a dense core, which we know is iron. Seismic models (PREM) refine this to about 13,000 kg/m³ in the inner core.", "th": "ค่าที่ต่ำกว่า 0.4 เกิดได้ก็ต่อเมื่อมวลกระจุกอยู่ใกล้ใจกลาง แบบจำลองง่าย ๆ นี้ต้องการใจกลางที่หนาแน่นราวสองเท่าของค่าเฉลี่ย และความหนาแน่นที่ผิวใกล้เคียงหินเปลือกโลกจริง (ประมาณ 2700 kg/m³) โลกจึงต้องมีแก่นที่หนาแน่น ซึ่งเรารู้ว่าเป็นเหล็ก แบบจำลองคลื่นไหวสะเทือน (PREM) ปรับค่านี้เป็นประมาณ 13,000 kg/m³ ในแก่นชั้นใน"}, "pitfalls": [{"en": "Using the solid-sphere formula $\\tfrac25MR^2$ for each shell. A thin shell has $\\tfrac23r^2\\,dm$.", "th": "ใช้สูตรทรงกลมตัน $\\tfrac25MR^2$ กับแต่ละเปลือก เปลือกบางมีโมเมนต์ความเฉื่อย $\\tfrac23r^2\\,dm$"}, {"en": "Integrating $\\rho(r)\\,dr$ instead of $4\\pi r^2\\rho(r)\\,dr$: you must multiply by the area of each shell.", "th": "หาปริพันธ์ $\\rho(r)\\,dr$ แทน $4\\pi r^2\\rho(r)\\,dr$ ต้องคูณด้วยพื้นที่ผิวของแต่ละเปลือก"}, {"en": "Treating $R$ in $\\alpha r^2/R^2$ as the variable. $R$ is a constant; only $r$ is integrated.", "th": "ถือว่า $R$ ใน $\\alpha r^2/R^2$ เป็นตัวแปร $R$ เป็นค่าคงตัว ตัวแปรที่หาปริพันธ์คือ $r$ เท่านั้น"}]}};

// $$..$$ and $..$ become MathJax display/inline maths (protected first); **bold** and *italic* are applied around them
const rich = s => { const m = [];
  let t = String(s).replace(/\$\$[\s\S]+?\$\$|\$[^$]+?\$/g, x => { m.push(x); return '\u0000' + (m.length - 1) + '\u0000'; });
  t = escHTML(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*([^*\s][^*]*?)\*/g, '<i>$1</i>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, k) => { const x = m[+k];
    return x.startsWith('$$') ? '\\[' + escHTML(x.slice(2, -2)) + '\\]' : '\\(' + escHTML(x.slice(1, -1)) + '\\)'; }); };

const QUIZ = {"A": [{"type": "num", "ex": 1, "q": {"en": "A GPS station moves east as $x(t)=50\\ln\\!\\left(1+\\frac{t}{0.5}\\right)$ mm, with $t$ in years after an earthquake. Find its **instantaneous velocity** at $t=2$ yr.", "th": "สถานี GPS เคลื่อนไปทางตะวันออกตาม $x(t)=50\\ln\\!\\left(1+\\frac{t}{0.5}\\right)$ มม. โดย $t$ เป็นปีหลังแผ่นดินไหว จงหา**ความเร็วขณะหนึ่ง**ที่ $t=2$ ปี"}, "answer": 20.0, "unit": {"en": "mm/yr", "th": "มม./ปี"}, "why": {"en": "$v(t)=x'(t)=\\dfrac{50}{0.5+t}$, so $v(2)=50/2.5=20$ mm/yr. It is the limit of the average velocity $\\frac{x(2+h)-x(2)}{h}$ as $h\\to0$.", "th": "$v(t)=x'(t)=\\dfrac{50}{0.5+t}$ ดังนั้น $v(2)=50/2.5=20$ มม./ปี ซึ่งคือลิมิตของความเร็วเฉลี่ย $\\frac{x(2+h)-x(2)}{h}$ เมื่อ $h\\to0$"}, "tol": 0.02, "dp": 3}, {"type": "mc", "ex": 1, "q": {"en": "For the same station, the average velocities over $[1,\\,1+h]$ with $h>0$ are all **smaller** than the true velocity at $t=1$. Why?", "th": "สำหรับสถานีเดิม ความเร็วเฉลี่ยบนช่วง $[1,\\,1+h]$ เมื่อ $h>0$ มีค่า**น้อยกว่า**ความเร็วจริงที่ $t=1$ ทุกค่า เพราะเหตุใด"}, "choices": [{"en": "The curve $x(t)$ is concave down, so secant slopes to the right fall below the tangent slope", "th": "กราฟ $x(t)$ เว้าลง ความชันของเส้นตัดทางขวาจึงต่ำกว่าความชันของเส้นสัมผัส"}, {"en": "The limit does not exist at $t=1$", "th": "ลิมิตไม่มีค่าที่ $t=1$"}, {"en": "Rounding error in the GPS data", "th": "ความคลาดเคลื่อนจากการปัดเศษของข้อมูล GPS"}, {"en": "The curve $x(t)$ is concave up", "th": "กราฟ $x(t)$ เว้าขึ้น"}], "answer": 0, "why": {"en": "$x''(t)=-50/(0.5+t)^2<0$, so the graph bends downward. Secants to the right lie below the tangent; secants to the left lie above it. Both still approach $33.3$ mm/yr.", "th": "$x''(t)=-50/(0.5+t)^2<0$ กราฟจึงโค้งลง เส้นตัดทางขวาอยู่ต่ำกว่าเส้นสัมผัส ส่วนทางซ้ายอยู่สูงกว่า แต่ทั้งสองข้างเข้าใกล้ $33.3$ มม./ปี เหมือนกัน"}}, {"type": "num", "ex": 2, "q": {"en": "A sand grain released in water speeds up as $v(t)=\\dfrac{24t}{t+0.02}$ mm/s. Find its terminal velocity $\\displaystyle\\lim_{t\\to\\infty}v(t)$.", "th": "เม็ดทรายที่ปล่อยลงในน้ำมีความเร็ว $v(t)=\\dfrac{24t}{t+0.02}$ มม./วินาที จงหาความเร็วปลาย $\\displaystyle\\lim_{t\\to\\infty}v(t)$"}, "answer": 24, "unit": {"en": "mm/s", "th": "มม./วินาที"}, "why": {"en": "Divide top and bottom by $t$: $\\dfrac{24}{1+0.02/t}\\to\\dfrac{24}{1+0}=24$ mm/s.", "th": "หารทั้งเศษและส่วนด้วย $t$: $\\dfrac{24}{1+0.02/t}\\to\\dfrac{24}{1+0}=24$ มม./วินาที"}, "tol": 0.02, "dp": 3}, {"type": "num", "ex": 3, "q": {"en": "Temperature in a two-layer crust is $T(z)=20+30z$ for $0\\le z\\le10$ km and $T(z)=a+15(z-10)$ for $z>10$ km. Find $a$ so that $T$ is **continuous** at $z=10$.", "th": "อุณหภูมิในเปลือกโลกสองชั้นคือ $T(z)=20+30z$ เมื่อ $0\\le z\\le10$ กม. และ $T(z)=a+15(z-10)$ เมื่อ $z>10$ กม. จงหา $a$ ที่ทำให้ $T$ **ต่อเนื่อง**ที่ $z=10$"}, "answer": 320, "unit": {"en": "°C", "th": "°C"}, "why": {"en": "Continuity needs the left limit, the right limit and $T(10)$ to agree: $20+30(10)=320$ and the right limit is $a$, so $a=320$ °C.", "th": "ความต่อเนื่องต้องการให้ลิมิตซ้าย ลิมิตขวา และ $T(10)$ เท่ากัน: $20+30(10)=320$ และลิมิตขวาคือ $a$ ดังนั้น $a=320$ °C"}, "tol": 0.02, "dp": 0}, {"type": "mc", "ex": 4, "q": {"en": "Let $f(z)=T_{\\text{mantle}}(z)-T_{\\text{solidus}}(z)$ be continuous, with $f(50)<0$ and $f(100)>0$ ($z$ in km). What does the Intermediate Value Theorem guarantee?", "th": "ให้ $f(z)=T_{\\text{mantle}}(z)-T_{\\text{solidus}}(z)$ ต่อเนื่อง โดย $f(50)<0$ และ $f(100)>0$ ($z$ เป็นกม.) ทฤษฎีบทค่าระหว่างกลางรับประกันอะไร"}, "choices": [{"en": "At least one depth between 50 and 100 km where melting starts ($f=0$)", "th": "มีความลึกอย่างน้อยหนึ่งค่าระหว่าง 50 ถึง 100 กม. ที่เริ่มหลอมละลาย ($f=0$)"}, {"en": "The depth is 75 km, the midpoint", "th": "ความลึกนั้นคือ 75 กม. ซึ่งเป็นจุดกึ่งกลาง"}, {"en": "Nothing, because $f$ changes sign", "th": "ไม่รับประกันอะไร เพราะ $f$ เปลี่ยนเครื่องหมาย"}, {"en": "Exactly one such depth", "th": "มีความลึกเช่นนั้นเพียงค่าเดียวพอดี"}], "answer": 0, "why": {"en": "The IVT says a continuous function that changes sign on $[a,b]$ has **at least one** root there. It does not say how many or where; bisection can locate it.", "th": "ทฤษฎีบทค่าระหว่างกลางกล่าวว่าฟังก์ชันต่อเนื่องที่เปลี่ยนเครื่องหมายบน $[a,b]$ มีรากอย่างน้อยหนึ่งค่า แต่ไม่ได้บอกจำนวนหรือตำแหน่ง ซึ่งหาได้ด้วยวิธีแบ่งครึ่งช่วง"}}, {"type": "mc", "ex": 3, "q": {"en": "When does $\\displaystyle\\lim_{z\\to c}T(z)$ exist?", "th": "$\\displaystyle\\lim_{z\\to c}T(z)$ หาค่าได้เมื่อใด"}, "choices": [{"en": "Only when $T$ is a polynomial", "th": "เฉพาะเมื่อ $T$ เป็นพหุนาม"}, {"en": "When both one-sided limits exist and are equal", "th": "เมื่อลิมิตทางเดียวทั้งสองข้างหาค่าได้และเท่ากัน"}, {"en": "When at least one one-sided limit exists", "th": "เมื่อลิมิตทางเดียวอย่างน้อยหนึ่งข้างหาค่าได้"}, {"en": "Whenever $T(c)$ is defined", "th": "เมื่อ $T(c)$ นิยามได้"}], "answer": 1, "why": {"en": "$\\lim_{z\\to c}T$ exists exactly when $\\lim_{z\\to c^-}T=\\lim_{z\\to c^+}T$. The value $T(c)$ itself does not matter for the limit; it matters for continuity.", "th": "$\\lim_{z\\to c}T$ มีค่าก็ต่อเมื่อ $\\lim_{z\\to c^-}T=\\lim_{z\\to c^+}T$ ค่า $T(c)$ ไม่มีผลต่อลิมิต แต่มีผลต่อความต่อเนื่อง"}}], "B": [{"type": "num", "ex": 5, "q": {"en": "Sea level (mm, relative to 1900) is modelled as $S(t)=1.4t+0.0085t^2$ with $t$ in years since 1900. How fast was it rising in 2024 ($t=124$)?", "th": "ระดับน้ำทะเล (มม. เทียบกับปี 1900) จำลองเป็น $S(t)=1.4t+0.0085t^2$ โดย $t$ เป็นปีนับจากปี 1900 ในปี 2024 ($t=124$) ระดับน้ำสูงขึ้นเร็วเท่าใด"}, "answer": 3.508, "unit": {"en": "mm/yr", "th": "มม./ปี"}, "why": {"en": "Power rule: $S'(t)=1.4+0.017t$, so $S'(124)=1.4+2.108=3.51$ mm/yr. A positive $S''=0.017$ means the rise is accelerating.", "th": "กฎกำลัง: $S'(t)=1.4+0.017t$ ดังนั้น $S'(124)=1.4+2.108=3.51$ มม./ปี และ $S''=0.017>0$ แปลว่าการเพิ่มขึ้นกำลังเร่ง"}, "tol": 0.02, "dp": 3}, {"type": "num", "ex": 7, "q": {"en": "Air pressure is $p(z)=1013\\,e^{-z/8}$ hPa ($z$ in km). A weather balloon at $z=8$ km rises at $0.3$ km/min. Find $\\dfrac{dp}{dt}$.", "th": "ความดันอากาศคือ $p(z)=1013\\,e^{-z/8}$ hPa ($z$ เป็นกม.) บอลลูนตรวจอากาศที่ $z=8$ กม. ลอยขึ้นด้วยอัตรา $0.3$ กม./นาที จงหา $\\dfrac{dp}{dt}$"}, "answer": -13.974820271500166, "unit": {"en": "hPa/min", "th": "hPa/นาที"}, "why": {"en": "Chain rule: $\\dfrac{dp}{dt}=\\dfrac{dp}{dz}\\dfrac{dz}{dt}=-\\dfrac{1013}{8}e^{-1}\\times0.3\\approx-13.97$ hPa/min (pressure falls).", "th": "หลักเกณฑ์ลูกโซ่: $\\dfrac{dp}{dt}=\\dfrac{dp}{dz}\\dfrac{dz}{dt}=-\\dfrac{1013}{8}e^{-1}\\times0.3\\approx-13.97$ hPa/นาที (ความดันลดลง)"}, "tol": 0.02, "dp": 3}, {"type": "num", "ex": 8, "q": {"en": "A radiocarbon age is $t=-\\dfrac{5730}{\\ln 2}\\ln f$ yr, where $f$ is the fraction of $^{14}$C remaining. If $f=0.25\\pm0.01$, use $\\dfrac{dt}{df}$ to estimate the age uncertainty $|\\Delta t|$.", "th": "อายุจากคาร์บอนกัมมันตรังสีคือ $t=-\\dfrac{5730}{\\ln 2}\\ln f$ ปี โดย $f$ เป็นสัดส่วน $^{14}$C ที่เหลือ ถ้า $f=0.25\\pm0.01$ จงใช้ $\\dfrac{dt}{df}$ ประมาณความไม่แน่นอนของอายุ $|\\Delta t|$"}, "answer": 330.66570337175045, "unit": {"en": "yr", "th": "ปี"}, "why": {"en": "$\\dfrac{dt}{df}=-\\dfrac{5730}{f\\ln2}$, so $|\\Delta t|\\approx\\dfrac{5730}{0.25\\ln 2}(0.01)\\approx331$ yr around an age of 11,460 yr.", "th": "$\\dfrac{dt}{df}=-\\dfrac{5730}{f\\ln2}$ ดังนั้น $|\\Delta t|\\approx\\dfrac{5730}{0.25\\ln 2}(0.01)\\approx331$ ปี ที่อายุประมาณ 11,460 ปี"}, "tol": 0.03, "dp": 0}, {"type": "num", "ex": 9, "q": {"en": "Earthquake energy satisfies $\\log_{10}E=4.8+1.5M$. How many times more energy does a magnitude 7 release than a magnitude 6?", "th": "พลังงานแผ่นดินไหวเป็นไปตาม $\\log_{10}E=4.8+1.5M$ แผ่นดินไหวขนาด 7 ปล่อยพลังงานมากกว่าขนาด 6 กี่เท่า"}, "answer": 31.622776601683793, "unit": {"en": "times", "th": "เท่า"}, "why": {"en": "$E=10^{4.8+1.5M}$, so $E(7)/E(6)=10^{1.5}\\approx31.6$. Equivalently $\\dfrac{dE}{dM}=1.5\\ln10\\,E$: energy grows at a fixed percentage rate per unit magnitude.", "th": "$E=10^{4.8+1.5M}$ ดังนั้น $E(7)/E(6)=10^{1.5}\\approx31.6$ หรือเขียนได้ว่า $\\dfrac{dE}{dM}=1.5\\ln10\\,E$ คือพลังงานเพิ่มเป็นสัดส่วนคงที่ต่อขนาดหนึ่งหน่วย"}, "tol": 0.02, "dp": 1}, {"type": "mc", "ex": 10, "q": {"en": "Ocean pH is $\\text{pH}=-\\log_{10}[\\text{H}^+]$. What is $\\dfrac{d\\,\\text{pH}}{d[\\text{H}^+]}$?", "th": "ค่า pH ของมหาสมุทรคือ $\\text{pH}=-\\log_{10}[\\text{H}^+]$ จงหา $\\dfrac{d\\,\\text{pH}}{d[\\text{H}^+]}$"}, "choices": [{"en": "$-\\dfrac{1}{[\\text{H}^+]}$", "th": "$-\\dfrac{1}{[\\text{H}^+]}$"}, {"en": "$-\\dfrac{1}{[\\text{H}^+]\\ln 10}$", "th": "$-\\dfrac{1}{[\\text{H}^+]\\ln 10}$"}, {"en": "$-\\dfrac{\\ln 10}{[\\text{H}^+]}$", "th": "$-\\dfrac{\\ln 10}{[\\text{H}^+]}$"}, {"en": "$-\\dfrac{[\\text{H}^+]}{\\ln 10}$", "th": "$-\\dfrac{[\\text{H}^+]}{\\ln 10}$"}], "answer": 1, "why": {"en": "$\\dfrac{d}{dx}\\log_{10}x=\\dfrac{1}{x\\ln10}$. Forgetting the $\\ln 10$ is the most common mistake.", "th": "$\\dfrac{d}{dx}\\log_{10}x=\\dfrac{1}{x\\ln10}$ การลืมตัว $\\ln 10$ เป็นข้อผิดพลาดที่พบบ่อยที่สุด"}}, {"type": "num", "ex": 11, "q": {"en": "Tide height is $h(t)=1.2\\sin\\!\\left(\\dfrac{2\\pi t}{12.42}\\right)$ m, $t$ in hours. What is the **fastest** rate at which the tide rises?", "th": "ความสูงของน้ำขึ้นน้ำลงคือ $h(t)=1.2\\sin\\!\\left(\\dfrac{2\\pi t}{12.42}\\right)$ ม. โดย $t$ เป็นชั่วโมง น้ำขึ้นด้วยอัตรา**สูงสุด**เท่าใด"}, "answer": 0.6070710441719407, "unit": {"en": "m/h", "th": "ม./ชม."}, "why": {"en": "$h'(t)=1.2\\cdot\\dfrac{2\\pi}{12.42}\\cos\\!\\left(\\dfrac{2\\pi t}{12.42}\\right)$, largest when $\\cos=1$ (mid-tide, rising): $0.607$ m/h.", "th": "$h'(t)=1.2\\cdot\\dfrac{2\\pi}{12.42}\\cos\\!\\left(\\dfrac{2\\pi t}{12.42}\\right)$ มีค่ามากสุดเมื่อ $\\cos=1$ (ระดับน้ำกลางขณะกำลังขึ้น): $0.607$ ม./ชม."}, "tol": 0.02, "dp": 3}, {"type": "mc", "ex": 12, "q": {"en": "A fault scarp has elevation $z(x)=\\arctan(x/2)$ (scaled units). What is $z'(x)$?", "th": "ผาเลื่อนมีระดับความสูง $z(x)=\\arctan(x/2)$ (หน่วยปรับมาตรา) จงหา $z'(x)$"}, "choices": [{"en": "$\\dfrac{2}{4+x^2}$", "th": "$\\dfrac{2}{4+x^2}$"}, {"en": "$\\dfrac{2}{1+x^2}$", "th": "$\\dfrac{2}{1+x^2}$"}, {"en": "$\\dfrac{1}{2(1+x^2)}$", "th": "$\\dfrac{1}{2(1+x^2)}$"}, {"en": "$\\dfrac{1}{1+x^2}$", "th": "$\\dfrac{1}{1+x^2}$"}], "answer": 0, "why": {"en": "$\\dfrac{d}{dx}\\arctan u=\\dfrac{u'}{1+u^2}=\\dfrac{1/2}{1+x^2/4}=\\dfrac{2}{4+x^2}$. The slope is largest at $x=0$, the steepest point of the scarp.", "th": "$\\dfrac{d}{dx}\\arctan u=\\dfrac{u'}{1+u^2}=\\dfrac{1/2}{1+x^2/4}=\\dfrac{2}{4+x^2}$ ความชันมากสุดที่ $x=0$ ซึ่งเป็นจุดชันที่สุดของผาเลื่อน"}}, {"type": "num", "ex": 14, "q": {"en": "Wave speed is $c=\\sqrt{\\dfrac{g}{k}\\tanh(kh)}$. For a tsunami $kh\\to0$ and $\\tanh(kh)\\approx kh$. Find the tsunami speed in an ocean $h=4000$ m deep ($g=9.81$ m/s²).", "th": "ความเร็วคลื่นคือ $c=\\sqrt{\\dfrac{g}{k}\\tanh(kh)}$ สำหรับสึนามิ $kh\\to0$ และ $\\tanh(kh)\\approx kh$ จงหาความเร็วสึนามิในมหาสมุทรลึก $h=4000$ ม. ($g=9.81$ ม./วินาที²)"}, "answer": 198.09088823063013, "unit": {"en": "m/s", "th": "ม./วินาที"}, "why": {"en": "With $\\tanh(kh)\\approx kh$, $c\\approx\\sqrt{gh}=\\sqrt{9.81\\times4000}\\approx198$ m/s, about 713 km/h: as fast as a jet.", "th": "เมื่อ $\\tanh(kh)\\approx kh$ จะได้ $c\\approx\\sqrt{gh}=\\sqrt{9.81\\times4000}\\approx198$ ม./วินาที หรือราว 713 กม./ชม. เร็วเท่าเครื่องบินไอพ่น"}, "tol": 0.02, "dp": 0}, {"type": "mc", "ex": 15, "q": {"en": "Which is $\\dfrac{d}{dx}\\tanh^{-1}x$ for $|x|<1$?", "th": "ข้อใดคือ $\\dfrac{d}{dx}\\tanh^{-1}x$ เมื่อ $|x|<1$"}, "choices": [{"en": "$\\dfrac{1}{1-x^2}$", "th": "$\\dfrac{1}{1-x^2}$"}, {"en": "$\\dfrac{1}{\\sqrt{1-x^2}}$", "th": "$\\dfrac{1}{\\sqrt{1-x^2}}$"}, {"en": "$\\dfrac{1}{1+x^2}$", "th": "$\\dfrac{1}{1+x^2}$"}, {"en": "$\\operatorname{sech}^2 x$", "th": "$\\operatorname{sech}^2 x$"}], "answer": 0, "why": {"en": "If $y=\\tanh^{-1}x$ then $x=\\tanh y$, $dx/dy=\\operatorname{sech}^2y=1-\\tanh^2y=1-x^2$, so $dy/dx=1/(1-x^2)$. Compare $\\frac{d}{dx}\\arctan x=1/(1+x^2)$.", "th": "ถ้า $y=\\tanh^{-1}x$ แล้ว $x=\\tanh y$, $dx/dy=\\operatorname{sech}^2y=1-\\tanh^2y=1-x^2$ ดังนั้น $dy/dx=1/(1-x^2)$ เทียบกับ $\\frac{d}{dx}\\arctan x=1/(1+x^2)$"}}], "C": [{"type": "mc", "ex": 16, "q": {"en": "Ground displacement is $u(t)=A\\sin(\\omega t)$. What is the ground **acceleration**?", "th": "การกระจัดของพื้นดินคือ $u(t)=A\\sin(\\omega t)$ ความ**เร่ง**ของพื้นดินคือข้อใด"}, "choices": [{"en": "$A\\omega^2\\sin(\\omega t)$", "th": "$A\\omega^2\\sin(\\omega t)$"}, {"en": "$A\\omega\\cos(\\omega t)$", "th": "$A\\omega\\cos(\\omega t)$"}, {"en": "$-A\\omega^2\\sin(\\omega t)$", "th": "$-A\\omega^2\\sin(\\omega t)$"}, {"en": "$-A\\sin(\\omega t)$", "th": "$-A\\sin(\\omega t)$"}], "answer": 2, "why": {"en": "$v=u'=A\\omega\\cos\\omega t$ and $a=u''=-A\\omega^2\\sin\\omega t$. Each derivative multiplies the amplitude by $\\omega$, so high frequencies dominate accelerograms.", "th": "$v=u'=A\\omega\\cos\\omega t$ และ $a=u''=-A\\omega^2\\sin\\omega t$ การหาอนุพันธ์แต่ละครั้งคูณแอมพลิจูดด้วย $\\omega$ ความถี่สูงจึงเด่นในบันทึกความเร่ง"}}, {"type": "num", "ex": 16, "q": {"en": "With $A=2$ cm and frequency 1 Hz ($\\omega=2\\pi$ rad/s), what is the **maximum** ground acceleration?", "th": "ถ้า $A=2$ ซม. และความถี่ 1 Hz ($\\omega=2\\pi$ เรเดียน/วินาที) ความเร่งของพื้นดิน**สูงสุด**เป็นเท่าใด"}, "answer": 78.95683520871486, "unit": {"en": "cm/s²", "th": "ซม./วินาที²"}, "why": {"en": "$|a|_{\\max}=A\\omega^2=2(2\\pi)^2\\approx79.0$ cm/s², about $0.08\\,g$.", "th": "$|a|_{\\max}=A\\omega^2=2(2\\pi)^2\\approx79.0$ ซม./วินาที² หรือราว $0.08\\,g$"}, "tol": 0.02, "dp": 1}, {"type": "mc", "ex": 17, "q": {"en": "A hillslope profile $z(x)$ evolves by soil creep, $\\dfrac{\\partial z}{\\partial t}=D\\,z''(x)$ with $D>0$. Where is the hillslope being **lowered** (eroded)?", "th": "รูปตัดลาดเขา $z(x)$ เปลี่ยนแปลงจากการคืบของดิน $\\dfrac{\\partial z}{\\partial t}=D\\,z''(x)$ โดย $D>0$ ลาดเขาถูก**กัดเซาะลดระดับ**ที่ใด"}, "choices": [{"en": "Where $z'$ is largest (steepest point)", "th": "ที่ $z'$ มากสุด (จุดชันที่สุด)"}, {"en": "Where $z''>0$ (concave, near the foot)", "th": "ที่ $z''>0$ (เว้า ใกล้เชิงเขา)"}, {"en": "Where $z''<0$ (convex, near the crest)", "th": "ที่ $z''<0$ (นูน ใกล้สันเขา)"}, {"en": "Everywhere at the same rate", "th": "ทุกจุดในอัตราเท่ากัน"}], "answer": 2, "why": {"en": "$\\partial z/\\partial t<0$ exactly where $z''<0$: convex crests erode and concave hollows fill. Steepness alone ($z'$) does not decide it.", "th": "$\\partial z/\\partial t<0$ ตรงที่ $z''<0$ พอดี สันเขาที่นูนถูกกัดเซาะ และแอ่งที่เว้าถูกถม ความชัน ($z'$) อย่างเดียวไม่ได้เป็นตัวกำหนด"}}, {"type": "num", "ex": 18, "q": {"en": "Between two rivers the water table obeys $h^2=400-300\\,\\dfrac{x}{1000}$ ($h$, $x$ in m). Use implicit differentiation to find $\\dfrac{dh}{dx}$ at $x=500$ m.", "th": "ระหว่างแม่น้ำสองสาย ระดับน้ำใต้ดินเป็นไปตาม $h^2=400-300\\,\\dfrac{x}{1000}$ ($h$, $x$ เป็นเมตร) จงใช้การหาอนุพันธ์โดยปริยายหา $\\dfrac{dh}{dx}$ ที่ $x=500$ ม."}, "answer": -0.009486832980505138, "unit": {"en": "", "th": ""}, "why": {"en": "$2h\\,h'=-0.3$, so $h'=-\\dfrac{0.3}{2h}$. At $x=500$, $h=\\sqrt{250}\\approx15.81$ m, giving $h'\\approx-0.00949$ (the water table drops about 9.5 m per km).", "th": "$2h\\,h'=-0.3$ ดังนั้น $h'=-\\dfrac{0.3}{2h}$ ที่ $x=500$ ได้ $h=\\sqrt{250}\\approx15.81$ ม. จึงได้ $h'\\approx-0.00949$ (ระดับน้ำลดลงราว 9.5 ม. ต่อกม.)"}, "tol": 0.02, "dp": 5}, {"type": "mc", "ex": 19, "q": {"en": "A meridian of the Earth is the ellipse $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1$. What is $\\dfrac{dy}{dx}$?", "th": "เส้นเมริเดียนของโลกคือวงรี $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1$ จงหา $\\dfrac{dy}{dx}$"}, "choices": [{"en": "$-\\dfrac{b^2x}{a^2y}$", "th": "$-\\dfrac{b^2x}{a^2y}$"}, {"en": "$\\dfrac{b^2y}{a^2x}$", "th": "$\\dfrac{b^2y}{a^2x}$"}, {"en": "$-\\dfrac{x}{y}$", "th": "$-\\dfrac{x}{y}$"}, {"en": "$-\\dfrac{a^2x}{b^2y}$", "th": "$-\\dfrac{a^2x}{b^2y}$"}], "answer": 0, "why": {"en": "Differentiate both sides: $\\dfrac{2x}{a^2}+\\dfrac{2y\\,y'}{b^2}=0\\Rightarrow y'=-\\dfrac{b^2x}{a^2y}$. With $a=b$ (a sphere) it reduces to $-x/y$.", "th": "หาอนุพันธ์ทั้งสองข้าง: $\\dfrac{2x}{a^2}+\\dfrac{2y\\,y'}{b^2}=0\\Rightarrow y'=-\\dfrac{b^2x}{a^2y}$ ถ้า $a=b$ (ทรงกลม) จะเหลือ $-x/y$"}}, {"type": "num", "ex": 20, "q": {"en": "Gravity is $g(r)=GM/r^2$, so $dg\\approx-\\dfrac{2g}{R}\\,dh$. With $g=9.81$ m/s² and $R=6371$ km, by how much does $g$ change when you climb 100 m? (1 mGal $=10^{-5}$ m/s²)", "th": "แรงโน้มถ่วงคือ $g(r)=GM/r^2$ ดังนั้น $dg\\approx-\\dfrac{2g}{R}\\,dh$ ถ้า $g=9.81$ ม./วินาที² และ $R=6371$ กม. เมื่อขึ้นที่สูง 100 ม. ค่า $g$ เปลี่ยนไปเท่าใด (1 mGal $=10^{-5}$ ม./วินาที²)"}, "answer": -30.795793439020564, "unit": {"en": "mGal", "th": "mGal"}, "why": {"en": "$dg\\approx-\\dfrac{2(9.81)}{6.371\\times10^6}(100)=-3.08\\times10^{-4}$ m/s² $=-30.8$ mGal. This is the free-air correction, 0.3086 mGal per metre.", "th": "$dg\\approx-\\dfrac{2(9.81)}{6.371\\times10^6}(100)=-3.08\\times10^{-4}$ ม./วินาที² $=-30.8$ mGal นี่คือค่าแก้อากาศอิสระ 0.3086 mGal ต่อเมตร"}, "tol": 0.02, "dp": 1}, {"type": "num", "ex": 21, "q": {"en": "Epicentral distance is $d=\\Delta t\\,\\dfrac{V_pV_s}{V_p-V_s}$ with $V_p=6$ and $V_s=3.5$ km/s. If the S–P time $\\Delta t$ is read with an error of $0.2$ s, what is the error in $d$?", "th": "ระยะถึงศูนย์กลางแผ่นดินไหวคือ $d=\\Delta t\\,\\dfrac{V_pV_s}{V_p-V_s}$ โดย $V_p=6$ และ $V_s=3.5$ กม./วินาที ถ้าอ่านเวลา S–P ($\\Delta t$) คลาดเคลื่อน $0.2$ วินาที ระยะ $d$ คลาดเคลื่อนเท่าใด"}, "answer": 1.6800000000000002, "unit": {"en": "km", "th": "กม."}, "why": {"en": "$d$ is linear in $\\Delta t$, so $\\mathrm{d}d=\\dfrac{V_pV_s}{V_p-V_s}\\,\\mathrm{d}(\\Delta t)=8.4\\times0.2=1.68$ km.", "th": "$d$ เป็นเชิงเส้นใน $\\Delta t$ ดังนั้น $\\mathrm{d}d=\\dfrac{V_pV_s}{V_p-V_s}\\,\\mathrm{d}(\\Delta t)=8.4\\times0.2=1.68$ กม."}, "tol": 0.02, "dp": 2}], "D": [{"type": "num", "ex": 22, "q": {"en": "A cinder cone keeps a 30° slope, so $V=\\pi h^3$. Lava adds $3000$ m³/day. How fast is the height growing when $h=50$ m?", "th": "กรวยภูเขาไฟรักษาความชัน 30° ไว้ จึงได้ $V=\\pi h^3$ ลาวาเพิ่มปริมาตร $3000$ ม.³/วัน ความสูงเพิ่มเร็วเท่าใดเมื่อ $h=50$ ม."}, "answer": 0.12732395447351627, "unit": {"en": "m/day", "th": "ม./วัน"}, "why": {"en": "$\\dfrac{dV}{dt}=3\\pi h^2\\dfrac{dh}{dt}\\Rightarrow\\dfrac{dh}{dt}=\\dfrac{3000}{3\\pi(2500)}\\approx0.127$ m/day. The cone grows more slowly as it gets bigger.", "th": "$\\dfrac{dV}{dt}=3\\pi h^2\\dfrac{dh}{dt}\\Rightarrow\\dfrac{dh}{dt}=\\dfrac{3000}{3\\pi(2500)}\\approx0.127$ ม./วัน กรวยโตช้าลงเมื่อใหญ่ขึ้น"}, "tol": 0.02, "dp": 3}, {"type": "mc", "ex": 23, "q": {"en": "A spherical magma chamber of radius $r$ is inflating. Which relation links the rates?", "th": "โพรงแมกมาทรงกลมรัศมี $r$ กำลังพองตัว ความสัมพันธ์ของอัตราข้อใดถูกต้อง"}, "choices": [{"en": "$\\dfrac{dV}{dt}=4\\pi r^2$", "th": "$\\dfrac{dV}{dt}=4\\pi r^2$"}, {"en": "$\\dfrac{dV}{dt}=\\dfrac{4}{3}\\pi r^3\\dfrac{dr}{dt}$", "th": "$\\dfrac{dV}{dt}=\\dfrac{4}{3}\\pi r^3\\dfrac{dr}{dt}$"}, {"en": "$\\dfrac{dV}{dt}=4\\pi r^2\\dfrac{dr}{dt}$", "th": "$\\dfrac{dV}{dt}=4\\pi r^2\\dfrac{dr}{dt}$"}, {"en": "$\\dfrac{dV}{dt}=\\dfrac{4}{3}\\pi\\left(\\dfrac{dr}{dt}\\right)^3$", "th": "$\\dfrac{dV}{dt}=\\dfrac{4}{3}\\pi\\left(\\dfrac{dr}{dt}\\right)^3$"}], "answer": 2, "why": {"en": "Differentiate $V=\\frac43\\pi r^3$ with respect to **time** using the chain rule: $\\dot V=4\\pi r^2\\dot r$. Forgetting the factor $dr/dt$ is the classic error.", "th": "หาอนุพันธ์ $V=\\frac43\\pi r^3$ เทียบกับ**เวลา**ด้วยหลักเกณฑ์ลูกโซ่: $\\dot V=4\\pi r^2\\dot r$ การลืมตัวคูณ $dr/dt$ เป็นข้อผิดพลาดคลาสสิก"}}, {"type": "mc", "ex": 24, "q": {"en": "Minimising the travel time of a seismic ray crossing a boundary between speeds $v_1$ and $v_2$ gives which law?", "th": "การทำให้เวลาเดินทางของรังสีคลื่นไหวสะเทือนที่ผ่านรอยต่อระหว่างความเร็ว $v_1$ และ $v_2$ มีค่าน้อยสุด ให้กฎใด"}, "choices": [{"en": "$\\theta_1=\\theta_2$", "th": "$\\theta_1=\\theta_2$"}, {"en": "$\\dfrac{\\cos\\theta_1}{v_1}=\\dfrac{\\cos\\theta_2}{v_2}$", "th": "$\\dfrac{\\cos\\theta_1}{v_1}=\\dfrac{\\cos\\theta_2}{v_2}$"}, {"en": "$v_1\\sin\\theta_1=v_2\\sin\\theta_2$", "th": "$v_1\\sin\\theta_1=v_2\\sin\\theta_2$"}, {"en": "$\\dfrac{\\sin\\theta_1}{v_1}=\\dfrac{\\sin\\theta_2}{v_2}$", "th": "$\\dfrac{\\sin\\theta_1}{v_1}=\\dfrac{\\sin\\theta_2}{v_2}$"}], "answer": 3, "why": {"en": "Setting $dT/dx=0$ gives $\\dfrac{x}{v_1L_1}=\\dfrac{d-x}{v_2L_2}$, i.e. $\\dfrac{\\sin\\theta_1}{v_1}=\\dfrac{\\sin\\theta_2}{v_2}$ (Snell's law). The ray bends away from the normal in the faster layer.", "th": "ตั้ง $dT/dx=0$ ได้ $\\dfrac{x}{v_1L_1}=\\dfrac{d-x}{v_2L_2}$ คือ $\\dfrac{\\sin\\theta_1}{v_1}=\\dfrac{\\sin\\theta_2}{v_2}$ (กฎของสเนลล์) รังสีหักเหออกจากเส้นตั้งฉากในชั้นที่เร็วกว่า"}}, {"type": "num", "ex": 25, "q": {"en": "Wien's law, found by maximising Planck's function, is $\\lambda_{\\max}=\\dfrac{2898}{T}$ µm. At what wavelength does the Earth ($T=288$ K) radiate most strongly?", "th": "กฎของวีน ซึ่งได้จากการหาค่าสูงสุดของฟังก์ชันของพลังค์ คือ $\\lambda_{\\max}=\\dfrac{2898}{T}$ ไมโครเมตร โลก ($T=288$ K) แผ่รังสีแรงที่สุดที่ความยาวคลื่นเท่าใด"}, "answer": 10.0625, "unit": {"en": "µm", "th": "ไมโครเมตร"}, "why": {"en": "$\\lambda_{\\max}=2898/288\\approx10.1$ µm, in the thermal infrared. The Sun ($T\\approx5800$ K) peaks near $0.5$ µm, visible light.", "th": "$\\lambda_{\\max}=2898/288\\approx10.1$ ไมโครเมตร อยู่ในช่วงอินฟราเรดความร้อน ส่วนดวงอาทิตย์ ($T\\approx5800$ K) มียอดที่ราว $0.5$ ไมโครเมตร คือแสงที่ตามองเห็น"}, "tol": 0.02, "dp": 1}, {"type": "num", "ex": 26, "q": {"en": "A volcanic bomb landed $500$ m from the vent (same height, no air drag). The range is $R=\\dfrac{v^2\\sin2\\theta}{g}$. What is the **minimum** launch speed? ($g=9.81$ m/s²)", "th": "ระเบิดภูเขาไฟตกห่างจากปล่อง $500$ ม. (ระดับเดียวกัน ไม่คิดแรงต้านอากาศ) ระยะตกคือ $R=\\dfrac{v^2\\sin2\\theta}{g}$ ความเร็วต้นที่**น้อยที่สุด**คือเท่าใด ($g=9.81$ ม./วินาที²)"}, "answer": 70.03570517957252, "unit": {"en": "m/s", "th": "ม./วินาที"}, "why": {"en": "For fixed $v$, $R$ is largest when $\\dfrac{dR}{d\\theta}=\\dfrac{2v^2\\cos2\\theta}{g}=0$, i.e. $\\theta=45°$, so $R_{\\max}=v^2/g$ and $v_{\\min}=\\sqrt{gR}=\\sqrt{4905}\\approx70.0$ m/s.", "th": "เมื่อ $v$ คงที่ $R$ มากสุดเมื่อ $\\dfrac{dR}{d\\theta}=\\dfrac{2v^2\\cos2\\theta}{g}=0$ คือ $\\theta=45°$ จึงได้ $R_{\\max}=v^2/g$ และ $v_{\\min}=\\sqrt{gR}=\\sqrt{4905}\\approx70.0$ ม./วินาที"}, "tol": 0.02, "dp": 1}, {"type": "num", "ex": 27, "q": {"en": "In a decay chain, $\\dfrac{N_2}{N_0}=\\dfrac{\\lambda_1}{\\lambda_2-\\lambda_1}\\left(e^{-\\lambda_1t}-e^{-\\lambda_2t}\\right)$. Use L'Hôpital's rule as $\\lambda_2\\to\\lambda_1=\\lambda$, then evaluate at $\\lambda=0.1$, $t=10$.", "th": "ในอนุกรมการสลายตัว $\\dfrac{N_2}{N_0}=\\dfrac{\\lambda_1}{\\lambda_2-\\lambda_1}\\left(e^{-\\lambda_1t}-e^{-\\lambda_2t}\\right)$ จงใช้กฎของโลปีตาลเมื่อ $\\lambda_2\\to\\lambda_1=\\lambda$ แล้วหาค่าที่ $\\lambda=0.1$, $t=10$"}, "answer": 0.36787944117144233, "unit": {"en": "", "th": ""}, "why": {"en": "The form is $0/0$. Differentiating top and bottom with respect to $\\lambda_2$: $\\lambda\\,\\dfrac{t\\,e^{-\\lambda_2 t}}{1}\\to\\lambda t\\,e^{-\\lambda t}=1\\cdot e^{-1}\\approx0.368$.", "th": "อยู่ในรูป $0/0$ หาอนุพันธ์เศษและส่วนเทียบกับ $\\lambda_2$: $\\lambda\\,\\dfrac{t\\,e^{-\\lambda_2 t}}{1}\\to\\lambda t\\,e^{-\\lambda t}=1\\cdot e^{-1}\\approx0.368$"}, "tol": 0.02, "dp": 3}, {"type": "mc", "ex": 28, "q": {"en": "A polluted lake is flushed in $n$ equal steps per year at total rate $r$, so the fraction remaining after one year is $\\left(1-\\frac{r}{n}\\right)^n$. What is the limit as $n\\to\\infty$?", "th": "ทะเลสาบที่ปนเปื้อนถูกชะล้าง $n$ ขั้นเท่า ๆ กันต่อปีที่อัตรารวม $r$ สัดส่วนที่เหลือหลังหนึ่งปีคือ $\\left(1-\\frac{r}{n}\\right)^n$ ลิมิตเมื่อ $n\\to\\infty$ คือข้อใด"}, "choices": [{"en": "$1-r$", "th": "$1-r$"}, {"en": "$e^{-r}$", "th": "$e^{-r}$"}, {"en": "$1$", "th": "$1$"}, {"en": "$0$", "th": "$0$"}], "answer": 1, "why": {"en": "This is a $1^\\infty$ form. Take logs: $n\\ln(1-r/n)\\to-r$ by L'Hôpital, so the limit is $e^{-r}$: continuous flushing gives exponential decay.", "th": "เป็นรูป $1^\\infty$ ใส่ลอการิทึม: $n\\ln(1-r/n)\\to-r$ ด้วยกฎของโลปีตาล ลิมิตจึงเป็น $e^{-r}$ การชะล้างต่อเนื่องให้การลดลงแบบเลขชี้กำลัง"}}], "E": [{"type": "num", "ex": 29, "q": {"en": "Seawater density is $\\rho=1027\\,[1-\\alpha(T-10)+\\beta(S-35)]$ kg/m³ with $\\alpha=2\\times10^{-4}$ /°C and $\\beta=8\\times10^{-4}$ /psu. Find $\\dfrac{\\partial\\rho}{\\partial T}$.", "th": "ความหนาแน่นของน้ำทะเลคือ $\\rho=1027\\,[1-\\alpha(T-10)+\\beta(S-35)]$ กก./ม.³ โดย $\\alpha=2\\times10^{-4}$ /°C และ $\\beta=8\\times10^{-4}$ /psu จงหา $\\dfrac{\\partial\\rho}{\\partial T}$"}, "answer": -0.2054, "unit": {"en": "kg/m³ per °C", "th": "กก./ม.³ ต่อ °C"}, "why": {"en": "Hold $S$ fixed: $\\dfrac{\\partial\\rho}{\\partial T}=-1027\\alpha=-0.205$ kg/m³ per °C. Cooling makes water denser, so it sinks.", "th": "ตรึง $S$ ไว้: $\\dfrac{\\partial\\rho}{\\partial T}=-1027\\alpha=-0.205$ กก./ม.³ ต่อ °C น้ำที่เย็นลงจึงหนาแน่นขึ้นและจมลง"}, "tol": 0.02, "dp": 3}, {"type": "num", "ex": 30, "q": {"en": "A DEM is the plane $z=100+0.03x-0.04y$ (m). What is the slope angle of the ground?", "th": "แบบจำลองความสูงเชิงเลข (DEM) เป็นระนาบ $z=100+0.03x-0.04y$ (ม.) มุมความชันของพื้นเป็นเท่าใด"}, "answer": 2.862405226111748, "unit": {"en": "°", "th": "°"}, "why": {"en": "$\\nabla z=(0.03,-0.04)$, $|\\nabla z|=0.05$, so the slope angle is $\\arctan0.05\\approx2.86°$.", "th": "$\\nabla z=(0.03,-0.04)$, $|\\nabla z|=0.05$ มุมความชันจึงเป็น $\\arctan0.05\\approx2.86°$"}, "tol": 0.02, "dp": 2}, {"type": "mc", "ex": 30, "q": {"en": "On the same DEM, in which direction does surface water flow?", "th": "บน DEM เดียวกัน น้ำผิวดินไหลไปทิศทางใด"}, "choices": [{"en": "Along $\\nabla z=(0.03,\\,-0.04)$", "th": "ตาม $\\nabla z=(0.03,\\,-0.04)$"}, {"en": "Straight along $+x$", "th": "ตรงไปตามแกน $+x$"}, {"en": "Along $-\\nabla z=(-0.03,\\,0.04)$", "th": "ตาม $-\\nabla z=(-0.03,\\,0.04)$"}, {"en": "Along the contour, perpendicular to $\\nabla z$", "th": "ตามเส้นชั้นความสูง ตั้งฉากกับ $\\nabla z$"}], "answer": 2, "why": {"en": "$\\nabla z$ points uphill, so water flows down the steepest descent, $-\\nabla z$: toward $-x$ and $+y$.", "th": "$\\nabla z$ ชี้ขึ้นเนิน น้ำจึงไหลตามทิศลงชันที่สุด $-\\nabla z$ คือไปทาง $-x$ และ $+y$"}}, {"type": "mc", "ex": 31, "q": {"en": "Hydraulic head is $h(x,y)$. The rate of change of head in the direction of a unit vector $\\mathbf u$ is…", "th": "ระดับพลังน้ำคือ $h(x,y)$ อัตราการเปลี่ยนของระดับพลังน้ำในทิศของเวกเตอร์หนึ่งหน่วย $\\mathbf u$ คือ…"}, "choices": [{"en": "$\\partial h/\\partial x$ only", "th": "$\\partial h/\\partial x$ เท่านั้น"}, {"en": "$\\nabla h\\times\\mathbf u$", "th": "$\\nabla h\\times\\mathbf u$"}, {"en": "$|\\nabla h|$ in every direction", "th": "$|\\nabla h|$ ในทุกทิศทาง"}, {"en": "$\\nabla h\\cdot\\mathbf u$, largest when $\\mathbf u$ points along $\\nabla h$", "th": "$\\nabla h\\cdot\\mathbf u$ มากสุดเมื่อ $\\mathbf u$ ชี้ตาม $\\nabla h$"}], "answer": 3, "why": {"en": "$D_{\\mathbf u}h=\\nabla h\\cdot\\mathbf u=|\\nabla h|\\cos\\phi$. It is largest along $\\nabla h$ and zero along a contour; groundwater flows along $-\\nabla h$.", "th": "$D_{\\mathbf u}h=\\nabla h\\cdot\\mathbf u=|\\nabla h|\\cos\\phi$ มากสุดตามทิศ $\\nabla h$ และเป็นศูนย์ตามเส้นชั้น น้ำใต้ดินไหลตาม $-\\nabla h$"}}, {"type": "num", "ex": 32, "q": {"en": "Darcy flow is $Q=\\dfrac{KA\\,\\Delta h}{L}$. The relative errors are 10% in $K$, 2% in $A$, 5% in $\\Delta h$ and 1% in $L$. Use the total differential to find the **worst-case** relative error in $Q$.", "th": "การไหลตามกฎของดาร์ซีคือ $Q=\\dfrac{KA\\,\\Delta h}{L}$ ความคลาดเคลื่อนสัมพัทธ์คือ 10% ใน $K$, 2% ใน $A$, 5% ใน $\\Delta h$ และ 1% ใน $L$ จงใช้ผลต่างเชิงอนุพันธ์รวมหาความคลาดเคลื่อนสัมพัทธ์**กรณีแย่ที่สุด**ของ $Q$"}, "answer": 18, "unit": {"en": "%", "th": "%"}, "why": {"en": "$\\ln Q=\\ln K+\\ln A+\\ln\\Delta h-\\ln L$, so $\\dfrac{dQ}{Q}=\\dfrac{dK}{K}+\\dfrac{dA}{A}+\\dfrac{d\\Delta h}{\\Delta h}-\\dfrac{dL}{L}$. Worst case adds magnitudes: $10+2+5+1=18\\%$. $K$ dominates.", "th": "$\\ln Q=\\ln K+\\ln A+\\ln\\Delta h-\\ln L$ ดังนั้น $\\dfrac{dQ}{Q}=\\dfrac{dK}{K}+\\dfrac{dA}{A}+\\dfrac{d\\Delta h}{\\Delta h}-\\dfrac{dL}{L}$ กรณีแย่ที่สุดรวมขนาด: $10+2+5+1=18\\%$ โดย $K$ มีผลมากที่สุด"}, "tol": 0.02, "dp": 0}, {"type": "mc", "ex": 32, "q": {"en": "A rock's temperature is $T(z,t)$ while it is exhumed, $z=z(t)$. What is $\\dfrac{dT}{dt}$ along its path?", "th": "อุณหภูมิของหินคือ $T(z,t)$ ขณะที่หินถูกยกตัวขึ้น $z=z(t)$ จงหา $\\dfrac{dT}{dt}$ ตามเส้นทางของหิน"}, "choices": [{"en": "$\\dfrac{\\partial T}{\\partial z}\\dfrac{dz}{dt}+\\dfrac{\\partial T}{\\partial t}$", "th": "$\\dfrac{\\partial T}{\\partial z}\\dfrac{dz}{dt}+\\dfrac{\\partial T}{\\partial t}$"}, {"en": "$\\dfrac{\\partial T}{\\partial z}\\dfrac{dz}{dt}$", "th": "$\\dfrac{\\partial T}{\\partial z}\\dfrac{dz}{dt}$"}, {"en": "$\\dfrac{\\partial T}{\\partial t}$", "th": "$\\dfrac{\\partial T}{\\partial t}$"}, {"en": "$\\dfrac{\\partial T}{\\partial z}+\\dfrac{\\partial T}{\\partial t}$", "th": "$\\dfrac{\\partial T}{\\partial z}+\\dfrac{\\partial T}{\\partial t}$"}], "answer": 0, "why": {"en": "Total derivative (chain rule for two variables): the rock cools because the geotherm changes **and** because it moves to shallower depth.", "th": "อนุพันธ์รวม (หลักเกณฑ์ลูกโซ่สองตัวแปร): หินเย็นลงทั้งเพราะเส้นอุณหภูมิตามความลึกเปลี่ยน **และ**เพราะหินเคลื่อนขึ้นมาที่ตื้นกว่า"}}, {"type": "num", "ex": 33, "q": {"en": "A gas bubble in magma obeys $V=nRT/P$. At constant $T$ the pressure drops by 10%. Use differentials to estimate the percentage change in $V$.", "th": "ฟองแก๊สในแมกมาเป็นไปตาม $V=nRT/P$ ที่ $T$ คงที่ ความดันลดลง 10% จงใช้ผลต่างเชิงอนุพันธ์ประมาณร้อยละการเปลี่ยนแปลงของ $V$"}, "answer": 10, "unit": {"en": "%", "th": "%"}, "why": {"en": "$\\dfrac{dV}{V}=\\dfrac{dT}{T}-\\dfrac{dP}{P}=0-(-10\\%)=+10\\%$. Near the surface $P$ is small, so the same pressure drop gives a huge **relative** expansion.", "th": "$\\dfrac{dV}{V}=\\dfrac{dT}{T}-\\dfrac{dP}{P}=0-(-10\\%)=+10\\%$ ใกล้ผิวโลก $P$ มีค่าน้อย ความดันที่ลดลงเท่ากันจึงทำให้ขยายตัว**เชิงสัดส่วน**มาก"}, "tol": 0.02, "dp": 0}], "F": [{"type": "num", "ex": 34, "q": {"en": "Sediment accumulates at $r(t)=2+\\sin(2\\pi t)$ mm/yr with $H(0)=0$. Find the thickness $H(10)$.", "th": "ตะกอนสะสมด้วยอัตรา $r(t)=2+\\sin(2\\pi t)$ มม./ปี โดย $H(0)=0$ จงหาความหนา $H(10)$"}, "answer": 20, "unit": {"en": "mm", "th": "มม."}, "why": {"en": "$H(t)=2t-\\dfrac{\\cos2\\pi t}{2\\pi}+C$ and $H(0)=0$ gives $C=\\dfrac{1}{2\\pi}$. Then $H(10)=20$ mm: the seasonal term cancels over whole years.", "th": "$H(t)=2t-\\dfrac{\\cos2\\pi t}{2\\pi}+C$ และ $H(0)=0$ ให้ $C=\\dfrac{1}{2\\pi}$ ดังนั้น $H(10)=20$ มม. พจน์ตามฤดูกาลหักล้างกันเมื่อครบปี"}, "tol": 0.02, "dp": 1}, {"type": "num", "ex": 35, "q": {"en": "Radioactive heat production in granite is $A(z)=2.5\\,e^{-z/10}$ µW/m³ ($z$ in km). Find the heat flow it supplies from the top 10 km, $\\displaystyle q=\\int_0^{10}A(z)\\,dz$, in mW/m².", "th": "การผลิตความร้อนจากกัมมันตภาพรังสีในหินแกรนิตคือ $A(z)=2.5\\,e^{-z/10}$ ไมโครวัตต์/ม.³ ($z$ เป็นกม.) จงหาฟลักซ์ความร้อนจากชั้นบน 10 กม. $\\displaystyle q=\\int_0^{10}A(z)\\,dz$ ในหน่วย mW/m²"}, "answer": 15.803013970713941, "unit": {"en": "mW/m²", "th": "mW/m²"}, "why": {"en": "Substitute $u=-z/10$: $\\int_0^{10}2.5e^{-z/10}dz=25(1-e^{-1})\\approx15.8$ (µW/m³·km $=$ mW/m²).", "th": "แทนค่า $u=-z/10$: $\\int_0^{10}2.5e^{-z/10}dz=25(1-e^{-1})\\approx15.8$ (ไมโครวัตต์/ม.³·กม. $=$ mW/m²)"}, "tol": 0.02, "dp": 1}, {"type": "num", "ex": 36, "q": {"en": "Seismic velocity grows with depth as $v=2+0.5z$ km/s. The vertical travel time to 4 km is $\\displaystyle\\int_0^4\\frac{dz}{2+0.5z}$. Evaluate it.", "th": "ความเร็วคลื่นไหวสะเทือนเพิ่มตามความลึกเป็น $v=2+0.5z$ กม./วินาที เวลาเดินทางแนวดิ่งถึงความลึก 4 กม. คือ $\\displaystyle\\int_0^4\\frac{dz}{2+0.5z}$ จงหาค่า"}, "answer": 1.3862943611198906, "unit": {"en": "s", "th": "วินาที"}, "why": {"en": "Let $u=2+0.5z$, $du=0.5\\,dz$: $\\displaystyle\\int_2^4\\frac{2\\,du}{u}=2\\ln2\\approx1.386$ s.", "th": "ให้ $u=2+0.5z$, $du=0.5\\,dz$: $\\displaystyle\\int_2^4\\frac{2\\,du}{u}=2\\ln2\\approx1.386$ วินาที"}, "tol": 0.02, "dp": 3}, {"type": "mc", "ex": 37, "q": {"en": "Logistic (Hubbert) production leads to $\\displaystyle\\int\\frac{dx}{x(1-x)}$. Which partial-fraction split is correct?", "th": "การผลิตแบบลอจิสติก (ฮับเบิร์ต) นำไปสู่ $\\displaystyle\\int\\frac{dx}{x(1-x)}$ การแยกเศษส่วนย่อยข้อใดถูกต้อง"}, "choices": [{"en": "$\\dfrac1x-\\dfrac{1}{1-x}$", "th": "$\\dfrac1x-\\dfrac{1}{1-x}$"}, {"en": "$\\dfrac{1}{1-x}-\\dfrac{2}{x}$", "th": "$\\dfrac{1}{1-x}-\\dfrac{2}{x}$"}, {"en": "$\\dfrac{1}{x}\\cdot\\dfrac{1}{1-x}$", "th": "$\\dfrac{1}{x}\\cdot\\dfrac{1}{1-x}$"}, {"en": "$\\dfrac1x+\\dfrac{1}{1-x}$", "th": "$\\dfrac1x+\\dfrac{1}{1-x}$"}], "answer": 3, "why": {"en": "$\\dfrac1x+\\dfrac1{1-x}=\\dfrac{(1-x)+x}{x(1-x)}=\\dfrac{1}{x(1-x)}$ ✓. The integral is $\\ln\\left|\\dfrac{x}{1-x}\\right|+C$.", "th": "$\\dfrac1x+\\dfrac1{1-x}=\\dfrac{(1-x)+x}{x(1-x)}=\\dfrac{1}{x(1-x)}$ ✓ ปริพันธ์คือ $\\ln\\left|\\dfrac{x}{1-x}\\right|+C$"}}, {"type": "num", "ex": 38, "q": {"en": "Evaluate $\\displaystyle\\int_1^2\\frac{dx}{x(x+1)}$ using partial fractions.", "th": "จงหาค่า $\\displaystyle\\int_1^2\\frac{dx}{x(x+1)}$ โดยใช้เศษส่วนย่อย"}, "answer": 0.28768207245178085, "unit": {"en": "", "th": ""}, "why": {"en": "$\\dfrac{1}{x(x+1)}=\\dfrac1x-\\dfrac1{x+1}$, so the integral is $\\Big[\\ln\\dfrac{x}{x+1}\\Big]_1^2=\\ln\\dfrac23-\\ln\\dfrac12=\\ln\\dfrac43\\approx0.288$.", "th": "$\\dfrac{1}{x(x+1)}=\\dfrac1x-\\dfrac1{x+1}$ ปริพันธ์จึงเป็น $\\Big[\\ln\\dfrac{x}{x+1}\\Big]_1^2=\\ln\\dfrac23-\\ln\\dfrac12=\\ln\\dfrac43\\approx0.288$"}, "tol": 0.02, "dp": 3}, {"type": "mc", "ex": 39, "q": {"en": "The gravity of a buried body leads to $\\displaystyle\\int\\frac{dx}{(x^2+z^2)^{3/2}}$. Which substitution should you use?", "th": "แรงโน้มถ่วงจากวัตถุที่ฝังอยู่นำไปสู่ $\\displaystyle\\int\\frac{dx}{(x^2+z^2)^{3/2}}$ ควรใช้การแทนค่าใด"}, "choices": [{"en": "$x=z\\sec\\theta$", "th": "$x=z\\sec\\theta$"}, {"en": "$x=z\\sin\\theta$", "th": "$x=z\\sin\\theta$"}, {"en": "$u=x^2$", "th": "$u=x^2$"}, {"en": "$x=z\\tan\\theta$", "th": "$x=z\\tan\\theta$"}], "answer": 3, "why": {"en": "For $x^2+z^2$ use $x=z\\tan\\theta$, since $z^2\\tan^2\\theta+z^2=z^2\\sec^2\\theta$. The result is $\\dfrac{x}{z^2\\sqrt{x^2+z^2}}+C$. ($\\sin$ suits $z^2-x^2$, $\\sec$ suits $x^2-z^2$.)", "th": "สำหรับ $x^2+z^2$ ใช้ $x=z\\tan\\theta$ เพราะ $z^2\\tan^2\\theta+z^2=z^2\\sec^2\\theta$ ผลลัพธ์คือ $\\dfrac{x}{z^2\\sqrt{x^2+z^2}}+C$ ($\\sin$ ใช้กับ $z^2-x^2$, $\\sec$ ใช้กับ $x^2-z^2$)"}}, {"type": "num", "ex": 40, "q": {"en": "The mean life of a radioactive atom is $\\displaystyle\\bar t=\\int_0^\\infty t\\,\\lambda e^{-\\lambda t}\\,dt$. For $^{14}$C (half-life 5730 yr), find $\\bar t$.", "th": "อายุเฉลี่ยของอะตอมกัมมันตรังสีคือ $\\displaystyle\\bar t=\\int_0^\\infty t\\,\\lambda e^{-\\lambda t}\\,dt$ สำหรับ $^{14}$C (ครึ่งชีวิต 5730 ปี) จงหา $\\bar t$"}, "answer": 8266.64258429376, "unit": {"en": "yr", "th": "ปี"}, "why": {"en": "By parts ($u=t$, $dv=\\lambda e^{-\\lambda t}dt$): $\\bar t=1/\\lambda=\\dfrac{5730}{\\ln2}\\approx8267$ yr, longer than the half-life.", "th": "แยกส่วน ($u=t$, $dv=\\lambda e^{-\\lambda t}dt$): $\\bar t=1/\\lambda=\\dfrac{5730}{\\ln2}\\approx8267$ ปี ซึ่งยาวกว่าครึ่งชีวิต"}, "tol": 0.01, "dp": 0}, {"type": "mc", "ex": 41, "q": {"en": "Using integration by parts, $\\displaystyle\\int x\\,e^{x}\\,dx=$", "th": "ใช้การหาปริพันธ์ทีละส่วน $\\displaystyle\\int x\\,e^{x}\\,dx=$"}, "choices": [{"en": "$xe^x+C$", "th": "$xe^x+C$"}, {"en": "$(x-1)e^x+C$", "th": "$(x-1)e^x+C$"}, {"en": "$\\tfrac12x^2e^x+C$", "th": "$\\tfrac12x^2e^x+C$"}, {"en": "$(x+1)e^x+C$", "th": "$(x+1)e^x+C$"}], "answer": 1, "why": {"en": "$u=x$, $dv=e^xdx$: $xe^x-\\int e^xdx=(x-1)e^x+C$. Check by differentiating: $e^x+(x-1)e^x=xe^x$ ✓.", "th": "$u=x$, $dv=e^xdx$: $xe^x-\\int e^xdx=(x-1)e^x+C$ ตรวจโดยหาอนุพันธ์: $e^x+(x-1)e^x=xe^x$ ✓"}}, {"type": "mc", "ex": 42, "q": {"en": "Omori's law says the aftershock rate falls like $t^{-p}$. When is the total number $\\displaystyle\\int_1^\\infty t^{-p}\\,dt$ finite?", "th": "กฎของโอโมริกล่าวว่าอัตราแผ่นดินไหวตามลดลงแบบ $t^{-p}$ จำนวนรวม $\\displaystyle\\int_1^\\infty t^{-p}\\,dt$ มีค่าจำกัดเมื่อใด"}, "choices": [{"en": "When $p\\ge1$", "th": "เมื่อ $p\\ge1$"}, {"en": "Only when $p>1$", "th": "เฉพาะเมื่อ $p>1$"}, {"en": "Never", "th": "ไม่มีวัน"}, {"en": "When $p>0$", "th": "เมื่อ $p>0$"}], "answer": 1, "why": {"en": "$\\int_1^b t^{-p}dt=\\dfrac{b^{1-p}-1}{1-p}$ tends to $\\dfrac{1}{p-1}$ only if $p>1$. At $p=1$ it is $\\ln b\\to\\infty$.", "th": "$\\int_1^b t^{-p}dt=\\dfrac{b^{1-p}-1}{1-p}$ เข้าใกล้ $\\dfrac{1}{p-1}$ เฉพาะเมื่อ $p>1$ ถ้า $p=1$ จะได้ $\\ln b\\to\\infty$"}}, {"type": "num", "ex": 43, "q": {"en": "Escape velocity follows from $\\displaystyle\\tfrac12v^2=\\int_R^\\infty\\frac{GM}{r^2}\\,dr$. For Io, $GM=5.96\\times10^{12}$ m³/s² and $R=1822$ km. Find $v$ in km/s.", "th": "ความเร็วหลุดพ้นได้จาก $\\displaystyle\\tfrac12v^2=\\int_R^\\infty\\frac{GM}{r^2}\\,dr$ สำหรับดวงจันทร์ไอโอ $GM=5.96\\times10^{12}$ ม.³/วินาที² และ $R=1822$ กม. จงหา $v$ ในหน่วย กม./วินาที"}, "answer": 2.5577844419286233, "unit": {"en": "km/s", "th": "กม./วินาที"}, "why": {"en": "The improper integral is $GM/R$, so $v=\\sqrt{2GM/R}=\\sqrt{2(5.96\\times10^{12})/1.822\\times10^6}\\approx2.56$ km/s. Io's plumes (≈1 km/s) stay bound.", "th": "ปริพันธ์ไม่ตรงแบบมีค่า $GM/R$ ดังนั้น $v=\\sqrt{2GM/R}=\\sqrt{2(5.96\\times10^{12})/1.822\\times10^6}\\approx2.56$ กม./วินาที พวยแก๊สของไอโอ (≈1 กม./วินาที) จึงไม่หลุดออกไป"}, "tol": 0.02, "dp": 2}], "G": [{"type": "num", "ex": 44, "q": {"en": "A river's discharge at $t=0,2,4,6$ h is $10,\\,50,\\,30,\\,10$ m³/s. Use the trapezoidal rule to estimate the volume of water that passed (m³).", "th": "อัตราการไหลของแม่น้ำที่ $t=0,2,4,6$ ชม. คือ $10,\\,50,\\,30,\\,10$ ม.³/วินาที จงใช้กฎสี่เหลี่ยมคางหมูประมาณปริมาตรน้ำที่ไหลผ่าน (ม.³)"}, "answer": 648000.0, "unit": {"en": "m³", "th": "ม.³"}, "why": {"en": "$V=\\int Q\\,dt\\approx\\Delta t\\left(\\tfrac{Q_0}{2}+Q_1+Q_2+\\tfrac{Q_3}{2}\\right)=7200\\,\\text{s}\\times90=648{,}000$ m³. Convert hours to seconds first!", "th": "$V=\\int Q\\,dt\\approx\\Delta t\\left(\\tfrac{Q_0}{2}+Q_1+Q_2+\\tfrac{Q_3}{2}\\right)=7200\\,\\text{วินาที}\\times90=648{,}000$ ม.³ ต้องแปลงชั่วโมงเป็นวินาทีก่อน!"}, "tol": 0.01, "dp": 0}, {"type": "mc", "ex": 44, "q": {"en": "On a hydrograph (discharge $Q$ against time $t$), what does the area under the curve represent?", "th": "บนกราฟอัตราการไหล (อัตราการไหล $Q$ กับเวลา $t$) พื้นที่ใต้เส้นโค้งแทนอะไร"}, "choices": [{"en": "The peak discharge", "th": "อัตราการไหลสูงสุด"}, {"en": "The total volume of water", "th": "ปริมาตรน้ำทั้งหมด"}, {"en": "The average water depth", "th": "ความลึกน้ำเฉลี่ย"}, {"en": "The rate of change of discharge", "th": "อัตราการเปลี่ยนของอัตราการไหล"}], "answer": 1, "why": {"en": "Units: (m³/s) × s = m³. Integrating a rate over time gives the accumulated amount.", "th": "หน่วย: (ม.³/วินาที) × วินาที = ม.³ การหาปริพันธ์ของอัตราเทียบกับเวลาให้ปริมาณสะสม"}}, {"type": "num", "ex": 45, "q": {"en": "Before a landslide the ground was $z_1(x)=x$ and after it $z_2(x)=x^2$ on $0\\le x\\le1$ (scaled units). Find the area of material removed, $\\displaystyle\\int_0^1(z_1-z_2)\\,dx$.", "th": "ก่อนดินถล่มพื้นผิวคือ $z_1(x)=x$ และหลังดินถล่มคือ $z_2(x)=x^2$ บน $0\\le x\\le1$ (หน่วยปรับมาตรา) จงหาพื้นที่ของวัสดุที่ถูกพาออกไป $\\displaystyle\\int_0^1(z_1-z_2)\\,dx$"}, "answer": 0.16666666666666666, "unit": {"en": "", "th": ""}, "why": {"en": "$\\int_0^1(x-x^2)\\,dx=\\tfrac12-\\tfrac13=\\tfrac16\\approx0.167$. On $[0,1]$, $x\\ge x^2$, so no splitting is needed.", "th": "$\\int_0^1(x-x^2)\\,dx=\\tfrac12-\\tfrac13=\\tfrac16\\approx0.167$ บน $[0,1]$ มี $x\\ge x^2$ จึงไม่ต้องแบ่งช่วง"}, "tol": 0.02, "dp": 3}, {"type": "mc", "ex": 45, "q": {"en": "If the before and after profiles **cross** several times, how do you get the total eroded plus deposited area?", "th": "ถ้ารูปตัดก่อนและหลัง**ตัดกัน**หลายครั้ง จะหาพื้นที่ที่ถูกกัดเซาะรวมกับที่ถูกทับถมได้อย่างไร"}, "choices": [{"en": "Integrate $|z_1-z_2|$, splitting the interval at each crossing", "th": "หาปริพันธ์ของ $|z_1-z_2|$ โดยแบ่งช่วงที่จุดตัดแต่ละจุด"}, {"en": "Multiply the maximum gap by the length", "th": "คูณช่องว่างที่มากที่สุดด้วยความยาว"}, {"en": "Integrate $z_1+z_2$", "th": "หาปริพันธ์ของ $z_1+z_2$"}, {"en": "Integrate $z_1-z_2$ over the whole interval once", "th": "หาปริพันธ์ของ $z_1-z_2$ ทั้งช่วงครั้งเดียว"}], "answer": 0, "why": {"en": "A single $\\int(z_1-z_2)$ gives the **net** change, where erosion and deposition cancel. Splitting at the crossings separates the two.", "th": "$\\int(z_1-z_2)$ ครั้งเดียวให้การเปลี่ยนแปลง**สุทธิ** ซึ่งการกัดเซาะและการทับถมหักล้างกัน การแบ่งที่จุดตัดจะแยกสองส่วนนี้ออกจากกัน"}}, {"type": "num", "ex": 46, "q": {"en": "A planet has density $\\rho(r)=\\rho_0\\left(1-\\dfrac{r^2}{R^2}\\right)$. Using $M=\\displaystyle\\int_0^R4\\pi r^2\\rho\\,dr$, what fraction is its mass of a uniform sphere of density $\\rho_0$?", "th": "ดาวเคราะห์ดวงหนึ่งมีความหนาแน่น $\\rho(r)=\\rho_0\\left(1-\\dfrac{r^2}{R^2}\\right)$ ใช้ $M=\\displaystyle\\int_0^R4\\pi r^2\\rho\\,dr$ มวลของดาวนี้เป็นสัดส่วนเท่าใดของทรงกลมสม่ำเสมอที่มีความหนาแน่น $\\rho_0$"}, "answer": 0.4, "unit": {"en": "", "th": ""}, "why": {"en": "$M=4\\pi\\rho_0\\left(\\dfrac{R^3}{3}-\\dfrac{R^3}{5}\\right)=\\dfrac{8\\pi\\rho_0R^3}{15}$; dividing by $\\dfrac43\\pi\\rho_0R^3$ gives $\\dfrac{2}{5}=0.4$.", "th": "$M=4\\pi\\rho_0\\left(\\dfrac{R^3}{3}-\\dfrac{R^3}{5}\\right)=\\dfrac{8\\pi\\rho_0R^3}{15}$ หารด้วย $\\dfrac43\\pi\\rho_0R^3$ ได้ $\\dfrac{2}{5}=0.4$"}, "tol": 0.02, "dp": 2}, {"type": "mc", "ex": 46, "q": {"en": "A uniform sphere has $I/(MR^2)=0.4$. The Earth's value is $0.3307$. What does this tell us?", "th": "ทรงกลมสม่ำเสมอมี $I/(MR^2)=0.4$ แต่ค่าของโลกคือ $0.3307$ ข้อนี้บอกอะไร"}, "choices": [{"en": "The Earth is denser near the surface", "th": "โลกหนาแน่นกว่าใกล้ผิว"}, {"en": "The Earth is hollow", "th": "โลกกลวง"}, {"en": "Mass is concentrated toward the centre (a dense core)", "th": "มวลรวมตัวอยู่ทางใจกลาง (มีแก่นที่หนาแน่น)"}, {"en": "Nothing; 0.33 and 0.4 are equal within error", "th": "ไม่บอกอะไร เพราะ 0.33 กับ 0.4 เท่ากันในขอบเขตความคลาดเคลื่อน"}], "answer": 2, "why": {"en": "$I$ weights mass by $r^2$, so moving mass inward lowers $I/(MR^2)$ below 0.4. The precise value 0.3307 requires a dense (iron) core.", "th": "$I$ ถ่วงมวลด้วย $r^2$ การย้ายมวลเข้าด้านในจึงทำให้ $I/(MR^2)$ ต่ำกว่า 0.4 ค่าที่วัดได้แม่นยำ 0.3307 จึงต้องมีแก่นเหล็กที่หนาแน่น"}}]};

const partName = g => isTH() ? PART_TH[GROUP_NAME[g]] : GROUP_NAME[g];
const partOf = i => ORDER_GROUPS.find(([g]) => GROUP_NAME[g] === EX[i].part)[0];
const weeksOfEx = i => { const w = EX[i].week, n = (w.match(/\d+/g) || []).map(Number);
  return n.length === 2 && /[\u2013-]/.test(w) ? Array.from({ length: n[1] - n[0] + 1 }, (_, j) => n[0] + j) : n; };
const partExamples = g => EX.map((e, i) => i).filter(i => partOf(i) === g);
const partWeeks = g => { const w = [...new Set(partExamples(g).flatMap(weeksOfEx))].sort((a, b) => a - b); return w.length > 1 ? `${w[0]}–${w[w.length - 1]}` : String(w[0]); };
const minus = s => String(s).replace(/^-/, '−');
const fmtAns = it => minus(Number(it.answer.toFixed(it.dp)).toLocaleString('en-US', { maximumFractionDigits: it.dp }));
const parseNum = s => { s = String(s).trim().replace(/[−–]/g, '-').replace(/\s+/g, '');
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, ''); else s = s.replace(',', '.');
  return s === '' || !/^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s) ? NaN : parseFloat(s); };
const quizAns = {}, quizChecked = {};
PARTS.forEach(g => { quizAns[g] = QUIZ[g].map(() => null); quizChecked[g] = false; });
const isRight = (it, a) => a === null || a === '' ? false : it.type === 'mc' ? +a === it.answer
  : (x => isFinite(x) && Math.abs(x - it.answer) <= it.tol * Math.abs(it.answer) + 1e-12)(parseNum(a));
const typeset = el => { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {}); };

function renderQuiz(g) {
  const u = UI[lang], L = lang, items = QUIZ[g], ex = partExamples(g), done = quizChecked[g];
  const k = PARTS.indexOf(g);
  const qHTML = items.map((it, j) => {

    let body;

        const cls = done ? (m === it.answer ? 'is-key' : (a !== null && +a === m ? 'is-wrong' : '')) : '';
        return `<label class="${cls}"><input type="radio" name="${id}" value="${m}"${a !== null && +a === m ? ' checked' : ''}><span class="lt">(${'abcd'[m]})</span><span>${rich(c[L])}</span></label>`; }).join('')}</div>`;
    else body = `<label class="numin"><span>${u.yourAns}</span><input type="text" inputmode="decimal" autocomplete="off" id="${id}-in" value="${a === null ? '' : escHTML(a)}" aria-describedby="${id}-stem"><span>${escHTML(it.unit[L])}</span></label>`;
    const keyTxt = it.type === 'mc' ? `(${'abcd'[it.answer]})` : `${fmtAns(it)}${it.unit[L] ? ' ' + escHTML(it.unit[L]) : ''}`;

  $('view-quiz').innerHTML = `<div class="page-head"><h2>${u.quiz} ${partName(g)}</h2><p>${u.quizIntro}</p>
      <div class="meta"><span class="chip tool">${u.nQ(items.length)}</span><span class="chip week">${u.exRange(ex[0] + 1, ex[ex.length - 1] + 1)}</span><span class="chip week">${u.weeksOf(partWeeks(g))}</span></div></div>
    <ol class="quiz">${qHTML}</ol>

      <span class="score" id="q-score" role="status">${done ? u.score(nRight, items.length) + (nBlank ? ' · ' + u.unanswered(nBlank) : '') : ''}</span></div>
    <div class="qnav">${k > 0 ? `<a class="btn" href="#quiz-${PARTS[k - 1]}">${u.prevQuiz}</a>` : '<span></span>'}

      ${k < PARTS.length - 1 ? `<a class="btn" href="#quiz-${PARTS[k + 1]}">${u.nextQuiz}</a>` : '<span></span>'}</div>`;
  const v = $('view-quiz');
  v.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', () => { quizAns[g][+r.closest('.q').dataset.j] = r.value; }));
  v.querySelectorAll('.numin input').forEach(t => t.addEventListener('input', () => { quizAns[g][+t.closest('.q').dataset.j] = t.value; }));
  $('q-check').addEventListener('click', () => { quizChecked[g] = true; renderQuiz(g); $('q-score').scrollIntoView({ block: 'nearest' }); });
  $('q-clear').addEventListener('click', () => { quizAns[g] = items.map(() => null); quizChecked[g] = false; renderQuiz(g); });
  typeset(v);
}

function renderWeeks() {
  const u = UI[lang], L = lang, loc = isTH() ? 'th-TH' : 'en-GB';
  const day = s => new Date(s + 'T12:00:00');
  const dfmt = s => day(s).toLocaleDateString(loc, { day: 'numeric', month: 'short' });
  const today = new Date(); let now = -1;
  WEEKS.forEach((w, k) => { const start = day(w.date); start.setDate(start.getDate() - 1); /* the week runs Monday to Sunday */
    const next = WEEKS[k + 1] ? day(WEEKS[k + 1].date) : (d => (d.setDate(d.getDate() + 1), d))(day(w.end || w.date));
    if (WEEKS[k + 1]) next.setDate(next.getDate() - 1);
    if (today >= start && today < next) now = k; });
  const rows = WEEKS.map((w, k) => {
    const nums = w.w.match(/\d+/g).map(Number);
    const idx = w.kind ? [] : EX.map((e, i) => i).filter(i => weeksOfEx(i).some(n => nums.includes(n)));
    const parts = [...new Set(idx.map(partOf))];
    const list = idx.length ? `<ul>${idx.map(i => `<li><a href="#ex-${i + 1}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${exTitle(i)}</a></li>`).join('')}</ul>`
      : (w.kind ? '' : `<p class="empty">${u.noEx}</p>`);
    const ql = parts.length ? `<div class="qlinks">${parts.map(g => `<a class="chip tool" href="#quiz-${g}">✎ ${u.quiz} ${g}</a>`).join('')}</div>` : '';
    return `<article class="wk${w.kind ? ' ' + w.kind : ''}${k === now ? ' current' : ''}" id="wk-${k}">
      <div><div class="wn">${u.week} ${w.w}</div><div class="wd">${dfmt(w.date)}${w.end ? ' – ' + dfmt(w.end) : ''}</div>${k === now ? `<span class="chip badge-now">${u.thisWeek}</span>` : ''}</div>
      <div><p class="topic">${escHTML(w.topic[L])}</p>${w.clo ? `<span class="chip week">${w.clo}</span>` : ''}</div>
      <div>${list}${ql}</div></article>`; }).join('');
  $('view-weeks').innerHTML = `<div class="page-head"><h2>${u.mapTitle}</h2><p>${u.mapIntro}</p>
      ${now >= 0 ? `<div class="meta"><a class="btn" href="#weeks" id="go-now">${u.goNow}: ${u.week} ${WEEKS[now].w}</a></div>` : ''}</div>
    <div class="weeks">${rows}</div>`;
  if (now >= 0) $('go-now').addEventListener('click', ev => { ev.preventDefault(); $('wk-' + now).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
}

const state = EX.map(e => Object.fromEntries(e.params.map(q => [q.id, q.value])));

const val = (q, raw) => q.log ? 10 ** raw : raw;
const show = (q, v) => q.names ? tTerm(q.names[Math.round(v)]) : (q.log ? fmt(v, v < 1 ? 4 : 1) : fmt(v, 4));

function update() {
  if (view !== 'ex') return;
  const e = EX[cur], c = C(), p = Object.fromEntries(e.params.map(q => [q.id, val(q, state[cur][q.id])]));
  let r; try { r = e.run(p, c); } catch (err) { $('readouts').innerHTML = `<dt>error</dt><dd>${err.message}</dd>`; return; }
  const thOut = TH[cur].o;
  $('readouts').innerHTML = r.out.map(([k, v, hl], j) => {
    const label = isTH() ? (thOut[j] || k).replace(/\{(\w+)\}/g, (_, id) => Math.round(p[id])) : k;
    return `<dt>${label}</dt><dd${hl ? ' class="hl"' : ''}>${tVal(v)}</dd>`; }).join('');
  if (!window.Plotly) return;

    r.traces.forEach(t => { if (t.name) t.name = tTerm(t.name); if (t.type === 'bar') t.y = t.y.map(tTerm); });
  }

  const merge = (o = {}) => ({ ...axis, ...o, title: { ...axis.title, text: tTerm(typeof o.title === 'string' ? o.title : (o.title && o.title.text) || '') } });
  const L = r.layout || {};
  const layout = { ...L, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { family: (isTH() ? '"IBM Plex Sans Thai", "IBM Plex Sans"' : '"IBM Plex Sans", "IBM Plex Sans Thai"') + ', system-ui, sans-serif', color: c.ink, size: 12 },
    margin: { l: 60, r: L.yaxis2 ? 60 : 20, t: 10, b: 50 }, legend: { orientation: 'h', y: -0.2, font: { size: 11 } }, hovermode: 'closest',
    xaxis: merge(L.xaxis), yaxis: merge(L.yaxis) };

  (layout.annotations || []).forEach(a => { a.text = tTerm(a.text); a.font = { color: c.ink, ...(a.font || {}) }; });
  Plotly.react('chart', r.traces, layout, { displayModeBar: false, responsive: true });
}

function route() {
  const hsh = location.hash, q = /^#quiz-([A-G])$/.exec(hsh);
  if (q && QUIZ[q[1]]) { showView('quiz'); markNav('quiz-' + q[1]); renderQuiz(q[1]); window.scrollTo(0, 0); return; }
  if (hsh === '#weeks') { showView('weeks'); markNav('weeks'); renderWeeks(); window.scrollTo(0, 0); return; }
  const m = /^#ex-(\d+)$/.exec(hsh); const i = m ? Math.min(Math.max(+m[1] - 1, 0), EX.length - 1) : cur;
  const changed = view !== 'ex' || i !== cur; renderExample(i); if (changed && m) window.scrollTo(0, 0);
}
$('prev').addEventListener('click', () => { if (cur > 0) location.hash = 'ex-' + cur; });

{ const m = /^#ex-(\d+)$/.exec(location.hash); cur = m ? Math.min(Math.max(+m[1] - 1, 0), EX.length - 1) : 0; }
