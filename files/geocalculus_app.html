const fill = (x, y, name, color, rgba, extra = {}) => ({ x, y, name, type: 'scatter', mode: 'lines', fill: 'tozeroy', line: { color, width: 2.4 }, fillcolor: rgba, ...extra });
const vline = (x, y0, y1, name, color) => line([x, x], [y0, y1], name, color, { line: { dash: 'dot', width: 1.4 } });
EX.push(
{ part: '2A · Limits & continuity', level: 1, week: 'Week 1', tool: 'Limit at infinity', th: 'ลิมิตที่อนันต์',
  title: 'Terminal settling velocity of a sand grain',
  context: 'A grain dropped into still water speeds up until drag balances gravity. Its speed approaches a limit, the terminal velocity, given by Stokes’ law. This sets how long fine sediment takes to settle out of a river plume or a lake.',
  tex: [String.raw`v(t)=v_t\left(1-e^{-t/\tau}\right),\quad \tau=\frac{v_t}{g}`, String.raw`\lim_{t\to\infty}v(t)=v_t=\frac{(\rho_s-\rho_w)\,g\,D^2}{18\mu}`],
  params: [{ id: 'D', label: 'grain diameter D (mm)', min: 0.01, max: 0.2, step: 0.005, value: 0.1 },
           { id: 'rs', label: 'grain density ρ_s (kg/m³)', min: 2000, max: 5000, step: 50, value: 2650 },
           { id: 'mu', label: 'water viscosity μ (mPa·s)', min: 0.5, max: 2, step: 0.05, value: 1.0 }],
  note: 'Quartz is 2650 kg/m³; heavy minerals such as magnetite (≈5000) settle much faster, which is how placer deposits form. Cold water is more viscous, so grains sink more slowly in winter.',
  run(p, c) { const vt = (p.rs - 1000) * 9.81 * (p.D * 1e-3) ** 2 / (18 * p.mu * 1e-3), tau = vt / 9.81, T = linspace(0, 6 * tau, 200);
    return { traces: [line(T.map(t => t * 1e3), T.map(t => vt * (1 - Math.exp(-t / tau)) * 1e3), 'v(t)', c.s1), line([0, 6 * tau * 1e3], [vt * 1e3, vt * 1e3], 'limit v_t', c.s2, { line: { dash: 'dash', width: 1.5 } })],
      layout: { xaxis: { title: 'time (ms)' }, yaxis: { title: 'settling speed (mm/s)' } },
      out: [['terminal velocity v_t', fmt(vt * 1e3, 3) + ' mm/s', 1], ['time constant τ', fmt(tau * 1e3, 3) + ' ms'], ['speed at t = τ', fmt(vt * (1 - Math.exp(-1)) * 1e3, 3) + ' mm/s (63%)'], ['time to sink 10 m', fmt(10 / vt / 60, 1) + ' min']] }; } },

{ part: '2A · Limits & continuity', level: 1, week: 'Week 2', tool: 'Intermediate Value Theorem', th: 'ความต่อเนื่องและทฤษฎีบทค่าระหว่างกลาง',
  title: 'Where does the mantle start to melt?',
  context: 'Rock melts where the geotherm T(z) reaches the solidus Tₛ(z). f(z) = T(z) − Tₛ(z) is continuous; if it changes sign on an interval, the Intermediate Value Theorem guarantees a root, and bisection finds it.',
  tex: [String.raw`T(z)=15+T_a\left(1-e^{-z/L}\right),\qquad T_s(z)=1100+g\,z`, String.raw`f(a)<0<f(b)\ \Rightarrow\ \exists\,c\in(a,b):\ f(c)=0`],
  params: [{ id: 'Ta', label: 'geotherm scale T_a (°C)', min: 1200, max: 2000, step: 10, value: 1600 },
           { id: 'L', label: 'length scale L (km)', min: 30, max: 100, step: 1, value: 60 },
           { id: 'g', label: 'solidus gradient g (°C/km)', min: 1, max: 4, step: 0.1, value: 2 }],
  note: 'The crossing depth marks where partial melting begins, close to the base of the lithosphere. A hotter geotherm (larger T_a) moves it upward, as under rifts and mid-ocean ridges.',
  run(p, c) { const T = z => 15 + p.Ta * (1 - Math.exp(-z / p.L)), Ts = z => 1100 + p.g * z, f = z => T(z) - Ts(z), Z = linspace(0, 300, 301);
    let a = null, b = null; for (let i = 1; i < Z.length; i++) if (f(Z[i - 1]) < 0 && f(Z[i]) >= 0) { a = Z[i - 1]; b = Z[i]; break; }
    let it = 0, root = null; if (a !== null) { let lo = 0, hi = b; while (hi - lo > 0.01) { const m = (lo + hi) / 2; if (f(m) < 0) lo = m; else hi = m; it++; } root = (lo + hi) / 2; }
    const tr = [line(Z.map(T), Z, 'geotherm T(z)', c.s2), line(Z.map(Ts), Z, 'solidus Tₛ(z)', c.s1, { line: { dash: 'dash' } })];
    if (root !== null) tr.push(pts([T(root)], [root], 'melting starts', c.ink, 11));
    return { traces: tr, layout: { xaxis: { title: 'temperature (°C)' }, yaxis: { title: 'depth (km)', autorange: 'reversed' } },
      out: [['f(50 km)', fmt(f(50), 0) + ' °C'], ['f(100 km)', fmt(f(100), 0) + ' °C'], ['melting depth', root === null ? 'no crossing above 300 km' : fmt(root, 2) + ' km', 1], ['bisection steps (to 0.01 km)', root === null ? '—' : String(it)]] }; } },

{ part: '2B · Derivatives of elementary functions', level: 1, week: 'Week 3', tool: 'Quotient rule', th: 'อนุพันธ์ของผลหาร',
  title: 'How steep can a soil slope be?',
  context: 'For a shallow soil layer on a long hillslope, the factor of safety FS compares resisting and driving forces; FS < 1 means a landslide. FS depends on slope angle β through quotients of trig functions.',
  tex: [String.raw`FS(\beta)=\frac{c}{\gamma z\sin\beta\cos\beta}+\frac{\tan\phi}{\tan\beta}`, String.raw`\frac{dFS}{d\beta}=-\frac{c\,\cos2\beta}{\gamma z\sin^2\!\beta\cos^2\!\beta}-\frac{\tan\phi}{\sin^2\beta}`],
  params: [{ id: 'c', label: 'cohesion c (kPa)', min: 0, max: 20, step: 0.5, value: 5 },
           { id: 'phi', label: 'friction angle φ (°)', min: 20, max: 40, step: 0.5, value: 30 },
           { id: 'z', label: 'soil depth z (m)', min: 0.5, max: 5, step: 0.1, value: 2 },
           { id: 'b', label: 'slope angle β (°)', min: 10, max: 60, step: 0.5, value: 35 }],
  note: 'γ = 19 kN/m³. Heavy monsoon rain reduces effective cohesion; set c near 0 and the critical angle falls to φ itself. That is why so many slopes fail in northern Thailand during the rainy season.',
  run(p, c) { const g = 19, tp = Math.tan(rad(p.phi)), FS = bd => { const b = rad(bd); return p.c / (g * p.z * Math.sin(b) * Math.cos(b)) + tp / Math.tan(b); };
    const dFS = bd => { const b = rad(bd), s = Math.sin(b), co = Math.cos(b); return (-p.c * Math.cos(2 * b) / (g * p.z * s * s * co * co) - tp / (s * s)) * Math.PI / 180; };
    const B = linspace(5, 85, 321); let crit = null; for (let i = 1; i < B.length; i++) if (FS(B[i - 1]) >= 1 && FS(B[i]) < 1) { let lo = B[i - 1], hi = B[i]; for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (FS(m) >= 1) lo = m; else hi = m; } crit = (lo + hi) / 2; break; }
    const f = FS(p.b);
    return { traces: [line(B, B.map(FS), 'FS(β)', c.s1), line([5, 85], [1, 1], 'FS = 1', c.s2, { line: { dash: 'dash', width: 1.5 } }), pts([p.b], [f], 'your slope', c.s2)],
      layout: { xaxis: { title: 'slope angle β (°)' }, yaxis: { title: 'factor of safety FS', range: [0, 4] } },
      out: [['FS at β', fmt(f, 3), 1], ['dFS/dβ', fmt(dFS(p.b), 4) + ' per °'], ['critical angle (FS = 1)', crit === null ? 'none (always stable)' : fmt(crit, 1) + '°'], ['state', f >= 1 ? '<span class="status-ok">stable</span>' : '<span class="status-bad">unstable</span>']] }; } },

{ part: '2B · Derivatives of elementary functions', level: 1, week: 'Week 3', tool: 'Chain rule', th: 'หลักเกณฑ์ลูกโซ่',
  title: 'Pressure change felt by a weather balloon',
  context: 'Air pressure falls exponentially with height. A radiosonde rises at a steady speed, so the pressure it measures changes with time by the chain rule: dP/dt = (dP/dz)(dz/dt).',
  tex: [String.raw`P(z)=1013.25\,e^{-z/H}\ \text{hPa}`, String.raw`\frac{dP}{dt}=\frac{dP}{dz}\cdot\frac{dz}{dt}=-\frac{P}{H}\,w`],
  params: [{ id: 'z', label: 'height z (km)', min: 0, max: 20, step: 0.1, value: 3 },
           { id: 'w', label: 'ascent speed w (m/s)', min: 1, max: 10, step: 0.5, value: 5 },
           { id: 'H', label: 'scale height H (km)', min: 7, max: 9, step: 0.1, value: 8.4 }],
  note: 'The same chain-rule idea gives the decompression rate of magma rising in a volcanic conduit, or the pressure drop felt by a diver ascending.',
  run(p, c) { const P = z => 1013.25 * Math.exp(-z / p.H), Z = linspace(0, 20, 200), dPdz = -P(p.z) / p.H, dPdt = dPdz * p.w / 1000 * 60;
    return { traces: [line(Z.map(P), Z, 'P(z)', c.s1), pts([P(p.z)], [p.z], 'balloon', c.s2)],
      layout: { xaxis: { title: 'pressure (hPa)' }, yaxis: { title: 'height (km)' } },
      out: [['pressure P', fmt(P(p.z), 1) + ' hPa'], ['dP/dz', fmt(dPdz, 2) + ' hPa/km'], ['dP/dt', fmt(dPdt, 3) + ' hPa/min', 1], ['time to reach this height', fmt(p.z * 1000 / p.w / 60, 1) + ' min']] }; } },

{ part: '2B · Derivatives of elementary functions', level: 1, week: 'Week 4', tool: 'Derivative of log₁₀', th: 'อนุพันธ์ของฟังก์ชันลอการิทึม',
  title: 'Ocean acidification and pH',
  context: 'pH = −log₁₀[H⁺]. As the ocean absorbs CO₂, [H⁺] rises. The derivative shows how a small change in [H⁺] maps to a change in pH, and why a "small" pH drop is a large chemical change.',
  tex: [String.raw`\text{pH}=-\log_{10}[\mathrm{H}^+]`, String.raw`\frac{d\,\text{pH}}{d[\mathrm{H}^+]}=-\frac{1}{[\mathrm{H}^+]\ln10}`, String.raw`\Delta\text{pH}\approx-\frac{\Delta[\mathrm{H}^+]}{[\mathrm{H}^+]\ln10}`],
  params: [{ id: 'p0', label: 'pre-industrial pH', min: 7.9, max: 8.3, step: 0.01, value: 8.18 },
           { id: 'p1', label: 'present / future pH', min: 7.6, max: 8.3, step: 0.01, value: 8.07 }],
  note: 'A drop of 0.11 pH units means about 29% more H⁺. Corals and shell-building plankton find it harder to make calcium carbonate in more acidic water.',
  run(p, c) { const H0 = 10 ** -p.p0 * 1e9, H1 = 10 ** -p.p1 * 1e9, Hs = linspace(4, 30, 200), lin = H0 > 0 ? -(H1 - H0) / (H0 * Math.LN10) : 0;
    return { traces: [line(Hs, Hs.map(h => -Math.log10(h * 1e-9)), 'pH', c.s1), line(Hs, Hs.map(h => p.p0 - (h - H0) / (H0 * Math.LN10)), 'tangent at pre-industrial', c.muted, { line: { dash: 'dash', width: 1.2 } }), pts([H0, H1], [p.p0, p.p1], 'then / now', c.s2)],
      layout: { xaxis: { title: '[H⁺] (nmol/L)' }, yaxis: { title: 'pH', range: [7.5, 8.4] } },
      out: [['[H⁺] before', fmt(H0, 2) + ' nmol/L'], ['[H⁺] after', fmt(H1, 2) + ' nmol/L'], ['increase in [H⁺]', fmt((H1 / H0 - 1) * 100, 1) + ' %', 1], ['ΔpH exact', fmt(p.p1 - p.p0, 3)], ['ΔpH from the differential', fmt(lin, 3)]] }; } },

{ part: '2B · Derivatives of elementary functions', level: 1, week: 'Week 4', tool: 'Inverse trigonometric functions', th: 'อนุพันธ์ของฟังก์ชันตรีโกณมิติผกผัน',
  title: 'Apparent dip in a road cut',
  context: 'A rock layer dips at its true dip δ. On a cliff face or cross-section that makes angle β with the strike, the layer appears to dip less, at the apparent dip α. Field geologists use this every day.',
  tex: [String.raw`\tan\alpha=\tan\delta\,\sin\beta\ \Rightarrow\ \alpha(\beta)=\arctan(\tan\delta\sin\beta)`, String.raw`\frac{d\alpha}{d\beta}=\frac{\tan\delta\cos\beta}{1+\tan^2\delta\,\sin^2\beta}`],
  params: [{ id: 'd', label: 'true dip δ (°)', min: 5, max: 85, step: 1, value: 40 },
           { id: 'b', label: 'section angle from strike β (°)', min: 0, max: 90, step: 1, value: 30 }],
  note: 'At β = 90° (section perpendicular to strike) the apparent dip equals the true dip. At β = 0 (parallel to strike) the layer looks horizontal. The derivative is largest near the strike direction.',
  run(p, c) { const td = Math.tan(rad(p.d)), al = b => deg(Math.atan(td * Math.sin(rad(b)))), B = linspace(0, 90, 181), da = td * Math.cos(rad(p.b)) / (1 + td * td * Math.sin(rad(p.b)) ** 2);
    const bh = deg(Math.asin(Math.min(1, Math.tan(rad(p.d / 2)) / td)));
    return { traces: [line(B, B.map(al), 'apparent dip α(β)', c.s1), line([0, 90], [p.d, p.d], 'true dip δ', c.muted, { line: { dash: 'dot', width: 1.2 } }), pts([p.b], [al(p.b)], 'your section', c.s2)],
      layout: { xaxis: { title: 'angle between section and strike β (°)' }, yaxis: { title: 'apparent dip α (°)', range: [0, 90] } },
      out: [['apparent dip α', fmt(al(p.b), 2) + '°', 1], ['dα/dβ', fmt(da, 4) + ' °/°'], ['β where α = δ/2', fmt(bh, 1) + '°']] }; } },

{ part: '2B · Derivatives of elementary functions', level: 2, week: 'Week 5', tool: 'Inverse hyperbolic functions', th: 'ฟังก์ชันไฮเพอร์โบลิกผกผัน',
  title: 'Water depth from satellite images of waves',
  context: 'Satellites can measure the wavelength L of swell approaching a coast, and its period T is known. Inverting the dispersion relation with artanh gives the water depth: a way to map shallow seafloor without a boat.',
  tex: [String.raw`\omega^2=gk\tanh(kh)\ \Rightarrow\ h=\frac{1}{k}\,\operatorname{artanh}\!\left(\frac{\omega^2}{gk}\right)`, String.raw`\frac{d}{dx}\operatorname{artanh}x=\frac{1}{1-x^2},\qquad |x|<1`],
  params: [{ id: 'T', label: 'wave period T (s)', min: 4, max: 16, step: 0.1, value: 10 },
           { id: 'L', label: 'measured wavelength L (m)', min: 20, max: 300, step: 1, value: 100 }],
  note: 'As L approaches the deep-water wavelength gT²/2π, x → 1 and artanh x → ∞: the waves no longer feel the bottom, so depth cannot be measured. The method works only in shallow coastal water.',
  run(p, c) { const g = 9.81, w = 2 * Math.PI / p.T, L0 = g * p.T ** 2 / (2 * Math.PI), h = L => { const k = 2 * Math.PI / L, x = w * w / (g * k); return x < 1 ? Math.atanh(x) / k : NaN; };
    const Ls = linspace(10, L0 * 0.98, 300), hh = h(p.L), dh = (h(p.L + 0.01) - h(p.L - 0.01)) / 0.02, x = w * w / (g * 2 * Math.PI / p.L);
    const tr = [line(Ls, Ls.map(h), 'depth h(L)', c.s1), vline(L0, 0, Math.min(200, Math.max(...Ls.map(h).filter(isFinite))), 'deep-water wavelength', c.muted)];
    if (isFinite(hh)) tr.push(pts([p.L], [hh], 'your wave', c.s2));
    return { traces: tr, layout: { xaxis: { title: 'wavelength L (m)' }, yaxis: { title: 'water depth h (m)', range: [0, 60] } },
      out: [['x = ω²/(gk)', fmt(x, 4)], ['water depth h', isFinite(hh) ? fmt(hh, 2) + ' m' : 'deep water: cannot invert', 1], ['deep-water wavelength gT²/2π', fmt(L0, 1) + ' m'], ['dh/dL', isFinite(dh) ? fmt(dh, 3) + ' m per m' : '—']] }; } },

{ part: '2C · Implicit, higher-order, differentials', level: 2, week: 'Week 6', tool: 'Implicit differentiation', th: 'การหาอนุพันธ์โดยปริยาย',
  title: 'Latitude on an ellipsoidal Earth',
  context: 'Earth is an ellipsoid, flattened at the poles. GPS latitude (geodetic) is the angle of the surface normal, found from the slope of the meridian ellipse by implicit differentiation. It differs from the geocentric angle.',
  tex: [String.raw`\frac{x^2}{a^2}+\frac{z^2}{b^2}=1\ \Rightarrow\ \frac{dz}{dx}=-\frac{b^2x}{a^2z}`, String.raw`\tan\varphi_{\text{geodetic}}=\frac{a^2}{b^2}\tan\psi_{\text{geocentric}}`],
  params: [{ id: 'psi', label: 'geocentric latitude ψ (°)', min: 0, max: 89.5, step: 0.5, value: 45 }],
  note: 'WGS84: a = 6378.137 km, b = 6356.752 km. The difference peaks near 45° at about 0.19°, roughly 21 km on the ground. Ignoring it would put a map of Thailand (latitude 6–20° N) out by up to about 15 km.',
  run(p, c) { const a = 6378.137, b = 6356.752, ph = s => deg(Math.atan(a * a / (b * b) * Math.tan(rad(s)))), S = linspace(0, 89.5, 180);
    const s = rad(p.psi), r = a * b / Math.sqrt((b * Math.cos(s)) ** 2 + (a * Math.sin(s)) ** 2), x = r * Math.cos(s), z = r * Math.sin(s), slope = z > 0 ? -b * b * x / (a * a * z) : -Infinity;
    return { traces: [line(S, S.map(q => (ph(q) - q) * 60), 'φ − ψ', c.s1), pts([p.psi], [(ph(p.psi) - p.psi) * 60], 'your latitude', c.s2)],
      layout: { xaxis: { title: 'geocentric latitude ψ (°)' }, yaxis: { title: 'φ − ψ (arc-minutes)' } },
      out: [['geodetic latitude φ', fmt(ph(p.psi), 4) + '°'], ['φ − ψ', fmt(ph(p.psi) - p.psi, 4) + '°', 1], ['ground distance', fmt((ph(p.psi) - p.psi) * Math.PI / 180 * 6371, 1) + ' km'], ['meridian slope dz/dx', isFinite(slope) ? fmt(slope, 4) : '−∞'], ['radius at ψ', fmt(r, 3) + ' km']] }; } },

{ part: '2C · Implicit, higher-order, differentials', level: 2, week: 'Week 5', tool: 'Second derivative · concavity', th: 'อนุพันธ์อันดับสองและความเว้า',
  title: 'Which parts of a hillslope erode?',
  context: 'Soil creep makes hillslopes behave like heat diffusion: the rate of elevation change equals D times the curvature z″. Convex hilltops (z″ < 0) are lowered; concave footslopes (z″ > 0) build up. The inflection point separates them.',
  tex: [String.raw`z(x)=\frac{H}{1+e^{(x-x_0)/w}}`, String.raw`z''(x)=-\frac{H}{w^2}\,\frac{e^{s}(1-e^{s})}{(1+e^{s})^3},\quad s=\frac{x-x_0}{w}`, String.raw`\frac{\partial z}{\partial t}=D\,z''(x)`],
  params: [{ id: 'H', label: 'relief H (m)', min: 10, max: 100, step: 1, value: 50 },
           { id: 'w', label: 'width scale w (m)', min: 5, max: 50, step: 1, value: 20 },
           { id: 'D', label: 'diffusivity D (m²/yr)', min: 0.001, max: 0.05, step: 0.001, value: 0.01 },
           { id: 'x', label: 'probe position x (m)', min: 0, max: 200, step: 1, value: 70 }],
  note: 'Inflection at x₀ = 100 m. Narrow (small w) hillslopes have large curvature, so they change fastest, which is why sharp fault scarps round off quickly.',
  run(p, c) { const x0 = 100, z = x => p.H / (1 + Math.exp((x - x0) / p.w)), z2 = x => { const e = Math.exp((x - x0) / p.w); return -p.H / (p.w * p.w) * e * (1 - e) / (1 + e) ** 3; };
    const X = linspace(0, 200, 400), rate = x => p.D * z2(x) * 1000, R = X.map(rate), zz = z2(p.x);
    return { traces: [line(X, X.map(z), 'z(x)', c.s1), line(X, R, '∂z/∂t (mm/yr)', c.s2, { yaxis: 'y2' }), pts([p.x], [rate(p.x)], 'probe', c.s2)].map((t, i) => i === 2 ? { ...t, yaxis: 'y2' } : t),
      layout: { xaxis: { title: 'distance x (m)' }, yaxis: { title: 'elevation (m)' }, yaxis2: { title: 'erosion (−) / deposition (+) (mm/yr)', overlaying: 'y', side: 'right', showgrid: false } },
      out: [["z″ at probe", fmt(zz, 5) + ' 1/m'], ['shape', zz < 0 ? 'convex: erodes' : zz > 0 ? 'concave: builds up' : 'inflection'], ['∂z/∂t at probe', fmt(rate(p.x), 3) + ' mm/yr', 1], ['fastest lowering', fmt(Math.min(...R), 3) + ' mm/yr']] }; } },

{ part: '2C · Implicit, higher-order, differentials', level: 2, week: 'Week 6', tool: 'Differentials · error estimate', th: 'ผลต่างเชิงอนุพันธ์และการประมาณความคลาดเคลื่อน',
  title: 'Distance to an earthquake from the S−P time',
  context: 'P waves arrive before S waves. The delay Δt grows with distance d, which gives the classic single-station distance estimate. The differential shows how a timing error in Δt becomes a distance error.',
  tex: [String.raw`\Delta t=\frac{d}{v_s}-\frac{d}{v_p}\ \Rightarrow\ d=\Delta t\,\frac{v_pv_s}{v_p-v_s}`, String.raw`\mathrm{d}d=\frac{v_pv_s}{v_p-v_s}\,\mathrm{d}(\Delta t)`],
  params: [{ id: 'dt', label: 'S−P time Δt (s)', min: 1, max: 60, step: 0.5, value: 12 },
           { id: 'vp', label: 'P-wave speed v_p (km/s)', min: 5, max: 8, step: 0.1, value: 6 },
           { id: 'vs', label: 'S-wave speed v_s (km/s)', min: 2.5, max: 4.5, step: 0.05, value: 3.5 },
           { id: 'e', label: 'picking error (s)', min: 0.05, max: 1, step: 0.05, value: 0.2 }],
  note: 'Rule of thumb: distance ≈ 8 × S−P time (km). Three stations give three circles whose intersection locates the epicentre.',
  run(p, c) { const vs = Math.min(p.vs, p.vp - 0.1), F = p.vp * vs / (p.vp - vs), T = linspace(0, 60, 100);
    return { traces: [line(T, T.map(t => F * (t + p.e)), '+ error', c.muted, { line: { width: 0 }, showlegend: false }), line(T, T.map(t => F * (t - p.e)), '± error', c.muted, { fill: 'tonexty', fillcolor: 'rgba(120,120,120,0.18)', line: { width: 0 } }), line(T, T.map(t => F * t), 'd(Δt)', c.s1), pts([p.dt], [F * p.dt], 'your reading', c.s2)],
      layout: { xaxis: { title: 'S−P time Δt (s)' }, yaxis: { title: 'distance d (km)' } },
      out: [['factor v_p v_s/(v_p − v_s)', fmt(F, 3) + ' km/s'], ['distance d', fmt(F * p.dt, 1) + ' km', 1], ['error ± dd', '± ' + fmt(F * p.e, 2) + ' km'], ['relative error', fmt(p.e / p.dt * 100, 2) + ' %']] }; } },

{ part: '2D · Applications of derivatives', level: 2, week: 'Week 7', tool: 'Optimisation (max/min)', th: 'การหาค่าสูงสุดต่ำสุด',
  title: 'Wien’s law: the colour of the Sun and the Earth',
  context: 'Planck’s law gives the radiation emitted at each wavelength. Setting dB/dλ = 0 gives the peak wavelength. The Sun peaks in visible light; the Earth peaks in the infrared, which is the radiation greenhouse gases absorb.',
  tex: [String.raw`B(\lambda,T)=\frac{2hc^2}{\lambda^5}\,\frac{1}{e^{hc/(\lambda kT)}-1}`, String.raw`\frac{\partial B}{\partial\lambda}=0\Rightarrow 5\left(1-e^{-x}\right)=x,\ x=\frac{hc}{\lambda kT}\approx4.965`, String.raw`\lambda_{\max}=\frac{2898\ \mu\text{m·K}}{T}`],
  params: [{ id: 'T', label: 'temperature T (K)', min: 200, max: 7000, step: 10, value: 5778 }],
  note: 'Try 288 K (Earth’s surface, peak ≈ 10 μm), 1400 K (lava, peak ≈ 2 μm, used by satellites to detect eruptions) and 5778 K (the Sun, ≈ 0.5 μm).',
  run(p, c) { const h = 6.626e-34, cc = 2.998e8, k = 1.381e-23, B = (l, T) => 2 * h * cc * cc / (l ** 5) / (Math.exp(h * cc / (l * k * T)) - 1), Lm = logspace(-1, 2, 400);
    const norm = T => { const v = Lm.map(l => B(l * 1e-6, T)), m = Math.max(...v); return v.map(y => y / m); }, lmax = 2897.77 / p.T;
    const band = lmax < 0.38 ? 'ultraviolet' : lmax < 0.75 ? 'visible' : 'infrared';
    return { traces: [line(Lm, norm(p.T), 'B(λ) at T', c.s2), line(Lm, norm(288), 'Earth 288 K', c.s1, { line: { dash: 'dash', width: 1.4 } }), vline(lmax, 0, 1, 'λ_max', c.s2)],
      layout: { xaxis: { title: 'wavelength (μm)', type: 'log' }, yaxis: { title: 'radiance (normalised)' } },
      out: [['peak wavelength λ_max', fmt(lmax, 3) + ' μm', 1], ['band', band], ['x = hc/(λkT) at peak', '4.965']] }; } },

{ part: '2D · Applications of derivatives', level: 2, week: 'Week 7', tool: 'Related rates', th: 'อัตราการเปลี่ยนแปลงสัมพัทธ์',
  title: 'An inflating magma chamber',
  context: 'Magma flows into a spherical chamber at a known rate. Related rates give how fast its radius grows, and the Mogi model gives how fast the ground above it rises, which GPS and satellite radar can measure.',
  tex: [String.raw`V=\tfrac43\pi r^3\ \Rightarrow\ \frac{dr}{dt}=\frac{1}{4\pi r^2}\frac{dV}{dt}`, String.raw`u_z(\rho)=\frac{3\,\Delta V\,d}{4\pi(\rho^2+d^2)^{3/2}}\ \Rightarrow\ \frac{du_z}{dt}\Big|_{\rho=0}=\frac{3}{4\pi d^2}\frac{dV}{dt}`],
  params: [{ id: 'r', label: 'chamber radius r (km)', min: 0.5, max: 5, step: 0.1, value: 2 },
           { id: 'Q', label: 'inflow dV/dt (million m³/yr)', min: 0.1, max: 10, step: 0.1, value: 1 },
           { id: 'd', label: 'depth to centre d (km)', min: 2, max: 15, step: 0.5, value: 5 }],
  note: 'The radius grows only millimetres per year, yet the surface rises measurably. Uplift is concentrated above the chamber, and the width of the uplift bowl reveals the depth.',
  run(p, c) { const d = Math.max(p.d, p.r + 0.5) * 1e3, Q = p.Q * 1e6, R = linspace(-20, 20, 300), up = rho => 3 * Q * d / (4 * Math.PI * ((rho * 1e3) ** 2 + d * d) ** 1.5) * 1000;
    return { traces: [fill(R, R.map(up), 'uplift rate', c.s1, 'rgba(80,150,170,0.22)')],
      layout: { xaxis: { title: 'distance from centre (km)' }, yaxis: { title: 'uplift rate (mm/yr)' } },
      out: [['dr/dt', fmt(Q / (4 * Math.PI * (p.r * 1e3) ** 2) * 1000, 2) + ' mm/yr'], ['uplift rate above centre', fmt(up(0), 2) + ' mm/yr', 1], ['uplift rate 5 km away', fmt(up(5), 2) + ' mm/yr'], ['uplift after 10 years', fmt(up(0) * 10 / 10, 1) + ' cm']] }; } },

{ part: '2D · Applications of derivatives', level: 2, week: 'Week 7', tool: 'Optimisation (max/min)', th: 'การหาค่าสูงสุดต่ำสุด',
  title: 'How far can a volcanic bomb fly?',
  context: 'Ballistic blocks thrown from a crater follow projectile paths. On flat ground the range is largest at 45°. Launched from a crater rim of height H, the best angle is lower. Field mapping of the farthest bombs gives a minimum ejection speed.',
  tex: [String.raw`R(\theta)=\frac{v\cos\theta}{g}\left(v\sin\theta+\sqrt{v^2\sin^2\theta+2gH}\right)`, String.raw`H=0:\ R=\frac{v^2\sin2\theta}{g},\ \ R'(\theta)=\frac{2v^2\cos2\theta}{g}=0\Rightarrow\theta=45^\circ`],
  params: [{ id: 'v', label: 'ejection speed v (m/s)', min: 50, max: 300, step: 5, value: 140 },
           { id: 'H', label: 'launch height H (m)', min: 0, max: 1000, step: 10, value: 300 },
           { id: 'th', label: 'launch angle θ (°)', min: 5, max: 85, step: 1, value: 45 }],
  note: 'Air drag is ignored, so real ranges are shorter. Hazard maps around volcanoes (e.g. Mayon, Merapi) use the maximum range of ballistics to draw exclusion zones.',
  run(p, c) { const g = 9.81, R = t => { const a = rad(t); return p.v * Math.cos(a) / g * (p.v * Math.sin(a) + Math.sqrt((p.v * Math.sin(a)) ** 2 + 2 * g * p.H)); };
    const best = golden(t => -R(t), 1, 89), A = linspace(1, 89, 177);
    return { traces: [line(A, A.map(t => R(t) / 1000), 'range R(θ)', c.s1), pts([p.th], [R(p.th) / 1000], 'your angle', c.s2), pts([best], [R(best) / 1000], 'maximum', c.ink, 10)],
      layout: { xaxis: { title: 'launch angle θ (°)' }, yaxis: { title: 'range (km)' } },
      out: [['range at θ', fmt(R(p.th) / 1000, 3) + ' km'], ['best angle', fmt(best, 2) + '°', 1], ['maximum range', fmt(R(best) / 1000, 3) + ' km'], ['flat-ground maximum v²/g', fmt(p.v * p.v / g / 1000, 3) + ' km'], ['min speed for bombs at 2 km (H = 0)', fmt(Math.sqrt(g * 2000), 0) + ' m/s']] }; } },

{ part: '2D · Applications of derivatives', level: 2, week: 'Week 8', tool: "L'Hôpital's rule (1^∞ form)", th: 'หลักเกณฑ์โลปีตาลและรูปแบบไม่กำหนด',
  title: 'From yearly flushing to continuous decay',
  context: 'A lake flushes out a fraction k of a pollutant each year. Applied in n smaller steps per year, what remains after t years is (1 − k/n)^{nt}. As n → ∞ this is the indeterminate form 1^∞. Taking logs and using L’Hôpital gives e^{−kt}.',
  tex: [String.raw`\lim_{n\to\infty}\left(1-\frac kn\right)^{nt}\quad(1^\infty)`, String.raw`\ln(\cdot)=t\,\frac{\ln(1-k/n)}{1/n}\ \ \left(\tfrac00\right)\ \xrightarrow{\text{L'H}}\ t\,\frac{\frac{k/n^2}{1-k/n}}{-1/n^2}\to-kt`, String.raw`\Rightarrow\ \lim_{n\to\infty}\left(1-\frac kn\right)^{nt}=e^{-kt}`],
  params: [{ id: 'k', label: 'flushing rate k (per year)', min: 0.05, max: 1, step: 0.01, value: 0.3 },
           { id: 'ln', label: 'steps per year n', min: 0, max: 3, step: 0.05, value: 0, log: true }],
  note: 'n = 1 is yearly, 12 monthly, 365 daily. The stepped curve approaches the smooth exponential. This is why continuous decay laws use e.',
  run(p, c) { const n = Math.max(1, Math.round(p.ln)), T = linspace(0, 10, 600), disc = t => (1 - p.k / n) ** Math.floor(n * t), cont = t => Math.exp(-p.k * t);
    return { traces: [line(T, T.map(disc), `stepwise, n = ${n}`, c.s2, { line: { shape: 'hv', width: 2 } }), line(T, T.map(cont), 'limit e^(−kt)', c.s1, { line: { dash: 'dash' } })],
      layout: { xaxis: { title: 'time t (yr)' }, yaxis: { title: 'fraction remaining', range: [0, 1.02] } },
      out: [['n (rounded)', String(n)], ['(1 − k/n)^(5n)', fmt((1 - p.k / n) ** (5 * n), 5)], ['e^(−5k)', fmt(Math.exp(-5 * p.k), 5), 1], ['difference', fmt(Math.abs((1 - p.k / n) ** (5 * n) - Math.exp(-5 * p.k)), 5)], ['n·ln(1 − k/n) → −k', fmt(n * Math.log(1 - p.k / n), 5)]] }; } },

{ part: '2E · Several variables', level: 3, week: 'Week 11', tool: 'Partial derivatives', th: 'อนุพันธ์ย่อย',
  title: 'Seawater density: temperature vs salinity',
  context: 'Ocean circulation is driven by density, which depends on temperature T and salinity S. The partial derivatives tell how much density changes per degree and per unit of salinity, holding the other fixed.',
  tex: [String.raw`\rho=1027\left[1-\alpha_0(T-10)-\tfrac{\gamma}{2}(T-10)^2+\beta_0(S-35)\right]`, String.raw`\frac{\partial\rho}{\partial T}=-1027\left[\alpha_0+\gamma(T-10)\right],\qquad\frac{\partial\rho}{\partial S}=1027\,\beta_0`, String.raw`\alpha=-\frac1\rho\frac{\partial\rho}{\partial T}`],
  params: [{ id: 'T', label: 'temperature T (°C)', min: 0, max: 30, step: 0.5, value: 25 },
           { id: 'S', label: 'salinity S (g/kg)', min: 32, max: 37, step: 0.1, value: 34 }],
  note: 'α₀ = 1.7×10⁻⁴ /°C, γ = 10⁻⁵ /°C², β₀ = 7.6×10⁻⁴ per g/kg. Cold polar water has a small ∂ρ/∂T, so salinity controls its density. That is why sea-ice formation (which leaves salt behind) drives deep-water formation.',
  run(p, c) { const a0 = 1.7e-4, ga = 1e-5, b0 = 7.6e-4, rho = (T, S) => 1027 * (1 - a0 * (T - 10) - ga / 2 * (T - 10) ** 2 + b0 * (S - 35));
    const Ts = linspace(0, 30, 61), Ss = linspace(32, 37, 51), Z = Ts.map(T => Ss.map(S => rho(T, S))), dT = -1027 * (a0 + ga * (p.T - 10)), dS = 1027 * b0;
    return { traces: [{ x: Ss, y: Ts, z: Z, type: 'contour', colorscale: 'Viridis', reversescale: true, contours: { showlabels: true }, colorbar: { title: { text: 'kg/m³', side: 'right' }, thickness: 12 }, name: 'ρ', hoverinfo: 'z' }, pts([p.S], [p.T], 'your water', c.s2, 12)],
      layout: { showlegend: false, xaxis: { title: 'salinity S (g/kg)' }, yaxis: { title: 'temperature T (°C)' } },
      out: [['density ρ', fmt(rho(p.T, p.S), 3) + ' kg/m³'], ['∂ρ/∂T', fmt(dT, 4) + ' kg/m³ per °C', 1], ['∂ρ/∂S', fmt(dS, 4) + ' kg/m³ per g/kg'], ['thermal expansion α', fmt(-dT / rho(p.T, p.S), 6) + ' /°C'], ['°C that equals 1 g/kg', fmt(Math.abs(dS / dT), 2)]] }; } },

{ part: '2E · Several variables', level: 3, week: 'Week 11', tool: 'Total differential', th: 'ผลต่างเชิงอนุพันธ์รวม',
  title: 'Why eruptions turn explosive near the surface',
  context: 'Gas bubbles in rising magma obey the ideal gas law. The total differential splits the change in bubble volume into a cooling part and a decompression part. Pressure falls with depth, so the same ascent step makes bubbles grow much more near the surface.',
  tex: [String.raw`V=\frac{nRT}{P}\ \Rightarrow\ \frac{dV}{V}=\frac{dT}{T}-\frac{dP}{P}`, String.raw`P=\rho g z,\qquad dP=-\rho g\,dz\ \ (\text{rising by }dz)`],
  params: [{ id: 'z', label: 'depth z (m)', min: 100, max: 5000, step: 50, value: 2000 },
           { id: 'dz', label: 'ascent step dz (m)', min: 10, max: 500, step: 10, value: 100 },
           { id: 'dT', label: 'cooling during step (K)', min: 0, max: 5, step: 0.1, value: 0.5 }],
  note: 'ρ = 2600 kg/m³, T = 1273 K, lithostatic pressure P = ρgz. Cooling barely matters; decompression dominates. When bubbles expand fast enough to fragment the magma, a gentle lava flow becomes an explosive eruption.',
  run(p, c) { const rho = 2600, g = 9.81, T = 1273, P = z => rho * g * z, dz = Math.min(p.dz, p.z - 1), lin = z => (-p.dT / T + rho * g * dz / P(z)) * 100;
    const ex = (T - p.dT) / T * P(p.z) / P(p.z - dz) - 1, Z = linspace(Math.max(2 * dz, 50), 5000, 300);
    return { traces: [line(Z.map(lin), Z, 'growth per step (linear)', c.s1), pts([lin(p.z)], [p.z], 'your depth', c.s2)],
      layout: { xaxis: { title: 'bubble growth per step (%)', type: 'log' }, yaxis: { title: 'depth (m)', autorange: 'reversed' } },
      out: [['pressure P', fmt(P(p.z) / 1e6, 2) + ' MPa'], ['decompression term −dP/P', fmt(rho * g * dz / P(p.z) * 100, 2) + ' %'], ['cooling term dT/T', fmt(-p.dT / T * 100, 3) + ' %'], ['dV/V (total differential)', fmt(lin(p.z), 2) + ' %', 1], ['exact change', fmt(ex * 100, 2) + ' %']] }; } },

{ part: '2E · Several variables', level: 3, week: 'Week 11', tool: 'Gradient · directional derivative', th: 'เกรเดียนต์และอนุพันธ์ระบุทิศทาง',
  title: 'Groundwater flow from three wells',
  context: 'The classic three-point problem: water levels in three wells define a plane h(x, y). Its partial derivatives give the hydraulic gradient, the direction groundwater flows, and how fast. The same method finds strike and dip from three boreholes.',
  tex: [String.raw`h(x,y)=h_0+\frac{\partial h}{\partial x}x+\frac{\partial h}{\partial y}y`, String.raw`\text{flow}\parallel-\nabla h,\qquad v=\frac{K\lVert\nabla h\rVert}{n}`, String.raw`D_{\mathbf u}h=\nabla h\cdot\mathbf u`],
  params: [{ id: 'h1', label: 'well A at (0, 0): head (m)', min: 48, max: 55, step: 0.1, value: 52 },
           { id: 'h2', label: 'well B at (400, 0): head (m)', min: 48, max: 55, step: 0.1, value: 50.4 },
           { id: 'h3', label: 'well C at (100, 300): head (m)', min: 48, max: 55, step: 0.1, value: 50.9 },
           { id: 'K', label: 'conductivity K (m/day)', min: 1, max: 50, step: 1, value: 10 },
           { id: 'n', label: 'porosity n', min: 0.05, max: 0.4, step: 0.01, value: 0.25 }],
  note: 'x points east and y north (metres). A contaminant spilled near well A will move down the gradient at the seepage velocity, so this tells you which way, and how fast, a plume travels.',
  run(p, c) { const bx = (p.h2 - p.h1) / 400, cy = (p.h3 - p.h1 - 100 * bx) / 300, h = (x, y) => p.h1 + bx * x + cy * y, X = linspace(-50, 450, 51), Y = linspace(-50, 350, 41), G = Math.hypot(bx, cy);
    const bearing = (deg(Math.atan2(-bx, -cy)) + 360) % 360, L = G > 0 ? 120 / G : 0;
    return { traces: [{ x: X, y: Y, z: Y.map(y => X.map(x => h(x, y))), type: 'contour', colorscale: 'Blues', contours: { showlabels: true }, colorbar: { title: { text: 'm', side: 'right' }, thickness: 12 }, hoverinfo: 'z', name: 'head' },
      { x: [0, 400, 100], y: [0, 0, 300], text: ['A', 'B', 'C'], type: 'scatter', mode: 'markers+text', textposition: 'top center', marker: { size: 11, color: c.ink }, name: 'wells' },
      { x: [200, 200 - bx * L], y: [100, 100 - cy * L], type: 'scatter', mode: 'lines+markers', line: { color: c.s2, width: 3 }, marker: { size: [10, 0], color: c.s2 }, name: 'flow −∇h' }],
      layout: { showlegend: false, xaxis: { title: 'east x (m)' }, yaxis: { title: 'north y (m)', scaleanchor: 'x' } },
      out: [['∂h/∂x', fmt(bx, 6)], ['∂h/∂y', fmt(cy, 6)], ['gradient |∇h|', fmt(G, 6), 1], ['flow direction', fmt(bearing, 1) + '° (0° = N)'], ['seepage velocity', fmt(p.K * G / p.n, 3) + ' m/day'], ['directional derivative due east', fmt(bx, 6)]] }; } },

{ part: '2F · Integration', level: 3, week: 'Week 12', tool: 'Antiderivative + initial condition', th: 'ปฏิยานุพันธ์และปริพันธ์ไม่จำกัดเขต',
  title: 'Sediment layers paced by Earth’s orbit',
  context: 'Changes in Earth’s orbit (Milankovitch cycles) make sediment accumulate faster and slower in a regular rhythm. Integrating the accumulation rate r(t) with H(0) = 0 gives the thickness of the sedimentary record: cyclostratigraphy.',
  tex: [String.raw`r(t)=r_0+r_1\sin\frac{2\pi t}{P}`, String.raw`H(t)=\int_0^t r\,ds=r_0t+\frac{r_1P}{2\pi}\left(1-\cos\frac{2\pi t}{P}\right)`],
  params: [{ id: 'r0', label: 'mean rate r₀ (cm/kyr)', min: 0.5, max: 5, step: 0.1, value: 2 },
           { id: 'r1', label: 'cyclic part r₁ (cm/kyr)', min: 0, max: 2, step: 0.05, value: 0.8 },
           { id: 'P', label: 'cycle period P (kyr)', min: 20, max: 400, step: 1, value: 100 },
           { id: 't', label: 'elapsed time t (kyr)', min: 0, max: 1000, step: 5, value: 1000 }],
  note: 'Main periods: precession ≈ 21 kyr, obliquity ≈ 41 kyr, eccentricity ≈ 100 and 405 kyr. Counting the rhythmic beds gives an astronomical time scale for the rocks.',
  run(p, c) { const r1 = Math.min(p.r1, p.r0), r = t => p.r0 + r1 * Math.sin(2 * Math.PI * t / p.P), H = t => p.r0 * t + r1 * p.P / (2 * Math.PI) * (1 - Math.cos(2 * Math.PI * t / p.P)), T = linspace(0, 1000, 800);
    return { traces: [line(T, T.map(t => H(t) / 100), 'thickness H(t)', c.s1), line(T, T.map(r), 'rate r(t)', c.s2, { yaxis: 'y2', line: { width: 1.2 } }), pts([p.t], [H(p.t) / 100], 'selected', c.s1)],
      layout: { xaxis: { title: 'time (kyr)' }, yaxis: { title: 'thickness (m)' }, yaxis2: { title: 'rate (cm/kyr)', overlaying: 'y', side: 'right', showgrid: false } },
      out: [['thickness H(t)', fmt(H(p.t) / 100, 3) + ' m', 1], ['average rate H/t', p.t ? fmt(H(p.t) / p.t, 3) + ' cm/kyr' : '—'], ['rate r(t)', fmt(r(p.t), 3) + ' cm/kyr'], ['number of cycles', fmt(p.t / p.P, 1)]] }; } },

{ part: '2F · Integration', level: 3, week: 'Week 13', tool: 'Integration by substitution', th: 'การหาปริพันธ์โดยการเปลี่ยนตัวแปร',
  title: 'Seismic travel time when velocity increases with depth',
  context: 'Rocks get faster with depth as they compact. With a linear velocity v(z) = v₀ + kz, travel time is the integral of slowness 1/v. Substituting u = v₀ + kz turns it into a logarithm. Seismic reflection profiles are recorded in two-way time.',
  tex: [String.raw`t(z)=\int_0^z\frac{d\zeta}{v_0+k\zeta}\ \overset{u=v_0+k\zeta}{=}\ \frac1k\int_{v_0}^{v_0+kz}\frac{du}{u}`, String.raw`=\frac1k\ln\!\left(1+\frac{kz}{v_0}\right),\qquad \text{TWT}=2t(z)`],
  params: [{ id: 'v0', label: 'surface velocity v₀ (km/s)', min: 1.5, max: 3, step: 0.05, value: 1.8 },
           { id: 'k', label: 'gradient k (1/s)', min: 0, max: 1.5, step: 0.05, value: 0.6 },
           { id: 'z', label: 'reflector depth z (km)', min: 0.5, max: 6, step: 0.1, value: 3 }],
  note: 'Assuming a constant velocity would overestimate the depth of deep reflectors, a serious error when siting an oil or geothermal well. Try k = 0: the formula reduces to z/v₀ (a limit you can check with L’Hôpital).',
  run(p, c) { const t = z => p.k > 1e-9 ? Math.log(1 + p.k * z / p.v0) / p.k : z / p.v0, Z = linspace(0, 6, 200);
    return { traces: [line(Z.map(z => 2 * t(z)), Z, 'v = v₀ + kz', c.s1), line(Z.map(z => 2 * z / p.v0), Z, 'constant v₀', c.muted, { line: { dash: 'dash' } }), pts([2 * t(p.z)], [p.z], 'reflector', c.s2)],
      layout: { xaxis: { title: 'two-way time (s)' }, yaxis: { title: 'depth (km)', autorange: 'reversed' } },
      out: [['two-way time', fmt(2 * t(p.z), 3) + ' s', 1], ['if velocity were constant', fmt(2 * p.z / p.v0, 3) + ' s'], ['average velocity z/t', fmt(p.z / t(p.z), 3) + ' km/s'], ['velocity at reflector', fmt(p.v0 + p.k * p.z, 2) + ' km/s']] }; } },

{ part: '2F · Integration', level: 3, week: 'Week 13', tool: 'Partial fractions', th: 'การหาปริพันธ์โดยการแยกเศษส่วนย่อย',
  title: 'Neutralising acid mine drainage',
  context: 'Acidic water from old mines is treated with limestone. In a simple second-order model the reaction rate is proportional to both the remaining acid (a − x) and the remaining carbonate (b − x). Separating variables needs partial fractions.',
  tex: [String.raw`\frac{dx}{dt}=k(a-x)(b-x)`, String.raw`\frac{1}{(a-x)(b-x)}=\frac{1}{b-a}\left(\frac{1}{a-x}-\frac{1}{b-x}\right)`, String.raw`t=\frac{1}{(b-a)k}\ln\frac{a(b-x)}{b(a-x)}`],
  params: [{ id: 'a', label: 'acid a (mmol/L)', min: 0.5, max: 5, step: 0.1, value: 2 },
           { id: 'b', label: 'carbonate b (mmol/L)', min: 0.5, max: 5, step: 0.1, value: 3 },
           { id: 'k', label: 'rate constant k (L/(mmol·h))', min: 0.05, max: 2, step: 0.05, value: 0.5 }],
  note: 'When b < a the carbonate runs out first and the acid can never be fully neutralised. Treatment ponds are sized from the 90 % neutralisation time.',
  run(p, c) { const a = p.a, b = p.b, k = p.k, x = t => { if (Math.abs(a - b) < 1e-9) return a * a * k * t / (1 + a * k * t); const E = Math.exp((b - a) * k * t); return a * b * (E - 1) / (E * b - a); };
    const xt = 0.9 * a, t90 = xt < Math.min(a, b) ? (Math.abs(a - b) < 1e-9 ? xt / (a * k * (a - xt)) : Math.log(a * (b - xt) / (b * (a - xt))) / ((b - a) * k)) : Infinity;
    const tmax = isFinite(t90) ? Math.max(4, t90 * 1.5) : 20, T = linspace(0, tmax, 300);
    return { traces: [line(T, T.map(t => a - x(t)), 'acid remaining a − x', c.s2), line(T, T.map(t => b - x(t)), 'carbonate remaining b − x', c.s1, { line: { dash: 'dash' } })],
      layout: { xaxis: { title: 'time (h)' }, yaxis: { title: 'concentration (mmol/L)' } },
      out: [['time to neutralise 90 %', isFinite(t90) ? fmt(t90, 2) + ' h' : 'never (b < 0.9a)', 1], ['acid left after 2 h', fmt(a - x(2), 3) + ' mmol/L'], ['limit of x as t → ∞', fmt(Math.min(a, b), 2) + ' mmol/L']] }; } },

{ part: '2F · Integration', level: 3, week: 'Week 15', tool: 'Integration by parts (cyclic)', th: 'การหาปริพันธ์โดยการแยกส่วน',
  title: 'How much heat does the ground store in summer?',
  context: 'Seasonal temperature waves soak into the ground, shrinking and lagging with depth. The heat stored is the integral of the temperature excess over depth, which needs integration by parts twice (the integral reappears and is solved for).',
  tex: [String.raw`T(z,t)=\bar T+Ae^{-z/d}\cos\!\left(\omega t-\frac zd\right),\quad d=\sqrt{2\kappa/\omega}`, String.raw`\int_0^\infty e^{-u}\cos(\phi-u)\,du=\frac{\cos\phi+\sin\phi}{2}\quad(\text{parts twice})`, String.raw`Q(t)=\rho c\,A\,d\,\frac{\cos\omega t+\sin\omega t}{2},\quad |Q|_{\max}=\frac{\rho cAd}{\sqrt2}`],
  params: [{ id: 'A', label: 'surface amplitude A (°C)', min: 1, max: 15, step: 0.5, value: 10 },
           { id: 'kap', label: 'diffusivity κ (×10⁻⁷ m²/s)', min: 1, max: 15, step: 0.5, value: 5 },
           { id: 'P', label: 'period (days)', min: 1, max: 365, step: 1, value: 365 },
           { id: 'rc', label: 'heat capacity ρc (MJ/m³/K)', min: 1, max: 3, step: 0.1, value: 2 }],
  note: 'Set the period to 1 day: the daily wave dies out within about 30 cm. The yearly wave reaches a few metres, which is why cellars and ground-source heat pumps work.',
  run(p, c) { const w = 2 * Math.PI / (p.P * 86400), d = Math.sqrt(2 * p.kap * 1e-7 / w), Z = linspace(0, 5 * d, 200), prof = ph => Z.map(z => p.A * Math.exp(-z / d) * Math.cos(ph - z / d)), Qa = p.rc * 1e6 * p.A * d / Math.SQRT2;
    const tr = [0, Math.PI / 2, Math.PI, 1.5 * Math.PI].map((ph, i) => line(prof(ph), Z, ['ωt = 0', 'ωt = π/2', 'ωt = π', 'ωt = 3π/2'][i], [c.s2, c.s3, c.s1, c.s4][i], { line: { width: 1.6 } }));
    tr.push(line(Z.map(z => p.A * Math.exp(-z / d)), Z, 'envelope', c.muted, { line: { dash: 'dot', width: 1 } }), line(Z.map(z => -p.A * Math.exp(-z / d)), Z, 'envelope', c.muted, { line: { dash: 'dot', width: 1 }, showlegend: false }));
    return { traces: tr, layout: { xaxis: { title: 'T − T̄ (°C)' }, yaxis: { title: 'depth (m)', autorange: 'reversed' } },
      out: [['damping depth d', fmt(d, 3) + ' m'], ['depth where amplitude is 5 %', fmt(3 * d, 2) + ' m'], ['stored heat amplitude', fmt(Qa / 1e6, 2) + ' MJ/m²', 1], ['time lag at 1 m depth', fmt((1 / d) / w / 86400, 1) + ' days']] }; } },

{ part: '2F · Integration', level: 3, week: 'Week 16', tool: 'Improper integrals', th: 'ปริพันธ์ไม่ตรงแบบ',
  title: 'Escape velocity: can volcanic ejecta leave the planet?',
  context: 'The work needed to lift a mass from the surface to infinity is an improper integral of gravity. It is finite, so a fast enough projectile escapes. Io’s volcanic plumes rise hundreds of kilometres because its gravity is weak.',
  tex: [String.raw`W=\int_R^\infty\frac{GMm}{r^2}dr=\lim_{b\to\infty}\left[-\frac{GMm}{r}\right]_R^b=\frac{GMm}{R}`, String.raw`v_{\text{esc}}=\sqrt{\frac{2GM}{R}},\qquad \frac1R-\frac1{r_{\max}}=\frac{v^2}{2GM}`],
  params: [{ id: 'body', label: 'body', min: 0, max: 2, step: 1, value: 2, names: ['Earth', 'Moon', 'Io'] },
           { id: 'v', label: 'launch speed v (km/s)', min: 0.1, max: 15, step: 0.05, value: 1 }],
  note: 'Earth GM = 3.986×10¹⁴, R = 6371 km; Moon 4.905×10¹², 1737 km; Io 5.960×10¹², 1822 km (SI units). Io’s Pele and Loki plumes rise 300–400 km.',
  run(p, c) { const B = [[3.986004e14, 6.371e6], [4.9048e12, 1.7374e6], [5.959916e12, 1.8216e6]][Math.round(p.body)], GM = B[0], R = B[1], ve = Math.sqrt(2 * GM / R), v = p.v * 1000;
    const hmax = s => { const q = 1 / R - s * s / (2 * GM); return q > 0 ? (1 / q - R) / 1000 : Infinity; }, V = linspace(0.02 * ve, 0.995 * ve, 300);
    const tr = [line(V.map(s => s / 1000), V.map(hmax), 'maximum height', c.s1), vline(ve / 1000, 1, 1e6, 'escape velocity', c.s2)];
    if (v < ve) tr.push(pts([p.v], [hmax(v)], 'your launch', c.s2));
    return { traces: tr, layout: { xaxis: { title: 'launch speed (km/s)' }, yaxis: { title: 'maximum height (km)', type: 'log', range: [0, 6] } },
      out: [['escape velocity', fmt(ve / 1000, 3) + ' km/s', 1], ['escape energy GM/R', fmt(GM / R / 1e6, 3) + ' MJ/kg'], ['height reached', v < ve ? fmt(hmax(v), 1) + ' km' : 'escapes']] }; } },

{ part: '2G · Applications of integration', level: 3, week: 'Week 17', tool: 'Definite integrals (mass, moment of inertia)', th: 'การประยุกต์ปริพันธ์จำกัดเขต',
  title: 'Weighing the Earth: is the core dense?',
  context: 'Integrating density over spherical shells gives Earth’s mass M and moment of inertia I. A uniform planet has I/(MR²) = 0.4; the measured value 0.3307 means mass is concentrated toward the centre: Earth has a dense iron core.',
  tex: [String.raw`\rho(r)=\rho_0\left(1-\alpha\frac{r^2}{R^2}\right)`, String.raw`M=\int_0^R4\pi r^2\rho\,dr=4\pi\rho_0R^3\left(\tfrac13-\tfrac\alpha5\right)`, String.raw`I=\int_0^R\tfrac{8\pi}{3}r^4\rho\,dr,\quad\frac{I}{MR^2}=\frac23\cdot\frac{\frac15-\frac\alpha7}{\frac13-\frac\alpha5}`],
  params: [{ id: 'al', label: 'density drop α', min: 0, max: 1, step: 0.001, value: 0.794 }],
  note: 'Mean density 5514 kg/m³ fixes ρ₀ for each α. Matching 0.3307 needs α ≈ 0.79, giving a centre density near 10,500 kg/m³. Real seismic models (PREM) put the inner core at about 13,000 kg/m³.',
  run(p, c) { const R = 6.371e6, mean = 5514, r0 = mean / (3 * (1 / 3 - p.al / 5)), f = (2 / 3) * (0.2 - p.al / 7) / (1 / 3 - p.al / 5), X = linspace(0, 1, 100), M = 4 * Math.PI * r0 * R ** 3 * (1 / 3 - p.al / 5);
    return { traces: [line(X, X.map(x => r0 * (1 - p.al * x * x)), 'model ρ(r)', c.s2), line([0, 1], [mean, mean], 'uniform Earth', c.muted, { line: { dash: 'dash', width: 1.3 } })],
      layout: { xaxis: { title: 'r / R' }, yaxis: { title: 'density (kg/m³)', range: [0, 14000] } },
      out: [['centre density ρ₀', fmt(r0, 0) + ' kg/m³'], ['surface density', fmt(r0 * (1 - p.al), 0) + ' kg/m³'], ['I/(MR²)', fmt(f, 4), 1], ['measured', '0.3307'], ['mass M', fmt(M) + ' kg']] }; } }
);

const DETAIL = {"1": {"id": 1, "idea": {"en": "A GPS station only gives positions at certain times, so the simplest velocity we can compute is an **average** velocity: change in position divided by change in time. That is the slope of a secant line. The **instantaneous** velocity is what the average velocity approaches as the time interval $h$ shrinks to zero, and that limit is exactly the definition of the derivative.", "th": "สถานี GPS ให้ตำแหน่งเฉพาะบางช่วงเวลา ความเร็วที่หาได้ง่ายที่สุดจึงเป็น **ความเร็วเฉลี่ย** คือการเปลี่ยนตำแหน่งหารด้วยช่วงเวลา ซึ่งก็คือความชันของเส้นตัดโค้ง (secant line) ส่วน **ความเร็วขณะหนึ่ง** คือค่าที่ความเร็วเฉลี่ยเข้าใกล้เมื่อช่วงเวลา $h$ หดลงเข้าใกล้ศูนย์ ลิมิตนี้ก็คือนิยามของอนุพันธ์ (derivative) นั่นเอง"}, "steps": [{"en": "Write the average velocity between $t_0$ and $t_0+h$ as a difference quotient: $$\\bar v(h)=\\frac{x(t_0+h)-x(t_0)}{h},\\qquad x(t)=50\\ln\\!\\left(1+\\frac{t}{0.5}\\right).$$", "th": "เขียนความเร็วเฉลี่ยระหว่าง $t_0$ ถึง $t_0+h$ เป็นผลหารเชิงผลต่าง (difference quotient): $$\\bar v(h)=\\frac{x(t_0+h)-x(t_0)}{h},\\qquad x(t)=50\\ln\\!\\left(1+\\frac{t}{0.5}\\right)$$"}, {"en": "Evaluate it at $t_0=1$ yr for shrinking $h$. With $h=0.5$: $\\bar v=28.77$ mm/yr; $h=0.1$: $32.27$; $h=0.01$: $33.22$; $h=0.001$: $33.32$ mm/yr. Using $h<0$ (an interval before $t_0$) gives $40.55,\\ 34.50,\\ 33.44,\\ 33.34$ mm/yr.", "th": "คำนวณที่ $t_0=1$ ปี โดยให้ $h$ เล็กลงเรื่อย ๆ เมื่อ $h=0.5$ ได้ $\\bar v=28.77$ มม./ปี $h=0.1$ ได้ $32.27$ $h=0.01$ ได้ $33.22$ และ $h=0.001$ ได้ $33.32$ มม./ปี ถ้าใช้ $h<0$ (ช่วงเวลาก่อน $t_0$) จะได้ $40.55,\\ 34.50,\\ 33.44,\\ 33.34$ มม./ปี"}, {"en": "Both one-sided sequences close in on the same number from opposite sides, so the two-sided limit exists. The right-hand values are too small and the left-hand values too big because the curve is bending downward (concave down).", "th": "ค่าจากทั้งสองด้านบีบเข้าหาค่าเดียวกันจากคนละฝั่ง ลิมิตสองข้างจึงมีค่า ค่าจากด้านขวาน้อยเกินไปและค่าจากด้านซ้ายมากเกินไป เพราะกราฟโค้งลง (เว้าลง)"}, {"en": "Find the exact limit with the chain rule: $$v(t)=x'(t)=50\\cdot\\frac{1}{1+t/0.5}\\cdot\\frac{1}{0.5}=\\frac{50}{0.5+t}.$$", "th": "หาค่าลิมิตที่แท้จริงด้วยหลักเกณฑ์ลูกโซ่ (chain rule): $$v(t)=x'(t)=50\\cdot\\frac{1}{1+t/0.5}\\cdot\\frac{1}{0.5}=\\frac{50}{0.5+t}$$"}, {"en": "Substitute $t_0=1$: $v(1)=50/1.5=33.33$ mm/yr, which matches the trend of the table. In the app the default $h\\approx0.50$ gives secants of $28.76$ and $40.57$ mm/yr, an error of about $4.6$ mm/yr that disappears as $h\\to0$.", "th": "แทน $t_0=1$ ได้ $v(1)=50/1.5=33.33$ มม./ปี ตรงกับแนวโน้มในตาราง ในแอปค่าเริ่มต้น $h\\approx0.50$ ให้ความชันเส้นตัดโค้ง $28.76$ และ $40.57$ มม./ปี คลาดเคลื่อนราว $4.6$ มม./ปี และความคลาดเคลื่อนนี้หายไปเมื่อ $h\\to0$"}], "meaning": {"en": "One year after the earthquake the station still moves about **33 mm/yr**, comparable to plate-tectonic speeds, so afterslip is a big signal in GPS data. Because $v=50/(0.5+t)$ decreases with time, the station slows down: right after the earthquake ($t=0$) it moves at 100 mm/yr. Geodesists fit curves like this to separate afterslip from steady plate motion.", "th": "หนึ่งปีหลังแผ่นดินไหว สถานียังเคลื่อนที่ราว **33 มม./ปี** ซึ่งพอ ๆ กับความเร็วของแผ่นเปลือกโลก การเลื่อนหลังแผ่นดินไหว (afterslip) จึงเป็นสัญญาณขนาดใหญ่ในข้อมูล GPS เนื่องจาก $v=50/(0.5+t)$ ลดลงตามเวลา สถานีจึงเคลื่อนช้าลง ทันทีหลังแผ่นดินไหว ($t=0$) สถานีเคลื่อนที่ 100 มม./ปี นักมาตรวิทยาธรณีจึงใช้เส้นโค้งแบบนี้แยกการเลื่อนหลังแผ่นดินไหวออกจากการเคลื่อนที่คงที่ของแผ่นเปลือกโลก"}, "pitfalls": [{"en": "Putting $h=0$ directly into the difference quotient gives $0/0$, which is undefined. The limit is about what happens as $h$ approaches 0, not at $h=0$.", "th": "แทน $h=0$ ลงในผลหารเชิงผลต่างโดยตรงจะได้ $0/0$ ซึ่งไม่นิยาม ลิมิตพูดถึงสิ่งที่เกิดขึ้นเมื่อ $h$ เข้าใกล้ 0 ไม่ใช่ที่ $h=0$"}, {"en": "Forgetting the inner derivative $1/0.5$ in the chain rule and writing $v=50/(1+t/0.5)$, which is too small by a factor of 2.", "th": "ลืมคูณอนุพันธ์ของฟังก์ชันข้างใน $1/0.5$ ตามหลักเกณฑ์ลูกโซ่ แล้วเขียน $v=50/(1+t/0.5)$ ซึ่งน้อยไป 2 เท่า"}, {"en": "Checking only one side ($h>0$). A limit exists only if the left and right limits agree.", "th": "ตรวจเพียงด้านเดียว ($h>0$) ลิมิตจะมีค่าก็ต่อเมื่อลิมิตซ้ายและลิมิตขวาเท่ากัน"}]}, "2": {"id": 2, "idea": {"en": "A piecewise function is continuous at a joining point only if the left-hand limit, the right-hand limit and the function value all agree. Temperature is a physical quantity that cannot jump inside the Earth, so we **choose** the constant $c$ to make the two pieces meet. The derivative (the gradient) is allowed to jump, and checking its one-sided limits shows a kink.", "th": "ฟังก์ชันที่นิยามเป็นช่วง (piecewise function) จะต่อเนื่องที่จุดเชื่อมได้ก็ต่อเมื่อลิมิตซ้าย ลิมิตขวา และค่าฟังก์ชันเท่ากันทั้งหมด อุณหภูมิเป็นปริมาณทางกายภาพที่กระโดดไม่ได้ภายในโลก เราจึง **เลือก** ค่าคงตัว $c$ ให้สองช่วงมาบรรจบกัน ส่วนอนุพันธ์ (ความชันอุณหภูมิ) กระโดดได้ และการตรวจลิมิตข้างเดียวของมันจะแสดงให้เห็นจุดหักมุม (kink)"}, "steps": [{"en": "Write the model with the default values $g_1=25$ °C/km, $g_2=15$ °C/km and contact depth $z_c=10$ km: $$T(z)=\\begin{cases}15+25z,& z\\le10\\\\ c+15z,& z>10.\\end{cases}$$", "th": "เขียนแบบจำลองด้วยค่าเริ่มต้น $g_1=25$ °C/กม. $g_2=15$ °C/กม. และความลึกรอยต่อ $z_c=10$ กม.: $$T(z)=\\begin{cases}15+25z,& z\\le10\\\\ c+15z,& z>10\\end{cases}$$"}, {"en": "Left-hand limit (from the sediment above): $\\lim_{z\\to10^-}T=15+25(10)=265$ °C. Right-hand limit (from the basement below): $\\lim_{z\\to10^+}T=c+15(10)=c+150$.", "th": "ลิมิตซ้าย (จากชั้นตะกอนด้านบน): $\\lim_{z\\to10^-}T=15+25(10)=265$ °C ลิมิตขวา (จากหินฐานด้านล่าง): $\\lim_{z\\to10^+}T=c+15(10)=c+150$"}, {"en": "Continuity requires the two limits to be equal: $c+150=265$, so $c=115$ °C. In general $c=15+(g_1-g_2)z_c$.", "th": "ความต่อเนื่องต้องการให้ลิมิตทั้งสองเท่ากัน: $c+150=265$ จึงได้ $c=115$ °C ในกรณีทั่วไป $c=15+(g_1-g_2)z_c$"}, {"en": "Now look at the derivative: $T'(z)=25$ for $z<10$ and $T'(z)=15$ for $z>10$. The one-sided limits of $T'$ differ, so $T$ is continuous but **not differentiable** at $z=10$ km (a corner in the graph).", "th": "ต่อไปดูอนุพันธ์: $T'(z)=25$ เมื่อ $z<10$ และ $T'(z)=15$ เมื่อ $z>10$ ลิมิตข้างเดียวของ $T'$ ไม่เท่ากัน ดังนั้น $T$ ต่อเนื่องแต่ **หาอนุพันธ์ไม่ได้** ที่ $z=10$ กม. (กราฟมีมุม)"}, {"en": "Physics fixes what must match: heat flow $q=k\\,T'(z)$ is continuous, so $k_1g_1=k_2g_2$ and $k_2/k_1=g_1/g_2=25/15\\approx1.67$. Finally, $T(40)=115+15(40)=715$ °C.", "th": "ฟิสิกส์บอกว่าปริมาณที่ต้องเท่ากันคือ การไหลของความร้อน $q=k\\,T'(z)$ ดังนั้น $k_1g_1=k_2g_2$ และ $k_2/k_1=g_1/g_2=25/15\\approx1.67$ สุดท้าย $T(40)=115+15(40)=715$ °C"}], "meaning": {"en": "The contact is at **265 °C**, and the basement conducts heat about **1.67 times** better than the sediment, which is reasonable for granite under shale. A kink in a measured borehole temperature profile is therefore a clue to a change in rock type, not a mistake in the data.", "th": "อุณหภูมิที่รอยต่อคือ **265 °C** และหินฐานนำความร้อนได้ดีกว่าชั้นตะกอนราว **1.67 เท่า** ซึ่งสมเหตุสมผลสำหรับหินแกรนิตที่อยู่ใต้หินดินดาน จุดหักมุมในโปรไฟล์อุณหภูมิที่วัดจากหลุมเจาะจึงเป็นเบาะแสของการเปลี่ยนชนิดหิน ไม่ใช่ความผิดพลาดของข้อมูล"}, "pitfalls": [{"en": "Making the gradients equal instead of the temperatures. Continuity is about $T$, not $T'$.", "th": "ทำให้ความชันเท่ากันแทนที่จะทำให้อุณหภูมิเท่ากัน ความต่อเนื่องพูดถึง $T$ ไม่ใช่ $T'$"}, {"en": "Thinking that continuous means differentiable. A continuous function can have a corner, like $|x|$ at 0.", "th": "คิดว่าต่อเนื่องแปลว่าหาอนุพันธ์ได้ ฟังก์ชันต่อเนื่องอาจมีมุมได้ เช่น $|x|$ ที่ 0"}, {"en": "Mixing units: gradients in °C/km must be multiplied by depths in km, not metres.", "th": "ใช้หน่วยปนกัน ความชันหน่วย °C/กม. ต้องคูณกับความลึกหน่วยกิโลเมตร ไม่ใช่เมตร"}]}, "3": {"id": 3, "idea": {"en": "A quadratic trend $h(s)=bs+cs^2$ is a polynomial, so the **power rule** gives its derivatives instantly. The first derivative is the rate of sea-level rise and the second derivative is the acceleration. A positive second derivative is the mathematical meaning of \\\"sea-level rise is speeding up\\\".", "th": "แนวโน้มกำลังสอง $h(s)=bs+cs^2$ เป็นพหุนาม จึงหาอนุพันธ์ได้ทันทีด้วย **กฎยกกำลัง (power rule)** อนุพันธ์อันดับหนึ่งคืออัตราการสูงขึ้นของระดับน้ำทะเล และอนุพันธ์อันดับสองคือความเร่ง อนุพันธ์อันดับสองที่เป็นบวกคือความหมายทางคณิตศาสตร์ของคำว่า \\\"ระดับน้ำทะเลสูงขึ้นเร็วขึ้นเรื่อย ๆ\\\""}, "steps": [{"en": "Use the default model $h(s)=1.2s+0.0085s^2$ mm, with $s=t-1900$ (years since 1900).", "th": "ใช้แบบจำลองค่าเริ่มต้น $h(s)=1.2s+0.0085s^2$ มม. โดย $s=t-1900$ (จำนวนปีนับจาก ค.ศ. 1900)"}, {"en": "Power rule $\\frac{d}{ds}s^n=ns^{n-1}$ term by term: $$h'(s)=1.2+2(0.0085)s=1.2+0.017s\\ \\text{mm/yr}.$$", "th": "ใช้กฎยกกำลัง $\\frac{d}{ds}s^n=ns^{n-1}$ ทีละพจน์: $$h'(s)=1.2+2(0.0085)s=1.2+0.017s\\ \\text{มม./ปี}$$"}, {"en": "Differentiate again: $h''(s)=0.017$ mm/yr². It is positive and constant, so the rate grows by 0.017 mm/yr every year.", "th": "หาอนุพันธ์อีกครั้ง: $h''(s)=0.017$ มม./ปี² มีค่าบวกและคงที่ อัตราจึงเพิ่มขึ้น 0.017 มม./ปี ทุกปี"}, {"en": "For 2024, $s=124$: $h'(124)=1.2+0.017(124)=3.31$ mm/yr, compared with $h'(0)=1.2$ mm/yr in 1900. (The notebook fits the quadratic to noisy synthetic tide-gauge data, so its fitted rates are slightly different: 1.26 mm/yr in 1900 and 3.34 mm/yr in 2024.)", "th": "สำหรับ ค.ศ. 2024 $s=124$: $h'(124)=1.2+0.017(124)=3.31$ มม./ปี เทียบกับ $h'(0)=1.2$ มม./ปี ใน ค.ศ. 1900 (ในสมุดบันทึกเราปรับเส้นโค้งกำลังสองเข้ากับข้อมูลมาตรวัดน้ำขึ้นน้ำลงจำลองที่มีสัญญาณรบกวน อัตราที่ได้จึงต่างเล็กน้อย คือ 1.26 มม./ปี ใน ค.ศ. 1900 และ 3.34 มม./ปี ใน ค.ศ. 2024)"}, {"en": "Total rise: $h(124)=1.2(124)+0.0085(124)^2=148.8+130.7\\approx279$ mm since 1900. If the trend continued, $h(200)-h(124)\\approx301$ mm more would be added between 2024 and 2100.", "th": "การสูงขึ้นรวม: $h(124)=1.2(124)+0.0085(124)^2=148.8+130.7\\approx279$ มม. นับจาก ค.ศ. 1900 ถ้าแนวโน้มนี้ดำเนินต่อไป จะสูงขึ้นอีก $h(200)-h(124)\\approx301$ มม. ระหว่าง ค.ศ. 2024 ถึง 2100"}], "meaning": {"en": "The rate has nearly **tripled** (1.2 → 3.3 mm/yr), which is close to the satellite-altimetry value of about 3–4 mm/yr. The extrapolation to 2100 is only a scenario: a polynomial fitted to past data has no physics in it, so forecasts beyond the data range should be treated with care.", "th": "อัตราเพิ่มขึ้นเกือบ **สามเท่า** (1.2 → 3.3 มม./ปี) ใกล้กับค่าที่วัดด้วยดาวเทียมวัดความสูง (satellite altimetry) ราว 3–4 มม./ปี การคาดการณ์ถึง ค.ศ. 2100 เป็นเพียงฉากทัศน์ เพราะพหุนามที่ปรับเข้ากับข้อมูลในอดีตไม่มีฟิสิกส์อยู่ในนั้น การพยากรณ์นอกช่วงข้อมูลจึงต้องระวัง"}, "pitfalls": [{"en": "Plugging the calendar year $t=2024$ instead of $s=124$ into $h'(s)$.", "th": "แทนปี ค.ศ. $t=2024$ แทนที่จะแทน $s=124$ ลงใน $h'(s)$"}, {"en": "Confusing the rate $h'$ (mm/yr) with the acceleration $h''$ (mm/yr²), or forgetting the factor 2 from the power rule.", "th": "สับสนระหว่างอัตรา $h'$ (มม./ปี) กับความเร่ง $h''$ (มม./ปี²) หรือลืมตัวคูณ 2 จากกฎยกกำลัง"}, {"en": "Treating a polynomial fit as a law of nature and extrapolating it far beyond the data.", "th": "ถือว่าพหุนามที่ปรับเข้ากับข้อมูลเป็นกฎธรรมชาติ แล้วใช้คาดการณ์ไกลเกินช่วงข้อมูล"}]}, "4": {"id": 4, "idea": {"en": "Radioactive decay is described by the exponential $f=e^{-\\lambda t}$, and the age is found by inverting it with the natural logarithm. The derivative of the age with respect to the measured fraction, $dt/df$, is a **sensitivity**: multiplied by the measurement error $\\Delta f$ it gives the age error. This is the linear (tangent-line) approximation used throughout error analysis.", "th": "การสลายตัวของกัมมันตรังสีอธิบายด้วยฟังก์ชันเลขชี้กำลัง $f=e^{-\\lambda t}$ และหาอายุได้โดยใช้ลอการิทึมธรรมชาติกลับฟังก์ชัน อนุพันธ์ของอายุเทียบกับสัดส่วนที่วัดได้ $dt/df$ เป็น **ความไว (sensitivity)** เมื่อคูณด้วยความคลาดเคลื่อนในการวัด $\\Delta f$ จะได้ความคลาดเคลื่อนของอายุ นี่คือการประมาณเชิงเส้น (เส้นสัมผัส) ที่ใช้ทั่วไปในการวิเคราะห์ความคลาดเคลื่อน"}, "steps": [{"en": "Decay constant from the half-life: $\\lambda=\\dfrac{\\ln2}{t_{1/2}}=\\dfrac{0.6931}{5730}=1.2097\\times10^{-4}$ /yr.", "th": "ค่าคงตัวการสลายตัวจากครึ่งชีวิต: $\\lambda=\\dfrac{\\ln2}{t_{1/2}}=\\dfrac{0.6931}{5730}=1.2097\\times10^{-4}$ ต่อปี"}, {"en": "Derivative of the decay law: $f'(t)=-\\lambda e^{-\\lambda t}=-\\lambda f$. The rate of loss is proportional to what is left, so $f'/f=-\\lambda$ is constant.", "th": "อนุพันธ์ของกฎการสลายตัว: $f'(t)=-\\lambda e^{-\\lambda t}=-\\lambda f$ อัตราการลดลงแปรผันตามปริมาณที่เหลือ ดังนั้น $f'/f=-\\lambda$ เป็นค่าคงตัว"}, {"en": "Invert: take $\\ln$ of both sides, $\\ln f=-\\lambda t$, so $t(f)=-\\dfrac{\\ln f}{\\lambda}$. For $f=0.25$: $t=-\\ln(0.25)/\\lambda=1.3863/1.2097\\times10^{-4}=11{,}460$ yr, exactly two half-lives.", "th": "หาฟังก์ชันผกผัน: ใส่ $\\ln$ ทั้งสองข้าง $\\ln f=-\\lambda t$ จึงได้ $t(f)=-\\dfrac{\\ln f}{\\lambda}$ เมื่อ $f=0.25$: $t=-\\ln(0.25)/\\lambda=1.3863/1.2097\\times10^{-4}=11{,}460$ ปี ซึ่งเท่ากับสองครึ่งชีวิตพอดี"}, {"en": "Differentiate the age using $\\frac{d}{df}\\ln f=\\frac1f$: $$\\frac{dt}{df}=-\\frac{1}{\\lambda f}=-\\frac{1}{(1.2097\\times10^{-4})(0.25)}=-33{,}067\\ \\text{yr}.$$", "th": "หาอนุพันธ์ของอายุโดยใช้ $\\frac{d}{df}\\ln f=\\frac1f$: $$\\frac{dt}{df}=-\\frac{1}{\\lambda f}=-\\frac{1}{(1.2097\\times10^{-4})(0.25)}=-33{,}067\\ \\text{ปี}$$"}, {"en": "Error estimate: $\\Delta t\\approx\\left|\\dfrac{dt}{df}\\right|\\Delta f=33{,}067\\times0.01\\approx331$ yr. Repeat for an old sample with $f=0.02$: $|dt/df|=413{,}332$ yr, so the same error gives $\\pm4{,}133$ yr.", "th": "ประมาณความคลาดเคลื่อน: $\\Delta t\\approx\\left|\\dfrac{dt}{df}\\right|\\Delta f=33{,}067\\times0.01\\approx331$ ปี ทำซ้ำกับตัวอย่างอายุมากที่ $f=0.02$: $|dt/df|=413{,}332$ ปี ความคลาดเคลื่อนเท่าเดิมจึงให้ $\\pm4{,}133$ ปี"}], "meaning": {"en": "The sample is **11,460 ± 331 yr** old. The minus sign in $dt/df$ just says that less carbon-14 means an older sample. Because $|dt/df|\\propto1/f$, the uncertainty explodes for old samples, which is why radiocarbon stops being useful near 50,000 yr and geologists switch to slower clocks such as K–Ar or U–Pb.", "th": "ตัวอย่างมีอายุ **11,460 ± 331 ปี** เครื่องหมายลบใน $dt/df$ บอกเพียงว่าคาร์บอน-14 น้อยลงแปลว่าอายุมากขึ้น เนื่องจาก $|dt/df|\\propto1/f$ ความไม่แน่นอนจึงพุ่งสูงมากสำหรับตัวอย่างเก่า นี่คือเหตุที่การหาอายุด้วยคาร์บอนกัมมันตรังสีใช้ไม่ได้เมื่อใกล้ 50,000 ปี และนักธรณีวิทยาเปลี่ยนไปใช้นาฬิกาที่ช้ากว่า เช่น K–Ar หรือ U–Pb"}, "pitfalls": [{"en": "Using $\\log_{10}$ instead of $\\ln$. The decay law uses base $e$, so the inverse must be the natural log.", "th": "ใช้ $\\log_{10}$ แทน $\\ln$ กฎการสลายตัวใช้ฐาน $e$ ฟังก์ชันผกผันจึงต้องเป็นลอการิทึมธรรมชาติ"}, {"en": "Using the half-life as if it were $\\lambda$. Remember $\\lambda=\\ln2/t_{1/2}$.", "th": "ใช้ครึ่งชีวิตแทน $\\lambda$ จำไว้ว่า $\\lambda=\\ln2/t_{1/2}$"}, {"en": "Keeping the negative sign in an error bar. Errors are sizes, so use $|dt/df|$.", "th": "เก็บเครื่องหมายลบไว้ในช่วงความคลาดเคลื่อน ความคลาดเคลื่อนเป็นขนาด จึงต้องใช้ $|dt/df|$"}]}, "5": {"id": 5, "idea": {"en": "The magnitude scale is logarithmic, so energy is an exponential function of magnitude with base 10: $E=10^{1.5M+4.8}$. The rule $\\frac{d}{dx}a^{u}=a^{u}\\ln a\\cdot u'$ shows that the **relative** growth rate $(1/E)(dE/dM)$ is constant. That is the defining property of exponential growth, and it explains why one magnitude unit always multiplies energy by the same factor.", "th": "มาตราขนาดแผ่นดินไหวเป็นแบบลอการิทึม พลังงานจึงเป็นฟังก์ชันเลขชี้กำลังฐาน 10 ของขนาด: $E=10^{1.5M+4.8}$ กฎ $\\frac{d}{dx}a^{u}=a^{u}\\ln a\\cdot u'$ แสดงว่าอัตราการเติบโต **สัมพัทธ์** $(1/E)(dE/dM)$ เป็นค่าคงตัว ซึ่งเป็นสมบัติเฉพาะของการเติบโตแบบเลขชี้กำลัง และอธิบายว่าทำไมขนาดที่เพิ่มขึ้นหนึ่งหน่วยจึงคูณพลังงานด้วยตัวเลขเดิมเสมอ"}, "steps": [{"en": "Energy at the default magnitude $M=7.7$: $E=10^{1.5(7.7)+4.8}=10^{16.35}=2.24\\times10^{16}$ J. Dividing by $4.184\\times10^9$ J per tonne of TNT gives about 5.35 million tonnes.", "th": "พลังงานที่ขนาดค่าเริ่มต้น $M=7.7$: $E=10^{1.5(7.7)+4.8}=10^{16.35}=2.24\\times10^{16}$ จูล หารด้วย $4.184\\times10^9$ จูลต่อทีเอ็นทีหนึ่งตัน ได้ประมาณ 5.35 ล้านตัน"}, {"en": "Differentiate with $\\frac{d}{dM}10^{u}=10^{u}\\ln10\\cdot\\frac{du}{dM}$ and $u=1.5M+4.8$: $$\\frac{dE}{dM}=1.5\\ln10\\cdot E\\approx3.454\\,E.$$", "th": "หาอนุพันธ์โดยใช้ $\\frac{d}{dM}10^{u}=10^{u}\\ln10\\cdot\\frac{du}{dM}$ และ $u=1.5M+4.8$: $$\\frac{dE}{dM}=1.5\\ln10\\cdot E\\approx3.454\\,E$$"}, {"en": "At $M=7.7$: $dE/dM=3.454\\times2.24\\times10^{16}=7.73\\times10^{16}$ J per magnitude unit. The relative rate $(1/E)(dE/dM)=1.5\\ln10\\approx3.45$ does not depend on $M$.", "th": "ที่ $M=7.7$: $dE/dM=3.454\\times2.24\\times10^{16}=7.73\\times10^{16}$ จูลต่อขนาดหนึ่งหน่วย อัตราสัมพัทธ์ $(1/E)(dE/dM)=1.5\\ln10\\approx3.45$ ไม่ขึ้นกับ $M$"}, {"en": "Because the derivative is only a local rate, use the exact ratio for a finite step $\\Delta M=1$: $\\dfrac{E(M+1)}{E(M)}=10^{1.5}\\approx31.6$. Two units give $10^{3}=1000$.", "th": "เนื่องจากอนุพันธ์เป็นอัตราเฉพาะจุด สำหรับการเพิ่มขึ้นจำกัด $\\Delta M=1$ ให้ใช้อัตราส่วนแท้จริง: $\\dfrac{E(M+1)}{E(M)}=10^{1.5}\\approx31.6$ เพิ่มสองหน่วยได้ $10^{3}=1000$"}, {"en": "Compare with a moderate earthquake: $E(7.7)/E(5)=10^{1.5(2.7)}=10^{4.05}\\approx11{,}220$. One M 7.7 releases as much energy as about 11,200 M 5.0 events.", "th": "เทียบกับแผ่นดินไหวขนาดปานกลาง: $E(7.7)/E(5)=10^{1.5(2.7)}=10^{4.05}\\approx11{,}220$ แผ่นดินไหวขนาด 7.7 หนึ่งครั้งปล่อยพลังงานเท่ากับแผ่นดินไหวขนาด 5.0 ราว 11,200 ครั้ง"}], "meaning": {"en": "A magnitude 7.7 earthquake (like Myanmar 2025) releases about $2\\times10^{16}$ J. Small earthquakes cannot \\\"release the pressure\\\" of a big fault: you would need over ten thousand M 5 events to match one M 7.7. On a log-scale graph the energy curve is a straight line, which is how you recognise exponential growth.", "th": "แผ่นดินไหวขนาด 7.7 (เช่น เมียนมา ค.ศ. 2025) ปล่อยพลังงานราว $2\\times10^{16}$ จูล แผ่นดินไหวเล็ก ๆ จึง \\\"ระบายแรงดัน\\\" ของรอยเลื่อนใหญ่ไม่ได้ ต้องใช้แผ่นดินไหวขนาด 5 มากกว่าหนึ่งหมื่นครั้งจึงเท่ากับขนาด 7.7 หนึ่งครั้ง บนกราฟสเกลลอการิทึม เส้นโค้งพลังงานเป็นเส้นตรง ซึ่งเป็นวิธีสังเกตการเติบโตแบบเลขชี้กำลัง"}, "pitfalls": [{"en": "Writing $\\frac{d}{dM}10^{u}=u\\cdot10^{u-1}$ (the power rule). The variable is in the exponent, so you need $10^{u}\\ln10\\cdot u'$.", "th": "เขียน $\\frac{d}{dM}10^{u}=u\\cdot10^{u-1}$ (ใช้กฎยกกำลังผิดที่) ตัวแปรอยู่ในเลขชี้กำลัง จึงต้องใช้ $10^{u}\\ln10\\cdot u'$"}, {"en": "Thinking M 7 is \\\"one more\\\" than M 6, so only slightly stronger. It is about 31.6 times more energy.", "th": "คิดว่าขนาด 7 มากกว่าขนาด 6 แค่ \\\"หนึ่ง\\\" จึงแรงกว่าเพียงเล็กน้อย ที่จริงพลังงานมากกว่าราว 31.6 เท่า"}, {"en": "Using $dE/dM\\cdot\\Delta M$ for a large step like $\\Delta M=1$. For big steps the exact ratio $10^{1.5\\Delta M}$ is required.", "th": "ใช้ $dE/dM\\cdot\\Delta M$ กับการเปลี่ยนแปลงขนาดใหญ่ เช่น $\\Delta M=1$ สำหรับการเปลี่ยนแปลงมากต้องใช้อัตราส่วนแท้จริง $10^{1.5\\Delta M}$"}]}, "6": {"id": 6, "idea": {"en": "Tides are sums of cosine waves, one for each astronomical constituent. The rate at which the water rises is the derivative $\\eta'(t)$, found with $\\frac{d}{dt}\\cos(\\omega t+\\phi)=-\\omega\\sin(\\omega t+\\phi)$. The fastest rise is a maximum of $\\eta'$, which happens where $\\eta''=0$: at the inflection points of the tide curve, not at high water.", "th": "น้ำขึ้นน้ำลงคือผลรวมของคลื่นโคไซน์ หนึ่งคลื่นต่อหนึ่งองค์ประกอบทางดาราศาสตร์ อัตราที่ระดับน้ำสูงขึ้นคืออนุพันธ์ $\\eta'(t)$ ซึ่งหาได้จาก $\\frac{d}{dt}\\cos(\\omega t+\\phi)=-\\omega\\sin(\\omega t+\\phi)$ การขึ้นเร็วที่สุดคือค่าสูงสุดของ $\\eta'$ ซึ่งเกิดที่ $\\eta''=0$ คือที่จุดเปลี่ยนเว้า (inflection point) ของกราฟน้ำขึ้นน้ำลง ไม่ใช่ตอนน้ำขึ้นสูงสุด"}, "steps": [{"en": "Model with the defaults $A_1=1.2$ m (M2, 12.42 h), $A_2=0.4$ m (S2, 12 h), $\\phi=0.5$ rad: $$\\eta(t)=1.2\\cos\\omega_1t+0.4\\cos(\\omega_2t+0.5),\\quad \\omega_1=\\tfrac{2\\pi}{12.42}=0.5059,\\ \\omega_2=\\tfrac{2\\pi}{12}=0.5236\\ \\text{rad/h}.$$", "th": "แบบจำลองด้วยค่าเริ่มต้น $A_1=1.2$ ม. (M2, 12.42 ชม.) $A_2=0.4$ ม. (S2, 12 ชม.) $\\phi=0.5$ เรเดียน: $$\\eta(t)=1.2\\cos\\omega_1t+0.4\\cos(\\omega_2t+0.5),\\quad \\omega_1=\\tfrac{2\\pi}{12.42}=0.5059,\\ \\omega_2=\\tfrac{2\\pi}{12}=0.5236\\ \\text{rad/ชม.}$$"}, {"en": "Differentiate each term with the chain rule: $$\\eta'(t)=-1.2\\,\\omega_1\\sin\\omega_1t-0.4\\,\\omega_2\\sin(\\omega_2t+0.5)\\ \\ \\text{m/h}.$$", "th": "หาอนุพันธ์ทีละพจน์ด้วยหลักเกณฑ์ลูกโซ่: $$\\eta'(t)=-1.2\\,\\omega_1\\sin\\omega_1t-0.4\\,\\omega_2\\sin(\\omega_2t+0.5)\\ \\ \\text{ม./ชม.}$$"}, {"en": "To find the fastest rise, set $\\eta''(t)=0$, where $\\eta''=-1.2\\omega_1^2\\cos\\omega_1t-0.4\\omega_2^2\\cos(\\omega_2t+0.5)$. Solving numerically in the first tidal cycle gives $t\\approx8.98$ h, with $\\eta'=0.783$ m/h and $\\eta\\approx-0.01$ m (mid-tide).", "th": "หาจุดที่ขึ้นเร็วที่สุดโดยให้ $\\eta''(t)=0$ เมื่อ $\\eta''=-1.2\\omega_1^2\\cos\\omega_1t-0.4\\omega_2^2\\cos(\\omega_2t+0.5)$ แก้เชิงตัวเลขในรอบน้ำขึ้นน้ำลงแรก ได้ $t\\approx8.98$ ชม. ที่ $\\eta'=0.783$ ม./ชม. และ $\\eta\\approx-0.01$ ม. (ระดับน้ำกลาง)"}, {"en": "An upper bound comes from $|\\sin|\\le1$: $|\\eta'|\\le A_1\\omega_1+A_2\\omega_2=0.607+0.209=0.817$ m/h. It is reached only when both constituents are in phase (spring tide). Over the app's 15-day window the maximum is $0.816$ m/h at $t\\approx332$ h.", "th": "ขอบเขตบนได้จาก $|\\sin|\\le1$: $|\\eta'|\\le A_1\\omega_1+A_2\\omega_2=0.607+0.209=0.817$ ม./ชม. ซึ่งเกิดได้เฉพาะเมื่อสององค์ประกอบมีเฟสตรงกัน (น้ำเกิด) ในช่วง 15 วันของแอป ค่าสูงสุดคือ $0.816$ ม./ชม. ที่ $t\\approx332$ ชม."}, {"en": "The beat between the periods: the phase difference changes by $\\omega_2-\\omega_1$ per hour, so spring tides repeat every $2\\pi/(\\omega_2-\\omega_1)\\approx354$ h $=14.77$ days. The largest possible range is $2(A_1+A_2)=3.2$ m.", "th": "จังหวะการเหลื่อมของคาบ: ผลต่างเฟสเปลี่ยนไป $\\omega_2-\\omega_1$ ต่อชั่วโมง น้ำเกิดจึงวนกลับมาทุก $2\\pi/(\\omega_2-\\omega_1)\\approx354$ ชม. $=14.77$ วัน พิสัยน้ำขึ้นน้ำลงที่มากที่สุดคือ $2(A_1+A_2)=3.2$ ม."}], "meaning": {"en": "The water rises fastest, about **0.8 m per hour**, when it is near mid-level, and it stands still at high and low water. That is why tidal currents in estuaries and harbours are strongest at mid-tide, and why the sailors' \\\"rule of twelfths\\\" puts the biggest change in the middle hours. Spring tides every ~14.8 days give both the largest range and the fastest rise.", "th": "น้ำขึ้นเร็วที่สุดราว **0.8 เมตรต่อชั่วโมง** เมื่อระดับน้ำอยู่ใกล้ระดับกลาง และหยุดนิ่งตอนน้ำขึ้นสูงสุดและลงต่ำสุด นี่คือเหตุที่กระแสน้ำในปากแม่น้ำและท่าเรือแรงที่สุดตอนระดับน้ำกลาง และ \\\"กฎหนึ่งในสิบสอง (rule of twelfths)\\\" ของชาวเรือให้การเปลี่ยนแปลงมากที่สุดในชั่วโมงกลาง ๆ น้ำเกิดที่เกิดทุกราว 14.8 วันให้ทั้งพิสัยมากที่สุดและน้ำขึ้นเร็วที่สุด"}, "pitfalls": [{"en": "Forgetting the factor $\\omega$ from the chain rule, which gives a \\\"rate\\\" in metres instead of metres per hour.", "th": "ลืมตัวคูณ $\\omega$ จากหลักเกณฑ์ลูกโซ่ ทำให้ได้ \\\"อัตรา\\\" ที่มีหน่วยเป็นเมตร แทนที่จะเป็นเมตรต่อชั่วโมง"}, {"en": "Looking for the fastest rise where $\\eta'=0$. That condition gives high and low water; the maximum of $\\eta'$ needs $\\eta''=0$.", "th": "หาจุดที่ขึ้นเร็วที่สุดจาก $\\eta'=0$ เงื่อนไขนี้ให้ตำแหน่งน้ำขึ้นสูงสุดและลงต่ำสุด ค่าสูงสุดของ $\\eta'$ ต้องใช้ $\\eta''=0$"}, {"en": "Using degrees instead of radians: calculus formulas for $\\sin$ and $\\cos$ only hold in radians.", "th": "ใช้องศาแทนเรเดียน สูตรแคลคูลัสของ $\\sin$ และ $\\cos$ ใช้ได้เฉพาะเรเดียน"}]}, "7": {"id": 7, "idea": {"en": "The arctan function is a smooth step, so it is a good model for a fault scarp rounded by erosion. Its derivative $\\frac{d}{dx}\\arctan u=\\frac{u'}{1+u^2}$ gives the slope at every point, and the slope angle is $\\theta=\\arctan(z')$. The steepest point is where $z'$ is largest, which by symmetry is the centre of the scarp.", "th": "ฟังก์ชันอาร์กแทนเจนต์มีรูปเป็นขั้นบันไดที่ราบเรียบ จึงเหมาะเป็นแบบจำลองผารอยเลื่อน (fault scarp) ที่ถูกกัดเซาะจนมน อนุพันธ์ $\\frac{d}{dx}\\arctan u=\\frac{u'}{1+u^2}$ ให้ความชันที่ทุกจุด และมุมลาดคือ $\\theta=\\arctan(z')$ จุดที่ชันที่สุดคือจุดที่ $z'$ มากที่สุด ซึ่งด้วยความสมมาตรอยู่ที่กลางผา"}, "steps": [{"en": "Profile with the defaults $H=6$ m and $w=3$ m: $z(x)=\\dfrac{6}{\\pi}\\arctan\\dfrac{x}{3}+3$. Far left $z\\to0$, far right $z\\to6$ m, so the total offset is $H$.", "th": "โปรไฟล์ด้วยค่าเริ่มต้น $H=6$ ม. และ $w=3$ ม.: $z(x)=\\dfrac{6}{\\pi}\\arctan\\dfrac{x}{3}+3$ ทางซ้ายสุด $z\\to0$ ทางขวาสุด $z\\to6$ ม. ระยะเหลื่อมรวมจึงเท่ากับ $H$"}, {"en": "Chain rule with $u=x/w$, $u'=1/w$: $$z'(x)=\\frac{H}{\\pi}\\cdot\\frac{1/w}{1+x^2/w^2}=\\frac{H}{\\pi}\\cdot\\frac{w}{w^2+x^2}.$$", "th": "ใช้หลักเกณฑ์ลูกโซ่กับ $u=x/w$, $u'=1/w$: $$z'(x)=\\frac{H}{\\pi}\\cdot\\frac{1/w}{1+x^2/w^2}=\\frac{H}{\\pi}\\cdot\\frac{w}{w^2+x^2}$$"}, {"en": "The denominator $w^2+x^2$ is smallest at $x=0$, so the slope is largest there: $z'(0)=\\dfrac{H}{\\pi w}=\\dfrac{6}{3\\pi}=0.637$.", "th": "ตัวส่วน $w^2+x^2$ มีค่าน้อยที่สุดที่ $x=0$ ความชันจึงมากที่สุดที่นั่น: $z'(0)=\\dfrac{H}{\\pi w}=\\dfrac{6}{3\\pi}=0.637$"}, {"en": "Convert the slope (rise/run) into an angle: $\\theta_{\\max}=\\arctan(0.637)=32.5^\\circ$. This is below the ~35° angle of repose, so the scarp is already degraded. For comparison, $w=1$ m gives 62.4° (fresh) and $w=8$ m gives 13.4°.", "th": "แปลงความชัน (ระยะตั้ง/ระยะราบ) เป็นมุม: $\\theta_{\\max}=\\arctan(0.637)=32.5^\\circ$ ซึ่งต่ำกว่ามุมพัก (angle of repose) ราว 35° ผาจึงถูกกัดเซาะไปแล้ว เปรียบเทียบ $w=1$ ม. ให้ 62.4° (ยังสด) และ $w=8$ ม. ให้ 13.4°"}, {"en": "Solve backward for the width at which $\\theta_{\\max}=35^\\circ$: $\\tan35^\\circ=\\dfrac{H}{\\pi w}\\Rightarrow w=\\dfrac{6}{\\pi\\tan35^\\circ}=2.73$ m.", "th": "แก้ย้อนกลับหาความกว้างที่ทำให้ $\\theta_{\\max}=35^\\circ$: $\\tan35^\\circ=\\dfrac{H}{\\pi w}\\Rightarrow w=\\dfrac{6}{\\pi\\tan35^\\circ}=2.73$ ม."}], "meaning": {"en": "A 6 m scarp with $w=3$ m has a steepest slope of **32.5°**, gentler than loose debris can stand, so it is no longer a fresh rupture. Erosion widens $w$ over time, so measuring the maximum slope of a scarp in the field (or on a DEM) is a way to estimate how long ago the earthquake happened.", "th": "ผาสูง 6 ม. ที่มี $w=3$ ม. มีความชันสูงสุด **32.5°** ซึ่งลาดน้อยกว่าที่เศษหินร่วนจะตั้งอยู่ได้ จึงไม่ใช่รอยแตกที่เพิ่งเกิดแล้ว การกัดเซาะทำให้ $w$ กว้างขึ้นตามเวลา การวัดความชันสูงสุดของผาในภาคสนาม (หรือจากแบบจำลองความสูงเชิงเลข DEM) จึงเป็นวิธีประมาณว่าแผ่นดินไหวเกิดขึ้นนานเท่าใดแล้ว"}, "pitfalls": [{"en": "Treating the slope $z'$ as an angle. A slope of 0.637 is not 0.637 rad or 0.637°; you must take $\\arctan$.", "th": "ถือว่าความชัน $z'$ เป็นมุม ความชัน 0.637 ไม่ใช่ 0.637 เรเดียนหรือ 0.637° ต้องใส่ $\\arctan$ ก่อน"}, {"en": "Forgetting the inner derivative $1/w$ when differentiating $\\arctan(x/w)$.", "th": "ลืมอนุพันธ์ของฟังก์ชันข้างใน $1/w$ เมื่อหาอนุพันธ์ของ $\\arctan(x/w)$"}, {"en": "Having the calculator in degree mode while applying formulas derived in radians.", "th": "ตั้งเครื่องคิดเลขเป็นโหมดองศาขณะใช้สูตรที่พิสูจน์มาในหน่วยเรเดียน"}]}, "8": {"id": 8, "idea": {"en": "Water-wave speed is $c=\\sqrt{(g/k)\\tanh(kh)}$. The hyperbolic tangent behaves very differently at its two ends: $\\tanh x\\approx x$ for small $x$ and $\\tanh x\\to1$ for large $x$. Taking these **limits** turns one formula into two simple laws, and a tsunami falls in the small-$kh$ limit where speed depends only on depth.", "th": "ความเร็วคลื่นน้ำคือ $c=\\sqrt{(g/k)\\tanh(kh)}$ ฟังก์ชันแทนเจนต์ไฮเพอร์โบลิก (hyperbolic tangent) มีพฤติกรรมต่างกันมากที่สองปลาย: $\\tanh x\\approx x$ เมื่อ $x$ เล็ก และ $\\tanh x\\to1$ เมื่อ $x$ ใหญ่ การหา **ลิมิต** ทั้งสองทำให้สูตรเดียวกลายเป็นกฎง่าย ๆ สองข้อ และสึนามิอยู่ในกรณี $kh$ เล็ก ซึ่งความเร็วขึ้นกับความลึกเท่านั้น"}, "steps": [{"en": "Default values: depth $h=10^{3.6}\\approx3981$ m and wavelength $\\lambda=10^{5.3}\\approx199.5$ km. Wavenumber $k=2\\pi/\\lambda=3.149\\times10^{-5}$ m⁻¹, so $kh=0.1254$.", "th": "ค่าเริ่มต้น: ความลึก $h=10^{3.6}\\approx3981$ ม. และความยาวคลื่น $\\lambda=10^{5.3}\\approx199.5$ กม. เลขคลื่น $k=2\\pi/\\lambda=3.149\\times10^{-5}$ ต่อเมตร จึงได้ $kh=0.1254$"}, {"en": "Shallow-water limit: from the series $\\tanh x=x-\\tfrac{x^3}{3}+\\dots$, $\\tanh x\\approx x$ as $x\\to0$, so $$\\lim_{kh\\to0}c=\\sqrt{\\frac gk\\cdot kh}=\\sqrt{gh}.$$ Deep-water limit: $\\tanh(kh)\\to1$, so $c\\to\\sqrt{g/k}$.", "th": "ลิมิตน้ำตื้น: จากอนุกรม $\\tanh x=x-\\tfrac{x^3}{3}+\\dots$ ได้ $\\tanh x\\approx x$ เมื่อ $x\\to0$ ดังนั้น $$\\lim_{kh\\to0}c=\\sqrt{\\frac gk\\cdot kh}=\\sqrt{gh}$$ ลิมิตน้ำลึก: $\\tanh(kh)\\to1$ จึงได้ $c\\to\\sqrt{g/k}$"}, {"en": "Exact speed: $\\tanh(0.1254)=0.1247$, so $c=\\sqrt{\\dfrac{9.81}{3.149\\times10^{-5}}\\times0.1247}=197.1$ m/s $\\approx710$ km/h. The limit $\\sqrt{gh}=\\sqrt{9.81\\times3981}=197.6$ m/s is only 0.3% higher.", "th": "ความเร็วแท้จริง: $\\tanh(0.1254)=0.1247$ ดังนั้น $c=\\sqrt{\\dfrac{9.81}{3.149\\times10^{-5}}\\times0.1247}=197.1$ ม./วินาที $\\approx710$ กม./ชม. ลิมิต $\\sqrt{gh}=\\sqrt{9.81\\times3981}=197.6$ ม./วินาที สูงกว่าเพียง 0.3%"}, {"en": "Group speed (how fast the energy travels) from $\\omega=ck$: $$c_g=\\frac{d\\omega}{dk}=\\frac c2\\left(1+\\frac{2kh}{\\sinh2kh}\\right)=196.1\\ \\text{m/s}.$$ Since $\\sinh x\\approx x$ for small $x$, the bracket tends to 2 and $c_g\\to c$ in shallow water; in deep water it tends to 1 and $c_g\\to c/2$.", "th": "ความเร็วกลุ่ม (ความเร็วที่พลังงานเดินทาง) จาก $\\omega=ck$: $$c_g=\\frac{d\\omega}{dk}=\\frac c2\\left(1+\\frac{2kh}{\\sinh2kh}\\right)=196.1\\ \\text{ม./วินาที}$$ เนื่องจาก $\\sinh x\\approx x$ เมื่อ $x$ เล็ก วงเล็บจึงเข้าใกล้ 2 และ $c_g\\to c$ ในน้ำตื้น ในน้ำลึกวงเล็บเข้าใกล้ 1 และ $c_g\\to c/2$"}, {"en": "Classify the regime: $kh<\\pi/10\\approx0.314$ means a shallow-water wave. With $kh=0.125$ the tsunami is a shallow-water wave even in a 4 km deep ocean.", "th": "จำแนกประเภท: $kh<\\pi/10\\approx0.314$ หมายถึงคลื่นน้ำตื้น เมื่อ $kh=0.125$ สึนามิจึงเป็นคลื่นน้ำตื้นแม้ในมหาสมุทรลึก 4 กม."}], "meaning": {"en": "A tsunami crosses the deep ocean at about **200 m/s (≈ 710 km/h)**, the speed of a jet airliner. Because $c=\\sqrt{gh}$, it slows to about 31 m/s in 100 m of water and 10 m/s in 10 m, so the back of the wave catches up with the front and the wave grows taller near the coast, as on the Andaman coast of Thailand in 2004. Wind waves, by contrast, have $kh\\gg1$ and do not feel the bottom.", "th": "สึนามิเคลื่อนที่ข้ามมหาสมุทรลึกด้วยความเร็วราว **200 ม./วินาที (≈ 710 กม./ชม.)** เท่าเครื่องบินไอพ่น เนื่องจาก $c=\\sqrt{gh}$ มันจึงช้าลงเหลือราว 31 ม./วินาที ในน้ำลึก 100 ม. และ 10 ม./วินาที ในน้ำลึก 10 ม. ด้านหลังของคลื่นจึงไล่ทันด้านหน้า และคลื่นสูงขึ้นใกล้ชายฝั่ง เช่นที่ชายฝั่งทะเลอันดามันของไทยใน ค.ศ. 2004 ส่วนคลื่นลมมี $kh\\gg1$ จึงไม่ \\\"รู้สึก\\\" ถึงพื้นทะเล"}, "pitfalls": [{"en": "Thinking a 4 km deep ocean is \\\"deep water\\\" for every wave. Deep or shallow depends on $kh$ (depth compared with wavelength), not on depth alone.", "th": "คิดว่ามหาสมุทรลึก 4 กม. เป็น \\\"น้ำลึก\\\" สำหรับคลื่นทุกชนิด น้ำลึกหรือน้ำตื้นขึ้นกับ $kh$ (ความลึกเทียบกับความยาวคลื่น) ไม่ใช่ความลึกอย่างเดียว"}, {"en": "Using the wavelength $\\lambda$ where the formula needs the wavenumber $k=2\\pi/\\lambda$.", "th": "ใช้ความยาวคลื่น $\\lambda$ ในตำแหน่งที่สูตรต้องการเลขคลื่น $k=2\\pi/\\lambda$"}, {"en": "Confusing $\\tanh$ with $\\tan$: $\\tan x$ blows up at $\\pi/2$, but $\\tanh x$ always stays between $-1$ and $1$.", "th": "สับสน $\\tanh$ กับ $\\tan$: $\\tan x$ พุ่งเป็นอนันต์ที่ $\\pi/2$ แต่ $\\tanh x$ อยู่ระหว่าง $-1$ ถึง $1$ เสมอ"}]}, "9": {"id": 9, "idea": {"en": "Velocity is the first derivative of displacement and acceleration is the second derivative. For a damped oscillation $u=Ae^{-\\alpha t}\\sin\\omega t$ we need the **product rule** and the **chain rule** twice. Each differentiation brings down a factor of roughly $\\omega$, so acceleration scales like $\\omega^2A$, which is why high-frequency shaking produces large forces on buildings.", "th": "ความเร็วคืออนุพันธ์อันดับหนึ่งของการกระจัด และความเร่งคืออนุพันธ์อันดับสอง สำหรับการสั่นแบบหน่วง $u=Ae^{-\\alpha t}\\sin\\omega t$ ต้องใช้ **กฎผลคูณ (product rule)** และ **หลักเกณฑ์ลูกโซ่** สองครั้ง การหาอนุพันธ์แต่ละครั้งนำตัวคูณประมาณ $\\omega$ ออกมา ความเร่งจึงมีขนาดราว $\\omega^2A$ นี่คือเหตุที่การสั่นความถี่สูงสร้างแรงขนาดใหญ่ต่ออาคาร"}, "steps": [{"en": "Defaults: $A=5$ cm, $f=1.5$ Hz, $\\zeta=0.15$. Angular frequency $\\omega=2\\pi f=9.425$ s⁻¹ and decay rate $\\alpha=\\zeta\\omega=1.414$ s⁻¹.", "th": "ค่าเริ่มต้น: $A=5$ ซม. $f=1.5$ เฮิรตซ์ $\\zeta=0.15$ ความถี่เชิงมุม $\\omega=2\\pi f=9.425$ ต่อวินาที และอัตราการหน่วง $\\alpha=\\zeta\\omega=1.414$ ต่อวินาที"}, {"en": "First derivative by the product rule, $(fg)'=f'g+fg'$, with $f=Ae^{-\\alpha t}$ and $g=\\sin\\omega t$: $$v=u'=-\\alpha Ae^{-\\alpha t}\\sin\\omega t+Ae^{-\\alpha t}\\omega\\cos\\omega t=Ae^{-\\alpha t}(\\omega\\cos\\omega t-\\alpha\\sin\\omega t).$$", "th": "อนุพันธ์อันดับหนึ่งด้วยกฎผลคูณ $(fg)'=f'g+fg'$ โดย $f=Ae^{-\\alpha t}$ และ $g=\\sin\\omega t$: $$v=u'=-\\alpha Ae^{-\\alpha t}\\sin\\omega t+Ae^{-\\alpha t}\\omega\\cos\\omega t=Ae^{-\\alpha t}(\\omega\\cos\\omega t-\\alpha\\sin\\omega t)$$"}, {"en": "Differentiate again (product rule on $v$) and collect terms: $$a=u''=Ae^{-\\alpha t}\\big[(\\alpha^2-\\omega^2)\\sin\\omega t-2\\alpha\\omega\\cos\\omega t\\big].$$", "th": "หาอนุพันธ์อีกครั้ง (ใช้กฎผลคูณกับ $v$) แล้วจัดพจน์: $$a=u''=Ae^{-\\alpha t}\\big[(\\alpha^2-\\omega^2)\\sin\\omega t-2\\alpha\\omega\\cos\\omega t\\big]$$"}, {"en": "Peak values (largest $|u|,|v|,|a|$ over the record): displacement $3.99$ cm, PGV $=47.1$ cm/s (at $t=0$, where $v=A\\omega$), PGA $=379$ cm/s² $=0.387$ g after dividing by $g=981$ cm/s².", "th": "ค่าสูงสุด (ค่า $|u|,|v|,|a|$ ที่มากที่สุดตลอดบันทึก): การกระจัด $3.99$ ซม. PGV $=47.1$ ซม./วินาที (ที่ $t=0$ ซึ่ง $v=A\\omega$) PGA $=379$ ซม./วินาที² $=0.387$ g เมื่
