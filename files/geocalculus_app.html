<style>

  --chip-mid: #fbe9d7;  --chip-mid-ink: #8a3a0a;
  --chip-adv: #e9e1f5;  --chip-adv-ink: #563092;
  /* Every stack names IBM Plex Sans Thai right after its Latin face, so Thai glyphs never fall back to a random system font */

  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;

    --chip-easy: #24331a; --chip-easy-ink: #b7d98b;
    --chip-mid: #3a2614; --chip-mid-ink: #f5b07a;

  --chip-easy: #24331a; --chip-easy-ink: #b7d98b;

<script>
// ---------- helpers ----------
const linspace = (a, b, n) => Array.from({ length: n }, (_, i) => a + (b - a) * i / (n - 1));
const logspace = (a, b, n) => linspace(a, b, n).map(v => 10 ** v);
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const fmt = (v, d = 3) => {
  if (!isFinite(v)) return v > 0 ? '∞' : '—';
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e6 || a < 1e-3)) return v.toExponential(2).replace('e', '×10^').replace('^+', '^');
  return v.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: 0 });
};
const simpson = (f, a, b, n = 2000) => { if (n % 2) n++; const h = (b - a) / n; let s = f(a) + f(b);
  for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * f(a + i * h); return s * h / 3; };
const golden = (f, a, b, tol = 1e-9) => { const g = (Math.sqrt(5) - 1) / 2; let c = b - g * (b - a), d = a + g * (b - a);
  while (Math.abs(b - a) > tol) { if (f(c) < f(d)) b = d; else a = c; c = b - g * (b - a); d = a + g * (b - a); } return (a + b) / 2; };
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = () => ({ s1: tok('--s1'), s2: tok('--s2'), s3: tok('--s3'), s4: tok('--s4'), ink: tok('--ink'), muted: tok('--muted'), rule: tok('--rule') });
const line = (x, y, name, color, extra = {}) => { const { line: l = {}, ...rest } = extra;
  return { x, y, name, type: 'scatter', mode: 'lines', ...rest, line: { color, width: 2.4, ...l } }; };
const pts = (x, y, name, color, size = 9) => ({ x, y, name, type: 'scatter', mode: 'markers', marker: { color, size } });

// ---------- examples 1–23 (original numbering; reordered below) ----------
// level: 1 easy, 2 medium, 3 advanced
const EX = [
{ part: 'A · Limits & continuity', level: 1, week: 'Week 1', tool: 'Limit of a difference quotient', th: 'ลิมิตของฟังก์ชัน',
  title: 'Velocity of a GPS station after an earthquake',
  context: 'After a large earthquake, afterslip keeps moving GPS stations for years. Displacement (mm) is x(t) = 50 ln(1 + t/0.5). The secant slope over a short interval h is an average velocity; its limit as h → 0 is the instantaneous velocity.',
  tex: [String.raw`\displaystyle v(t_0)=\lim_{h\to0}\frac{x(t_0+h)-x(t_0)}{h}`, String.raw`x(t)=50\ln\!\left(1+\tfrac{t}{0.5}\right)\;\Rightarrow\; v(t)=\frac{50}{0.5+t}`],
  params: [{ id: 't0', label: 'time t₀ (yr)', min: 0.6, max: 3, step: 0.05, value: 1 },
           { id: 'lh', label: 'interval h (yr)', min: -3, max: -0.3, step: 0.05, value: -0.3, log: true }],
  note: 'Drag <b>h</b> to the left: the orange secant swings into the tangent line. Both the left and the right difference quotients approach the same number, so the limit exists.',
  run(p, c) { const x = t => 50 * Math.log(1 + t / 0.5), h = p.lh, t0 = p.t0, x0 = x(t0);
    const sR = (x(t0 + h) - x0) / h, sL = (x(t0 - h) - x0) / (-h), v = 50 / (0.5 + t0), T = linspace(0, 3.5, 250);
    return { traces: [line(T, T.map(x), 'x(t)', c.s1),
      line(T, T.map(t => x0 + sR * (t - t0)), 'secant (h > 0)', c.s2, { line: { dash: 'dash', width: 1.8 } }),
      line(T, T.map(t => x0 + v * (t - t0)), 'tangent (limit)', c.ink, { line: { width: 1.4 } }),
      pts([t0, t0 + h], [x0, x(t0 + h)], 'points', c.s2)],
      layout: { xaxis: { title: 'time after earthquake (yr)' }, yaxis: { title: 'displacement (mm)', range: [0, 100] } },
      out: [['secant slope, h > 0', fmt(sR, 4) + ' mm/yr'], ['secant slope, h < 0', fmt(sL, 4) + ' mm/yr'], ['limit (exact) v(t₀)', fmt(v, 4) + ' mm/yr', 1], ['error of right secant', fmt(Math.abs(sR - v), 4) + ' mm/yr']] }; } },

{ part: 'A · Limits & continuity', level: 1, week: 'Week 2', tool: 'Continuity · one-sided limits', th: 'ความต่อเนื่องของฟังก์ชัน',
  title: 'Temperature in a two-layer crust',
  context: 'Temperature cannot jump across a rock contact, but the geothermal gradient can. Choose the gradients of a sedimentary layer and the basement below it; the constant c is computed so that T(z) is continuous at the contact depth.',
  tex: [String.raw`T(z)=\begin{cases}15+g_1z,& z\le z_c\\ c+g_2z,& z>z_c\end{cases}`, String.raw`\lim_{z\to z_c^-}T=\lim_{z\to z_c^+}T\;\Rightarrow\; c=15+(g_1-g_2)z_c`, String.raw`q=k\,T'(z)\text{ continuous}\Rightarrow \tfrac{k_2}{k_1}=\tfrac{g_1}{g_2}`],
  params: [{ id: 'g1', label: 'upper gradient g₁ (°C/km)', min: 10, max: 45, step: 1, value: 25 },
           { id: 'g2', label: 'basement gradient g₂ (°C/km)', min: 8, max: 45, step: 1, value: 15 },
           { id: 'zc', label: 'contact depth z_c (km)', min: 3, max: 25, step: 0.5, value: 10 }],
  note: 'The curve is continuous (no jump) but has a <b>kink</b>: the derivative T′(z) has different one-sided limits. Heat flow, not gradient, is what must match across the contact.',
  run(p, c) { const cc = 15 + (p.g1 - p.g2) * p.zc, Z = linspace(0, 40, 400), T = Z.map(z => z <= p.zc ? 15 + p.g1 * z : cc + p.g2 * z);
    return { traces: [line(T, Z, 'T(z)', c.s1), pts([15 + p.g1 * p.zc], [p.zc], 'contact', c.s2, 11)],
      layout: { xaxis: { title: 'temperature (°C)' }, yaxis: { title: 'depth (km)', autorange: 'reversed' },
        shapes: [{ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: p.zc, y1: p.zc, line: { color: c.muted, dash: 'dot', width: 1 } }] },
      out: [['c (for continuity)', fmt(cc, 2) + ' °C', 1], ['T at contact', fmt(15 + p.g1 * p.zc, 1) + ' °C'], ['lim T′ from above', p.g1 + ' °C/km'], ['lim T′ from below', p.g2 + ' °C/km'], ['conductivity ratio k₂/k₁', fmt(p.g1 / p.g2, 3)], ['T at 40 km', fmt(cc + p.g2 * 40, 0) + ' °C']] }; } },

{ part: 'B · Derivatives of elementary functions', level: 1, week: 'Week 3', tool: 'Power rule', th: 'อนุพันธ์ของฟังก์ชันพหุนาม',
  title: 'Is sea-level rise accelerating?',
  context: 'Tide-gauge records are often summarised by a quadratic h(s) = b·s + c·s², where s is years since 1900. The derivative is the rate of rise; the second derivative is the acceleration.',
  tex: [String.raw`h(s)=bs+cs^2,\quad s=t-1900`, String.raw`h'(s)=b+2cs\ \ (\text{mm/yr}),\qquad h''(s)=2c\ \ (\text{mm/yr}^2)`],
  params: [{ id: 'b', label: 'b (mm/yr)', min: 0.5, max: 3, step: 0.05, value: 1.2 },
           { id: 'c', label: 'c (mm/yr²)', min: 0, max: 0.02, step: 0.0005, value: 0.0085 },
           { id: 'yr', label: 'evaluate at year', min: 1900, max: 2100, step: 1, value: 2024 }],
  note: 'Set c = 0 and the rate line goes flat: no acceleration. Real tide-gauge and satellite data give c ≈ 0.01 mm/yr² over the 20th century.',
  run(p, c) { const Y = linspace(1900, 2100, 201), h = y => p.b * (y - 1900) + p.c * (y - 1900) ** 2, r = y => p.b + 2 * p.c * (y - 1900);
    return { traces: [line(Y, Y.map(h), 'h(t) sea level', c.s1), line(Y, Y.map(r), "h'(t) rate", c.s2, { yaxis: 'y2' }), pts([p.yr], [r(p.yr)], 'selected', c.s2)].map((t, i) => i === 2 ? { ...t, yaxis: 'y2' } : t),
      layout: { xaxis: { title: 'year' }, yaxis: { title: 'sea level rel. 1900 (mm)' }, yaxis2: { title: 'rate (mm/yr)', overlaying: 'y', side: 'right', showgrid: false } },
      out: [['rate in ' + p.yr, fmt(r(p.yr), 2) + ' mm/yr', 1], ['acceleration h″', fmt(2 * p.c, 4) + ' mm/yr²'], ['rise 1900→' + p.yr, fmt(h(p.yr), 0) + ' mm'], ['rise 2024→2100', fmt(h(2100) - h(2024), 0) + ' mm']] }; } },

{ part: 'B · Derivatives of elementary functions', level: 1, week: 'Week 4', tool: 'Derivatives of eˣ and ln x', th: 'อนุพันธ์ของฟังก์ชันเลขชี้กำลังและลอการิทึม',
  title: 'Radiocarbon dating and age uncertainty',
  context: 'A sample keeps a fraction f of its original ¹⁴C. Its age is t(f) = −ln f / λ. The derivative dt/df tells how much the age changes for a small error in the measured fraction.',
  tex: [String.raw`f(t)=e^{-\lambda t},\quad f'(t)=-\lambda f`, String.raw`t(f)=-\frac{\ln f}{\lambda},\quad \frac{dt}{df}=-\frac{1}{\lambda f}`, String.raw`\Delta t\approx\left|\frac{dt}{df}\right|\Delta f`],
  params: [{ id: 'half', label: 'half-life (yr)', min: 1000, max: 10000, step: 10, value: 5730 },
           { id: 'f', label: 'measured fraction f', min: 0.01, max: 0.99, step: 0.005, value: 0.25 },
           { id: 'df', label: 'measurement error Δf', min: 0.001, max: 0.03, step: 0.001, value: 0.01 }],
  note: 'Move f toward 0 (old samples): the tangent line becomes nearly vertical, so a tiny error in f gives a huge error in age. This is why radiocarbon stops working near 50,000 years.',
  run(p, c) { const L = Math.LN2 / p.half, age = f => -Math.log(f) / L, d = -1 / (L * p.f), F = linspace(0.005, 1, 400), Ft = linspace(Math.max(0.005, p.f - 0.12), Math.min(1, p.f + 0.12), 20);
    return { traces: [line(F, F.map(age), 'age t(f)', c.s1), line(Ft, Ft.map(f => age(p.f) + d * (f - p.f)), 'tangent', c.s2, { line: { dash: 'dash' } }), pts([p.f], [age(p.f)], 'sample', c.s2)],
      layout: { xaxis: { title: 'fraction remaining f' }, yaxis: { title: 'age (yr)', range: [0, Math.min(age(0.005), 8 * p.half)] } },
      out: [['decay constant λ', fmt(L, 6) + ' /yr'], ['age', fmt(age(p.f), 0) + ' yr', 1], ['dt/df', fmt(d, 0) + ' yr'], ['age error ±Δt', '± ' + fmt(Math.abs(d) * p.df, 0) + ' yr', 1]] }; } },

{ part: 'B · Derivatives of elementary functions', level: 1, week: 'Week 4', tool: 'Derivatives of aˣ and logₐx', th: 'อนุพันธ์ของฟังก์ชันเลขชี้กำลังฐาน a',
  title: 'Earthquake magnitude and energy',
  context: 'Radiated seismic energy grows exponentially with magnitude: log₁₀E = 1.5M + 4.8 (E in joules). The relative growth rate (1/E)(dE/dM) is constant.',
  tex: [String.raw`E(M)=10^{1.5M+4.8}`, String.raw`\frac{dE}{dM}=1.5\ln 10\cdot E\approx 3.45\,E`, String.raw`\frac{E(M+\Delta M)}{E(M)}=10^{1.5\Delta M}`],
  params: [{ id: 'M', label: 'magnitude M', min: 3, max: 9.5, step: 0.1, value: 7.7 },
           { id: 'dM', label: 'increase ΔM', min: 0.1, max: 2, step: 0.1, value: 1 }],
  note: 'The axis is logarithmic, so a straight line means exponential growth. One magnitude unit multiplies energy by about 31.6; two units by 1000.',
  run(p, c) { const E = m => 10 ** (1.5 * m + 4.8), Mx = linspace(3, 9.5, 200);
    return { traces: [line(Mx, Mx.map(E), 'E(M)', c.s1), pts([p.M, p.M + p.dM], [E(p.M), E(p.M + p.dM)], 'M and M+ΔM', c.s2)],
      layout: { xaxis: { title: 'magnitude M' }, yaxis: { title: 'energy (J)', type: 'log', exponentformat: 'power' } },
      out: [['energy E(M)', fmt(E(p.M)) + ' J'], ['TNT equivalent', fmt(E(p.M) / 4.184e9, 0) + ' t'], ['dE/dM', fmt(1.5 * Math.LN10 * E(p.M)) + ' J'], ['energy ratio', '× ' + fmt(10 ** (1.5 * p.dM), 1), 1], ['number of M5.0 events with equal energy', fmt(E(p.M) / E(5), 0)]] }; } },

{ part: 'B · Derivatives of elementary functions', level: 1, week: 'Week 4', tool: 'Trigonometric derivatives', th: 'อนุพันธ์ของฟังก์ชันตรีโกณมิติ',
  title: 'When does the tide rise fastest?',
  context: 'Semidiurnal tides combine the lunar M2 (12.42 h) and solar S2 (12.00 h) constituents. Because the periods differ slightly, they drift in and out of phase, which produces spring and neap tides. The rate of rise is η′(t).',
  tex: [String.raw`\eta(t)=A_1\cos\frac{2\pi t}{12.42}+A_2\cos\!\left(\frac{2\pi t}{12}+\phi\right)`, String.raw`\eta'(t)=-\frac{2\pi A_1}{12.42}\sin\frac{2\pi t}{12.42}-\frac{2\pi A_2}{12}\sin\!\left(\frac{2\pi t}{12}+\phi\right)`],
  params: [{ id: 'a1', label: 'M2 amplitude A₁ (m)', min: 0, max: 2, step: 0.05, value: 1.2 },
           { id: 'a2', label: 'S2 amplitude A₂ (m)', min: 0, max: 2, step: 0.05, value: 0.4 },
           { id: 'ph', label: 'S2 phase φ (rad)', min: 0, max: 6.28, step: 0.02, value: 0.5 }],
  note: 'Fastest rise happens near <b>mid-tide</b>, where η″ = 0, not at high water. Spring tides (constituents in phase) give the largest ranges and the strongest currents.',
  run(p, c) { const w1 = 2 * Math.PI / 12.42, w2 = 2 * Math.PI / 12, T = linspace(0, 360, 3000);
    const eta = t => p.a1 * Math.cos(w1 * t) + p.a2 * Math.cos(w2 * t + p.ph), de = t => -p.a1 * w1 * Math.sin(w1 * t) - p.a2 * w2 * Math.sin(w2 * t + p.ph);
    const E = T.map(eta), D = T.map(de); let im = 0; D.forEach((v, i) => { if (v > D[im]) im = i; });
    return { traces: [line(T.map(t => t / 24), E, 'η(t) height', c.s1, { line: { width: 1.5 } }), line(T.map(t => t / 24), D, "η′(t) rate", c.s2, { yaxis: 'y2', line: { width: 1 }, opacity: 0.75 }), pts([T[im] / 24], [D[im]], 'max rate', c.s2)].map((t, i) => i === 2 ? { ...t, yaxis: 'y2' } : t),
      layout: { xaxis: { title: 'time (days)' }, yaxis: { title: 'tide height (m)' }, yaxis2: { title: 'rate (m/h)', overlaying: 'y', side: 'right', showgrid: false } },
      out: [['max rate of rise', fmt(D[im], 3) + ' m/h', 1], ['at time', fmt(T[im], 1) + ' h'], ['tide height then', fmt(E[im], 2) + ' m'], ['largest tidal range 2(A₁+A₂)', fmt(2 * (p.a1 + p.a2), 2) + ' m'], ['spring–neap period', '14.77 days']] }; } },

{ part: 'B · Derivatives of elementary functions', level: 1, week: 'Week 4', tool: 'Derivative of arctan', th: 'อนุพันธ์ของฟังก์ชันตรีโกณมิติผกผัน',
  title: 'Steepest point of a fault scarp',
  context: 'A fault scarp of height H is rounded by erosion; w measures how degraded it is. The slope angle along the profile is θ = arctan(z′). Fresh scarps are steeper than the angle of repose of loose debris (≈ 35°).',
  tex: [String.raw`z(x)=\frac{H}{\pi}\arctan\frac{x}{w}+\frac H2`, String.raw`z'(x)=\frac{H}{\pi}\cdot\frac{w}{w^2+x^2}`, String.raw`\theta_{\max}=\arctan\frac{H}{\pi w}`],
  params: [{ id: 'H', label: 'scarp height H (m)', min: 1, max: 15, step: 0.5, value: 6 },
           { id: 'w', label: 'degradation width w (m)', min: 0.5, max: 15, step: 0.1, value: 3 }],
  note: 'Increase w to simulate thousands of years of erosion. Geomorphologists date prehistoric earthquakes by how far a scarp has relaxed.',
  run(p, c) { const X = linspace(-40, 40, 400), z = x => p.H / Math.PI * Math.atan(x / p.w) + p.H / 2, th = x => deg(Math.atan(p.H / Math.PI * p.w / (p.w ** 2 + x ** 2)));
    const tm = deg(Math.atan(p.H / (Math.PI * p.w)));
    return { traces: [line(X, X.map(z), 'z(x) profile', c.s1), line(X, X.map(th), 'slope angle θ', c.s2, { yaxis: 'y2' }), line([-40, 40], [35, 35], 'repose 35°', c.muted, { yaxis: 'y2', line: { dash: 'dot', width: 1 } })],
      layout: { xaxis: { title: 'distance across scarp (m)' }, yaxis: { title: 'elevation (m)' }, yaxis2: { title: 'slope (°)', overlaying: 'y', side: 'right', range: [0, 90], showgrid: false } },
      out: [["z′(0)", fmt(p.H / (Math.PI * p.w), 3)], ['max slope θ_max', fmt(tm, 1) + '°', 1], ['state', tm > 35 ? '<span class="status-bad">steeper than repose</span>' : '<span class="status-ok">below repose</span>'], ['w where θ_max = 35°', fmt(p.H / (Math.PI * Math.tan(rad(35))), 2) + ' m']] }; } },

{ part: 'B · Derivatives of elementary functions', level: 2, week: 'Week 5', tool: 'Hyperbolic functions & limits', th: 'ฟังก์ชันไฮเพอร์โบลิก',
  title: 'Why tsunamis travel as fast as jets',
  context: 'Water-wave speed depends on wavelength and depth through tanh(kh). When the wavelength is much longer than the depth (a tsunami), tanh(kh) ≈ kh and the speed becomes √(gh).',
  tex: [String.raw`c=\sqrt{\frac gk\tanh(kh)},\quad k=\frac{2\pi}{\lambda}`, String.raw`\lim_{kh\to0}c=\sqrt{gh},\qquad\lim_{kh\to\infty}c=\sqrt{g/k}`, String.raw`c_g=\frac{d\omega}{dk}=\frac c2\left(1+\frac{2kh}{\sinh 2kh}\right)`],
  params: [{ id: 'lh', label: 'ocean depth h (m)', min: 0, max: 3.7, step: 0.01, value: 3.6, log: true },
           { id: 'll', label: 'wavelength λ (m)', min: 0, max: 6, step: 0.01, value: 5.3, log: true }],
  note: 'Long waves (right of the bend) "feel the bottom" and all travel at √(gh). Short wind waves (left) do not, and their speed depends only on wavelength.',
  run(p, c) { const g = 9.81, h = p.lh, k = 2 * Math.PI / p.ll, cs = (kk, hh) => Math.sqrt(g / kk * Math.tanh(kk * hh));
    const L = logspace(0, 6, 300), cc = cs(k, h), kh = k * h, cg = cc / 2 * (1 + (2 * kh > 600 ? 0 : 2 * kh / Math.sinh(2 * kh)));
    const regime = kh < Math.PI / 10 ? 'shallow-water wave' : kh > Math.PI ? 'deep-water wave' : 'intermediate';
    return { traces: [line(L, L.map(l => cs(2 * Math.PI / l, h)), 'c (depth ' + fmt(h, 0) + ' m)', c.s1), line(L, L.map(l => Math.sqrt(g * l / (2 * Math.PI))), 'deep limit √(g/k)', c.muted, { line: { dash: 'dash', width: 1.2 } }),
      line([1, 1e6], [Math.sqrt(g * h), Math.sqrt(g * h)], 'shallow limit √(gh)', c.s3, { line: { dash: 'dot', width: 1.5 } }), pts([p.ll], [cc], 'your wave', c.s2)],
      layout: { xaxis: { title: 'wavelength (m)', type: 'log', exponentformat: 'power' }, yaxis: { title: 'phase speed c (m/s)', type: 'log' } },
      out: [['phase speed c', fmt(cc, 1) + ' m/s = ' + fmt(cc * 3.6, 0) + ' km/h', 1], ['group speed c_g', fmt(cg, 1) + ' m/s'], ['√(gh)', fmt(Math.sqrt(g * h), 1) + ' m/s'], ['kh', fmt(kh, 4)], ['regime', regime]] }; } },

{ part: 'C · Higher-order, implicit, differentials', level: 2, week: 'Week 5', tool: 'Higher-order derivatives', th: 'อนุพันธ์อันดับสูง',
  title: 'Ground displacement, velocity and acceleration',
  context: 'Building codes are written in terms of peak ground acceleration (PGA). A damped oscillation models ground displacement; velocity and acceleration are its first and second derivatives.',
  tex: [String.raw`u(t)=Ae^{-\zeta\omega t}\sin\omega t,\quad \omega=2\pi f`, String.raw`v=u'=Ae^{-\alpha t}(\omega\cos\omega t-\alpha\sin\omega t)`, String.raw`a=u''=Ae^{-\alpha t}\big[(\alpha^2-\omega^2)\sin\omega t-2\alpha\omega\cos\omega t\big],\ \alpha=\zeta\omega`],
  params: [{ id: 'A', label: 'amplitude A (cm)', min: 0.5, max: 20, step: 0.5, value: 5 },
           { id: 'f', label: 'frequency f (Hz)', min: 0.2, max: 8, step: 0.1, value: 1.5 },
           { id: 'z', label: 'damping ζ', min: 0.02, max: 0.5, step: 0.01, value: 0.15 }],
  note: 'Each derivative multiplies amplitude by about ω. Doubling the frequency at the same displacement roughly <b>quadruples</b> PGA (∝ ω²).',
  run(p, c) { const w = 2 * Math.PI * p.f, al = p.z * w, T = linspace(0, 6, 2500);
    const u = t => p.A * Math.exp(-al * t) * Math.sin(w * t), v = t => p.A * Math.exp(-al * t) * (w * Math.cos(w * t) - al * Math.sin(w * t)),
      a = t => p.A * Math.exp(-al * t) * ((al * al - w * w) * Math.sin(w * t) - 2 * al * w * Math.cos(w * t));
    const U = T.map(u), V = T.map(v), Acc = T.map(t => a(t) / 981), mx = arr => Math.max(...arr.map(Math.abs));
    return { traces: [line(T, U, 'u (cm)', c.s1, { line: { width: 1.6 } }), line(T, V, 'v (cm/s)', c.s3, { yaxis: 'y2', line: { width: 1.6 } }), line(T, Acc, 'a (g)', c.s2, { yaxis: 'y3', line: { width: 1.6 } })],
      layout: { showlegend: false, xaxis: { title: 'time (s)', anchor: 'y3' }, yaxis: { title: 'u (cm)', domain: [0.70, 1] }, yaxis2: { title: 'v (cm/s)', domain: [0.36, 0.64] }, yaxis3: { title: 'a (g)', domain: [0, 0.30] } },
      out: [['peak displacement', fmt(mx(U), 2) + ' cm'], ['peak velocity PGV', fmt(mx(V), 1) + ' cm/s'], ['peak acceleration PGA', fmt(mx(Acc), 3) + ' g', 1], ['ω² · A (estimate)', fmt(w * w * p.A / 981, 3) + ' g']] }; } },

{ part: 'C · Higher-order, implicit, differentials', level: 2, week: 'Week 6', tool: 'Implicit differentiation', th: 'การหาอนุพันธ์โดยปริยาย',
  title: 'The water table between two rivers',
  context: 'Groundwater flows through an unconfined aquifer from a river at head h₁ to one at h₂. The Dupuit equation defines h(x) implicitly. Differentiating both sides gives the water-table slope, and Darcy’s law then gives the flow q.',
  tex: [String.raw`h^2=h_1^2-(h_1^2-h_2^2)\frac xL`, String.raw`2h\frac{dh}{dx}=-\frac{h_1^2-h_2^2}{L}\Rightarrow\frac{dh}{dx}=-\frac{h_1^2-h_2^2}{2Lh}`, String.raw`q=-Kh\frac{dh}{dx}=\frac{K(h_1^2-h_2^2)}{2L}`],
  params: [{ id: 'h1', label: 'upstream head h₁ (m)', min: 5, max: 40, step: 0.5, value: 20 },
           { id: 'h2', label: 'downstream head h₂ (m)', min: 1, max: 39, step: 0.5, value: 12 },
           { id: 'L', label: 'distance L (m)', min: 100, max: 2000, step: 10, value: 500 },
           { id: 'K', label: 'conductivity K (m/day)', min: 1, max: 50, step: 1, value: 10 }],
  note: 'The water table steepens where the aquifer is thin, so that h·h′ stays constant. Mass is conserved: the same q passes every cross-section.',
  run(p, c) { const h2 = Math.min(p.h2, p.h1 - 0.5), X = linspace(0, p.L, 200), h = x => Math.sqrt(p.h1 ** 2 - (p.h1 ** 2 - h2 ** 2) * x / p.L), D = p.h1 ** 2 - h2 ** 2;
    return { traces: [{ x: X, y: X.map(h), type: 'scatter', mode: 'lines', fill: 'tozeroy', name: 'saturated aquifer', line: { color: c.s1, width: 2.4 }, fillcolor: 'rgba(80,150,170,0.22)' },
      line([0, p.L], [p.h1, h2], 'straight line', c.muted, { line: { dash: 'dash', width: 1 } })],
      layout: { xaxis: { title: 'x (m)' }, yaxis: { title: 'head h (m)', range: [0, p.h1 * 1.1] } },
      out: [['dh/dx at x = 0', fmt(-D / (2 * p.L * p.h1), 4)], ['dh/dx at x = L', fmt(-D / (2 * p.L * h2), 4)], ['discharge q', fmt(p.K * D / (2 * p.L), 3) + ' m²/day', 1], ['per km of river', fmt(p.K * D / (2 * p.L) * 1000, 0) + ' m³/day']].concat(p.h2 >= p.h1 ? [['note', 'h₂ capped below h₁']] : []) }; } },

{ part: 'C · Higher-order, implicit, differentials', level: 2, week: 'Week 6', tool: 'Differentials · linear approximation', th: 'ผลต่างเชิงอนุพันธ์และการประมาณค่า',
  title: 'The free-air gravity correction',
  context: 'Gravity decreases with height above sea level. Every gravity survey corrects readings with the differential dg = g′(0)·dh, the tangent-line approximation of g(h).',
  tex: [String.raw`g(h)=\frac{GM}{(R+h)^2}`, String.raw`dg=g'(0)\,dh=-\frac{2GM}{R^3}dh=-\frac{2g_0}{R}dh`, String.raw`\approx-0.308\ \text{mGal per metre}`],
  params: [{ id: 'h', label: 'station height h (m)', min: 0, max: 30000, step: 50, value: 2565 }],
  note: 'Default height is Doi Inthanon (2565 m). The tangent line is extremely accurate for any land elevation; it only starts to drift at aircraft and satellite heights.',
  run(p, c) { const GM = 3.986004e14, R = 6.371e6, g = h => GM / (R + h) ** 2, g0 = g(0), H = linspace(0, Math.max(3000, p.h * 1.6), 200), ex = h => (g(h) - g0) * 1e5, li = h => -2 * g0 / R * h * 1e5;
    return { traces: [line(H, H.map(ex), 'exact Δg', c.s1), line(H, H.map(li), 'linear dg', c.s2, { line: { dash: 'dash' } }), pts([p.h], [ex(p.h)], 'station', c.s2)],
      layout: { xaxis: { title: 'height above sea level (m)' }, yaxis: { title: 'change in gravity (mGal)' } },
      out: [['exact Δg', fmt(ex(p.h), 3) + ' mGal'], ['linear dg', fmt(li(p.h), 3) + ' mGal', 1], ['relative error', fmt(p.h ? Math.abs((li(p.h) - ex(p.h)) / ex(p.h)) * 100 : 0, 4) + ' %'], ['free-air gradient', fmt(-2 * g0 / R * 1e5, 4) + ' mGal/m']] }; } },

{ part: 'D · Applications of derivatives', level: 2, week: 'Week 7', tool: 'Related rates', th: 'อัตราการเปลี่ยนแปลงสัมพัทธ์',
  title: 'How fast does a cinder cone grow?',
  context: 'Tephra piles up at its angle of repose φ, so h = r tan φ at all times. Given the eruption rate dV/dt, differentiate the cone volume with respect to time to find dh/dt.',
  tex: [String.raw`V=\tfrac13\pi r^2h=\frac{\pi h^3}{3\tan^2\varphi}`, String.raw`\frac{dV}{dt}=\frac{\pi h^2}{\tan^2\varphi}\frac{dh}{dt}`, String.raw`\frac{dh}{dt}=\frac{\tan^2\varphi}{\pi h^2}\frac{dV}{dt}`],
  params: [{ id: 'Q', label: 'eruption rate dV/dt (m³/s)', min: 1, max: 100, step: 1, value: 10 },
           { id: 'phi', label: 'angle of repose φ (°)', min: 25, max: 40, step: 0.5, value: 33 },
           { id: 'h', label: 'current height h (m)', min: 5, max: 400, step: 1, value: 50 }],
  note: 'Growth slows as 1/h²: each new metre of height needs a much bigger shell of tephra. Parícutin (Mexico, 1943) grew ~50 m on day one but took years to reach 400 m.',
  run(p, c) { const t2 = Math.tan(rad(p.phi)) ** 2, rate = h => t2 / (Math.PI * h * h) * p.Q * 86400, H = linspace(5, 400, 300), V = Math.PI * p.h ** 3 / (3 * t2);
    return { traces: [line(H, H.map(rate), 'dh/dt', c.s1), pts([p.h], [rate(p.h)], 'now', c.s2)],
      layout: { xaxis: { title: 'cone height h (m)' }, yaxis: { title: 'dh/dt (m/day)', type: 'log' } },
      out: [['dh/dt', fmt(rate(p.h), 2) + ' m/day', 1], ['base radius r', fmt(p.h / Math.tan(rad(p.phi)), 1) + ' m'], ['volume V', fmt(V / 1e6, 3) + ' million m³'], ['time to build this cone', fmt(V / p.Q / 86400, 1) + ' days']] }; } },

{ part: 'D · Applications of derivatives', level: 2, week: 'Week 7', tool: 'Optimisation (max/min)', th: 'การหาค่าสูงสุดต่ำสุด',
  title: 'Seismic rays take the fastest path',
  context: 'A wave travels from a source in a layer of speed v₁ to a receiver in a layer of speed v₂, crossing the interface at x. Minimising the travel time T(x) gives Snell’s law (Fermat’s principle).',
  tex: [String.raw`T(x)=\frac{\sqrt{a^2+x^2}}{v_1}+\frac{\sqrt{b^2+(d-x)^2}}{v_2}`, String.raw`T'(x)=0\iff\frac{\sin\theta_1}{v_1}=\frac{\sin\theta_2}{v_2}`],
  params: [{ id: 'v1', label: 'upper speed v₁ (km/s)', min: 1, max: 8, step: 0.1, value: 3 },
           { id: 'v2', label: 'lower speed v₂ (km/s)', min: 1, max: 8, step: 0.1, value: 5 },
           { id: 'xt', label: 'your trial crossing x (km)', min: 0, max: 6, step: 0.05, value: 3.5 }],
  note: 'Source 2 km above the interface; receiver 3 km below it and 6 km away. Move the trial point: no other crossing beats the red path. Swap the speeds to see the ray bend the other way.',
  run(p, c) { const a = 2, b = 3, d = 6, T = x => Math.hypot(a, x) / p.v1 + Math.hypot(b, d - x) / p.v2, xs = golden(T, 0, d);
    const s1 = xs / Math.hypot(a, xs), s2 = (d - xs) / Math.hypot(b, d - xs);
    return { traces: [line([0, xs, d], [a, 0, -b], 'fastest path', c.s2, { line: { width: 3 } }), line([0, p.xt, d], [a, 0, -b], 'your trial path', c.muted, { line: { dash: 'dash', width: 1.5 } }), pts([0, d], [a, -b], 'source / receiver', c.ink, 12)],
      layout: { xaxis: { title: 'x (km)', range: [-0.3, 6.3] }, yaxis: { title: 'z (km)', range: [-3.6, 2.6], scaleanchor: 'x' },
        shapes: [{ type: 'rect', xref: 'paper', x0: 0, x1: 1, y0: 0, y1: 2.6, fillcolor: 'rgba(194,65,12,0.08)', line: { width: 0 }, layer: 'below' }, { type: 'rect', xref: 'paper', x0: 0, x1: 1, y0: -3.6, y1: 0, fillcolor: 'rgba(11,107,128,0.10)', line: { width: 0 }, layer: 'below' }],
        annotations: [{ x: 5.2, y: 2.2, text: 'v₁ = ' + p.v1 + ' km/s', showarrow: false }, { x: 1, y: -3.2, text: 'v₂ = ' + p.v2 + ' km/s', showarrow: false }] },
      out: [['optimal crossing x*', fmt(xs, 4) + ' km'], ['minimum time T(x*)', fmt(T(xs), 4) + ' s', 1], ['your trial T(x)', fmt(T(p.xt), 4) + ' s'], ['θ₁ / θ₂', fmt(deg(Math.asin(s1)), 2) + '° / ' + fmt(deg(Math.asin(s2)), 2) + '°'], ['sin θ₁ / v₁', fmt(s1 / p.v1, 6)], ['sin θ₂ / v₂', fmt(s2 / p.v2, 6)]] }; } },

{ part: 'D · Applications of derivatives', level: 2, week: 'Week 8', tool: "L'Hôpital's rule", th: 'หลักเกณฑ์โลปีตาล',
  title: 'A decay chain when λ₁ = λ₂',
  context: 'In a chain Parent → Daughter → …, the amount of daughter follows the Bateman equation. When the two decay constants are equal it becomes 0/0. L’Hôpital’s rule (differentiate with respect to λ₂) gives the finite limit.',
  tex: [String.raw`\frac{N_2}{N_0}=\frac{\lambda_1\left(e^{-\lambda_1t}-e^{-\lambda_2t}\right)}{\lambda_2-\lambda_1}\ \xrightarrow{\ \lambda_2\to\lambda_1\ }\ \frac00`, String.raw`\lim_{\lambda_2\to\lambda}\frac{\lambda\,t\,e^{-\lambda_2t}}{1}=\lambda t\,e^{-\lambda t}`],
  params: [{ id: 'l1', label: 'parent λ₁', min: 0.02, max: 0.5, step: 0.005, value: 0.1 },
           { id: 'l2', label: 'daughter λ₂', min: 0.02, max: 0.5, step: 0.005, value: 0.15 }],
  note: 'Slide λ₂ onto λ₁: the orange curve settles exactly on the dashed L’Hôpital limit instead of blowing up.',
  run(p, c) { const T = linspace(0, 60, 400), eq = Math.abs(p.l2 - p.l1) < 1e-9, N = t => eq ? p.l1 * t * Math.exp(-p.l1 * t) : p.l1 / (p.l2 - p.l1) * (Math.exp(-p.l1 * t) - Math.exp(-p.l2 * t));
    const tm = eq ? 1 / p.l1 : Math.log(p.l2 / p.l1) / (p.l2 - p.l1);
    return { traces: [line(T, T.map(N), 'Bateman N₂/N₀', c.s2), line(T, T.map(t => p.l1 * t * Math.exp(-p.l1 * t)), 'limit λt e^(−λt)', c.ink, { line: { dash: 'dash', width: 1.5 } }), pts([tm], [N(tm)], 'maximum', c.s2)],
      layout: { xaxis: { title: 'time' }, yaxis: { title: 'N₂ / N₀' } },
      out: [['λ₂ − λ₁', fmt(p.l2 - p.l1, 4)], ['form', eq ? '0/0 → L’Hôpital used' : 'ordinary formula'], ['time of maximum', fmt(tm, 2), 1], ['maximum N₂/N₀', fmt(N(tm), 4)]] }; } },

{ part: 'E · Several variables', level: 3, week: 'Week 11', tool: 'Partial derivatives · gradient', th: 'อนุพันธ์ย่อย',
  title: 'Slope and flow direction on a DEM',
  context: 'A digital elevation model is a function z(x, y). Its partial derivatives give the gradient; slope = arctan|∇z|, and water flows along −∇z. Move the probe to read the terrain.',
  tex: [String.raw`\nabla z=\left(\frac{\partial z}{\partial x},\frac{\partial z}{\partial y}\right)`, String.raw`\theta=\arctan\lVert\nabla z\rVert,\qquad\text{flow}\parallel-\nabla z`, String.raw`z=H e^{-\frac{(x-1)^2+(y-0.5)^2}{1.5}}+350e^{-\frac{(x+1.5)^2+(y+1)^2}{0.8}}+s\,x`],
  params: [{ id: 'px', label: 'probe x (km)', min: -3.5, max: 3.5, step: 0.05, value: 0 },
           { id: 'py', label: 'probe y (km)', min: -3, max: 3, step: 0.05, value: -0.5 },
           { id: 'H', label: 'main hill height H (m)', min: 100, max: 1000, step: 10, value: 600 },
           { id: 's', label: 'regional tilt s (m/km)', min: 0, max: 100, step: 5, value: 40 }],
  note: 'Arrows (−∇z) cross contours at right angles and point downhill. GIS slope maps, watershed boundaries and landslide-hazard maps are all built from these two partial derivatives.',
  run(p, c) { const g1 = (x, y) => p.H * Math.exp(-((x - 1) ** 2 + (y - 0.5) ** 2) / 1.5), g2 = (x, y) => 350 * Math.exp(-((x + 1.5) ** 2 + (y + 1) ** 2) / 0.8);
    const z = (x, y) => g1(x, y) + g2(x, y) + p.s * x, zx = (x, y) => g1(x, y) * (-2 * (x - 1) / 1.5) + g2(x, y) * (-2 * (x + 1.5) / 0.8) + p.s, zy = (x, y) => g1(x, y) * (-2 * (y - 0.5) / 1.5) + g2(x, y) * (-2 * (y + 1) / 0.8);
    const X = linspace(-4, 4, 81), Y = linspace(-3.5, 3.5, 71), Z = Y.map(y => X.map(x => z(x, y)));
    const ax = [], ay = [], sc = 0.0016; for (let i = 0; i < Y.length; i += 7) for (let j = 0; j < X.length; j += 8) { const x = X[j], y = Y[i]; ax.push(x, x - zx(x, y) * sc, null); ay.push(y, y - zy(x, y) * sc, null); }
    const gx = zx(p.px, p.py), gy = zy(p.px, p.py), mag = Math.hypot(gx, gy), bearing = (deg(Math.atan2(-gx, -gy)) + 360) % 360, L = 0.6 / Math.max(mag, 1e-9);
    return { traces: [{ x: X, y: Y, z: Z, type: 'contour', colorscale: 'Earth', contours: { coloring: 'heatmap' }, line: { width: 0.4 }, colorbar: { title: { text: 'm', side: 'right' }, thickness: 12 }, name: 'elevation', hoverinfo: 'z' },
      { x: ax, y: ay, type: 'scatter', mode: 'lines', line: { color: c.ink, width: 1 }, name: '−∇z', hoverinfo: 'skip' },
      { x: [p.px, p.px - gx * L], y: [p.py, p.py - gy * L], type: 'scatter', mode: 'lines+markers', marker: { size: [12, 0], color: c.s2 }, line: { color: c.s2, width: 3 }, name: 'probe flow' }],
      layout: { showlegend: false, xaxis: { title: 'x (km)', range: [-4, 4] }, yaxis: { title: 'y (km)', range: [-3.5, 3.5], scaleanchor: 'x' } },
      out: [['elevation z', fmt(z(p.px, p.py), 1) + ' m'], ['∂z/∂x', fmt(gx, 1) + ' m/km'], ['∂z/∂y', fmt(gy, 1) + ' m/km'], ['slope θ', fmt(deg(Math.atan(mag / 1000)), 2) + '°', 1], ['water flows toward', fmt(bearing, 0) + '° (0° = N)']] }; } },

{ part: 'E · Several variables', level: 3, week: 'Week 11', tool: 'Total differential', th: 'ผลต่างเชิงอนุพันธ์รวม',
  title: 'Error budget for Darcy’s law',
  context: 'Groundwater discharge Q = KAΔh/L. Each input has a measurement error. The total differential adds up how each error propagates into Q; for a product or quotient, the relative errors add.',
  tex: [String.raw`dQ=\frac{\partial Q}{\partial K}dK+\frac{\partial Q}{\partial A}dA+\frac{\partial Q}{\partial \Delta h}d\Delta h+\frac{\partial Q}{\partial L}dL`, String.raw`\left|\frac{dQ}{Q}\right|\le\left|\frac{dK}{K}\right|+\left|\frac{dA}{A}\right|+\left|\frac{d\Delta h}{\Delta h}\right|+\left|\frac{dL}{L}\right|`],
  params: [{ id: 'eK', label: 'error in K (%)', min: 0, max: 50, step: 0.5, value: 10 },
           { id: 'eA', label: 'error in A (%)', min: 0, max: 10, step: 0.1, value: 2 },
           { id: 'eh', label: 'error in Δh (%)', min: 0, max: 10, step: 0.1, value: 2.5 },
           { id: 'eL', label: 'error in L (%)', min: 0, max: 10, step: 0.1, value: 0.8 }],
  note: 'Hydraulic conductivity K is notoriously hard to measure (it can vary by orders of magnitude). The bar chart shows where to spend effort to improve the estimate of Q.',
  run(p, c) { const v = [p.eK, p.eA, p.eh, p.eL], names = ['K', 'A', 'Δh', 'L'], tot = v.reduce((s, x) => s + x, 0), rss = Math.sqrt(v.reduce((s, x) => s + x * x, 0)), im = v.indexOf(Math.max(...v));
    return { traces: [{ type: 'bar', orientation: 'h', x: v, y: names.map(n => 'from ' + n), marker: { color: v.map((_, i) => i === im ? c.s2 : c.s1) }, name: 'contribution' }],
      layout: { showlegend: false, xaxis: { title: 'contribution to error in Q (%)' }, yaxis: { autorange: 'reversed' } },
      out: [['max error |dQ/Q|', fmt(tot, 2) + ' %', 1], ['independent errors (√Σ²)', fmt(rss, 2) + ' %'], ['dominant input', names[im]], ['share of dominant', fmt(tot ? v[im] / tot * 100 : 0, 0) + ' %']] }; } },

{ part: 'F · Integration techniques', level: 3, week: 'Week 12–13', tool: 'Integration by substitution', th: 'การหาปริพันธ์โดยการเปลี่ยนตัวแปร',
  title: 'Heat from radioactive granite',
  context: 'Radiogenic heat production decreases with depth, A(z) = A₀e^{−z/hᵣ}. Integrating once (substitution u = −z/hᵣ) gives the heat flow; integrating again with Fourier’s law gives the temperature profile.',
  tex: [String.raw`\int_0^\infty A_0e^{-z/h_r}dz\overset{u=-z/h_r}{=}A_0h_r`, String.raw`q_s=q_m+A_0h_r`, String.raw`T(z)=T_s+\frac{q_mz}{k}+\frac{A_0h_r^2}{k}\left(1-e^{-z/h_r}\right)`],
  params: [{ id: 'A0', label: 'surface heat production A₀ (μW/m³)', min: 0, max: 6, step: 0.1, value: 2.5 },
           { id: 'hr', label: 'decay depth hᵣ (km)', min: 2, max: 20, step: 0.5, value: 10 },
           { id: 'qm', label: 'mantle heat flow q_m (mW/m²)', min: 10, max: 60, step: 1, value: 30 },
           { id: 'k', label: 'conductivity k (W/m/K)', min: 1.5, max: 4, step: 0.1, value: 2.5 }],
  note: 'Granite-rich crust such as northern Thailand’s granite belt has high heat flow, which feeds hot springs like Fang and San Kamphaeng and makes geothermal power possible.',
  run(p, c) { const A0 = p.A0 * 1e-6, hr = p.hr * 1e3, qm = p.qm * 1e-3, Z = linspace(0, 50e3, 300), T = z => 15 + qm * z / p.k + A0 * hr * hr / p.k * (1 - Math.exp(-z / hr));
    return { traces: [line(Z.map(T), Z.map(z => z / 1e3), 'with radiogenic heat', c.s2), line(Z.map(z => 15 + qm * z / p.k), Z.map(z => z / 1e3), 'mantle heat only', c.s1, { line: { dash: 'dash' } })],
      layout: { xaxis: { title: 'temperature (°C)' }, yaxis: { title: 'depth (km)', autorange: 'reversed' } },
      out: [['radiogenic part A₀hᵣ', fmt(A0 * hr * 1e3, 1) + ' mW/m²'], ['surface heat flow q_s', fmt((qm + A0 * hr) * 1e3, 1) + ' mW/m²', 1], ['T at 10 km', fmt(T(10e3), 0) + ' °C'], ['T at 30 km', fmt(T(30e3), 0) + ' °C']] }; } },

{ part: 'F · Integration techniques', level: 3, week: 'Week 13', tool: 'Partial fractions', th: 'การหาปริพันธ์โดยการแยกเศษส่วนย่อย',
  title: 'Hubbert’s peak',
  context: 'Cumulative production Q(t) of a finite oil province follows the logistic equation. Separating variables needs partial fractions; the solution is an S-curve and its derivative is the bell-shaped Hubbert curve.',
  tex: [String.raw`\frac{dQ}{dt}=rQ\left(1-\frac Q{Q_\infty}\right)`, String.raw`\int\frac{dQ}{Q(1-Q/Q_\infty)}=\int\left(\frac1Q+\frac1{Q_\infty-Q}\right)dQ=\ln\frac{Q}{Q_\infty-Q}`, String.raw`Q(t)=\frac{Q_\infty}{1+e^{-(rt+C)}},\quad \text{peak at }Q=\tfrac{Q_\infty}{2}`],
  params: [{ id: 'Qi', label: 'ultimate resource Q∞ (Gbbl)', min: 50, max: 500, step: 5, value: 230 },
           { id: 'r', label: 'growth rate r (1/yr)', min: 0.02, max: 0.15, step: 0.001, value: 0.065 }],
  note: 'Illustrative oil province with 0.5 Gbbl produced by 1900. Hubbert used this model in 1956 to predict the 1970 US oil peak.',
  run(p, c) { const C0 = Math.log(0.5 / (p.Qi - 0.5)), Y = linspace(1900, 2150, 251), Q = y => p.Qi / (1 + Math.exp(-(p.r * (y - 1900) + C0))), P = y => p.r * Q(y) * (1 - Q(y) / p.Qi), peak = 1900 - C0 / p.r;
    return { traces: [line(Y, Y.map(P), 'production dQ/dt', c.s2), line(Y, Y.map(Q), 'cumulative Q', c.s1, { yaxis: 'y2', line: { width: 1.6 } })],
      layout: { xaxis: { title: 'year' }, yaxis: { title: 'production (Gbbl/yr)' }, yaxis2: { title: 'cumulative (Gbbl)', overlaying: 'y', side: 'right', showgrid: false },
        shapes: [{ type: 'line', x0: peak, x1: peak, yref: 'paper', y0: 0, y1: 1, line: { color: c.muted, dash: 'dot', width: 1 } }] },
      out: [['peak year', String(Math.round(peak)), 1], ['peak production rQ∞/4', fmt(p.r * p.Qi / 4, 2) + ' Gbbl/yr'], ['produced by 2025', fmt(Q(2025), 0) + ' Gbbl'], ['remaining after 2025', fmt(p.Qi - Q(2025), 0) + ' Gbbl']] }; } },

{ part: 'F · Integration techniques', level: 3, week: 'Week 14', tool: 'Trigonometric substitution', th: 'การแทนค่าด้วยฟังก์ชันตรีโกณมิติ',
  title: 'Gravity anomaly of a buried ore body',
  context: 'A dense ore body modelled as a buried sphere produces a bell-shaped gravity anomaly. Integrating it along the profile needs x = z tan θ. The half-width x½ estimates the depth.',
  tex: [String.raw`\Delta g(x)=\frac{G\,\Delta M\,z}{(x^2+z^2)^{3/2}},\quad\Delta M=\tfrac43\pi R^3\Delta\rho`, String.raw`\int\frac{dx}{(x^2+z^2)^{3/2}}\overset{x=z\tan\theta}{=}\frac{\sin\theta}{z^2}=\frac{x}{z^2\sqrt{x^2+z^2}}`, String.raw`\int_{-\infty}^{\infty}\Delta g\,dx=\frac{2G\Delta M}{z},\qquad z\approx1.305\,x_{1/2}`],
  params: [{ id: 'R', label: 'sphere radius R (m)', min: 20, max: 400, step: 5, value: 150 },
           { id: 'dr', label: 'density contrast Δρ (kg/m³)', min: 100, max: 3000, step: 50, value: 1500 },
           { id: 'z', label: 'depth to centre z (m)', min: 50, max: 2000, step: 10, value: 400 }],
  note: 'Deeper bodies give wider, flatter anomalies, so the half-width reveals depth. A modern gravimeter resolves about 0.01 mGal.',
  run(p, c) { const z = Math.max(p.z, p.R + 5), G = 6.674e-11, dM = 4 / 3 * Math.PI * p.R ** 3 * p.dr, X = linspace(-5 * z, 5 * z, 400), dg = x => G * dM * z / (x * x + z * z) ** 1.5 * 1e5, xh = z * Math.sqrt(2 ** (2 / 3) - 1);
    return { traces: [{ x: X, y: X.map(dg), type: 'scatter', mode: 'lines', fill: 'tozeroy', name: 'Δg(x)', line: { color: c.s1, width: 2.4 }, fillcolor: 'rgba(80,150,170,0.2)' }, line([-xh, xh], [dg(0) / 2, dg(0) / 2], 'half-width', c.s2, { line: { width: 2 } })],
      layout: { xaxis: { title: 'distance along profile (m)' }, yaxis: { title: 'Δg (mGal)' } },
      out: [['excess mass ΔM', fmt(dM / 1e9, 2) + ' million t'], ['peak anomaly', fmt(dg(0), 3) + ' mGal', 1], ['half-width x½', fmt(xh, 0) + ' m'], ['depth from 1.305·x½', fmt(1.305 * xh, 0) + ' m'], ['∫Δg dx = 2GΔM/z', fmt(2 * G * dM / z * 1e5, 0) + ' mGal·m'], ['detectable (> 0.01 mGal)?', dg(0) > 0.01 ? '<span class="status-ok">yes</span>' : '<span class="status-bad">no</span>']] }; } },

{ part: 'F · Integration techniques', level: 3, week: 'Week 15', tool: 'Integration by parts', th: 'การหาปริพันธ์โดยการแยกส่วน',
  title: 'Mean life of a radioactive atom',
  context: 'The probability that an atom decays at time t is λe^{−λt}. Its mean life is ∫ t·λe^{−λt} dt, done by parts with u = t. The same integral gives the mean transit time of water in a well-mixed aquifer.',
  tex: [String.raw`\int t\lambda e^{-\lambda t}dt=-te^{-\lambda t}-\frac1\lambda e^{-\lambda t}+C`, String.raw`\int_0^T t\lambda e^{-\lambda t}dt=\frac1\lambda-\left(T+\frac1\lambda\right)e^{-\lambda T}`, String.raw`\bar t=\lim_{T\to\infty}(\cdots)=\frac1\lambda=\frac{t_{1/2}}{\ln2}`],
  params: [{ id: 'half', label: 'half-life t½', min: 1, max: 50, step: 0.5, value: 12.3 },
           { id: 'T', label: 'upper limit T', min: 1, max: 300, step: 1, value: 40 }],
  note: 'Default half-life 12.3 yr is tritium (³H), used to date young groundwater. Push T to the right: the shaded area approaches 1/λ, the mean life.',
  run(p, c) { const L = Math.LN2 / p.half, f = t => t * L * Math.exp(-L * t), tmax = Math.max(p.T, 8 / L) * 1.05, X = linspace(0, tmax, 400), XS = X.filter(t => t <= p.T).concat([p.T]);
    const part = 1 / L - (p.T + 1 / L) * Math.exp(-L * p.T);
    return { traces: [{ x: XS, y: XS.map(f), type: 'scatter', mode: 'lines', fill: 'tozeroy', line: { width: 0 }, fillcolor: 'rgba(194,65,12,0.25)', name: '∫₀ᵀ', hoverinfo: 'skip' }, line(X, X.map(f), 't·λe^(−λt)', c.s1), line([1 / L, 1 / L], [0, f(1 / L) * 1.1], 'mean life 1/λ', c.s2, { line: { dash: 'dot', width: 1.5 } })],
      layout: { xaxis: { title: 'time t' }, yaxis: { title: 't · λe^(−λt)' } },
      out: [['λ', fmt(L, 5)], ['∫₀ᵀ (by parts)', fmt(part, 3)], ['mean life 1/λ', fmt(1 / L, 3), 1], ['reached', fmt(part * L * 100, 1) + ' % of the limit']] }; } },

{ part: 'F · Integration techniques', level: 3, week: 'Week 16', tool: 'Improper integrals', th: 'ปริพันธ์ไม่ตรงแบบ',
  title: 'How many aftershocks will there be?',
  context: 'The Omori–Utsu law gives the aftershock rate n(t) = K/(t + c)^p per day. The total number ever is an improper integral, which converges only when p > 1.',
  tex: [String.raw`N(T)=\int_0^T\frac{K\,dt}{(t+c)^p}=\frac{K}{1-p}\left[(T+c)^{1-p}-c^{1-p}\right]`, String.raw`N_\infty=\lim_{T\to\infty}N(T)=\begin{cases}\dfrac{Kc^{1-p}}{p-1},&p>1\\ \infty,&p\le1\end{cases}`],
  params: [{ id: 'K', label: 'productivity K (per day)', min: 20, max: 1000, step: 10, value: 200 },
           { id: 'c', label: 'c (days)', min: 0.01, max: 1, step: 0.01, value: 0.05 },
           { id: 'p', label: 'decay exponent p', min: 0.7, max: 1.6, step: 0.01, value: 1.1 },
           { id: 'lT', label: 'days after mainshock T', min: -1, max: 5, step: 0.05, value: 2.56, log: true }],
  note: 'With p just above 1 the integral converges, but very slowly; most of the theoretical total lies thousands of years ahead. At p ≤ 1 the curve never levels off.',
  run(p, c) { const N = T => Math.abs(p.p - 1) < 1e-9 ? p.K * Math.log((T + p.c) / p.c) : p.K / (1 - p.p) * ((T + p.c) ** (1 - p.p) - p.c ** (1 - p.p)), Ninf = p.p > 1 ? p.K * p.c ** (1 - p.p) / (p.p - 1) : Infinity;
    const X = logspace(-2, 6, 300), tr = [line(X, X.map(N), 'N(T)', c.s1), pts([p.lT], [N(p.lT)], 'selected T', c.s2)];
    if (isFinite(Ninf)) tr.push(line([1e-2, 1e6], [Ninf, Ninf], 'N∞ (limit)', c.s2, { line: { dash: 'dash', width: 1.2 } }));
    return { traces: tr, layout: { xaxis: { title: 'days after mainshock', type: 'log', exponentformat: 'power' }, yaxis: { title: 'cumulative aftershocks N(T)' } },
      out: [['N(T)', fmt(N(p.lT), 0), 1], ['rate on that day n(T)', fmt(p.K / (p.lT + p.c) ** p.p, 2) + ' /day'], ['N∞', isFinite(Ninf) ? fmt(Ninf, 0) : '<span class="status-bad">diverges</span>'], ['fraction of N∞ so far', isFinite(Ninf) ? fmt(N(p.lT) / Ninf * 100, 1) + ' %' : '—']] }; } },

{ part: 'G · Areas', level: 3, week: 'Week 17', tool: 'Area under a curve · numerical integration', th: 'พื้นที่ใต้เส้นโค้ง',
  title: 'Flood volume from a river hydrograph',
  context: 'Area under a discharge hydrograph Q(t) is the total water volume. The area between Q(t) and the baseflow line is the direct storm runoff. Gauges sample every few hours, so the trapezoid and Simpson rules are used.',
  tex: [String.raw`V=\int Q\,dt,\qquad V_{\text{direct}}=\int\big(Q-Q_b\big)dt`, String.raw`Q=Q_b+Q_p\left(\tfrac t{t_p}\right)^me^{m(1-t/t_p)},\ \ Q_b=35+0.15t`, String.raw`T_n=\tfrac{\Delta t}{2}\big[Q_0+2Q_1+\cdots+Q_n\big]`],
  params: [{ id: 'Qp', label: 'peak storm flow Q_p (m³/s)', min: 50, max: 1500, step: 10, value: 420 },
           { id: 'tp', label: 'time to peak t_p (h)', min: 6, max: 48, step: 1, value: 18 },
           { id: 'dt', label: 'gauge interval Δt (h)', min: 1, max: 24, step: 1, value: 3 },
           { id: 'area', label: 'catchment area (km²)', min: 100, max: 5000, step: 50, value: 1250 }],
  note: 'Raise Δt to 12 or 24 h and watch the trapezoid estimate drift away from the exact value: sparse sampling misses the peak.',
  run(p, c) { const m = 3, Qb = t => 35 + 0.15 * t, Q = t => Qb(t) + p.Qp * (t / p.tp) ** m * Math.exp(m * (1 - t / p.tp)), T = linspace(0, 120, 500);
    const ts = []; for (let t = 0; t <= 120 + 1e-9; t += p.dt) ts.push(t); const qs = ts.map(Q);
    let trap = 0; for (let i = 1; i < ts.length; i++) trap += (ts[i] - ts[i - 1]) * (qs[i] + qs[i - 1]) / 2;
    const exact = simpson(Q, 0, 120, 4000), direct = simpson(t => Q(t) - Qb(t), 0, 120, 4000);
    return { traces: [{ x: T, y: T.map(Qb), type: 'scatter', mode: 'lines', fill: 'tozeroy', line: { color: c.s3, width: 1 }, fillcolor: 'rgba(95,127,30,0.18)', name: 'baseflow' },
      { x: T, y: T.map(Q), type: 'scatter', mode: 'lines', fill: 'tonexty', line: { color: c.s1, width: 2.4 }, fillcolor: 'rgba(80,150,170,0.25)', name: 'direct runoff' },
      { x: ts, y: qs, type: 'scatter', mode: 'lines+markers', line: { color: c.s2, width: 1, dash: 'dot' }, marker: { color: c.s2, size: 6 }, name: 'gauge readings' }],
      layout: { xaxis: { title: 'time since rain began (h)' }, yaxis: { title: 'discharge Q (m³/s)' } },
      out: [['exact total volume', fmt(exact * 3600 / 1e6, 2) + ' million m³'], ['trapezoid estimate', fmt(trap * 3600 / 1e6, 2) + ' million m³'], ['trapezoid error', fmt(Math.abs(trap - exact) / exact * 100, 2) + ' %'], ['direct runoff', fmt(direct * 3600 / 1e6, 2) + ' million m³', 1], ['runoff depth', fmt(direct * 3600 / (p.area * 1e6) * 1000, 1) + ' mm']] }; } },

{ part: 'G · Areas', level: 3, week: 'Week 17', tool: 'Area between curves', th: 'พื้นที่ระหว่างเส้นโค้ง',
  title: 'Landslide erosion and deposition',
  context: 'Two surveys of a slope, before (z₁) and after (z₂) a landslide. Where z₁ > z₂ rock was removed; where z₂ > z₁ it was deposited. Each is an area between two curves, split where the curves cross. Multiply by the slide width for volume.',
  tex: [String.raw`z_1=120-0.4x,\quad z_2=z_1-A\sin\frac{\pi x}{L}\,e^{-x/400}`, String.raw`A_{\text{erosion}}=\int_0^{L}(z_1-z_2)\,dx,\qquad A_{\text{deposit}}=\int_L^{2L}(z_2-z_1)\,dx`],
  params: [{ id: 'A', label: 'slide depth A (m)', min: 2, max: 25, step: 0.5, value: 12 },
           { id: 'L', label: 'scar length L (m)', min: 60, max: 200, step: 5, value: 150 },
           { id: 'W', label: 'slide width (m)', min: 10, max: 200, step: 5, value: 80 }],
  note: 'This “DEM of difference” calculation is run on repeat drone or LiDAR surveys after landslides in northern Thailand. Erosion exceeds deposition here because some debris left the slope.',
  run(p, c) { const z1 = x => 120 - 0.4 * x, z2 = x => z1(x) - p.A * Math.sin(Math.PI * x / p.L) * Math.exp(-x / 400), X = linspace(0, 2 * p.L, 500);
    const er = simpson(x => z1(x) - z2(x), 0, p.L), de = simpson(x => z2(x) - z1(x), p.L, 2 * p.L);
    return { traces: [line(X, X.map(z1), 'before z₁', c.ink, { line: { width: 1.5 } }),
      { x: X, y: X.map(x => Math.min(z1(x), z2(x))), type: 'scatter', mode: 'lines', line: { width: 0 }, showlegend: false, hoverinfo: 'skip' },
      { x: X, y: X.map(x => Math.max(z1(x), z2(x))), type: 'scatter', mode: 'lines', line: { width: 0 }, fill: 'tonexty', fillcolor: 'rgba(124,77,189,0.18)', showlegend: false, hoverinfo: 'skip' },
      line(X, X.map(z2), 'after z₂', c.s2)],
      layout: { xaxis: { title: 'distance down slope (m)' }, yaxis: { title: 'elevation (m)' },
        annotations: [{ x: p.L / 2, y: z1(p.L / 2) + 6, text: 'erosion', showarrow: false, font: { color: c.s2 } }, { x: 1.5 * p.L, y: z1(1.5 * p.L) + 8, text: 'deposition', showarrow: false, font: { color: c.s4 } }] },
      out: [['erosion area', fmt(er, 1) + ' m²'], ['deposition area', fmt(de, 1) + ' m²'], ['eroded volume', fmt(er * p.W, 0) + ' m³', 1], ['deposited volume', fmt(de * p.W, 0) + ' m³'], ['10 m³ trucks to clear deposit', fmt(Math.ceil(de * p.W / 10), 0)]] }; } },
];
